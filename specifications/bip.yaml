# BIP — Bitcoin Improvement Proposals
#
# Une entrée par document : identifiant, titre d'origine, statut, résumé en français.
# `definition` : slug de l'entrée du dictionnaire consacrée au document, imprimée sous le
# résumé dans l'édition complète. `related` : entrées du dictionnaire liées au document.
#
# Depuis BIP-0003 (2025), le champ Created de l'en-tête s'appelle Assigned : il donne `created`.
# `superseded_by` reprend Proposed-Replacement.

source: "https://github.com/bitcoin/bips"
source_commit: "100ba872c808946155b1eeb8c4568058f2eea0a7"
updated: "2026-10-25"

entries:
  - number: 1
    id: "BIP-0001"
    title: "BIP Purpose and Guidelines"
    status: "Closed"
    type: "Process"
    authors:
      - "Amir Taaki"
    created: "2011-09-19"
    superseded_by: [2]
    summary: "Premier document à définir ce qu'est un BIP et comment le proposer. Amir Taaki y décrit les 3 types de BIP (*Standards Track*, *Informational*, *Process*), le rôle de l'auteur qui porte la proposition et les étapes de son cycle de vie. Le BIP-0002 l'a remplacé en 2016."
    definition: "bip-0001"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0001.mediawiki"
  - number: 2
    id: "BIP-0002"
    title: "BIP process, revised"
    status: "Closed"
    type: "Process"
    authors:
      - "Luke Dashjr"
    created: "2016-02-03"
    replaces: [1]
    superseded_by: [3]
    summary: "Révision du processus des BIP par Luke Dashjr, qui remplace le BIP-0001. Ce BIP fixe des statuts précis (*Draft*, *Proposed*, *Final*, *Rejected*…) avec des critères objectifs pour passer de l'un à l'autre, ajoute des commentaires publics sur chaque proposition et impose des licences libres. Le BIP-0003 l'a remplacé en 2026."
    definition: "bip-0002"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0002.mediawiki"
  - number: 3
    id: "BIP-0003"
    title: "Updated BIP Process"
    status: "Deployed"
    type: "Process"
    authors:
      - "Murch"
    created: "2025-01-09"
    replaces: [2]
    summary: "Processus actuel des BIP, rédigé par Murch et en vigueur depuis janvier 2026 à la place du BIP-0002. Il réduit les statuts à 4 (*Draft*, *Complete*, *Deployed*, *Closed*), remplace le type *Standards Track* par *Specification*, limite les décisions laissées à l'appréciation des éditeurs et accepte le format Markdown."
    definition: "bip-0003"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0003.md"
  - number: 8
    id: "BIP-0008"
    title: "Version bits with lock-in by height"
    status: "Complete"
    type: "Informational"
    authors:
      - "Shaolin Fry"
      - "Luke Dashjr"
    created: "2017-02-01"
    summary: "Méthode d'activation des soft forks par signalement des mineurs, conçue comme une alternative au BIP-0009. Les périodes se comptent en hauteur de bloc plutôt qu'en horodatage, et le paramètre `lockinontimeout` peut rendre le signalement obligatoire sur la dernière période, ce qui garantit l'activation même sans le soutien des mineurs."
    definition: "bip-0008"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0008.mediawiki"
  - number: 9
    id: "BIP-0009"
    title: "Version bits with timeout and delay"
    status: "Deployed"
    type: "Informational"
    authors:
      - "Pieter Wuille"
      - "Peter Todd"
      - "Greg Maxwell"
      - "Rusty Russell"
    created: "2015-10-04"
    summary: "Méthode d'activation des soft forks qui lit le champ `nVersion` comme une suite de bits : chaque bit signale le soutien des mineurs à un changement, ce qui permet d'en déployer plusieurs à la fois. Sur le *mainnet*, un changement se verrouille quand 95 % des 2016 blocs d'une période le signalent, ou échoue à l'expiration."
    definition: "bip-0009"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0009.mediawiki"
  - number: 10
    id: "BIP-0010"
    title: "Multi-Sig Transaction Distribution"
    status: "Closed"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Alan Reiner"
    created: "2011-10-28"
    summary: "Format proposé par Alan Reiner pour faire circuler une transaction multisignature non signée entre les participants, recueillir leurs signatures puis la diffuser. Ce format, appelé TxDP, embarque les transactions précédentes pour qu'un appareil de signature hors ligne vérifie les montants dépensés sans accès à la blockchain."
    definition: "bip-0010"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0010.mediawiki"
  - number: 11
    id: "BIP-0011"
    title: "M-of-N Standard Transactions"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Gavin Andresen"
    created: "2011-10-18"
    summary: "Type de transaction standard pour les multisignatures M-of-N, dont le `scriptPubKey` liste directement les clés publiques avant `OP_CHECKMULTISIG`, avec 3 clés au plus. Gavin Andresen visait les portefeuilles protégés par un service tiers et les séquestres entre acheteur, vendeur et arbitre. Ce format porte aujourd'hui le nom de P2MS ou *bare multisig*."
    definition: "bip-0011"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0011.mediawiki"
  - number: 12
    id: "BIP-0012"
    title: "OP_EVAL"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Gavin Andresen"
    created: "2011-10-18"
    summary: "Proposition de Gavin Andresen d'un nouvel opcode, `OP_EVAL`, qui redéfinit `OP_NOP1` pour exécuter un script sérialisé fourni au moment de la dépense. Le destinataire fixe ainsi lui-même les conditions de dépense, l'expéditeur n'en connaissant que le hachage. Le BIP-0016 (P2SH) l'a remplacé."
    definition: "bip-0012"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0012.mediawiki"
  - number: 13
    id: "BIP-0013"
    title: "Address Format for pay-to-script-hash"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Gavin Andresen"
    created: "2011-10-18"
    summary: "Format des adresses P2SH, qui encodent le hachage d'un script plutôt que celui d'une clé publique. L'adresse suit le même encodage `Base58Check` que les adresses classiques, avec l'octet de version 5 sur le *mainnet* (préfixe `3`) et 196 sur le testnet."
    definition: "bip-0013"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0013.mediawiki"
  - number: 14
    id: "BIP-0014"
    title: "Protocol Version and User Agent"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Amir Taaki"
      - "Patrick Strateman"
    created: "2011-11-10"
    summary: "Séparation du numéro de version du protocole et de celui du logiciel, alors que la version du protocole se confondait avec celle du client de Satoshi. Ce BIP définit aussi l'agent utilisateur, une chaîne comme `/Satoshi:5.64/bitcoin-qt:0.4/` que chaque client place dans le message `version` pour s'identifier sur le réseau."
    definition: "bip-0014"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0014.mediawiki"
  - number: 15
    id: "BIP-0015"
    title: "Aliases"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Amir Taaki"
    created: "2011-12-10"
    summary: "Étude de plusieurs systèmes d'alias pour remplacer les adresses, difficiles à retenir, par des noms lisibles. Amir Taaki y compare FirstBits (la blockchain comme annuaire), les enregistrements DNS TXT, un service HTTPS, un serveur d'alias dédié, les transactions vers une adresse IP et Namecoin. Le texte présente le BIP-0070 comme l'alternative à ces alias."
    definition: "bip-0015"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0015.mediawiki"
  - number: 16
    id: "BIP-0016"
    title: "Pay to Script Hash"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Gavin Andresen"
    created: "2012-01-03"
    summary: "Type de sortie P2SH (*Pay-to-Script-Hash*), qui ne contient que le hachage d'un script : celui qui dépense fournit le script complet avec les données qui le satisfont. L'expéditeur paie ainsi n'importe quel script complexe avec une adresse courte. Les nouvelles règles de validation s'appliquent depuis le 1er avril 2012."
    definition: "bip-0016"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0016.mediawiki"
  - number: 17
    id: "BIP-0017"
    title: "OP_CHECKHASHVERIFY (CHV)"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Luke Dashjr"
    created: "2012-01-18"
    summary: "Proposition de Luke Dashjr concurrente du P2SH, qui redéfinit `OP_NOP2` en `OP_CHECKHASHVERIFY` : l'opcode compare le hachage de la fin du `scriptSig` à une valeur inscrite dans le `scriptPubKey`. Le BIP-0016 a été retenu à sa place."
    definition: "bip-0017"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0017.mediawiki"
  - number: 18
    id: "BIP-0018"
    title: "hashScriptCheck"
    status: "Complete"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Luke Dashjr"
    created: "2012-01-27"
    summary: "Proposition de Luke Dashjr qui déclare obsolètes les champs `scriptSig` et `scriptPubKey` et les remplace par `dataSig`, `scriptCheck` et `hashScriptCheck`. La sortie s'écrit octet pour octet comme une sortie P2SH, si bien que les anciens nœuds y lisent un simple script `OP_HASH160 <hash> OP_EQUAL`."
    definition: "bip-0018"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0018.mediawiki"
  - number: 19
    id: "BIP-0019"
    title: "M-of-N Standard Transactions (Low SigOp)"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Luke Dashjr"
    created: "2012-01-30"
    summary: "Variante des transactions multisignatures M-of-N qui remplace `OP_CHECKMULTISIG` par une suite de `OP_CHECKSIG`. Luke Dashjr cherchait à contourner le décompte de 20 opérations de signature par `OP_CHECKMULTISIG`, qui limitait un bloc à 1000 transactions multisignatures."
    definition: "bip-0019"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0019.mediawiki"
  - number: 20
    id: "BIP-0020"
    title: "URI Scheme"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Luke Dashjr"
    created: "2011-01-10"
    superseded_by: [21]
    summary: "Première version du schéma d'URI `bitcoin:`, rédigée par Luke Dashjr à partir d'un texte de Nils Schneider, pour payer en cliquant sur un lien ou en scannant un QR code. Elle prévoyait des montants avec exposant et en hexadécimal. Le BIP-0021 l'a remplacée."
    definition: "bip-0020"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0020.mediawiki"
  - number: 21
    id: "BIP-0021"
    title: "URI Scheme"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Nils Schneider"
      - "Matt Corallo"
    created: "2012-01-29"
    replaces: [20]
    superseded_by: [321]
    summary: "Schéma d'URI `bitcoin:` qui encode une adresse avec des paramètres optionnels (`amount`, `label`, `message`) pour lancer un paiement depuis un lien ou un QR code. Il reprend le BIP-0020 sans ses montants alternatifs. Le BIP-0321 l'a remplacé."
    definition: "bip-0021"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0021.mediawiki"
  - number: 22
    id: "BIP-0022"
    title: "getblocktemplate - Fundamentals"
    status: "Deployed"
    type: "Specification"
    layer: "API/RPC"
    authors:
      - "Luke Dashjr"
    created: "2012-02-28"
    summary: "Appel JSON-RPC `getblocktemplate`, par lequel un nœud transmet au logiciel de minage toute la structure du bloc à construire, et non plus un simple en-tête à hacher. Le mineur peut ainsi assembler lui-même le bloc et, s'il le veut, en modifier le contenu."
    definition: "bip-0022"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0022.mediawiki"
  - number: 23
    id: "BIP-0023"
    title: "getblocktemplate - Pooled Mining"
    status: "Deployed"
    type: "Specification"
    layer: "API/RPC"
    authors:
      - "Luke Dashjr"
    created: "2012-02-28"
    summary: "Extensions de `getblocktemplate` (BIP-0022) destinées au minage en *pool* : cible propre à chaque mineur, modifications autorisées du modèle de bloc, propositions de blocs à la *pool*. L'ensemble couvre tout ce que faisait l'ancien protocole *getwork*, pour que les *pools* l'adoptent sans gros changement et que les mineurs puissent vérifier les blocs qu'ils produisent."
    definition: "bip-0023"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0023.mediawiki"
  - number: 30
    id: "BIP-0030"
    title: "Duplicate transactions"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Pieter Wuille"
    created: "2012-02-22"
    summary: "Règle de consensus qui interdit à un bloc de contenir une transaction dont l'identifiant est celui d'une transaction antérieure encore partiellement non dépensée. Pieter Wuille corrige ainsi une attaque fondée sur des coinbases dupliquées. La règle s'applique depuis le 15 mars 2012, puis à tous les blocs sauf les 2 cas historiques des hauteurs 91842 et 91880."
    definition: "bip-0030"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0030.mediawiki"
  - number: 31
    id: "BIP-0031"
    title: "Pong message"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Mike Hearn"
    created: "2012-04-11"
    summary: "Message `pong` du réseau pair-à-pair. Un nœud envoie un `ping` avec un nombre aléatoire (nonce), son pair le lui renvoie dans un `pong`, ce qui permet de détecter une connexion morte ou un pair surchargé et de mesurer la latence."
    definition: "bip-0031"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0031.mediawiki"
  - number: 32
    id: "BIP-0032"
    title: "Hierarchical Deterministic Wallets"
    status: "Deployed"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Pieter Wuille"
    created: "2012-02-11"
    summary: "Standard des portefeuilles hiérarchiques déterministes (HD) : à partir d'une seule graine, une fonction de dérivation produit un arbre de paires de clés, et une clé publique étendue permet de dériver des adresses sans exposer les clés privées. Une seule sauvegarde suffit alors à restaurer toutes les clés du portefeuille."
    definition: "bip-0032"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0032.mediawiki"
  - number: 33
    id: "BIP-0033"
    title: "Stratized Nodes"
    status: "Closed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Amir Taaki"
    created: "2012-05-15"
    summary: "Proposition d'Amir Taaki de « nœuds stratifiés » qui confient la validation et les recherches dans la blockchain à des services spécialisés. Le texte ajoute les bits de service `NODE_SERVICE` et `NODE_STRATIZED` et des messages comme `getoutputs`, pour remplacer le serveur Stratum utilisé par Electrum."
    definition: "bip-0033"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0033.mediawiki"
  - number: 34
    id: "BIP-0034"
    title: "Block v2, Height in Coinbase"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Gavin Andresen"
    created: "2012-07-06"
    summary: "Version 2 des blocs, qui oblige chaque mineur à inscrire la hauteur du bloc au début du `scriptSig` de la coinbase et rend ainsi chaque coinbase unique. Quand 750 des 1000 derniers blocs sont en version 2, les blocs version 2 invalides sont rejetés, puis tous les blocs version 1 à partir de 950."
    definition: "bip-0034"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0034.mediawiki"
  - number: 35
    id: "BIP-0035"
    title: "mempool message"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Jeff Garzik"
    created: "2012-08-16"
    summary: "Message `mempool`, par lequel un pair demande à un nœud la liste des transactions de sa mempool, avec une extension de `getdata` pour récupérer ces transactions. Le texte cite 3 usages : les clients SPV qui cherchent leurs transactions non confirmées, les mineurs qui redémarrent et le diagnostic du réseau."
    definition: "bip-0035"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0035.mediawiki"
  - number: 36
    id: "BIP-0036"
    title: "Custom Services"
    status: "Closed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Stefan Thomas"
    created: "2012-08-03"
    summary: "Proposition de Stefan Thomas pour que les nœuds annoncent des services personnalisés (table de hachage distribuée, *pools* distribuées, protocoles pour clients légers) dans de nouveaux champs du message `version`, sans consommer les 64 bits limités du champ `services`."
    definition: "bip-0036"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0036.mediawiki"
  - number: 37
    id: "BIP-0037"
    title: "Connection Bloom filtering"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Mike Hearn"
      - "Matt Corallo"
    created: "2012-10-24"
    summary: "Filtrage par filtre de Bloom, qu'un client léger (SPV) confie à ses pairs pour décrire les transactions qui le concernent. Le nœud complet ne lui envoie plus que ces transactions et des blocs Merkle qui prouvent leur inclusion. Le taux de faux positifs, choisi par le client, règle le compromis entre bande passante et confidentialité."
    definition: "bip-0037"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0037.mediawiki"
  - number: 38
    id: "BIP-0038"
    title: "Passphrase-protected private key"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Mike Caldwell"
      - "Aaron Voisine"
    created: "2012-11-20"
    summary: "Méthode pour chiffrer une clé privée avec une phrase secrète, sous la forme d'une chaîne `Base58Check` de 58 caractères destinée aux *paper wallets* et aux pièces physiques. Le chiffrement utilise `scrypt` contre la force brute, et un second mode permet à un fabricant de générer la clé sans jamais connaître la phrase secrète d'origine."
    definition: "bip-0038"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0038.mediawiki"
  - number: 39
    id: "BIP-0039"
    title: "Mnemonic code for generating deterministic keys"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Marek Palatinus"
      - "Pavol Rusnak"
      - "Aaron Voisine"
      - "Sean Bowe"
    created: "2013-09-10"
    summary: "Standard de la phrase mnémonique : l'entropie du portefeuille, de 128 à 256 bits, reçoit une somme de contrôle puis se découpe en groupes de 11 bits qui renvoient chacun à un mot d'une liste de 2048. La phrase, avec une *passphrase* optionnelle, se convertit ensuite en graine binaire pour un portefeuille HD du BIP-0032."
    definition: "bip-0039"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0039.mediawiki"
  - number: 42
    id: "BIP-0042"
    title: "A finite monetary supply for Bitcoin"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Pieter Wuille"
    created: "2014-04-01"
    summary: "BIP humoristique publié le 1er avril 2014 par Pieter Wuille, qui corrige un vrai défaut : le décalage binaire qui divise la récompense de bloc devient un comportement non défini en C++ après 64 *halvings*, ce qui aurait relancé l'émission. Le correctif fixe la récompense à zéro au-delà, et plafonne ainsi l'offre totale à 21 millions de bitcoins."
    definition: "bip-0042"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0042.mediawiki"
  - number: 43
    id: "BIP-0043"
    title: "Purpose Field for Deterministic Wallets"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Marek Palatinus"
      - "Pavol Rusnak"
    created: "2014-04-24"
    summary: "Champ *purpose* qui occupe le premier niveau de dérivation d'un portefeuille HD, `m / purpose' / *`, et annonce le standard qui organise la suite du chemin. Chaque schéma prend le numéro de son BIP : `44'` pour le BIP-0044, par exemple. Des portefeuilles qui suivent des standards différents ne dérivent ainsi jamais les mêmes clés."
    definition: "bip-0043"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0043.mediawiki"
  - number: 44
    id: "BIP-0044"
    title: "Multi-Account Hierarchy for Deterministic Wallets"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Marek Palatinus"
      - "Pavol Rusnak"
    created: "2014-04-24"
    summary: "Hiérarchie en 5 niveaux pour les portefeuilles HD, `m / purpose' / coin_type' / account' / change / address_index`, avec `44'` comme *purpose*. Une même graine sert ainsi plusieurs cryptomonnaies et plusieurs comptes, chacun séparé en une chaîne externe pour les adresses de réception et une chaîne interne pour la monnaie rendue."
    definition: "bip-0044"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0044.mediawiki"
  - number: 45
    id: "BIP-0045"
    title: "Structure for Deterministic P2SH Multisignature Wallets"
    status: "Complete"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Manuel Araoz"
      - "Ryan X. Charles"
      - "Matias Alejo Garcia"
    created: "2014-04-25"
    summary: "Structure de dérivation pour les portefeuilles multisignatures P2SH partagés entre plusieurs parties, sur le chemin `m / 45' / cosigner_index / change / address_index`. Chaque cosignataire génère sa clé maîtresse de son côté, et tous dérivent les mêmes adresses sans avoir à communiquer, la communication ne servant qu'à créer et signer les transactions."
    definition: "bip-0045"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0045.mediawiki"
  - number: 46
    id: "BIP-0046"
    title: "Address Scheme for Timelocked Fidelity Bonds"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Chris Belcher"
      - "Thebora Kompanioni"
    created: "2022-04-01"
    summary: "Schéma de dérivation des adresses à verrou temporel qui portent les *fidelity bonds*, ces bitcoins bloqués avec `OP_CHECKLOCKTIMEVERIFY` pour résister aux attaques Sybil, notamment dans JoinMarket. Le chemin `m/84'/0'/0'/2/index` associe chacun des 960 index à un mois, de janvier 2020 à décembre 2099 : la graine suffit à retrouver les fonds, sans noter les dates de déverrouillage."
    definition: "bip-0046"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0046.mediawiki"
  - number: 47
    id: "BIP-0047"
    title: "Reusable Payment Codes for Hierarchical Deterministic Wallets"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Justus Ranvier"
    created: "2015-04-24"
    summary: "Codes de paiement réutilisables, des identifiants qu'on peut publier sans réutiliser d'adresse. L'expéditeur annonce son code au destinataire par une transaction de notification, puis un échange de clés ECDH permet à chacun de dériver une suite d'adresses uniques destinées à l'autre, sur le chemin `m / 47' / coin_type' / identity'`."
    definition: "bip-0047"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0047.mediawiki"
  - number: 48
    id: "BIP-0048"
    title: "Multi-Script Hierarchy for Multi-Sig Wallets"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Fontaine"
    created: "2020-12-16"
    summary: "Chemin de dérivation `m / 48' / coin_type' / account' / script_type' / change / address_index`, déjà utilisé par les portefeuilles multisignatures HD avant ce BIP. Le niveau `script_type'` sépare les types de script : `1'` pour le P2SH-P2WSH et `2'` pour le P2WSH, ce dernier étant recommandé par défaut."
    definition: "bip-0048"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0048.mediawiki"
  - number: 49
    id: "BIP-0049"
    title: "Derivation scheme for P2WPKH-nested-in-P2SH based accounts"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Daniel Weigl"
    created: "2016-05-19"
    summary: "Schéma de dérivation des portefeuilles HD pour les adresses SegWit imbriquées dans du P2SH (P2SH-P2WPKH), avec `49'` comme *purpose*. Ces comptes sont séparés des comptes BIP-0044 : un portefeuille incompatible n'affiche rien plutôt que d'afficher un solde partiel."
    definition: "bip-0049"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0049.mediawiki"
  - number: 50
    id: "BIP-0050"
    title: "March 2013 Chain Fork Post-Mortem"
    status: "Deployed"
    type: "Informational"
    authors:
      - "Gavin Andresen"
    created: "2013-03-20"
    summary: "Rapport d'incident sur la scission de chaîne de mars 2013. Un bloc valide demandait plus de verrous Berkeley DB que les nœuds antérieurs à la 0.8 n'en prévoyaient : ils l'ont rejeté, alors que les nœuds 0.8, passés à LevelDB, l'acceptaient. Les *pools* BTC Guild et Slush sont revenues à la 0.7 pour réunifier la chaîne."
    definition: "bip-0050"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0050.mediawiki"
  - number: 52
    id: "BIP-0052"
    title: "Durable, Low Energy Bitcoin PoW"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (hard fork)"
    authors:
      - "Michael Dubrovsky"
      - "Bogdan Penkovsky"
    created: "2021-05-13"
    summary: "Proposition de preuve de travail optique (oPoW), une variante de Hashcash que des processeurs photoniques calculent avec peu d'énergie, à la place de la preuve de travail actuelle. Le coût du minage passerait de l'électricité au matériel, pour rendre le minage rentable hors des régions où l'électricité est bon marché. Ce changement demanderait un hard fork."
    definition: "bip-0052"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0052.mediawiki"
  - number: 53
    id: "BIP-0053"
    title: "Disallow 64-byte transactions"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Chris Stewart"
    created: "2025-04-11"
    summary: "Règle de consensus qui rend invalides les transactions qui font exactement 64 octets sans leur témoin. Une telle transaction a la taille d'un nœud interne de l'arbre de Merkle et peut se faire passer pour lui, ce qui rend les blocs malléables et permet de tromper un client léger avec une fausse preuve d'inclusion."
    definition: "bip-0053"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0053.mediawiki"
  - number: 54
    id: "BIP-0054"
    title: "Consensus Cleanup"
    status: "Complete"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Antoine Poinsot"
      - "Matt Corallo"
    created: "2025-04-11"
    summary: "Soft fork qui regroupe 4 corrections du consensus : il bloque l'attaque *time warp* en encadrant l'horodatage des blocs aux bornes des périodes de difficulté, plafonne à 2500 les opérations de signature hors témoin par transaction, invalide les transactions de 64 octets et fixe le `nLockTime` de la coinbase, ce qui rend inutiles les vérifications du BIP-0030."
    definition: "bip-0054"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0054.md"
  - number: 60
    id: "BIP-0060"
    title: "Fixed Length \"version\" Message (Relay-Transactions Field)"
    status: "Closed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Amir Taaki"
    created: "2013-06-16"
    summary: "Proposition d'Amir Taaki de rendre obligatoire le champ `relay` que le BIP-0037 avait ajouté en option à la fin du message `version`. Un message aux champs fixes reste plus simple à lire et à vérifier, alors qu'un champ optionnel oblige le code à connaître la taille restante du message."
    definition: "bip-0060"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0060.mediawiki"
  - number: 61
    id: "BIP-0061"
    title: "Reject P2P message"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Gavin Andresen"
    created: "2014-06-18"
    summary: "Message `reject`, qu'un nœud envoie en réponse à un message `version`, `tx` ou `block` pour expliquer pourquoi il le refuse, avec un code et une raison lisible. Ce retour aide les implémentations à rester compatibles et signale à un client SPV qu'une transaction a été refusée. Bitcoin Core a retiré ces messages dans sa version 0.20.0."
    definition: "bip-0061"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0061.mediawiki"
  - number: 62
    id: "BIP-0062"
    title: "Dealing with malleability"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Pieter Wuille"
    created: "2014-03-12"
    summary: "Recensement des sources connues de malléabilité des transactions (signatures non DER, valeur S haute, opérations autres que des *push* dans le `scriptSig`, éléments superflus sur la pile…), avec une règle pour chacune, afin qu'un tiers ne puisse plus modifier une transaction sans invalider sa signature. Pieter Wuille a fermé ce BIP sans qu'il soit déployé."
    definition: "bip-0062"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0062.mediawiki"
  - number: 64
    id: "BIP-0064"
    title: "getutxo message"
    status: "Closed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Mike Hearn"
    created: "2014-06-10"
    summary: "Proposition de Mike Hearn d'un message `getutxos` par lequel un client léger demande à un nœud complet si des sorties précises sont encore non dépensées, la réponse arrivant dans un message `utxos`. Le texte cite les contrats d'assurance, qui doivent vérifier vite qu'une promesse de financement n'a pas été annulée par une double dépense."
    definition: "bip-0064"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0064.mediawiki"
  - number: 65
    id: "BIP-0065"
    title: "OP_CHECKLOCKTIMEVERIFY"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Peter Todd"
    created: "2014-10-01"
    summary: "Opcode `OP_CHECKLOCKTIMEVERIFY` (CLTV), qui redéfinit `OP_NOP2` pour qu'une sortie ne puisse pas être dépensée avant une hauteur de bloc ou une date donnée. Le script échoue si le `nLockTime` de la transaction de dépense n'atteint pas la valeur fixée. Le BIP cite comme usages les séquestres, les remboursements à échéance et les canaux de paiement."
    definition: "bip-0065"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0065.mediawiki"
  - number: 66
    id: "BIP-0066"
    title: "Strict DER signatures"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Pieter Wuille"
    created: "2015-01-10"
    summary: "Règle de consensus qui impose l'encodage DER strict à toute signature ECDSA vérifiée par `OP_CHECKSIG`, `OP_CHECKMULTISIG` et leurs variantes. La validité des blocs cesse ainsi de dépendre de la façon dont OpenSSL lit les signatures, après que les versions 1.0.0p et 1.0.1k d'OpenSSL ont fait rejeter la chaîne par certains nœuds."
    definition: "bip-0066"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0066.mediawiki"
  - number: 67
    id: "BIP-0067"
    title: "Deterministic Pay-to-script-hash multi-signature addresses through public key sorting"
    status: "Complete"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Thomas Kerin"
      - "Jean-Pierre Rupp"
      - "Ruben de Vries"
    created: "2015-02-08"
    summary: "Méthode qui trie par ordre lexicographique les clés publiques compressées d'un script multisignature P2SH, pour qu'un même ensemble de clés et un même seuil donnent toujours la même adresse. Sans ce tri, n clés offrent jusqu'à $2(n!)$ scripts possibles, chacun avec sa propre adresse."
    definition: "bip-0067"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0067.mediawiki"
  - number: 68
    id: "BIP-0068"
    title: "Relative lock-time using consensus-enforced sequence numbers"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Mark Friedenbach"
      - "BtcDrak"
      - "Nicolas Dorier"
      - "kinoshitajona"
    created: "2015-05-28"
    summary: "Règle de consensus qui donne au champ `nSequence` des entrées un sens de verrou temporel relatif, pour les transactions de version 2 ou plus. Une entrée reste invalide tant que la sortie qu'elle dépense n'a pas atteint un âge minimal, compté en blocs ou par tranches de 512 secondes. Les canaux de paiement bidirectionnels reposent sur ce mécanisme."
    definition: "bip-0068"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0068.mediawiki"
  - number: 69
    id: "BIP-0069"
    title: "Lexicographical Indexing of Transaction Inputs and Outputs"
    status: "Complete"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Kristov Atlas"
    created: "2015-06-12"
    summary: "Méthode de tri déterministe des entrées et des sorties d'une transaction : les entrées par hachage de la transaction précédente puis par index, les sorties par montant puis par `scriptPubKey`. Un ordre commun à tous les portefeuilles évite que l'ordre propre à chacun trahisse le logiciel utilisé ou la sortie de monnaie rendue."
    definition: "bip-0069"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0069.mediawiki"
  - number: 70
    id: "BIP-0070"
    title: "Payment Protocol"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Gavin Andresen"
      - "Mike Hearn"
    created: "2013-07-29"
    summary: "Protocole de paiement entre un commerçant et son client, en 3 messages : `PaymentRequest`, signé avec le certificat X.509 du commerçant, puis `Payment` et `PaymentACK`. Le portefeuille affiche un nom vérifié plutôt qu'une adresse, le client garde une preuve de paiement en cas de litige et l'échange résiste aux attaques de l'homme du milieu."
    definition: "bip-0070"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0070.mediawiki"
  - number: 71
    id: "BIP-0071"
    title: "Payment Protocol MIME types"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Gavin Andresen"
    created: "2013-07-29"
    summary: "Types MIME des 3 messages du protocole de paiement du BIP-0070 : `application/bitcoin-paymentrequest`, `application/bitcoin-payment` et `application/bitcoin-paymentack`. Un serveur web ou un e-mail qui transporte ces messages binaires les annonce ainsi selon les standards d'Internet."
    definition: "bip-0071"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0071.mediawiki"
  - number: 72
    id: "BIP-0072"
    title: "bitcoin: uri extensions for Payment Protocol"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Gavin Andresen"
    created: "2013-07-29"
    summary: "Extension du schéma d'URI `bitcoin:` (BIP-0021) qui ajoute le paramètre `r`, l'URL où le portefeuille télécharge la demande de paiement du BIP-0070. Un portefeuille compatible ignore alors l'adresse et le montant de l'URI pour suivre le protocole de paiement, tandis qu'un ancien portefeuille paie toujours l'adresse indiquée."
    definition: "bip-0072"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0072.mediawiki"
  - number: 73
    id: "BIP-0073"
    title: "Use \"Accept\" header for response type negotiation with Payment Request URLs"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Stephen Pair"
    created: "2013-08-27"
    summary: "Extension du protocole de paiement (BIP-0070) qui raccourcit les URL encodées dans les QR codes. Le portefeuille qui scanne une simple URL l'interroge avec l'en-tête HTTP `Accept`, et le serveur répond par une URI `bitcoin:` ou par une demande de paiement selon ce que le client indique savoir lire."
    definition: "bip-0073"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0073.mediawiki"
  - number: 74
    id: "BIP-0074"
    title: "Allow zero value OP_RETURN in Payment Protocol"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Toby Padilla"
    created: "2016-01-29"
    summary: "Modification du protocole de paiement (BIP-0070) qui autorise des sorties `OP_RETURN` de valeur nulle dans une demande de paiement. Le protocole ignorait jusque-là les sorties à zéro, si bien qu'un commerçant qui voulait inscrire des données devait y placer des bitcoins, perdus à jamais."
    definition: "bip-0074"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0074.mediawiki"
  - number: 75
    id: "BIP-0075"
    title: "Out of Band Address Exchange using Payment Protocol Encryption"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Justin Newton"
      - "Matt David"
      - "Aaron Voisine"
      - "James MacWhyte"
    created: "2015-11-20"
    summary: "Extension du protocole de paiement (BIP-0070) en 2 volets : l'expéditeur peut signer sa demande et joindre un certificat pour que le destinataire sache avec qui il traite, et la demande de paiement renvoyée est chiffrée pour qu'un intermédiaire ne puisse pas en lire le contenu. L'échange d'adresses entre portefeuilles peut ainsi s'automatiser."
    definition: "bip-0075"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0075.mediawiki"
  - number: 77
    id: "BIP-0077"
    title: "Async Payjoin"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Dan Gould"
      - "Yuval Kogman"
    created: "2023-08-08"
    summary: "Version asynchrone du Payjoin (BIP-0078), où le destinataire n'a plus besoin d'héberger un serveur joignable. Expéditeur et destinataire échangent leurs PSBT chiffrées par l'intermédiaire d'un serveur annuaire qui ne lit pas leur contenu, et les requêtes passent par Oblivious HTTP pour masquer leur adresse IP."
    definition: "bip-0077"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0077.md"
  - number: 78
    id: "BIP-0078"
    title: "A Simple Payjoin Proposal"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Nicolas Dorier"
    created: "2019-05-01"
    replaces: [79]
    summary: "Protocole de Payjoin : pendant un paiement, le destinataire ajoute une de ses entrées à la transaction préparée par l'expéditeur, reçue sous forme de PSBT sur l'adresse indiquée par le paramètre `pj=` d'une URI BIP-0021. La transaction casse ainsi l'heuristique selon laquelle toutes les entrées appartiennent à la même personne. Ce BIP remplace le BIP-0079."
    definition: "bip-0078"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0078.mediawiki"
  - number: 79
    id: "BIP-0079"
    title: "Bustapay :: a practical coinjoin protocol"
    status: "Closed"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Ryan Havar"
    created: "2018-10-05"
    superseded_by: [78]
    summary: "Protocole Bustapay, dans lequel l'expéditeur et le destinataire d'un paiement signent ensemble la transaction, le destinataire y ajoutant une de ses entrées. L'analyse de chaîne ne peut plus supposer que toutes les entrées appartiennent au payeur, et le commerçant consolide ses UTXO au passage. Le BIP-0078 l'a remplacé."
    definition: "bip-0079"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0079.mediawiki"
  - number: 80
    id: "BIP-0080"
    title: "Hierarchy for Non-Colored Voting Pool Deterministic Multisig Wallets"
    status: "Closed"
    type: "Informational"
    authors:
      - "Justus Ranvier"
      - "Jimmy Song"
    created: "2014-08-11"
    summary: "Hiérarchie de dérivation pour les portefeuilles multisignatures des *voting pools* sans *colored coins*, sur le chemin `m / 80' / coin_type' / series' / address_index`. Les séries permettent à ces *pools* de gérer leurs fonds en stockage à froid selon un ordre FIFO, la plupart des clés privées restant hors ligne."
    definition: "bip-0080"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0080.mediawiki"
  - number: 81
    id: "BIP-0081"
    title: "Hierarchy for Colored Voting Pool Deterministic Multisig Wallets"
    status: "Closed"
    type: "Informational"
    authors:
      - "Justus Ranvier"
      - "Jimmy Song"
    created: "2014-08-11"
    summary: "Variante du BIP-0080 pour les *voting pools* qui gèrent des *colored coins*. Le chemin `m / 81' / series' / … / address_index` insère 5 niveaux qui encodent la définition de la couleur, car un seul index de 32 bits ne suffit pas à l'identifier sans risque de collision."
    definition: "bip-0081"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0081.mediawiki"
  - number: 83
    id: "BIP-0083"
    title: "Dynamic Hierarchical Deterministic Key Trees"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Eric Lombrozo"
    created: "2015-11-16"
    summary: "Schéma de dérivation qui permet d'étendre une hiérarchie de clés BIP-0032 sans limite, au lieu d'imposer une structure fixe comme les BIP-0044 et BIP-0045. Sous un nœud parent, les index supérieurs à 0 donnent des clés de signature et l'index 0 est réservé à la création d'un sous-niveau, qui suit la même règle."
    definition: "bip-0083"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0083.mediawiki"
  - number: 84
    id: "BIP-0084"
    title: "Derivation scheme for P2WPKH based accounts"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pavol Rusnak"
    created: "2017-12-28"
    summary: "Schéma de dérivation des portefeuilles HD pour les adresses SegWit natives P2WPKH (`bc1q`), avec `84'` comme *purpose*. Il reprend la structure de comptes des BIP-0044 et BIP-0049 ; seul le *purpose* change pour indiquer le type de script."
    definition: "bip-0084"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0084.mediawiki"
  - number: 85
    id: "BIP-0085"
    title: "Deterministic Entropy From BIP32 Keychains"
    status: "Deployed"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Ethan Kosakovsky"
      - "Aneesh Karve"
    created: "2020-03-20"
    summary: "Méthode pour dériver de l'entropie depuis une clé maîtresse BIP-0032, sur des chemins endurcis `m/83696968'/…`, puis la convertir en phrase BIP-0039, en clé WIF, en `xprv`, en mot de passe ou en clé RSA. Une seule sauvegarde sert alors à régénérer les graines de plusieurs portefeuilles indépendants, sans révéler la graine d'origine."
    definition: "bip-0085"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0085.mediawiki"
  - number: 86
    id: "BIP-0086"
    title: "Key Derivation for Single Key P2TR Outputs"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Ava Chow"
    created: "2021-06-22"
    summary: "Schéma de dérivation des portefeuilles HD pour les sorties P2TR à clé unique, où la clé dérivée sert de clé interne Taproot, avec `86'` comme *purpose*. Il reprend la structure des BIP-0044, BIP-0049 et BIP-0084, pour qu'une simple sauvegarde de la graine retrouve ces sorties."
    definition: "bip-0086"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0086.mediawiki"
  - number: 87
    id: "BIP-0087"
    title: "Hierarchy for Deterministic Multisig Wallets"
    status: "Complete"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Robert Spigler"
    created: "2020-03-11"
    summary: "Hiérarchie de dérivation pour les portefeuilles multisignatures, `m / 87' / coin_type' / account' / change / address_index`, qui ne fixe aucun type de script dans le chemin. Les descripteurs (*output script descriptors*) qui accompagnent la sauvegarde donnent déjà le type de script et les clés publiques de tous les cosignataires."
    definition: "bip-0087"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0087.mediawiki"
  - number: 88
    id: "BIP-0088"
    title: "Hierarchical Deterministic Path Templates"
    status: "Complete"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Dmitry Petukhov"
    created: "2020-06-23"
    summary: "Format de modèles de chemins de dérivation BIP-0032, qui décrit les chemins qu'un portefeuille accepte avec des plages et des jokers. Par exemple, `m/{44,49,84}'/0'/0'/{0-1}/{0-50000}` couvre les chaînes externe et interne des BIP-0044, BIP-0049 et BIP-0084 jusqu'à l'index 50000. Un logiciel peut ainsi vérifier qu'un chemin reste dans les limites prévues."
    definition: "bip-0088"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0088.mediawiki"
  - number: 89
    id: "BIP-0089"
    title: "Chain Code Delegation"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Jesse Posner"
      - "Jurvis Tan"
    created: "2025-12-03"
    summary: "Méthode pour portefeuilles multisignatures, la *Chain Code Delegation*, où un participant privilégié garde pour lui les codes de chaîne BIP-0032 des autres et leur fournit, à chaque signature, l'ajustement propre à l'entrée concernée. Ces cosignataires, typiquement un service de garde collaborative, signent sans pouvoir dériver les autres adresses ni suivre le solde du portefeuille."
    definition: "bip-0089"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0089.mediawiki"
  - number: 90
    id: "BIP-0090"
    title: "Buried Deployments"
    status: "Deployed"
    type: "Informational"
    authors:
      - "Suhas Daftuar"
    created: "2016-11-08"
    summary: "Simplification qui remplace le déclenchement des soft forks BIP-0034, BIP-0065 et BIP-0066, fondé sur la version des 1000 blocs précédents, par les hauteurs de bloc où ces règles sont devenues actives. Valider un bloc ne demande plus de remonter l'historique de la chaîne, et le code d'activation devenu inutile disparaît."
    definition: "bip-0090"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0090.mediawiki"
  - number: 91
    id: "BIP-0091"
    title: "Reduced threshold Segwit MASF"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "James Hilliard"
    created: "2017-05-22"
    summary: "Déploiement destiné à activer SegWit avec moins de 95 % de la puissance de calcul. Dès que 269 blocs sur une fenêtre de 336 (80 %) signalent le bit 4, les nœuds rejettent tout bloc qui ne signale pas le bit 1 du déploiement SegWit du BIP-0009, ce qui force son verrouillage."
    definition: "bip-0091"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0091.mediawiki"
  - number: 93
    id: "BIP-0093"
    title: "codex32: Checksummed SSSS-aware BIP32 seeds"
    status: "Draft"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Leon Olsson Curr"
      - "Pearlwort Sneed"
      - "Andrew Poelstra"
    created: "2023-02-13"
    summary: "Format codex32 de sauvegarde de la graine maîtresse BIP-0032, une chaîne en base32 protégée par une somme de contrôle BCH qui corrige les erreurs de copie. Le partage de secret de Shamir peut répartir la graine en 31 parts au plus, dont un seuil de 2 à 9 suffit à la reconstituer, et tout se calcule à la main."
    definition: "bip-0093"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0093.mediawiki"
  - number: 94
    id: "BIP-0094"
    title: "Testnet 4"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Fabian Jahr"
    created: "2024-05-27"
    summary: "Testnet 4, réseau de test qui remplace le Testnet 3. Il conserve l'exception qui autorise la difficulté minimale après 20 minutes sans bloc, mais calcule l'ajustement de difficulté depuis le premier bloc de la période pour empêcher les « tempêtes de blocs », et bloque l'attaque *time warp*."
    definition: "bip-0094"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0094.mediawiki"
  - number: 95
    id: "BIP-0095"
    title: "Testnet 5"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pol Espinasa"
      - "Fabian Jahr"
    created: "2026-06-22"
    replaces: [94]
    summary: "Testnet 5, réseau de test destiné à remplacer le Testnet 4. Il supprime l'exception qui autorisait la difficulté minimale après 20 minutes sans bloc, exploitée au point de gêner les tests, relève la difficulté minimale et applique dès le bloc 1 les règles du Consensus Cleanup (BIP-0054)."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0095.md"
  - number: 98
    id: "BIP-0098"
    title: "Fast Merkle Trees"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Mark Friedenbach"
      - "Kalle Alm"
      - "BtcDrak"
    created: "2017-08-24"
    summary: "Nouvelle construction d'arbre de Merkle pour Bitcoin, qui n'est pas vulnérable à la faille des entrées dupliquées (CVE-2012-2459) de l'arbre conçu par Satoshi et évite son double hachage superflu. D'après l'auteur, construire et vérifier l'arbre prend environ 55 % de temps en moins."
    definition: "bip-0098"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0098.mediawiki"
  - number: 99
    id: "BIP-0099"
    title: "Motivation and deployment of consensus rule changes ([soft/hard]forks)"
    status: "Closed"
    type: "Informational"
    authors:
      - "Jorge Timón"
    created: "2015-06-20"
    summary: "Classification des différents types de forks de consensus (soft forks, hard forks et leurs variantes), avec pour chacun un mode de déploiement recommandé. Jorge Timón cherche à éviter les malentendus qui retardent les changements quand chacun discute sans vue commune des chemins de déploiement."
    definition: "bip-0099"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0099.mediawiki"
  - number: 100
    id: "BIP-0100"
    title: "Dynamic maximum block size by miner vote"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (hard fork)"
    authors:
      - "Jeff Garzik"
      - "Tom Harding"
      - "Dagur Valberg Johannsson"
    created: "2015-06-11"
    summary: "Proposition de Jeff Garzik qui remplace la limite fixe de 1 Mo par une taille maximale votée par les mineurs dans la coinbase. À chaque période de 2016 blocs, la limite peut monter ou baisser de 5 % au plus si 75 % des blocs (1512) votent en ce sens. Ce changement demandait un hard fork."
    definition: "bip-0100"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0100.mediawiki"
  - number: 101
    id: "BIP-0101"
    title: "Increase maximum block size"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (hard fork)"
    authors:
      - "Gavin Andresen"
    created: "2015-06-22"
    summary: "Proposition de Gavin Andresen qui remplace la limite de 1 Mo par une taille maximale de 8 Mo au 11 janvier 2016, doublée tous les 2 ans jusqu'à 8192 Mo en 2036. La limite augmente de façon linéaire entre 2 doublements. Ce changement demandait un hard fork."
    definition: "bip-0101"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0101.mediawiki"
  - number: 102
    id: "BIP-0102"
    title: "Block size increase to 2MB"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (hard fork)"
    authors:
      - "Jeff Garzik"
    created: "2015-06-23"
    summary: "Proposition de Jeff Garzik qui porte la taille maximale des blocs de 1 Mo à 2 Mo en une seule fois, par un hard fork. Le changement s'active à une date fixée, à condition que 95 % des 1000 derniers blocs le signalent, et la limite d'opérations de signature augmente dans la même proportion."
    definition: "bip-0102"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0102.mediawiki"
  - number: 103
    id: "BIP-0103"
    title: "Block size following technological growth"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (hard fork)"
    authors:
      - "Pieter Wuille"
    created: "2015-07-21"
    summary: "Proposition de Pieter Wuille d'une hausse de la taille maximale des blocs par paliers de 4,4 % tous les 97 jours environ, de janvier 2017 à juillet 2063, soit 17,7 % par an. Ce rythme suit la croissance moyenne de la bande passante, que l'auteur juge être le facteur limitant. Ce changement demandait un hard fork."
    definition: "bip-0103"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0103.mediawiki"
  - number: 104
    id: "BIP-0104"
    title: "'Block75' - Max block size like difficulty"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (hard fork)"
    authors:
      - "t.khan"
    created: "2017-01-13"
    summary: "Proposition surnommée « Block75 » qui ajuste la taille maximale des blocs à chaque période de 2016 blocs, sur le modèle de la difficulté, pour que les blocs restent pleins à 75 % en moyenne. La limite suit ainsi l'usage réel du réseau sans décision humaine. Ce changement demandait un hard fork."
    definition: "bip-0104"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0104.mediawiki"
  - number: 105
    id: "BIP-0105"
    title: "Consensus based block size retargeting algorithm"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (hard fork)"
    authors:
      - "BtcDrak"
    created: "2015-08-21"
    summary: "Proposition d'ajustement de la taille maximale des blocs par vote des mineurs dans la coinbase, à raison de 10 % de hausse ou de baisse au plus par période de 2016 blocs. Un mineur qui vote pour une hausse doit trouver un bloc sous une cible de difficulté plus exigeante, ce qui donne un coût à son vote."
    definition: "bip-0105"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0105.mediawiki"
  - number: 106
    id: "BIP-0106"
    title: "Dynamically Controlled Bitcoin Block Size Max Cap"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (hard fork)"
    authors:
      - "Upal Chakraborty"
    created: "2015-08-24"
    summary: "Proposition de taille maximale des blocs recalculée à chaque ajustement de difficulté. Dans la première variante, la limite double quand plus de la moitié des blocs de la période sont pleins à 90 %, et elle est divisée par 2 quand plus de 90 % restent sous 50 %. La seconde variante tient compte aussi des frais perçus."
    definition: "bip-0106"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0106.mediawiki"
  - number: 107
    id: "BIP-0107"
    title: "Dynamic limit on the block size"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (hard fork)"
    authors:
      - "Washington Y. Sanchez"
    created: "2015-09-11"
    summary: "Proposition de hausse de la taille maximale des blocs en 2 phases : 2 Mo en 2016 et 2017, 4 Mo en 2018 et 2019, puis 6 Mo en 2020. Ensuite, tous les 4032 blocs, la limite augmente de 10 % si au moins 3025 de ces blocs sont pleins à 60 %, sans jamais baisser."
    definition: "bip-0107"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0107.mediawiki"
  - number: 109
    id: "BIP-0109"
    title: "Two million byte size limit with sigop and sighash limits"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (hard fork)"
    authors:
      - "Gavin Andresen"
    created: "2016-01-28"
    summary: "Proposition de Gavin Andresen qui porte la taille maximale des blocs de 1 Mo à 2 Mo par un hard fork, en comptant précisément les opérations de signature et en limitant les données hachées par bloc. L'activation demande que 75 % des 1000 derniers blocs la signalent, suivis d'une période de grâce de 28 jours."
    definition: "bip-0109"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0109.mediawiki"
  - number: 110
    id: "BIP-0110"
    title: "Reduced Data Temporary Softfork"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Dathon Ohm"
    created: "2025-12-03"
    summary: "Soft fork temporaire, actif pendant un an, qui limite au niveau du consensus la taille des données arbitraires dans les transactions : `scriptPubKey` de 34 octets au plus (83 pour un `OP_RETURN`), éléments poussés de 256 octets au plus, annexe Taproot et `OP_SUCCESS` interdits. Le déploiement demande 55 % de signalement des mineurs."
    definition: "bip-0110"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0110.mediawiki"
  - number: 111
    id: "BIP-0111"
    title: "NODE_BLOOM service bit"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Matt Corallo"
      - "Peter Todd"
    created: "2015-08-20"
    summary: "Bit de service `NODE_BLOOM`, par lequel un nœud annonce qu'il accepte les filtres de Bloom du BIP-0037. Ces filtres offrent peu de confidentialité et exposent les nœuds à des attaques par déni de service, d'où la possibilité pour un opérateur de les désactiver. La version 70011 du protocole repère les anciens nœuds qui filtrent sans annoncer ce bit."
    definition: "bip-0111"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0111.mediawiki"
  - number: 112
    id: "BIP-0112"
    title: "CHECKSEQUENCEVERIFY"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "BtcDrak"
      - "Mark Friedenbach"
      - "Eric Lombrozo"
    created: "2015-08-10"
    summary: "Opcode `OP_CHECKSEQUENCEVERIFY` (CSV), qui redéfinit `OP_NOP3` pour que le script échoue si l'entrée n'impose pas, via son champ `nSequence` (BIP-0068), un verrou temporel relatif au moins égal à la valeur demandée. Une branche de script peut ainsi attendre que la sortie dépensée ait atteint un certain âge, ce qu'utilisent les canaux de paiement."
    definition: "bip-0112"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0112.mediawiki"
  - number: 113
    id: "BIP-0113"
    title: "Median time-past as endpoint for lock-time calculations"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Thomas Kerin"
      - "Mark Friedenbach"
    created: "2015-08-10"
    summary: "Règle de consensus qui compare les verrous temporels (`nLockTime`) à la médiane des horodatages des 11 derniers blocs (*Median Time Past*), et non plus à l'horodatage du bloc qui l'inclut. Cette médiane ne peut qu'augmenter : un mineur ne gagne plus rien à mentir sur l'heure de son bloc pour inclure plus tôt des transactions."
    definition: "bip-0113"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0113.mediawiki"
  - number: 114
    id: "BIP-0114"
    title: "Merkelized Abstract Syntax Tree"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Johnson Lau"
    created: "2016-04-02"
    summary: "Nouveau type de programme témoin (MAST) qui encode dans un arbre de Merkle les branches d'un script qui s'excluent mutuellement. À la dépense, seule la branche exécutée est révélée, ce qui rend possibles des conditions de dépense complexes, garde secrètes les branches inutilisées et permet d'ajouter des données hors consensus pour un coût très faible."
    definition: "bip-0114"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0114.mediawiki"
  - number: 115
    id: "BIP-0115"
    title: "Generic anti-replay protection using Script"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Luke Dashjr"
    created: "2016-09-23"
    summary: "Opcode `OP_CHECKBLOCKATHEIGHT`, qui redéfinit `OP_NOP5` pour qu'une transaction ne soit valide que sur une chaîne qui contient un bloc précis à une hauteur donnée. En cas de scission durable de la blockchain, une transaction ne peut ainsi pas être rejouée sur l'autre chaîne."
    definition: "bip-0115"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0115.mediawiki"
  - number: 116
    id: "BIP-0116"
    title: "MERKLEBRANCHVERIFY"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Mark Friedenbach"
      - "Kalle Alm"
      - "BtcDrak"
    created: "2017-08-25"
    summary: "Opcode `MERKLEBRANCHVERIFY`, activable par soft fork, qui vérifie qu'un ou plusieurs éléments appartiennent à un arbre de Merkle dont le script ne contient que la racine. Ces éléments peuvent être des clés publiques ou des sous-scripts : seuls ceux qui servent sont révélés à la dépense, ce qui économise de la place et préserve la confidentialité."
    definition: "bip-0116"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0116.mediawiki"
  - number: 117
    id: "BIP-0117"
    title: "Tail Call Execution Semantics"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Mark Friedenbach"
      - "Kalle Alm"
      - "BtcDrak"
    created: "2017-08-25"
    summary: "Sémantique d'appel terminal (*tail call*) pour Script : si l'exécution se termine avec plus d'un élément sur la pile, le dernier s'exécute à son tour comme un script. Associé à `MERKLEBRANCHVERIFY` (BIP-0116), ce mécanisme engage un script sur un grand nombre de chemins d'exécution dont seul celui utilisé est révélé, une forme générale de MAST."
    definition: "bip-0117"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0117.mediawiki"
  - number: 118
    id: "BIP-0118"
    title: "SIGHASH_ANYPREVOUT for Taproot Scripts"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Christian Decker"
      - "Anthony Towns"
    created: "2017-02-28"
    summary: "Nouveau type de clé publique pour Tapscript (BIP-0342) dont les signatures, en mode `SIGHASH_ANYPREVOUT` ou `SIGHASH_ANYPREVOUTANYSCRIPT`, ne s'engagent pas sur l'UTXO dépensé. Une même signature vaut alors pour toute sortie au script compatible, ce dont les protocoles hors chaîne comme eltoo ont besoin pour répondre à n'importe quel état publié."
    definition: "bip-0118"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0118.mediawiki"
  - number: 119
    id: "BIP-0119"
    title: "CHECKTEMPLATEVERIFY"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Jeremy Rubin"
    created: "2020-01-06"
    summary: "Opcode `OP_CHECKTEMPLATEVERIFY` (CTV), qui redéfinit `OP_NOP4` pour qu'une sortie ne puisse être dépensée que par une transaction conforme à un modèle haché : version, `nLockTime`, séquences, nombre d'entrées et sorties exactes. Ce *covenant* simple remplace de nombreuses transactions présignées et réduit la confiance et l'interactivité qu'elles demandent."
    definition: "bip-0119"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0119.mediawiki"
  - number: 120
    id: "BIP-0120"
    title: "Proof of Payment"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Kalle Rosenbaum"
    created: "2015-07-28"
    summary: "Système de preuve de paiement (*Proof of Payment*) : le portefeuille signe une transaction jamais diffusée qui reprend les entrées d'un paiement passé, avec une seule sortie `OP_RETURN` qui contient le `txid` et un nonce fourni par le vérificateur. Un hôtel, un parking ou un service de vidéo peut ainsi vérifier qu'un client a payé."
    definition: "bip-0120"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0120.mediawiki"
  - number: 121
    id: "BIP-0121"
    title: "Proof of Payment URI scheme"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Kalle Rosenbaum"
    created: "2015-07-27"
    summary: "Schéma d'URI `btcpop:` qui transmet une demande de preuve de paiement (BIP-0120) au portefeuille du client, par QR code ou NFC. Il reprend le BIP-0021 avec 2 paramètres obligatoires, `p` pour la destination de la preuve et `n` pour le nonce, et un `txid` optionnel qui désigne la transaction à prouver."
    definition: "bip-0121"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0121.mediawiki"
  - number: 122
    id: "BIP-0122"
    title: "URI scheme for Blockchain references / exploration"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Marco Pontello"
    created: "2015-08-29"
    summary: "Schéma d'URI `blockchain:` qui désigne un bloc, une transaction ou une adresse, pour que l'utilisateur l'ouvre dans l'explorateur ou l'application de son choix plutôt que dans celui imposé par son portefeuille. Un identifiant optionnel, le hachage du bloc de genèse, précise la chaîne visée."
    definition: "bip-0122"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0122.mediawiki"
  - number: 123
    id: "BIP-0123"
    title: "BIP Classification"
    status: "Deployed"
    type: "Process"
    authors:
      - "Eric Lombrozo"
    created: "2015-08-26"
    summary: "Classification des BIP en 4 couches, de la plus exigeante en interopérabilité à la plus libre : consensus, services pair-à-pair, API/RPC et applications. Le texte fixe les critères qui rangent un BIP dans l'une d'elles, sachant qu'un changement est d'autant plus difficile à faire accepter qu'il touche une couche basse."
    definition: "bip-0123"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0123.mediawiki"
  - number: 124
    id: "BIP-0124"
    title: "Hierarchical Deterministic Script Templates"
    status: "Closed"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Eric Lombrozo"
      - "William Swanson"
    created: "2015-11-20"
    summary: "Format de modèles de scripts (*script templates*) qui permet à plusieurs portefeuilles de générer les mêmes scripts à partir des mêmes chemins de dérivation BIP-0032. Il vise les multisignatures, les contrats à verrou temporel ou à hachage, et les protocoles comme le Lightning Network, dont les scripts évoluent vite."
    definition: "bip-0124"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0124.mediawiki"
  - number: 125
    id: "BIP-0125"
    title: "Opt-in Full Replace-by-Fee Signaling"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "David A. Harding"
      - "Peter Todd"
    created: "2015-12-04"
    summary: "Politique de relais *opt-in Replace-by-Fee* : une transaction signale qu'elle est remplaçable quand au moins une de ses entrées a un `nSequence` inférieur à `0xfffffffe`. Les nœuds acceptent alors de la remplacer dans leur mempool par une version qui paie plus de frais, et le destinataire sait qu'il doit attendre une confirmation."
    definition: "bip-0125"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0125.mediawiki"
  - number: 126
    id: "BIP-0126"
    title: "Best Practices for Heterogeneous Input Script Transactions"
    status: "Draft"
    type: "Informational"
    authors:
      - "Kristov Atlas"
    created: "2016-02-10"
    summary: "Bonnes pratiques pour les transactions qui dépensent des sorties envoyées à plusieurs adresses, ce qui révèle qu'elles appartiennent à la même personne. Le texte définit une forme standard (autant de scripts uniques en sortie qu'en entrée, et au moins 2 sorties de même montant, dont la plus grosse) qui limite la fuite d'informations."
    definition: "bip-0126"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0126.mediawiki"
  - number: 127
    id: "BIP-0127"
    title: "Simple Proof-of-Reserves Transactions"
    status: "Complete"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Steven Roose"
    created: "2019-01-28"
    summary: "Format standard de preuve de réserves : une transaction volontairement invalide, dont la première entrée porte le hachage d'un message et dont les autres, signées normalement, désignent les UTXO détenus. Une entreprise qui garde des bitcoins pour ses clients prouve ainsi qu'elle contrôle ces fonds sans les déplacer, et le format s'appuie sur les PSBT du BIP-0174."
    definition: "bip-0127"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0127.mediawiki"
  - number: 128
    id: "BIP-0128"
    title: "Timelock-Recovery Storage Format"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Oren Z"
    created: "2026-02-05"
    summary: "Format JSON des plans de récupération à verrou temporel, en cas de perte de la graine ou de succession. Un plan contient 2 transactions présignées : une transaction d'alerte qui consolide les fonds, puis une transaction de récupération, bloquée par un verrou relatif, qui les envoie vers des portefeuilles de secours et laisse au propriétaire le temps d'annuler."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0128.mediawiki"
  - number: 129
    id: "BIP-0129"
    title: "Bitcoin Secure Multisig Setup (BSMS)"
    status: "Complete"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Hugo Nguyen"
      - "Peter Gray"
      - "Marko Bencun"
      - "Aaron Chen"
      - "Rodolfo Novak"
    created: "2020-11-10"
    summary: "Protocole BSMS (*Bitcoin Secure Multisig Setup*) pour configurer un portefeuille multisignature entre signataires de fabricants différents. Un coordinateur collecte les clés des signataires, éventuellement chiffrées avec un secret partagé, puis leur renvoie la configuration complète, que chacun vérifie et enregistre, pour qu'un attaquant ne puisse ni la modifier ni l'espionner."
    definition: "bip-0129"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0129.mediawiki"
  - number: 130
    id: "BIP-0130"
    title: "sendheaders message"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Suhas Daftuar"
    created: "2015-05-08"
    summary: "Message `sendheaders`, par lequel un nœud demande à ses pairs de lui annoncer les nouveaux blocs directement par un message `headers` plutôt que par un `inv`. Le pair qui reçoit l'en-tête n'a plus à envoyer de `getheaders`, ce qui accélère la propagation des blocs."
    definition: "bip-0130"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0130.mediawiki"
  - number: 131
    id: "BIP-0131"
    title: "\"Coalescing Transaction\" Specification (wildcard inputs)"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (hard fork)"
    authors:
      - "Chris Priest"
    created: "2015-11-30"
    summary: "Proposition de transactions dites « de coalescence », dont une entrée *wildcard* dépense d'un coup tous les UTXO qui partagent le même `scriptPubKey`, avec une seule signature. Consolider de nombreuses petites sorties coûterait ainsi beaucoup moins cher, ce qui réduirait l'ensemble des UTXO. Ce changement demandait un hard fork."
    definition: "bip-0131"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0131.mediawiki"
  - number: 132
    id: "BIP-0132"
    title: "Committee-based BIP Acceptance Process"
    status: "Closed"
    type: "Process"
    authors:
      - "Andy Chase"
    created: "2015-08-31"
    summary: "Proposition d'un processus d'acceptation des BIP par des comités représentant 4 segments (développeurs de clients, mineurs, commerçants et utilisateurs). Un BIP serait accepté après 4 semaines de commentaires et d'avis s'il réunit au moins 70 % de la part représentée dans 3 segments sur 4."
    definition: "bip-0132"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0132.mediawiki"
  - number: 133
    id: "BIP-0133"
    title: "feefilter message"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Alex Morcos"
    created: "2016-02-13"
    summary: "Ajoute au protocole P2P le message `feefilter`, par lequel un nœud indique à ses pairs le taux de frais minimum de sa mempool. Les pairs cessent alors de lui annoncer les transactions moins chères, qu'il rejetterait de toute façon, ce qui économise de la bande passante."
    definition: "bip-0133"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0133.mediawiki"
  - number: 134
    id: "BIP-0134"
    title: "Flexible Transactions"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (hard fork)"
    authors:
      - "Tom Zander"
    created: "2016-07-27"
    summary: "Propose un nouveau format de transaction (version 4) dont les champs sont encodés sous forme de jetons étiquetés, le Compact Message Format. Ce *hard fork* visait à rendre les transactions plus faciles à faire évoluer et à supprimer leur malléabilité. Il n'a jamais été adopté."
    definition: "bip-0134"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0134.mediawiki"
  - number: 135
    id: "BIP-0135"
    title: "Generalized version bits voting"
    status: "Closed"
    type: "Informational"
    authors:
      - "Sancho Panza"
    created: "2017-03-29"
    replaces: [9]
    summary: "Généralise le signalement par *version bits* du BIP-0009 : chaque bit reçoit son propre seuil d'activation, sa propre fenêtre de comptage et sa propre période de verrouillage. Le mécanisme couvre aussi les changements de consensus autres que les soft forks. Il n'a jamais été déployé."
    definition: "bip-0135"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0135.mediawiki"
  - number: 136
    id: "BIP-0136"
    title: "Bech32 Encoded Tx Position References"
    status: "Draft"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Велеслав"
      - "Jonas Schnelli"
      - "Daniel Pape"
    created: "2017-07-09"
    summary: "Définit TxRef, un encodage `Bech32` court qui désigne une transaction confirmée par sa position dans la blockchain (hauteur du bloc et rang dans le bloc), et en option une de ses sorties. Contrairement au TXID, ce lien n'est pas cryptographique : une réorganisation peut changer la transaction pointée."
    definition: "bip-0136"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0136.mediawiki"
  - number: 137
    id: "BIP-0137"
    title: "Signatures of Messages using Private Keys"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Christopher Gilliard"
    created: "2019-02-16"
    summary: "Décrit le format des signatures de messages faites avec une clé privée Bitcoin, tel que les logiciels l'utilisaient déjà. L'octet d'en-tête de la signature indique aussi le type d'adresse (P2PKH, P2SH-P2WPKH ou P2WPKH), pour lever l'ambiguïté à la vérification. Le BIP-0322 propose depuis un format plus général."
    definition: "bip-0137"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0137.mediawiki"
  - number: 138
    id: "BIP-0138"
    title: "Compact Encryption Scheme for Non-seed Wallet Data"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pyth"
    created: "2026-05-11"
    summary: "Définit un chiffrement compact pour sauvegarder des *descriptors*, des politiques de portefeuille (BIP-0388) ou d'autres métadonnées, sans aucune clé privée. La clé de chiffrement découle des clés publiques du *descriptor* : chaque détenteur d'une clé peut déchiffrer la sauvegarde, alors que le service qui la stocke ne voit ni les adresses ni la structure des scripts."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0138.md"
  - number: 139
    id: "BIP-0139"
    title: "Wallet Metadata Export Format"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pyth"
    created: "2026-05-11"
    summary: "Définit un format d'export commun pour les métadonnées d'un portefeuille : comptes, *descriptors*, signataires, étiquettes, transactions, pièces et PSBT. Un logiciel peut ainsi relire ce qu'un autre a écrit. Un registre de champs, annexé au BIP, permet aux développeurs de déclarer les champs qu'ils utilisent."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0139.md"
  - number: 140
    id: "BIP-0140"
    title: "Normalized TXID"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Christian Decker"
    created: "2015-10-14"
    summary: "Propose un identifiant de transaction normalisé (NTXID), calculé sans les scripts de signature, que les transactions suivantes utiliseraient pour désigner les pièces dépensées. Modifier une signature ne changerait plus cet identifiant, ce qui supprimerait la malléabilité. SegWit a réglé ce problème autrement."
    definition: "bip-0140"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0140.mediawiki"
  - number: 141
    id: "BIP-0141"
    title: "Segregated Witness (Consensus layer)"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Eric Lombrozo"
      - "Johnson Lau"
      - "Pieter Wuille"
    created: "2015-12-21"
    summary: "Définit SegWit au niveau du consensus : les signatures et les scripts de déverrouillage passent dans une nouvelle structure, le témoin (*witness*), engagée dans le bloc par la transaction coinbase et non plus dans l'arbre de Merkle des transactions. Ce soft fork supprime la malléabilité involontaire et introduit la notion de poids des blocs."
    definition: "bip-0141"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0141.mediawiki"
  - number: 142
    id: "BIP-0142"
    title: "Address Format for Segregated Witness"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Johnson Lau"
    created: "2015-12-24"
    summary: "Proposait un format d'adresse `Base58check` pour les sorties SegWit natives P2WPKH et P2WSH. Le BIP-0173 l'a remplacé par les adresses `Bech32`."
    definition: "bip-0142"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0142.mediawiki"
  - number: 143
    id: "BIP-0143"
    title: "Transaction Signature Verification for Version 0 Witness Program"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Johnson Lau"
      - "Pieter Wuille"
    created: "2016-01-03"
    summary: "Définit le nouvel algorithme de hachage de transaction utilisé pour vérifier les signatures des sorties SegWit version 0. Le coût du hachage ne croît plus de façon quadratique avec la taille de la transaction, et la signature couvre le montant de l'entrée, ce qui permet à un appareil de signature hors ligne de connaître les frais."
    definition: "bip-0143"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0143.mediawiki"
  - number: 144
    id: "BIP-0144"
    title: "Segregated Witness (Peer Services)"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Eric Lombrozo"
      - "Pieter Wuille"
    created: "2016-01-08"
    summary: "Définit les messages et le format de sérialisation qui permettent aux nœuds de relayer les transactions et les blocs SegWit avec leurs témoins. Un nœud annonce sa prise en charge de SegWit par le bit de service `NODE_WITNESS`, et les anciens nœuds continuent de recevoir les données sans témoin."
    definition: "bip-0144"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0144.mediawiki"
  - number: 145
    id: "BIP-0145"
    title: "getblocktemplate Updates for Segregated Witness"
    status: "Deployed"
    type: "Specification"
    layer: "API/RPC"
    authors:
      - "Luke Dashjr"
    created: "2016-01-30"
    summary: "Adapte l'appel RPC `getblocktemplate` (BIP-0022) à SegWit : le modèle de bloc transmis aux mineurs indique désormais la limite de poids des blocs, ainsi que le poids de chaque transaction et son identifiant calculé avec le témoin."
    definition: "bip-0145"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0145.mediawiki"
  - number: 146
    id: "BIP-0146"
    title: "Dealing with signature encoding malleability"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Johnson Lau"
      - "Pieter Wuille"
    created: "2016-08-16"
    summary: "Propose deux règles de consensus contre la malléabilité liée à l'encodage des signatures ECDSA : `LOW_S` impose une valeur S dans la moitié basse de l'ordre de la courbe, et `NULLFAIL` exige qu'une signature dont la vérification échoue soit vide. Bitcoin Core les appliquait déjà au relais des transactions, mais ce soft fork n'a pas abouti."
    definition: "bip-0146"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0146.mediawiki"
  - number: 147
    id: "BIP-0147"
    title: "Dealing with dummy stack element malleability"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Johnson Lau"
    created: "2016-09-02"
    summary: "Ajoute la règle de consensus `NULLDUMMY` : l'élément supplémentaire que `OP_CHECKMULTISIG` et `OP_CHECKMULTISIGVERIFY` retirent de la pile sans jamais le lire doit être un tableau d'octets vide. Avant, n'importe quelle valeur y était acceptée, ce qui permettait à un tiers de modifier la transaction. La règle a été déployée en même temps que SegWit."
    definition: "bip-0147"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0147.mediawiki"
  - number: 148
    id: "BIP-0148"
    title: "Mandatory activation of segwit deployment"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Shaolin Fry"
    created: "2017-03-12"
    summary: "Propose une activation de SegWit imposée par les utilisateurs (UASF) : du 1er août au 15 novembre 2017, les nœuds qui appliquent ce BIP rejettent tout bloc qui ne signale pas SegWit par le bit 1, tant que SegWit n'est pas verrouillé. Les mineurs sont ainsi poussés à verrouiller SegWit avant l'expiration de son déploiement."
    definition: "bip-0148"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0148.mediawiki"
  - number: 149
    id: "BIP-0149"
    title: "Segregated Witness (second deployment)"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Shaolin Fry"
    created: "2017-04-14"
    summary: "Prévoit un second déploiement de SegWit au cas où le premier, fondé sur le BIP-0009, expirerait le 15 novembre 2017 sans activation. Ce déploiement suit le BIP-0008 avec verrouillage garanti : si les mineurs n'atteignent pas le seuil de signalement, SegWit se verrouille quand même à l'échéance du 4 juillet 2018."
    definition: "bip-0149"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0149.mediawiki"
  - number: 150
    id: "BIP-0150"
    title: "Peer Authentication"
    status: "Closed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Jonas Schnelli"
    created: "2016-03-23"
    summary: "Décrit un moyen pour deux nœuds de s'authentifier avec des clés publiques échangées à l'avance par un autre canal, sans qu'un observateur puisse identifier le nœud. Un opérateur peut ainsi réserver certains services à des pairs de confiance et détecter une attaque de l'homme du milieu. Ce schéma reposait sur le chiffrement du BIP-0151 et a été abandonné."
    definition: "bip-0150"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0150.mediawiki"
  - number: 151
    id: "BIP-0151"
    title: "Peer-to-Peer Communication Encryption"
    status: "Closed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Jonas Schnelli"
    created: "2016-03-23"
    superseded_by: [324]
    summary: "Propose de chiffrer les communications entre nœuds Bitcoin, avec des clés de session issues d'un échange ECDH éphémère, pour compliquer la surveillance de masse et la manipulation du trafic. Le BIP-0324 (transport P2P version 2) l'a remplacé."
    definition: "bip-0151"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0151.mediawiki"
  - number: 152
    id: "BIP-0152"
    title: "Compact Block Relay"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Matt Corallo"
    created: "2016-04-27"
    summary: "Définit le relais de blocs compacts : au lieu de renvoyer toutes les transactions d'un nouveau bloc, un nœud transmet l'en-tête et des identifiants courts, car le pair a déjà la plupart de ces transactions dans sa mempool. Le pair redemande seulement celles qui lui manquent, ce qui réduit les pics de bande passante au passage de chaque bloc."
    definition: "bip-0152"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0152.mediawiki"
  - number: 154
    id: "BIP-0154"
    title: "Rate Limiting via peer specified challenges"
    status: "Closed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Karl-Johan Alm"
    created: "2017-04-12"
    summary: "Propose un mécanisme contre le déni de service : un nœud peut exiger d'un pair qu'il résolve un défi de preuve de travail avant de lui accorder une place de connexion. Inonder le réseau de connexions factices deviendrait ainsi coûteux. La proposition a été abandonnée."
    definition: "bip-0154"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0154.mediawiki"
  - number: 155
    id: "BIP-0155"
    title: "addrv2 message"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Wladimir J. van der Laan"
    created: "2019-02-27"
    summary: "Ajoute le message P2P `addrv2`, qui diffuse des adresses de nœuds plus longues que les 128 bits prévus par le message `addr`. Il permet notamment de relayer les adresses des services onion Tor v3, longues de 256 bits, et celles du réseau I2P."
    definition: "bip-0155"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0155.mediawiki"
  - number: 156
    id: "BIP-0156"
    title: "Dandelion - Privacy Enhancing Routing"
    status: "Closed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Brad Denby"
      - "Andrew Miller"
      - "Giulia Fanti"
      - "Surya Bakshi"
      - "Shaileshh Bojja Venkatakrishnan"
      - "Pramod Viswanath"
    created: "2017-06-09"
    summary: "Propose Dandelion, un routage qui masque l'origine des transactions : une nouvelle transaction suit d'abord un chemin aléatoire de nœud en nœud (la tige), puis se diffuse à tout le réseau (le capitule). Un espion qui observe la diffusion a alors bien plus de mal à relier la transaction à l'adresse IP de son émetteur."
    definition: "bip-0156"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0156.mediawiki"
  - number: 157
    id: "BIP-0157"
    title: "Client Side Block Filtering"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Olaoluwa Osuntokun"
      - "Alex Akselrod"
      - "Jim Posen"
    created: "2017-05-24"
    summary: "Définit un protocole pour les clients légers : ils téléchargent auprès des nœuds complets des filtres compacts qui résument chaque bloc, puis seulement les blocs qui les concernent, sans révéler leurs adresses comme avec les filtres de Bloom du BIP-0037. Une chaîne d'en-têtes de filtres permet de repérer un pair qui sert de faux filtres."
    definition: "bip-0157"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0157.mediawiki"
  - number: 158
    id: "BIP-0158"
    title: "Compact Block Filters for Light Clients"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Olaoluwa Osuntokun"
      - "Alex Akselrod"
    created: "2017-05-24"
    summary: "Spécifie la construction des filtres de blocs compacts utilisés par le BIP-0157. Le filtre `basic` contient les scripts de sortie créés et dépensés dans le bloc, compressés par codage de Golomb-Rice, ce qui en fait une alternative plus compacte aux filtres de Bloom du BIP-0037."
    definition: "bip-0158"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0158.mediawiki"
  - number: 159
    id: "BIP-0159"
    title: "NODE_NETWORK_LIMITED service bit"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Jonas Schnelli"
    created: "2017-05-11"
    summary: "Définit le bit de service `NODE_NETWORK_LIMITED`, par lequel un nœud élagué annonce qu'il peut servir au moins les 288 derniers blocs (environ 2 jours), à défaut de tout l'historique. Les autres nœuds savent ainsi qu'ils peuvent s'y connecter pour les blocs récents."
    definition: "bip-0159"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0159.mediawiki"
  - number: 171
    id: "BIP-0171"
    title: "Currency/exchange rate information API"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Luke Dashjr"
    created: "2017-03-04"
    summary: "Définit une interface commune pour demander à un serveur les taux de change du bitcoin : des requêtes HTTP GET normalisées et des réponses en JSON. Un portefeuille pourrait ainsi afficher des prix en monnaie fiat sans écrire un code dédié à chaque fournisseur. La proposition a été fermée."
    definition: "bip-0171"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0171.mediawiki"
  - number: 172
    id: "BIP-0172"
    title: "Define Bitcoin Subunits as Satoshis"
    status: "Draft"
    type: "Informational"
    layer: "Applications"
    authors:
      - "OceanSlim"
    created: "2025-05-01"
    summary: "Propose de fixer le nom de la plus petite unité du bitcoin (un cent-millionième de BTC) : « satoshi », au pluriel « satoshis », abrégé en « sats ». Le texte s'appuie sur le modèle du dollar et du cent : le bitcoin reste l'unité principale, et le satoshi sert à exprimer les petits montants."
    definition: "bip-0172"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0172.mediawiki"
  - number: 173
    id: "BIP-0173"
    title: "Base32 address format for native v0-16 witness outputs"
    status: "Deployed"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Pieter Wuille"
      - "Greg Maxwell"
    created: "2017-03-20"
    replaces: [142]
    superseded_by: [350]
    summary: "Introduit `Bech32`, un encodage en base 32 doté d'une somme de contrôle BCH, et l'utilise pour les adresses des sorties SegWit natives (préfixe `bc1` sur le réseau principal). Ces adresses n'ont qu'une seule casse, prennent moins de place dans un QR code et détectent mieux les fautes de frappe que les adresses `Base58check`."
    definition: "bip-0173"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0173.mediawiki"
  - number: 174
    id: "BIP-0174"
    title: "Partially Signed Bitcoin Transaction Format"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Ava Chow"
    created: "2017-07-12"
    summary: "Définit le PSBT, un format binaire qui transporte une transaction incomplète avec toutes les informations dont un signataire a besoin, ainsi que les signatures déjà apposées. Plusieurs logiciels, *hardware wallets* ou cosignataires d'un multisig peuvent ainsi se passer la même transaction pour la compléter, la signer et la finaliser, même hors ligne."
    definition: "bip-0174"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0174.mediawiki"
  - number: 175
    id: "BIP-0175"
    title: "Pay to Contract Protocol"
    status: "Closed"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Omar Shibli"
      - "Nicholas Gregory"
    created: "2017-07-17"
    summary: "Spécifie un schéma de dérivation de clés « pay-to-contract » fondé sur les portefeuilles HD (BIP-0032 et BIP-0043) : l'adresse de paiement est dérivée de la clé publique du destinataire et des termes d'un contrat. Le paiement prouve ainsi qui est payé et pour quoi, alors que l'adresse ressemble à n'importe quelle autre sur le réseau."
    definition: "bip-0175"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0175.mediawiki"
  - number: 176
    id: "BIP-0176"
    title: "Bits Denomination"
    status: "Complete"
    type: "Informational"
    authors:
      - "Jimmy Song"
    created: "2017-12-12"
    summary: "Propose le « bit » comme terme standard pour 100 satoshis, soit un millionième de bitcoin. Avec un bitcoin à plus de 10 000 dollars, les petits montants exprimés en BTC accumulent les décimales, alors qu'en bits ils redeviennent des nombres simples à lire et à comparer."
    definition: "bip-0176"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0176.mediawiki"
  - number: 177
    id: "BIP-0177"
    title: "Redefine Bitcoin's Base Unit"
    status: "Draft"
    type: "Informational"
    authors:
      - "John Carvalho"
    created: "2025-04-23"
    summary: "Propose de redéfinir l'unité « bitcoin » pour qu'elle désigne la plus petite unité indivisible, l'actuel satoshi. L'actuel BTC vaudrait alors 100 000 000 bitcoins, et les montants s'afficheraient sans décimales, en nombres entiers, comme le registre de Bitcoin les représente déjà."
    definition: "bip-0177"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0177.mediawiki"
  - number: 178
    id: "BIP-0178"
    title: "Version Extended WIF"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Karl-Johan Alm"
    created: "2018-04-04"
    summary: "Étend le format WIF des clés privées : le suffixe de la clé indique aussi le type d'adresse associé (P2PKH, P2SH-P2WPKH, P2WPKH…). Un portefeuille qui importe la clé sait alors quelles adresses surveiller, au lieu de devoir suivre tous les types possibles."
    definition: "bip-0178"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0178.mediawiki"
  - number: 179
    id: "BIP-0179"
    title: "Name for payment recipient identifiers"
    status: "Complete"
    type: "Informational"
    authors:
      - "Emil Engler"
      - "Luke Dashjr"
    created: "2019-10-17"
    summary: "Propose de remplacer le mot « adresse » par « invoice » (*Bitcoin Invoice Address*, où « Bitcoin » et « Address » restent facultatifs). Une adresse Bitcoin ne devrait servir qu'une fois, alors que le mot « adresse » évoque quelque chose de durable, comme une adresse postale ou une adresse e-mail."
    definition: "bip-0179"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0179.mediawiki"
  - number: 180
    id: "BIP-0180"
    title: "Block size/weight fraud proof"
    status: "Closed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Luke Dashjr"
    created: "2017-03-17"
    summary: "Définit une preuve de fraude qui permet à un client léger de détecter un bloc dépassant la limite de taille ou de poids, sans télécharger tout le bloc. L'objectif était d'empêcher qu'une chaîne invalide, par exemple issue d'un *hard fork* d'augmentation de la taille des blocs imposé par des mineurs, trompe les clients légers."
    definition: "bip-0180"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0180.mediawiki"
  - number: 197
    id: "BIP-0197"
    title: "Hashed Time-Locked Collateral Contract"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Matthew Black"
      - "Tony Cai"
    created: "2019-03-19"
    summary: "Décrit des scripts de garantie pour des prêts entre deux blockchains (Atomic Loans) : l'emprunteur bloque des bitcoins en collatéral dans deux adresses P2SH, et le prêt est versé sur une autre blockchain. Des secrets révélés au fil du contrat et des délais décident qui récupère le collatéral, selon que le prêt est remboursé, liquidé ou non."
    definition: "bip-0197"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0197.mediawiki"
  - number: 199
    id: "BIP-0199"
    title: "Hashed Time-Locked Contract transactions"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Sean Bowe"
      - "Daira Hopwood"
    created: "2017-03-27"
    summary: "Décrit le HTLC (*Hashed Time-Locked Contract*), un script qui laisse un destinataire dépenser des fonds s'il révèle la préimage d'un hash, et rend les fonds à l'expéditeur une fois un délai passé. Ce mécanisme sert aux *atomic swaps* et aux canaux de paiement comme Lightning."
    definition: "bip-0199"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0199.mediawiki"
  - number: 300
    id: "BIP-0300"
    title: "Hashrate Escrows (Consensus layer)"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Paul Sztorc"
      - "CryptAxe"
    created: "2017-08-14"
    summary: "Définit les séquestres par le hashrate, première brique des drivechains : des bitcoins envoyés vers une sidechain restent bloqués sur la chaîne principale, et chaque retrait est soumis au vote des mineurs. Un retrait doit réunir 13 150 votes favorables sur une fenêtre de 26 300 blocs (environ 6 mois), ce qui le rend lent et visible de tous."
    definition: "bip-0300"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0300.mediawiki"
  - number: 301
    id: "BIP-0301"
    title: "Blind Merged Mining (Consensus layer)"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Paul Sztorc"
      - "CryptAxe"
    created: "2019-07-23"
    summary: "Définit le minage fusionné aveugle (*Blind Merged Mining*) : les utilisateurs d'une sidechain construisent eux-mêmes ses blocs et paient les mineurs de Bitcoin pour qu'ils en inscrivent l'empreinte. Le mineur encaisse ces enchères en BTC sans faire tourner le logiciel de la sidechain, et le BIP garantit qu'il n'accepte qu'une enchère par sidechain dans chaque bloc."
    definition: "bip-0301"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0301.mediawiki"
  - number: 310
    id: "BIP-0310"
    title: "Stratum protocol extensions"
    status: "Draft"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Pavel Moravec"
      - "Jan Čapek"
    created: "2018-03-10"
    summary: "Définit un mécanisme générique d'extensions pour Stratum, le protocole qui relie les machines de minage aux pools, avec un nouveau message `mining.configure`. La principale extension décrite, le *version rolling*, permet à la machine de faire varier certains bits du champ `nVersion` de l'en-tête de bloc."
    definition: "bip-0310"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0310.mediawiki"
  - number: 320
    id: "BIP-0320"
    title: "nVersion bits for general purpose use"
    status: "Draft"
    type: "Specification"
    authors:
      - "BtcDrak"
    created: "2018-03-01"
    superseded_by: [323]
    summary: "Réserve 16 bits du champ `nVersion` de l'en-tête de bloc à un usage libre, en les retirant du signalement des soft forks par *version bits*. Les mineurs peuvent alors s'en servir, par exemple pour l'AsicBoost, sans que les nœuds affichent de fausses alertes sur des soft forks inconnus."
    definition: "bip-0320"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0320.mediawiki"
  - number: 321
    id: "BIP-0321"
    title: "URI Scheme"
    status: "Complete"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Matt Corallo"
    created: "2024-11-15"
    replaces: [21]
    summary: "Remplace le BIP-0021 pour décrire le schéma d'URI `bitcoin:`, utilisé dans les liens et les QR codes de paiement. Il documente les types d'adresses récents et les paramètres de requête courants, explique comment ajouter de nouvelles instructions de paiement et propose une extension facultative de preuve de paiement."
    definition: "bip-0321"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0321.mediawiki"
  - number: 322
    id: "BIP-0322"
    title: "Generic Signed Message Format"
    status: "Complete"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Karl-Johan Alm"
      - "Oliver Gugger"
    created: "2018-09-10"
    summary: "Définit un format de signature de message fondé sur le Script de Bitcoin : le signataire signe une transaction virtuelle qui dépense une sortie de l'adresse concernée. Le format fonctionne avec tout type d'adresse, et pas seulement P2PKH, pour prouver qu'on contrôle des fonds ou s'engager sur un message en tant que destinataire."
    definition: "bip-0322"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0322.mediawiki"
  - number: 323
    id: "BIP-0323"
    title: "24 nVersion bits for general purpose use"
    status: "Draft"
    type: "Specification"
    authors:
      - "Matt Corallo"
    created: "2026-04-22"
    replaces: [320]
    summary: "Réserve 24 bits du champ `nVersion` de l'en-tête de bloc comme espace de *nonce* supplémentaire pour les mineurs, au lieu des 16 bits du BIP-0320 qu'il remplace. Certains appareils de minage manquaient déjà de place et commençaient à prendre des bits du champ `nTime`."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0323.mediawiki"
  - number: 324
    id: "BIP-0324"
    title: "Version 2 P2P Encrypted Transport Protocol"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Dhruv Mehta"
      - "Tim Ruffing"
      - "Jonas Schnelli"
      - "Pieter Wuille"
    created: "2019-03-08"
    replaces: [151]
    summary: "Définit le transport P2P version 2 : les connexions entre nœuds sont chiffrées de façon opportuniste, ce qui empêche un observateur passif de lire le trafic et complique sa manipulation. Le protocole économise aussi un peu de bande passante et permet de négocier des évolutions futures. Il remplace le BIP-0151."
    definition: "bip-0324"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0324.mediawiki"
  - number: 325
    id: "BIP-0325"
    title: "Signet"
    status: "Complete"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Karl-Johan Alm"
      - "Anthony Towns"
    created: "2019-03-20"
    summary: "Définit Signet, un type de réseau de test où chaque bloc doit fournir, en plus de la preuve de travail, une solution valide à un script fixé à la création du réseau (souvent une signature). Les blocs arrivent ainsi à un rythme régulier, sans les grosses réorganisations du testnet, ce qui convient aux tests de longue durée entre plusieurs équipes."
    definition: "bip-0325"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0325.mediawiki"
  - number: 326
    id: "BIP-0326"
    title: "Anti-fee-sniping in taproot transactions"
    status: "Draft"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Chris Belcher"
    created: "2021-06-10"
    summary: "Recommande aux portefeuilles de protéger leurs transactions Taproot contre le *fee sniping* en utilisant souvent le champ `nSequence` à la place de `nLockTime`. Les dépenses ordinaires ressemblent alors aux transactions de règlement des protocoles hors chaîne qui passent par un verrou temporel (Lightning, CoinSwap, DLC), ce qui améliore la confidentialité de ces protocoles."
    definition: "bip-0326"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0326.mediawiki"
  - number: 327
    id: "BIP-0327"
    title: "MuSig2 for BIP340-compatible Multi-Signatures"
    status: "Deployed"
    type: "Informational"
    authors:
      - "Jonas Nick"
      - "Tim Ruffing"
      - "Elliott Jin"
    created: "2022-03-22"
    summary: "Standardise MuSig2, un schéma multisignature où plusieurs signataires créent une clé publique agrégée et produisent ensemble une signature de Schnorr ordinaire, compatible avec le BIP-0340. Sur la blockchain, la dépense ressemble à celle d'une clé unique. Le schéma est de type *n-of-n* : tous les signataires doivent participer."
    definition: "bip-0327"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0327.mediawiki"
  - number: 328
    id: "BIP-0328"
    title: "Derivation Scheme for MuSig2 Aggregate Keys"
    status: "Complete"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Ava Chow"
    created: "2024-06-04"
    summary: "Explique comment construire une clé publique étendue BIP-0032 à partir d'une clé agrégée MuSig2 (BIP-0327), avec un code de chaîne fixe. Les cosignataires dérivent ensuite toutes leurs adresses de cette seule clé, sans refaire une agrégation pour chaque nouvelle adresse."
    definition: "bip-0328"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0328.mediawiki"
  - number: 329
    id: "BIP-0329"
    title: "Wallet Labels Export Format"
    status: "Draft"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Craig Raw"
    created: "2022-08-23"
    summary: "Définit un format d'export, en JSON Lines, des étiquettes (*labels*) qu'un utilisateur attache aux transactions, adresses, clés publiques, entrées, sorties ou xpubs de son portefeuille. Ces annotations, utiles pour la comptabilité et la confidentialité, peuvent ainsi passer d'un logiciel à un autre."
    definition: "bip-0329"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0329.mediawiki"
  - number: 330
    id: "BIP-0330"
    title: "Transaction announcements reconciliation"
    status: "Draft"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Gleb Naumenko"
      - "Pieter Wuille"
    created: "2019-09-25"
    summary: "Spécifie la réconciliation des annonces de transactions entre deux nœuds, brique du protocole de relais Erlay. Plutôt que d'annoncer chaque identifiant de transaction à chaque pair, deux nœuds comparent régulièrement des résumés compacts de leurs listes pour n'échanger que les différences. Un nœud peut ainsi ouvrir plus de connexions presque sans surcoût de bande passante."
    definition: "bip-0330"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0330.mediawiki"
  - number: 331
    id: "BIP-0331"
    title: "Ancestor Package Relay"
    status: "Draft"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Gloria Zhao"
    created: "2022-08-08"
    summary: "Ajoute des messages P2P pour demander et relayer, sous forme de paquet, les ancêtres non confirmés d'une transaction. Une transaction parente aux frais trop bas pour la mempool d'un pair peut ainsi se propager avec un enfant qui paie pour elle (CPFP), car le nœud évalue le taux de frais du paquet entier."
    definition: "bip-0331"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0331.mediawiki"
  - number: 332
    id: "BIP-0332"
    title: "Stale Tip Relay"
    status: "Draft"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Anthony Towns"
      - "w0xlt"
      - "Ram"
    created: "2026-08-21"
    summary: "Ajoute le message P2P facultatif `staletip`, par lequel un nœud annonce à ses pairs les blocs récents restés hors de la chaîne active (*stale blocks*), avec leurs en-têtes, et indique s'il peut fournir ces blocs. Leur fréquence renseigne sur l'état du relais des blocs : propagation lente, partition du réseau ou *selfish mining*."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0332.md"
  - number: 337
    id: "BIP-0337"
    title: "Compressed Transactions"
    status: "Draft"
    type: "Specification"
    layer: "API/RPC"
    authors:
      - "Tom Briar"
    created: "2024-02-01"
    summary: "Définit un format de sérialisation compressé qui peut ramener une transaction Bitcoin à moins de la moitié de sa taille, en supprimant le remplissage et les valeurs prévisibles. La compression des références aux sorties dépensées est facultative, car elle peut perdre de l'information, mais c'est elle qui fait passer la transaction sous 70 % de sa taille d'origine."
    definition: "bip-0337"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0337.mediawiki"
  - number: 338
    id: "BIP-0338"
    title: "Disable transaction relay message"
    status: "Closed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Suhas Daftuar"
    created: "2020-09-03"
    summary: "Ajoute le message P2P `disabletx`, par lequel un nœud prévient son pair qu'aucune transaction ne circulera sur la connexion. Il formalise les connexions réservées au relais des blocs, déjà utilisées sur le réseau, pour que les nœuds puissent accepter davantage de connexions entrantes. La proposition a été fermée."
    definition: "bip-0338"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0338.mediawiki"
  - number: 339
    id: "BIP-0339"
    title: "WTXID-based transaction relay"
    status: "Deployed"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Suhas Daftuar"
    created: "2020-02-03"
    summary: "Permet aux nœuds d'annoncer et de demander les transactions par leur `wtxid`, l'identifiant qui inclut le témoin SegWit, au lieu du `txid`. Le témoin pouvant changer sans modifier le `txid`, un nœud qui avait rejeté une version d'une transaction devait sinon retélécharger chaque annonce du même `txid`. Les pairs activent ce mode avec le message `wtxidrelay`."
    definition: "bip-0339"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0339.mediawiki"
  - number: 340
    id: "BIP-0340"
    title: "Schnorr Signatures for secp256k1"
    status: "Deployed"
    type: "Specification"
    authors:
      - "Pieter Wuille"
      - "Jonas Nick"
      - "Tim Ruffing"
    created: "2020-01-19"
    summary: "Standardise les signatures de Schnorr de 64 octets sur la courbe secp256k1, avec des clés publiques de 32 octets (*x-only*). Par rapport à ECDSA, elles disposent d'une preuve de sécurité, se vérifient par lots et facilitent les multisignatures et l'agrégation de clés. Taproot les utilise (BIP-0341 et BIP-0342)."
    definition: "bip-0340"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0340.mediawiki"
  - number: 341
    id: "BIP-0341"
    title: "Taproot: SegWit version 1 spending rules"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Pieter Wuille"
      - "Jonas Nick"
      - "Anthony Towns"
    created: "2020-01-19"
    summary: "Définit Taproot, le type de sortie SegWit version 1, qui se dépense par une signature de Schnorr avec une clé ajustée (*key path*), ou en révélant un script d'un arbre de Merkle (*script path*). Les scripts inutilisés restent cachés, et une dépense par la clé ressemble à un paiement ordinaire. Taproot est actif depuis le bloc 709 632."
    definition: "bip-0341"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0341.mediawiki"
  - number: 342
    id: "BIP-0342"
    title: "Validation of Taproot Scripts"
    status: "Deployed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Pieter Wuille"
      - "Jonas Nick"
      - "Anthony Towns"
    created: "2020-01-19"
    summary: "Définit Tapscript, les règles d'exécution des scripts dépensés par le chemin de script de Taproot. Les opcodes de signature y vérifient des signatures de Schnorr, `OP_CHECKSIGADD` remplace `OP_CHECKMULTISIG`, plusieurs limites de l'ancien Script disparaissent et des opcodes `OP_SUCCESS` sont réservés pour simplifier de futurs soft forks."
    definition: "bip-0342"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0342.mediawiki"
  - number: 343
    id: "BIP-0343"
    title: "Mandatory activation of taproot deployment"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Shinobius"
      - "Michael Folkson"
    created: "2021-04-25"
    summary: "Propose d'activer Taproot par le BIP-0008 avec `LOT=true` : signalement par le bit 2 à partir du bloc 681 408, seuil de 90 %, et signalement obligatoire dans la dernière période si Taproot n'est pas verrouillé avant le bloc 760 032. Les mineurs ne pourraient ainsi pas bloquer son activation indéfiniment. Taproot a finalement été activé par une autre méthode."
    definition: "bip-0343"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0343.mediawiki"
  - number: 345
    id: "BIP-0345"
    title: "OP_VAULT"
    status: "Closed"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "James O'Beirne"
      - "Greg Sanders"
    created: "2023-02-03"
    superseded_by: [443]
    summary: "Propose deux opcodes Tapscript, `OP_VAULT` et `OP_VAULT_RECOVER`, pour créer des coffres (*vaults*) : un retrait n'aboutit qu'après un délai, pendant lequel les fonds peuvent encore partir vers un chemin de récupération fixé à l'avance. Si une clé est volée, le propriétaire a le temps de réagir. Le BIP-0443 est proposé en remplacement."
    definition: "bip-0345"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0345.mediawiki"
  - number: 346
    id: "BIP-0346"
    title: "OP_TXHASH"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Steven Roose"
      - "Brandon Black"
    created: "2024-04-24"
    summary: "Propose l'opcode Tapscript `OP_TXHASH`, qui place sur la pile le hash de champs choisis de la transaction de dépense. Combiné à un opcode comme `OP_CHECKSIGFROMSTACK`, il permet de construire tous les types de *sighash*, y compris ceux du BIP-0118, et d'imposer des conditions à la transaction de dépense sans interaction entre les participants."
    definition: "bip-0346"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0346.md"
  - number: 347
    id: "BIP-0347"
    title: "OP_CAT in Tapscript"
    status: "Complete"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Ethan Heilman"
      - "Armin Sabouri"
    created: "2023-12-11"
    summary: "Propose de réactiver `OP_CAT` dans Tapscript, en redéfinissant `OP_SUCCESS126`. L'opcode met bout à bout les deux éléments du haut de la pile, dans la limite de 520 octets. Désactivé en 2010 avec 15 autres opcodes, il permettrait de vérifier des arbres de Merkle dans un script, de construire des signatures de Lamport ou des coffres (*vaults*)."
    definition: "bip-0347"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0347.mediawiki"
  - number: 348
    id: "BIP-0348"
    title: "CHECKSIGFROMSTACK"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Brandon Black"
      - "Jeremy Rubin"
    created: "2024-11-26"
    summary: "Propose l'opcode Tapscript `OP_CHECKSIGFROMSTACK`, qui vérifie une signature de Schnorr sur un message quelconque pris sur la pile, et non sur la transaction. Combiné à `OP_CHECKTEMPLATEVERIFY` (BIP-0119), il permet notamment de construire des canaux Lightning Symmetry."
    definition: "bip-0348"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0348.md"
  - number: 349
    id: "BIP-0349"
    title: "OP_INTERNALKEY"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Brandon Black"
      - "Jeremy Rubin"
    created: "2024-11-14"
    summary: "Propose l'opcode Tapscript `OP_INTERNALKEY`, qui place sur la pile la clé interne de la sortie Taproot dépensée. Un script peut ainsi exiger une signature de cette clé, souvent agrégée entre plusieurs signataires, sans la recopier, ce qui économise 8 vBytes."
    definition: "bip-0349"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0349.md"
  - number: 350
    id: "BIP-0350"
    title: "Bech32m format for v1+ witness addresses"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pieter Wuille"
    created: "2020-12-16"
    replaces: [173]
    summary: "Définit `Bech32m`, une variante de `Bech32` qui corrige une faiblesse de sa somme de contrôle : quand une chaîne se termine par « p », ajouter ou retirer des « q » juste avant ne l'invalide pas. Les adresses SegWit version 1 et suivantes (Taproot, en `bc1p`) utilisent `Bech32m`, la version 0 garde `Bech32`."
    definition: "bip-0350"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0350.mediawiki"
  - number: 351
    id: "BIP-0351"
    title: "Private Payments"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Alfred Hodler"
      - "Clark Moody"
    created: "2022-07-10"
    summary: "Propose des codes de paiement que le destinataire peut publier sans perdre en confidentialité : le payeur envoie d'abord une transaction de notification (une sortie `OP_RETURN`), puis les deux parties calculent par ECDH une série d'adresses qu'elles seules connaissent. Le BIP corrige des défauts de confidentialité des codes de paiement du BIP-0047. La proposition a été fermée."
    definition: "bip-0351"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0351.mediawiki"
  - number: 352
    id: "BIP-0352"
    title: "Silent Payments"
    status: "Complete"
    type: "Specification"
    layer: "Applications"
    authors:
      - "josibake"
      - "Ruben Somsen"
      - "Sebastian Falbesoner"
    created: "2023-03-09"
    summary: "Définit les *Silent Payments* : le destinataire publie une adresse statique, et chaque payeur en dérive par ECDH, avec les clés de ses propres entrées, une adresse unique que rien ne relie publiquement à l'adresse statique. Il n'y a ni interaction ni transaction de notification, mais le destinataire doit analyser les transactions de la blockchain pour trouver ses paiements."
    definition: "bip-0352"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0352.mediawiki"
  - number: 353
    id: "BIP-0353"
    title: "DNS Payment Instructions"
    status: "Complete"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Matt Corallo"
      - "Bastien Teinturier"
    created: "2024-02-10"
    summary: "Définit comment publier des instructions de paiement Bitcoin (une URI au format BIP-0021) dans un enregistrement DNS TXT signé par DNSSEC. Un portefeuille peut ainsi payer un identifiant lisible du type `alice@exemple.com`, qu'il résout en interrogeant `alice.user._bitcoin-payment.exemple.com`."
    definition: "bip-0353"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0353.mediawiki"
  - number: 360
    id: "BIP-0360"
    title: "Pay-to-Merkle-Root (P2MR)"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Hunter Beast"
      - "Ethan Heilman"
      - "Isabel Foxen Duke"
    created: "2024-12-18"
    summary: "Propose, par soft fork, un nouveau type de sortie, P2MR (*Pay-to-Merkle-Root*) : un équivalent de Taproot sans chemin de dépense par clé, qui ne s'engage que sur la racine d'un arbre de scripts. Aucune clé publique n'apparaît dans la sortie, ce qui la protège des attaques quantiques à long terme contre la cryptographie à courbe elliptique."
    definition: "bip-0360"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0360.mediawiki"
  - number: 361
    id: "BIP-0361"
    title: "Post Quantum Migration and Legacy Signature Sunset"
    status: "Draft"
    type: "Informational"
    layer: "Consensus (soft fork)"
    authors:
      - "Jameson Lopp"
      - "Christian Papathanasiou"
      - "Ian Smith"
      - "Joe Ross"
      - "Steve Vaile"
      - "Pierre-Luc Dallaire-Demers"
    created: "2026-02-11"
    summary: "Prévoit, une fois un type de sortie post-quantique adopté, l'abandon programmé des signatures ECDSA et Schnorr en deux phases. La première interdit d'envoyer des fonds vers des adresses vulnérables aux ordinateurs quantiques ; la seconde, à une date annoncée, cinq ans après l'activation, n'autorise plus la dépense de ces pièces que par un protocole de sauvetage résistant au quantique."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0361.mediawiki"
  - number: 370
    id: "BIP-0370"
    title: "PSBT Version 2"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Ava Chow"
    created: "2021-01-14"
    summary: "Définit la version 2 du PSBT, qui permet d'ajouter ou de retirer des entrées et des sorties après la création de la transaction, ce que la version 0 du BIP-0174 ne permettait pas. Plusieurs participants peuvent ainsi construire une même transaction avant de la signer, chacun y ajoutant ses entrées et ses sorties."
    definition: "bip-0370"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0370.mediawiki"
  - number: 371
    id: "BIP-0371"
    title: "Taproot Fields for PSBT"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Ava Chow"
    created: "2021-06-21"
    summary: "Ajoute au format PSBT (versions 0 et 2) les champs propres à Taproot : clé interne, scripts des feuilles et chemins dans l'arbre, signatures de Schnorr. Un *hardware wallet* ou un autre signataire dispose ainsi de tout ce qu'il lui faut pour signer une entrée Taproot."
    definition: "bip-0371"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0371.mediawiki"
  - number: 372
    id: "BIP-0372"
    title: "Pay-to-contract tweak fields for PSBT"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Maxim Orlovsky"
    created: "2022-01-16"
    summary: "Ajoute au format PSBT des champs pour les ajustements *pay-to-contract* (P2C), quand une clé publique a été modifiée pour s'engager sur un message. Le signataire, souvent un appareil externe, connaît ainsi l'ajustement à appliquer à la clé privée d'origine pour produire une signature valide."
    definition: "bip-0372"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0372.mediawiki"
  - number: 373
    id: "BIP-0373"
    title: "MuSig2 PSBT Fields"
    status: "Complete"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Ava Chow"
    created: "2024-06-04"
    summary: "Ajoute au format PSBT les champs nécessaires à MuSig2 (BIP-0327) : clés des participants, *nonces* publics et signatures partielles. Les cosignataires peuvent ainsi dérouler les deux tours du protocole en se passant le PSBT."
    definition: "bip-0373"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0373.mediawiki"
  - number: 374
    id: "BIP-0374"
    title: "Discrete Log Equality Proofs"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Andrew Toth"
      - "Ruben Somsen"
      - "Sebastian Falbesoner"
    created: "2024-12-26"
    summary: "Standardise des preuves d'égalité de logarithmes discrets (DLEQ) de 64 octets : le prouveur montre qu'il a utilisé la même clé secrète pour deux points de la courbe, sans rien révéler de cette clé. Elles servent par exemple à prouver qu'un secret ECDH a été calculé correctement, comme l'exige l'envoi de *Silent Payments* depuis un appareil de signature."
    definition: "bip-0374"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0374.mediawiki"
  - number: 375
    id: "BIP-0375"
    title: "Sending Silent Payments with PSBTs"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Andrew Toth"
      - "Ava Chow"
      - "josibake"
    created: "2025-01-08"
    summary: "Ajoute au PSBT version 2 les champs et les règles nécessaires pour payer une adresse *Silent Payments* (BIP-0352). Le script de sortie ne peut être calculé qu'une fois toutes les entrées connues, et chaque signataire fournit sa part du secret ECDH avec une preuve DLEQ (BIP-0374), pour que les autres participants vérifient la sortie."
    definition: "bip-0375"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0375.mediawiki"
  - number: 376
    id: "BIP-0376"
    title: "Spending Silent Payment outputs with PSBTs"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "nymius"
    created: "2026-02-05"
    summary: "Ajoute au PSBT version 2 des champs par entrée qui transportent l'ajustement (*tweak*) des sorties *Silent Payments* reçues. Le signataire peut ainsi dépenser ces sorties, ce que les BIP-0374 et BIP-0375, consacrés à l'envoi, ne prévoient pas."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0376.mediawiki"
  - number: 379
    id: "BIP-0379"
    title: "Miniscript"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pieter Wuille"
      - "Andrew Poelstra"
      - "Sanket Kanjalkar"
      - "Antoine Poinsot"
      - "Ava Chow"
    created: "2023-10-10"
    summary: "Spécifie Miniscript, un langage qui écrit une partie des scripts Bitcoin de façon structurée et composable, à partir de signatures, de verrous de hash et de verrous temporels. Un logiciel peut alors analyser un script, combiner des conditions de dépense, calculer la taille maximale du témoin et signer de façon générique."
    definition: "bip-0379"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0379.md"
  - number: 380
    id: "BIP-0380"
    title: "Output Script Descriptors General Operation"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pieter Wuille"
      - "Ava Chow"
    created: "2021-06-27"
    summary: "Définit le fonctionnement général des *output script descriptors*, un langage qui décrit un ensemble de scripts de sortie : syntaxe, somme de contrôle et expressions de clés. Sauvegarder un *descriptor* permet à un portefeuille restauré de retrouver tous ses scripts et ses adresses, ce que les seules clés privées ou la phrase de récupération ne garantissent pas."
    definition: "bip-0380"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0380.mediawiki"
  - number: 381
    id: "BIP-0381"
    title: "Non-Segwit Output Script Descriptors"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pieter Wuille"
      - "Ava Chow"
    created: "2021-06-27"
    summary: "Spécifie les *descriptors* `pk()`, `pkh()` et `sh()`, qui décrivent les trois formats de scripts standard d'avant SegWit : P2PK, P2PKH et P2SH."
    definition: "bip-0381"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0381.mediawiki"
  - number: 382
    id: "BIP-0382"
    title: "Segwit Output Script Descriptors"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pieter Wuille"
      - "Ava Chow"
    created: "2021-06-27"
    summary: "Spécifie les *descriptors* `wpkh()` et `wsh()`, qui décrivent les scripts SegWit version 0 P2WPKH et P2WSH, seuls ou imbriqués dans un `sh()`."
    definition: "bip-0382"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0382.mediawiki"
  - number: 383
    id: "BIP-0383"
    title: "Multisig Output Script Descriptors"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pieter Wuille"
      - "Ava Chow"
    created: "2021-06-27"
    summary: "Spécifie les *descriptors* `multi()` et `sortedmulti()`, qui décrivent un script multisignature à seuil (k clés parmi n). `sortedmulti()` trie les clés publiques par ordre lexicographique dans le script produit, si bien que l'ordre donné dans le *descriptor* n'a plus d'importance."
    definition: "bip-0383"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0383.mediawiki"
  - number: 384
    id: "BIP-0384"
    title: "combo() Output Script Descriptors"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pieter Wuille"
      - "Ava Chow"
    created: "2021-06-27"
    summary: "Spécifie le *descriptor* `combo()`, qui produit à partir d'une seule clé tous les scripts qu'un portefeuille classique surveillait : P2PK et P2PKH, plus P2WPKH et P2SH-P2WPKH si la clé est compressée. Il facilite le passage des anciens portefeuilles fondés sur des clés aux portefeuilles à *descriptors*."
    definition: "bip-0384"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0384.mediawiki"
  - number: 385
    id: "BIP-0385"
    title: "raw() and addr() Output Script Descriptors"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pieter Wuille"
      - "Ava Chow"
    created: "2021-06-27"
    summary: "Spécifie les *descriptors* `raw()` et `addr()`, qui enveloppent respectivement un script de sortie quelconque écrit en hexadécimal et une adresse. Tout script ou toute adresse en usage peut ainsi s'exprimer sous forme de *descriptor*."
    definition: "bip-0385"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0385.mediawiki"
  - number: 386
    id: "BIP-0386"
    title: "tr() Output Script Descriptors"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pieter Wuille"
      - "Ava Chow"
    created: "2021-06-27"
    summary: "Spécifie le *descriptor* `tr()`, qui décrit une sortie Taproot (P2TR) à partir d'une clé interne et, en option, d'un arbre de scripts."
    definition: "bip-0386"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0386.mediawiki"
  - number: 387
    id: "BIP-0387"
    title: "Tapscript Multisig Output Script Descriptors"
    status: "Deployed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Pieter Wuille"
      - "Ava Chow"
    created: "2024-04-17"
    summary: "Spécifie les *descriptors* `multi_a()` et `sortedmulti_a()`, équivalents de `multi()` et `sortedmulti()` pour Tapscript : ils produisent un script multisignature à seuil utilisable uniquement dans une feuille Taproot."
    definition: "bip-0387"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0387.mediawiki"
  - number: 388
    id: "BIP-0388"
    title: "Wallet Policies for Descriptor Wallets"
    status: "Complete"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Salvatore Ingala"
    created: "2023-12-26"
    summary: "Définit les politiques de portefeuille (*wallet policies*), une forme simplifiée des *descriptors* pensée pour les appareils de signature aux ressources limitées. Un modèle de script compact, séparé de la liste des clés, décrit un compte entier (adresses de réception et de change), que l'utilisateur peut relire et enregistrer sur son *hardware wallet*."
    definition: "bip-0388"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0388.mediawiki"
  - number: 389
    id: "BIP-0389"
    title: "Multipath Descriptor Key Expressions"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Ava Chow"
    created: "2022-07-26"
    summary: "Permet à une expression de clé d'un *descriptor* de contenir une étape de dérivation à plusieurs valeurs, notée par exemple `<0;1>`. Un seul *descriptor* décrit alors les adresses de réception et celles de change, qui demandaient jusqu'ici deux *descriptors* presque identiques."
    definition: "bip-0389"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0389.mediawiki"
  - number: 390
    id: "BIP-0390"
    title: "musig() Descriptor Key Expression"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Ava Chow"
    created: "2024-06-04"
    summary: "Définit l'expression de clé `musig()` pour les *descriptors* : elle agrège plusieurs clés en une clé publique MuSig2 (BIP-0327). Un portefeuille peut ainsi décrire, par exemple dans un `tr()`, une sortie dont la clé est partagée entre plusieurs signataires."
    definition: "bip-0390"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0390.mediawiki"
  - number: 391
    id: "BIP-0391"
    title: "Binary Output Descriptors"
    status: "Closed"
    type: "Specification"
    layer: "Applications"
    authors:
      - "SeedHammer"
    created: "2026-01-27"
    superseded_by: [393]
    summary: "Proposait un format binaire compact pour transporter un *descriptor* avec ses métadonnées (nom, bloc de création…), fondé sur les tables clé-valeur du PSBT (BIP-0174). Un *descriptor* textuel n'a ni en-tête reconnaissable par une machine ni métadonnées, et ses clés en base58 prennent de la place. La proposition est fermée, avec le BIP-0393 proposé en remplacement."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0391.mediawiki"
  - number: 392
    id: "BIP-0392"
    title: "Silent Payment Output Script Descriptors"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Craig Raw"
    created: "2026-02-06"
    summary: "Spécifie le *descriptor* `sp()` pour les *Silent Payments* (BIP-0352), avec deux nouvelles expressions de clé, `spscan` et `spspend`. Un portefeuille peut ainsi sauvegarder et restaurer des sorties *Silent Payments* avec les outils existants des *descriptors*."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0392.mediawiki"
  - number: 393
    id: "BIP-0393"
    title: "Output Script Descriptor Annotations"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Craig Raw"
    created: "2026-03-17"
    summary: "Ajoute aux *descriptors* une syntaxe facultative d'annotations : des paires clé-valeur écrites comme les paramètres d'une URL (`?`, `&`, `=`). Elles transmettent des informations utiles à la restauration, comme la hauteur de bloc où commencer l'analyse de la blockchain ou la *gap limit*, sans changer les scripts produits."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0393.mediawiki"
  - number: 431
    id: "BIP-0431"
    title: "Topology Restrictions for Pinning"
    status: "Draft"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Gloria Zhao"
    created: "2024-01-10"
    summary: "Décrit les problèmes d'épinglage (*pinning*) qui empêchent d'accélérer une transaction, et une politique de mempool qui les limite : les transactions de version 3, dites TRUC, sont remplaçables et ne peuvent avoir qu'un ancêtre et un descendant non confirmés. Augmenter les frais devient plus fiable, ce qui sert les protocoles comme Lightning."
    definition: "bip-0431"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0431.mediawiki"
  - number: 433
    id: "BIP-0433"
    title: "Pay to Anchor (P2A)"
    status: "Draft"
    type: "Informational"
    layer: "Applications"
    authors:
      - "Gregory Sanders"
    created: "2025-12-08"
    summary: "Définit P2A (*Pay to Anchor*), une sortie standard que n'importe qui peut dépenser sans signature ni témoin, avec le script `OP_1 <0x4e73>`. Elle sert de point d'accroche aux transactions présignées des protocoles de seconde couche, comme Lightning : n'importe quel participant peut y rattacher une transaction enfant pour en augmenter les frais (CPFP)."
    definition: "bip-0433"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0433.mediawiki"
  - number: 434
    id: "BIP-0434"
    title: "Peer Feature Negotiation"
    status: "Complete"
    type: "Specification"
    layer: "Peer Services"
    authors:
      - "Anthony Towns"
    created: "2026-01-14"
    summary: "Ajoute le message P2P `feature`, échangé entre les messages `version` et `verack`, pour annoncer et négocier la prise en charge de nouvelles fonctionnalités du réseau. Une implémentation peut ainsi ajouter une fonctionnalité sans augmenter le numéro de version du protocole, qu'il faudrait coordonner avec les autres implémentations."
    definition: "bip-0434"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0434.md"
  - number: 440
    id: "BIP-0440"
    title: "Varops Budget For Script Runtime Constraint"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Rusty Russell"
      - "Julian Moik"
    created: "2026-03-25"
    summary: "Définit un budget d'opérations, le *varops budget*, qui étend aux opérations autres que les signatures le budget de *sigops* du BIP-0342. Chaque opcode consomme une part du budget selon le nombre d'octets qu'il manipule, ce qui borne le temps de calcul d'un script et permet à d'autres BIP de relâcher les limites actuelles de Script."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0440.mediawiki"
  - number: 441
    id: "BIP-0441"
    title: "Restoration of disabled script (Tapleaf 0xC2)"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Rusty Russell"
      - "Julian Moik"
    created: "2026-03-25"
    summary: "Introduit une nouvelle version de feuille Taproot (`0xc2`) qui rend à Script ses capacités d'avant la version 0.3.1 : opcodes désactivés réactivés, éléments de pile jusqu'à 4 000 000 octets, nombres sans limite de 32 bits. Le budget d'opérations du BIP-0440 empêche les calculs excessifs à l'origine de la faille CVE-2010-5137."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0441.mediawiki"
  - number: 442
    id: "BIP-0442"
    title: "OP_PAIRCOMMIT"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "moonsettler"
      - "Brandon Black"
    created: "2024-12-09"
    summary: "Propose l'opcode Tapscript `OP_PAIRCOMMIT`, qui remplace les deux éléments du haut de la pile par un hash étiqueté de la paire. Un script peut ainsi s'engager sur plusieurs éléments avec un seul hash, par exemple sur un arbre de Merkle de préimages, et faire signer cet engagement avec `OP_CHECKSIGFROMSTACK`."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0442.md"
  - number: 443
    id: "BIP-0443"
    title: "OP_CHECKCONTRACTVERIFY"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Salvatore Ingala"
    created: "2025-05-08"
    summary: "Propose l'opcode Tapscript `OP_CHECKCONTRACTVERIFY` (`OP_CCV`), qui engage des données dans la clé Taproot d'une sortie et peut contraindre la clé interne, l'arbre de scripts et les données des sorties de la transaction de dépense. Il permet des *covenants* comme les coffres (*vaults*) ou le partage d'un UTXO entre plusieurs utilisateurs, comme dans Ark."
    definition: "bip-0443"
    url: "https://github.com/bitcoin/bips/blob/master/bip-0443.mediawiki"
  - number: 446
    id: "BIP-0446"
    title: "OP_TEMPLATEHASH"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Gregory Sanders"
      - "Antoine Poinsot"
      - "Steven Roose"
    created: "2026-02-06"
    summary: "Propose l'opcode Tapscript `OP_TEMPLATEHASH`, qui place sur la pile un hash de la transaction qui dépense la sortie. Un script peut ainsi s'engager à l'avance sur sa transaction de dépense, sans transaction présignée, ce qui réduit les échanges entre participants dans des protocoles de seconde couche comme Lightning, Ark ou LN-Symmetry."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0446.md"
  - number: 448
    id: "BIP-0448"
    title: "Taproot-native (Re)bindable Transactions"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Gregory Sanders"
      - "Antoine Poinsot"
      - "Steven Roose"
    created: "2026-03-11"
    summary: "Propose de déployer ensemble trois opcodes Tapscript : `OP_TEMPLATEHASH` (BIP-0446), `OP_CHECKSIGFROMSTACK` (BIP-0348) et `OP_INTERNALKEY` (BIP-0349). Combinés, ils permettent des transactions « réattachables » (*rebindable*), qui améliorent des protocoles de seconde couche existants, comme LN-Symmetry, et en rendent d'autres possibles."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0448.md"
  - number: 449
    id: "BIP-0449"
    title: "OP_TWEAKADD - x-only key tweak addition"
    status: "Draft"
    type: "Specification"
    layer: "Consensus (soft fork)"
    authors:
      - "Jeremy Rubin"
    created: "2026-03-05"
    summary: "Propose l'opcode Tapscript `OP_TWEAKADD`, qui prend une clé publique *x-only* $P$ et un entier $t$, et place sur la pile la clé $P + tG$. Un script peut ainsi reproduire l'ajustement de clé utilisé par Taproot et en vérifier le résultat, sans révéler de clé privée ni recourir à des verrous de hash."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0449.md"
  - number: 450
    id: "BIP-0450"
    title: "Formosa—Seed encoding by themed mnemonic stories"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Yuri S Villas Boas"
      - "André Fidencio Gonçalves"
    created: "2026-05-15"
    summary: "Décrit Formosa, une extension du BIP-0039 : chaque bloc de 33 bits d'entropie devient une courte phrase sur un thème, construite à partir de petites listes de mots typés, au lieu de trois mots sans lien. La phrase de récupération devient plus facile à mémoriser et reste compatible avec le BIP-0039, qui est lui-même un thème Formosa."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0450.mediawiki"
  - number: 451
    id: "BIP-0451"
    title: "Dust UTXO Disposal Protocol"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "bubb1es"
      - "haris"
    created: "2026-04-28"
    summary: "Définit un protocole pour se débarrasser des UTXO de poussière (*dust*) reçus lors d'une attaque : le portefeuille les dépense vers une sortie `OP_RETURN` en laissant toute leur valeur en frais, sans les mélanger à ses autres pièces. Une signature `ALL|ANYONECANPAY` permet à un tiers de regrouper plusieurs de ces dépenses dans une même transaction."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0451.md"
  - number: 461
    id: "BIP-0461"
    title: "Deterministic ECDSA Signatures"
    status: "Draft"
    type: "Specification"
    layer: "Applications"
    authors:
      - "Liam Gilligan"
    created: "2026-08-12"
    summary: "Spécifie un algorithme de signature ECDSA dont le résultat dépend uniquement de la clé secrète et du message, avec une signature d'au plus 70 octets en DER. Un signataire, par exemple un *hardware wallet*, n'a plus aucune liberté pour cacher des fragments de sa clé dans ses signatures. Bitcoin Core produit ce type de signatures depuis la version 0.17.0."
    url: "https://github.com/bitcoin/bips/blob/master/bip-0461.md"
