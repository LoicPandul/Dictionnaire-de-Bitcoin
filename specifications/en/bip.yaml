# BIP: Bitcoin Improvement Proposals, English summaries.
# Translation of specifications/fr/bip.yaml: only the summaries; every other field lives there.

entries:
  - id: "BIP-0001"
    summary: "First document to define what a BIP is and how to propose one. Amir Taaki describes the 3 BIP types (Standards Track, Informational, Process), the role of the author who champions the proposal, and the stages of its life cycle. BIP-0002 replaced it in 2016."
    source_hash: "25c20f68eba975b5"
    translation_hash: "5c3fc17fafb546f2"
  - id: "BIP-0002"
    summary: "Revision of the BIP process by Luke Dashjr, replacing BIP-0001. It sets precise statuses (Draft, Proposed, Final, Rejected, and so on) with objective criteria for moving from one to another, adds public comments on each proposal, and requires open licenses. BIP-0003 replaced it in 2026."
    source_hash: "eb448a48a5224b83"
    translation_hash: "0bc41433d52c7207"
  - id: "BIP-0003"
    summary: "Current BIP process, written by Murch and in force since January 2026 in place of BIP-0002. It cuts the statuses to 4 (Draft, Complete, Deployed, Closed), replaces the Standards Track type with Specification, limits the decisions left to the editors' discretion, and accepts the Markdown format."
    source_hash: "8f0255beaf6e34ef"
    translation_hash: "30409ee2b4e3c7b2"
  - id: "BIP-0008"
    summary: "Soft fork activation mechanism based on miner signaling, designed as an alternative to BIP-0009. Periods are counted in block height rather than timestamps, and the `lockinontimeout` parameter can make signaling mandatory in the last period, which guarantees activation even without miner support."
    source_hash: "8abd1034c6ac7f75"
    translation_hash: "c62e830410d8dc20"
  - id: "BIP-0009"
    summary: "Soft fork activation mechanism that reads the `nVersion` field as a set of bits: each bit signals miner support for a change, so several can be deployed at once. On mainnet, a change locks in when 95% of the 2,016 blocks in a period signal it, or fails when the deployment expires."
    source_hash: "505aa17f5bbeaed7"
    translation_hash: "0230a5d4eb46cb38"
  - id: "BIP-0010"
    summary: "Format proposed by Alan Reiner for passing an unsigned multisig transaction between participants, collecting their signatures, then broadcasting it. This format, called TxDP, embeds the previous transactions so that an offline signing device can verify the amounts being spent without access to the blockchain."
    source_hash: "6e840509c327e1c3"
    translation_hash: "e32e50b58640b140"
  - id: "BIP-0011"
    summary: "Standard transaction type for M-of-N multisig, whose `scriptPubKey` lists the public keys directly before `OP_CHECKMULTISIG`, with at most 3 keys. Gavin Andresen targeted wallets protected by a third-party service and escrows between buyer, seller, and arbitrator. This format is now called P2MS or bare multisig."
    source_hash: "f919a11b6fdf1561"
    translation_hash: "ed2ae2ea8396e131"
  - id: "BIP-0012"
    summary: "Gavin Andresen's proposal for a new opcode, `OP_EVAL`, which redefines `OP_NOP1` to execute a serialized script supplied at spending time. The recipient thus sets the spending conditions itself, while the sender only knows their hash. BIP-0016 (P2SH) replaced it."
    source_hash: "23925ff1c36f8b38"
    translation_hash: "7cc583aa6961181d"
  - id: "BIP-0013"
    summary: "Format of P2SH addresses, which encode the hash of a script rather than that of a public key. The address uses the same `Base58Check` encoding as classic addresses, with version byte 5 on mainnet (prefix `3`) and 196 on testnet."
    source_hash: "48eb97f78e689419"
    translation_hash: "b7f404572f18b52c"
  - id: "BIP-0014"
    summary: "Separation of the protocol version number from the software version number, at a time when the protocol version was tied to that of Satoshi's client. This BIP also defines the user agent, a string such as `/Satoshi:5.64/bitcoin-qt:0.4/` that each client puts in the `version` message to identify itself on the network."
    source_hash: "8872501b6b56cdfe"
    translation_hash: "7ff55fbb2c22b83a"
  - id: "BIP-0015"
    summary: "Study of several alias systems that replace hard-to-remember addresses with readable names. Amir Taaki compares FirstBits (the blockchain as a directory), DNS TXT records, an HTTPS service, a dedicated alias server, transactions to an IP address, and Namecoin. The text presents BIP-0070 as the alternative to these aliases."
    source_hash: "97f04f379de7fd09"
    translation_hash: "e6910a7ec98aa674"
  - id: "BIP-0016"
    summary: "P2SH (Pay-to-Script-Hash) output type, which contains only the hash of a script: the spender supplies the full script along with the data that satisfies it. The sender can thus pay any complex script with a short address. The new validation rules apply since April 1, 2012."
    source_hash: "75398f58e5785c06"
    translation_hash: "44b20af3e02596ee"
  - id: "BIP-0017"
    summary: "Luke Dashjr's proposal competing with P2SH, which redefines `OP_NOP2` as `OP_CHECKHASHVERIFY`, an opcode that compares the hash of the end of the `scriptSig` to a value written in the `scriptPubKey`. BIP-0016 was adopted instead."
    source_hash: "622d95af0f0ffc0b"
    translation_hash: "9aa03755a799d4f6"
  - id: "BIP-0018"
    summary: "Luke Dashjr's proposal that deprecates the `scriptSig` and `scriptPubKey` fields and replaces them with `dataSig`, `scriptCheck`, and `hashScriptCheck`. The output is written byte for byte like a P2SH output, so old nodes read it as a plain `OP_HASH160 <hash> OP_EQUAL` script."
    source_hash: "8948274ba1997fe7"
    translation_hash: "d86bccdfdbaae521"
  - id: "BIP-0019"
    summary: "Variant of M-of-N multisig transactions that replaces `OP_CHECKMULTISIG` with a series of `OP_CHECKSIG`. Luke Dashjr wanted to work around the count of 20 signature operations per `OP_CHECKMULTISIG`, which limited a block to 1,000 multisig transactions."
    source_hash: "1ba822b2ff26bfcf"
    translation_hash: "28942f82c0271fb3"
  - id: "BIP-0020"
    summary: "First version of the `bitcoin:` URI scheme, written by Luke Dashjr from a text by Nils Schneider, for paying by clicking a link or scanning a QR code. It provided for amounts with an exponent and in hexadecimal. BIP-0021 replaced it."
    source_hash: "57668c288b7ac365"
    translation_hash: "13839c4e85d5f570"
  - id: "BIP-0021"
    summary: "The `bitcoin:` URI scheme, which encodes an address with optional parameters (`amount`, `label`, `message`) to start a payment from a link or a QR code. It takes over BIP-0020 without its alternative amounts. BIP-0321 replaced it."
    source_hash: "a050a060f87a43c1"
    translation_hash: "2a210a10086d0035"
  - id: "BIP-0022"
    summary: "The `getblocktemplate` JSON-RPC call, through which a node gives the mining software the whole structure of the block to build, rather than a simple header to hash. The miner can thus assemble the block itself and, if it wants, change its contents."
    source_hash: "4e347d0e18dfa153"
    translation_hash: "3bff7bb2dfa70fd8"
  - id: "BIP-0023"
    summary: "Extensions to `getblocktemplate` (BIP-0022) for pooled mining: a target specific to each miner, allowed changes to the block template, and block proposals to the pool. Together they cover everything the old getwork protocol did, so that pools can adopt them without major changes and miners can verify the blocks they produce."
    source_hash: "e2755dc13fd85f61"
    translation_hash: "3b29246f0ecfdb2e"
  - id: "BIP-0030"
    summary: "Consensus rule that forbids a block from containing a transaction whose ID matches that of an earlier transaction that is still partly unspent. Pieter Wuille fixes an attack based on duplicate coinbases this way. The rule applies since March 15, 2012, then to all blocks except the 2 historical cases at heights 91,842 and 91,880."
    source_hash: "e449a2d8a7d2321c"
    translation_hash: "95522b0dbcb503bb"
  - id: "BIP-0031"
    summary: "The `pong` message of the peer-to-peer network. A node sends a `ping` with a random number (nonce), its peer sends it back in a `pong`, which makes it possible to detect a dead connection or an overloaded peer and to measure latency."
    source_hash: "23d0643e89f97617"
    translation_hash: "25042e2129115d46"
  - id: "BIP-0032"
    summary: "Standard for hierarchical deterministic (HD) wallets: from a single seed, a derivation function produces a tree of key pairs, and an extended public key can derive addresses without exposing the private keys. A single backup is then enough to restore all the wallet's keys."
    source_hash: "8cc2840435e4e88b"
    translation_hash: "a20fd673d7e5f9a0"
  - id: "BIP-0033"
    summary: "Amir Taaki's proposal for \"stratified nodes\" that hand validation and blockchain lookups over to specialized services. The text adds the `NODE_SERVICE` and `NODE_STRATIZED` service bits and messages such as `getoutputs`, to replace the Stratum server used by Electrum."
    source_hash: "766207680ca4a413"
    translation_hash: "cf078ce8b3f5ae61"
  - id: "BIP-0034"
    summary: "Version 2 of blocks, which requires each miner to write the block height at the start of the coinbase `scriptSig`, making every coinbase unique. Once 750 of the last 1,000 blocks are version 2, invalid version 2 blocks are rejected, then all version 1 blocks from 950."
    source_hash: "2e72de29467f84df"
    translation_hash: "608fa46f8dcb362d"
  - id: "BIP-0035"
    summary: "The `mempool` message, by which a peer asks a node for the list of transactions in its mempool, with an extension of `getdata` to fetch those transactions. The text cites 3 uses: SPV clients looking for their unconfirmed transactions, miners restarting, and network diagnostics."
    source_hash: "a298cc522cdd0c13"
    translation_hash: "062aabc14fd0bc84"
  - id: "BIP-0036"
    summary: "Stefan Thomas's proposal for nodes to announce custom services (distributed hash table, distributed pools, light client protocols) in new fields of the `version` message, without using up the limited 64 bits of the `services` field."
    source_hash: "27dd1e3538f852a9"
    translation_hash: "031118768b3a363d"
  - id: "BIP-0037"
    summary: "Filtering with a Bloom filter, which a light client (SPV) hands to its peers to describe the transactions that concern it. The full node then sends it only those transactions, along with Merkle blocks that prove their inclusion. The false positive rate, chosen by the client, sets the tradeoff between bandwidth and privacy."
    source_hash: "3a77bf4ea9a027fc"
    translation_hash: "0f59ff1d03821230"
  - id: "BIP-0038"
    summary: "Method for encrypting a private key with a passphrase, as a 58-character `Base58Check` string meant for paper wallets and physical coins. The encryption uses `scrypt` against brute force, and a second mode lets a manufacturer generate the key without ever knowing the original passphrase."
    source_hash: "c4a4b0c8fa676239"
    translation_hash: "c73b4e1df95638b2"
  - id: "BIP-0039"
    summary: "Mnemonic phrase standard: the wallet's entropy, from 128 to 256 bits, receives a checksum, then is split into groups of 11 bits that each point to a word in a list of 2,048. The phrase, with an optional passphrase, is then converted into a binary seed for a BIP-0032 HD wallet."
    source_hash: "179eb0d39c83df0e"
    translation_hash: "702bf98429a1b7b6"
  - id: "BIP-0042"
    summary: "April Fools' BIP published on April 1, 2014 by Pieter Wuille, which fixes a real flaw: the bit shift that divides the block reward becomes undefined behavior in C++ after 64 halvings, which would have restarted issuance. The fix sets the reward to zero beyond that point, capping total supply at 21 million bitcoin."
    source_hash: "8686d61159144a60"
    translation_hash: "9877506f14626a50"
  - id: "BIP-0043"
    summary: "Purpose field that occupies the first derivation level of an HD wallet, `m / purpose' / *`, and announces the standard that organizes the rest of the path. Each scheme takes the number of its BIP: `44'` for BIP-0044, for example. Wallets that follow different standards thus never derive the same keys."
    source_hash: "c2175b94ee5c1721"
    translation_hash: "4b2c17f974690266"
  - id: "BIP-0044"
    summary: "5-level hierarchy for HD wallets, `m / purpose' / coin_type' / account' / change / address_index`, with `44'` as the purpose. A single seed thus serves several cryptocurrencies and several accounts, each split into an external keychain for receiving addresses and an internal keychain for change."
    source_hash: "60b7172607284ffc"
    translation_hash: "518a353d26cf7d20"
  - id: "BIP-0045"
    summary: "Derivation structure for P2SH multisig wallets shared among several parties, on the path `m / 45' / cosigner_index / change / address_index`. Each cosigner generates its master key on its own, and all derive the same addresses without having to communicate; communication is only needed to create and sign transactions."
    source_hash: "33006b4b878c3d3f"
    translation_hash: "fdf182486c34f7c7"
  - id: "BIP-0046"
    summary: "Derivation scheme for the timelocked addresses that hold fidelity bonds, bitcoin locked with `OP_CHECKLOCKTIMEVERIFY` to resist Sybil attacks, notably in JoinMarket. The path `m/84'/0'/0'/2/index` maps each of the 960 indexes to a month, from January 2020 to December 2099: the seed is enough to find the funds, without writing down the unlock dates."
    source_hash: "e81b5209affe4a5b"
    translation_hash: "4441b9a74a5072d8"
  - id: "BIP-0047"
    summary: "Reusable payment codes, identifiers that can be published without reusing an address. The sender announces its code to the recipient in a notification transaction, then an ECDH key exchange lets each derive a series of unique addresses meant for the other, on the path `m / 47' / coin_type' / identity'`."
    source_hash: "04a7de25e4056f63"
    translation_hash: "76260bc77fd76955"
  - id: "BIP-0048"
    summary: "Derivation path `m / 48' / coin_type' / account' / script_type' / change / address_index`, already used by HD multisig wallets before this BIP. The `script_type'` level separates script types: `1'` for P2SH-P2WSH and `2'` for P2WSH, the latter being recommended by default."
    source_hash: "86b5c989a13a3bcc"
    translation_hash: "eab6d9b3012cf39c"
  - id: "BIP-0049"
    summary: "Derivation scheme for HD wallets for SegWit addresses nested in P2SH (P2SH-P2WPKH), with `49'` as the purpose. These accounts are kept separate from BIP-0044 accounts: an incompatible wallet shows nothing rather than a partial balance."
    source_hash: "59136d6399a82909"
    translation_hash: "88cf004fe5e0273a"
  - id: "BIP-0050"
    summary: "Incident report on the March 2013 chain split. A valid block required more Berkeley DB locks than nodes prior to 0.8 had provisioned: they rejected it, while 0.8 nodes, which had moved to LevelDB, accepted it. The BTC Guild and Slush pools went back to 0.7 to reunify the chain."
    source_hash: "77f9e4b4835876c7"
    translation_hash: "e909aa6663fa9fc5"
  - id: "BIP-0052"
    summary: "Proposal for optical proof of work (oPoW), a variant of Hashcash that photonic processors compute with little energy, in place of the current proof of work. The cost of mining would shift from electricity to hardware, making mining profitable outside regions where electricity is cheap. This change would require a hard fork."
    source_hash: "57e10628e4d9b3d9"
    translation_hash: "61cd8827db4214da"
  - id: "BIP-0053"
    summary: "Consensus rule that makes transactions of exactly 64 bytes without their witness invalid. Such a transaction has the size of an internal node of the Merkle tree and can pass for one, which makes blocks malleable and allows a light client to be fooled with a fake inclusion proof."
    source_hash: "e2ab26e2ec3bbe28"
    translation_hash: "1137d5718a57de60"
  - id: "BIP-0054"
    summary: "Soft fork that bundles 4 consensus fixes: it blocks the time warp attack by constraining block timestamps at difficulty period boundaries, caps non-witness signature operations at 2,500 per transaction, invalidates 64-byte transactions, and sets the coinbase `nLockTime`, which makes the BIP-0030 checks unnecessary."
    source_hash: "c0a4257d9e2d3623"
    translation_hash: "59e7fb97ecbefa97"
  - id: "BIP-0060"
    summary: "Amir Taaki's proposal to make the `relay` field mandatory. BIP-0037 had added it as optional at the end of the `version` message. A message with fixed fields is simpler to read and verify, whereas an optional field forces the code to know the remaining size of the message."
    source_hash: "c61a1536bd3d4201"
    translation_hash: "845bae03988e2611"
  - id: "BIP-0061"
    summary: "The `reject` message, which a node sends in response to a `version`, `tx`, or `block` message to explain why it refuses it, with a code and a readable reason. This feedback helps implementations stay compatible and tells an SPV client that a transaction was refused. Bitcoin Core removed these messages in version 0.20.0."
    source_hash: "281adf3dbea1e856"
    translation_hash: "2b950326ab8d47ad"
  - id: "BIP-0062"
    summary: "Inventory of the known sources of transaction malleability (non-DER signatures, high S value, non-push operations in the `scriptSig`, superfluous stack elements, and so on), with a rule for each, so that a third party can no longer modify a transaction without invalidating its signature. Pieter Wuille closed this BIP without it being deployed."
    source_hash: "6f378c7d5e9689e4"
    translation_hash: "6dfb99829914c4da"
  - id: "BIP-0064"
    summary: "Mike Hearn's proposal for a `getutxos` message by which a light client asks a full node whether specific outputs are still unspent, the answer arriving in a `utxos` message. The text cites assurance contracts, which must quickly check that a funding pledge has not been canceled by a double spend."
    source_hash: "ebbf13a96c34436a"
    translation_hash: "7e8e3a37ae2d7b92"
  - id: "BIP-0065"
    summary: "The `OP_CHECKLOCKTIMEVERIFY` (CLTV) opcode, which redefines `OP_NOP2` so that an output cannot be spent before a given block height or date. The script fails if the `nLockTime` of the spending transaction does not reach the set value. The BIP cites escrows, refunds at expiry, and payment channels as uses."
    source_hash: "f2d6715e6bcc6f88"
    translation_hash: "48c98961eebb9499"
  - id: "BIP-0066"
    summary: "Consensus rule that imposes strict DER encoding on every ECDSA signature checked by `OP_CHECKSIG`, `OP_CHECKMULTISIG`, and their variants. Block validity thus stops depending on how OpenSSL reads signatures, after OpenSSL versions 1.0.0p and 1.0.1k made some nodes reject the chain."
    source_hash: "36c7099e7c74e932"
    translation_hash: "fb468861efaad69a"
  - id: "BIP-0067"
    summary: "Method that sorts the compressed public keys of a P2SH multisig script in lexicographic order, so that the same set of keys and the same threshold always give the same address. Without this sorting, n keys allow up to $2(n!)$ possible scripts, each with its own address."
    source_hash: "60ac362ed0861d78"
    translation_hash: "4fd8df0547d79ad5"
  - id: "BIP-0068"
    summary: "Consensus rule that gives the `nSequence` field of inputs the meaning of a relative timelock, for transactions of version 2 or higher. An input stays invalid until the output it spends has reached a minimum age, counted in blocks or in 512-second units. Bidirectional payment channels rely on this mechanism."
    source_hash: "b6fd7519e639905c"
    translation_hash: "7e036a0b0c193079"
  - id: "BIP-0069"
    summary: "Deterministic sorting method for the inputs and outputs of a transaction: inputs by previous transaction hash then by index, outputs by amount then by `scriptPubKey`. An order shared by all wallets prevents each wallet's own ordering from betraying the software used or the change output."
    source_hash: "f5f6251363623271"
    translation_hash: "3f7819f23d22e73d"
  - id: "BIP-0070"
    summary: "Payment protocol between a merchant and a customer, in 3 messages: `PaymentRequest`, signed with the merchant's X.509 certificate, then `Payment` and `PaymentACK`. The wallet shows a verified name rather than an address, the customer keeps proof of payment in case of dispute, and the exchange resists man-in-the-middle attacks."
    source_hash: "3c9e17cb4fa30b49"
    translation_hash: "530d9fc60127565f"
  - id: "BIP-0071"
    summary: "MIME types of the 3 messages of the BIP-0070 payment protocol: `application/bitcoin-paymentrequest`, `application/bitcoin-payment`, and `application/bitcoin-paymentack`. A web server or an email that carries these binary messages thus announces them according to Internet standards."
    source_hash: "8db4771177ee6b55"
    translation_hash: "14b77902516ca8a7"
  - id: "BIP-0072"
    summary: "Extension of the `bitcoin:` URI scheme (BIP-0021) that adds the `r` parameter, the URL where the wallet downloads the BIP-0070 payment request. A compatible wallet then ignores the address and amount of the URI to follow the payment protocol, while an old wallet still pays the address given."
    source_hash: "c24712bc7c10decb"
    translation_hash: "782043bc3b9624d0"
  - id: "BIP-0073"
    summary: "Extension of the payment protocol (BIP-0070) that shortens the URLs encoded in QR codes. A wallet that scans a plain URL queries it with the HTTP `Accept` header, and the server answers with a `bitcoin:` URI or a payment request depending on what the client says it can read."
    source_hash: "1c74d49f68e4635e"
    translation_hash: "ab5ffae141d2fee9"
  - id: "BIP-0074"
    summary: "Change to the payment protocol (BIP-0070) that allows zero-value `OP_RETURN` outputs in a payment request. The protocol previously ignored zero-value outputs, so a merchant who wanted to record data had to put bitcoin in it, lost forever."
    source_hash: "0002d01d2baffc7d"
    translation_hash: "ba173adaf3b0b9ac"
  - id: "BIP-0075"
    summary: "Extension of the payment protocol (BIP-0070) in 2 parts: the sender can sign its request and attach a certificate so that the recipient knows who it is dealing with, and the returned payment request is encrypted so that an intermediary cannot read its contents. Address exchange between wallets can thus be automated."
    source_hash: "2d703da2abe6d51d"
    translation_hash: "1ca29f8e4c870d1c"
  - id: "BIP-0077"
    summary: "Asynchronous version of Payjoin (BIP-0078), where the receiver no longer needs to host a reachable server. Sender and receiver exchange their encrypted PSBTs through a directory server that does not read their contents, and requests go through Oblivious HTTP to hide their IP addresses."
    source_hash: "4cd4028ecb90bdb0"
    translation_hash: "5a8c7cbdd50ba220"
  - id: "BIP-0078"
    summary: "Payjoin protocol: during a payment, the receiver adds one of its own inputs to the transaction prepared by the sender, received as a PSBT at the address given by the `pj=` parameter of a BIP-0021 URI. The transaction thus breaks the heuristic that all inputs belong to the same person. This BIP replaces BIP-0079."
    source_hash: "b2c4c928b5f2baa8"
    translation_hash: "8087989ccb1fdd64"
  - id: "BIP-0079"
    summary: "Bustapay protocol, in which the sender and the receiver of a payment sign the transaction together, the receiver adding one of its inputs. Chain analysis can no longer assume that all inputs belong to the payer, and the merchant consolidates its UTXOs along the way. BIP-0078 replaced it."
    source_hash: "bcb83b2d198babb7"
    translation_hash: "8e1f4851822ba67d"
  - id: "BIP-0080"
    summary: "Derivation hierarchy for the multisig wallets of voting pools without colored coins, on the path `m / 80' / coin_type' / series' / address_index`. Series let these pools manage their funds in cold storage in FIFO order, with most private keys staying offline."
    source_hash: "ac6a7213f5a7cf9b"
    translation_hash: "39553dae19427b53"
  - id: "BIP-0081"
    summary: "Variant of BIP-0080 for voting pools that manage colored coins. The path `m / 81' / series' / ... / address_index` inserts 5 levels that encode the color definition, since a single 32-bit index is not enough to identify it without risk of collision."
    source_hash: "c7dfad2f754e1d46"
    translation_hash: "3edddac50cb84b04"
  - id: "BIP-0083"
    summary: "Derivation scheme that lets a BIP-0032 key hierarchy be extended without limit, instead of imposing a fixed structure like BIP-0044 and BIP-0045. Under a parent node, indexes above 0 give signing keys and index 0 is reserved for creating a sublevel, which follows the same rule."
    source_hash: "73e2ec74b23eb22b"
    translation_hash: "6136acbc7bb931f8"
  - id: "BIP-0084"
    summary: "Derivation scheme for HD wallets for native SegWit P2WPKH addresses (`bc1q`), with `84'` as the purpose. It takes over the account structure of BIP-0044 and BIP-0049; only the purpose changes, to indicate the script type."
    source_hash: "fb9d301130571109"
    translation_hash: "c306d86a5705e9cb"
  - id: "BIP-0085"
    summary: "Method for deriving entropy from a BIP-0032 master key, on hardened paths `m/83696968'/...`, then converting it into a BIP-0039 phrase, a WIF key, an `xprv`, a password, or an RSA key. A single backup can then regenerate the seeds of several independent wallets, without revealing the original seed."
    source_hash: "b839229c281f41e7"
    translation_hash: "b3cb5f46a97b60e3"
  - id: "BIP-0086"
    summary: "Derivation scheme for HD wallets for single-key P2TR outputs, where the derived key serves as the Taproot internal key, with `86'` as the purpose. It takes over the structure of BIP-0044, BIP-0049, and BIP-0084, so that a simple seed backup finds these outputs."
    source_hash: "97e04a2ab53e3fc1"
    translation_hash: "5422b536144af508"
  - id: "BIP-0087"
    summary: "Derivation hierarchy for multisig wallets, `m / 87' / coin_type' / account' / change / address_index`, which fixes no script type in the path. The output script descriptors that accompany the backup already give the script type and the public keys of all cosigners."
    source_hash: "5ce7b837469b6d49"
    translation_hash: "0db8adfbfd7d3870"
  - id: "BIP-0088"
    summary: "Format of BIP-0032 derivation path templates, which describes the paths a wallet accepts using ranges and wildcards. For example, `m/{44,49,84}'/0'/0'/{0-1}/{0-50000}` covers the external and internal keychains of BIP-0044, BIP-0049, and BIP-0084 up to index 50,000. Software can thus check that a path stays within the intended limits."
    source_hash: "54ab9031eeff9a1e"
    translation_hash: "17ae1f5a96534912"
  - id: "BIP-0089"
    summary: "Method for multisig wallets, Chain Code Delegation, where a privileged participant keeps the BIP-0032 chain codes of the others to itself and supplies, at each signing, the tweak specific to the input concerned. These cosigners, typically a collaborative custody service, sign without being able to derive the other addresses or track the wallet's balance."
    source_hash: "2985ec4a68b65bda"
    translation_hash: "fcb828f15be295d8"
  - id: "BIP-0090"
    summary: "Simplification that replaces the triggering of the BIP-0034, BIP-0065, and BIP-0066 soft forks, based on the version of the previous 1,000 blocks, with the block heights at which these rules became active. Validating a block no longer requires going back through chain history, and the now-unneeded activation code disappears."
    source_hash: "ef1bdf48d76082fe"
    translation_hash: "eb1aa238a9cc9f4e"
  - id: "BIP-0091"
    summary: "Deployment meant to activate SegWit with less than 95% of the hash power. Once 269 blocks out of a 336-block window (80%) signal bit 4, nodes reject any block that does not signal bit 1 of the BIP-0009 SegWit deployment, which forces its lock-in."
    source_hash: "f97da4dfcffca045"
    translation_hash: "c57e09885532401d"
  - id: "BIP-0093"
    summary: "The codex32 format for backing up the BIP-0032 master seed, a base32 string protected by a BCH checksum that corrects copying errors. Shamir's secret sharing can split the seed into at most 31 shares, of which a threshold of 2 to 9 is enough to reconstruct it, and everything can be computed by hand."
    source_hash: "02a32eff0e3661fd"
    translation_hash: "069cf5f043936ad7"
  - id: "BIP-0094"
    summary: "Testnet 4, a test network that replaces Testnet 3. It keeps the exception that allows minimum difficulty after 20 minutes without a block, but computes the difficulty adjustment from the first block of the period to prevent \"block storms\", and blocks the time warp attack."
    source_hash: "4378bd7c1db7366b"
    translation_hash: "4a7167c305a3806f"
  - id: "BIP-0095"
    summary: "Testnet 5, a test network meant to replace Testnet 4. It removes the exception that allowed minimum difficulty after 20 minutes without a block, which was exploited to the point of hampering tests, raises the minimum difficulty, and applies the Consensus Cleanup rules (BIP-0054) from block 1."
    source_hash: "262c027014bffffe"
    translation_hash: "6daeddd17661dbfe"
  - id: "BIP-0098"
    summary: "New Merkle tree construction for Bitcoin, which is not vulnerable to the duplicate-entries flaw (CVE-2012-2459) of the tree Satoshi designed and avoids its unnecessary double hashing. According to the author, building and verifying the tree takes about 55% less time."
    source_hash: "17f54b12785048a6"
    translation_hash: "d50ca756bc5afaff"
  - id: "BIP-0099"
    summary: "Classification of the different types of consensus forks (soft forks, hard forks, and their variants), with a recommended deployment method for each. Jorge Timón wants to avoid the misunderstandings that delay changes when everyone discusses them without a shared view of the deployment paths."
    source_hash: "b3f89a3343385f15"
    translation_hash: "cf9a62e568749e5b"
  - id: "BIP-0100"
    summary: "Jeff Garzik's proposal that replaces the fixed 1 MB limit with a maximum size voted on by miners in the coinbase. At each period of 2,016 blocks, the limit can rise or fall by at most 5% if 75% of the blocks (1,512) vote that way. This change required a hard fork."
    source_hash: "86a8ddf3ce22521e"
    translation_hash: "1b659463e293a1fd"
  - id: "BIP-0101"
    summary: "Gavin Andresen's proposal that replaces the 1 MB limit with a maximum size of 8 MB on January 11, 2016, doubling every 2 years up to 8,192 MB in 2036. The limit rises linearly between 2 doublings. This change required a hard fork."
    source_hash: "a14517e4ec6ff816"
    translation_hash: "19be48df976e93e9"
  - id: "BIP-0102"
    summary: "Jeff Garzik's proposal that raises the maximum block size from 1 MB to 2 MB in one step, through a hard fork. The change activates on a set date, provided that 95% of the last 1,000 blocks signal it, and the signature operation limit rises in the same proportion."
    source_hash: "f1616dce330b498d"
    translation_hash: "87ccf50ec5613734"
  - id: "BIP-0103"
    summary: "Pieter Wuille's proposal for raising the maximum block size in steps of 4.4% about every 97 days, from January 2017 to July 2063, or 17.7% per year. This pace follows the average growth of bandwidth, which the author considers the limiting factor. This change required a hard fork."
    source_hash: "81d5d6a5d7e4528b"
    translation_hash: "8573d79a796915f9"
  - id: "BIP-0104"
    summary: "Proposal nicknamed \"Block75\" that adjusts the maximum block size at each period of 2,016 blocks, on the model of difficulty, so that blocks stay 75% full on average. The limit thus follows actual network usage without human decision. This change required a hard fork."
    source_hash: "4a09c86f2ecddbdb"
    translation_hash: "6097745ecc090b8f"
  - id: "BIP-0105"
    summary: "Proposal for adjusting the maximum block size by miner vote in the coinbase, with an increase or decrease of at most 10% per period of 2,016 blocks. A miner who votes for an increase must find a block under a more demanding difficulty target, which gives its vote a cost."
    source_hash: "b8dc2eb02edfb46e"
    translation_hash: "109703a9f403fb81"
  - id: "BIP-0106"
    summary: "Proposal for a maximum block size recalculated at each difficulty adjustment. In the first variant, the limit doubles when more than half of the blocks in the period are 90% full, and is divided by 2 when more than 90% stay under 50%. The second variant also takes the fees collected into account."
    source_hash: "73c65ae49ec8a635"
    translation_hash: "2da54d7ce2035ada"
  - id: "BIP-0107"
    summary: "Proposal to raise the maximum block size in 2 phases: 2 MB in 2016 and 2017, 4 MB in 2018 and 2019, then 6 MB in 2020. After that, every 4,032 blocks, the limit rises by 10% if at least 3,025 of those blocks are 60% full, and it never decreases."
    source_hash: "297b2e3d4da0b95a"
    translation_hash: "8cb98677cc4d6f5f"
  - id: "BIP-0109"
    summary: "Gavin Andresen's proposal that raises the maximum block size from 1 MB to 2 MB through a hard fork, by counting signature operations precisely and limiting the data hashed per block. Activation requires 75% of the last 1,000 blocks to signal it, followed by a grace period of 28 days."
    source_hash: "7036995e2af20e5b"
    translation_hash: "e82353615adc25d7"
  - id: "BIP-0110"
    summary: "Temporary soft fork, active for one year, that limits the size of arbitrary data in transactions at the consensus level: `scriptPubKey` of at most 34 bytes (83 for an `OP_RETURN`), pushed elements of at most 256 bytes, and the Taproot annex and `OP_SUCCESS` forbidden. Deployment requires 55% miner signaling."
    source_hash: "10b05760a8c63060"
    translation_hash: "958c961800654505"
  - id: "BIP-0111"
    summary: "The `NODE_BLOOM` service bit, by which a node announces that it accepts the Bloom filters of BIP-0037. These filters offer little privacy and expose nodes to denial-of-service attacks, hence an operator's ability to disable them. Protocol version 70011 identifies old nodes that filter without announcing this bit."
    source_hash: "ba0ca5ddc9d131d1"
    translation_hash: "4d400dd9c9127f87"
  - id: "BIP-0112"
    summary: "The `OP_CHECKSEQUENCEVERIFY` (CSV) opcode, which redefines `OP_NOP3` so that the script fails if the input does not impose, through its `nSequence` field (BIP-0068), a relative timelock at least equal to the requested value. A script branch can thus wait until the spent output has reached a certain age, which payment channels rely on."
    source_hash: "0bff025952f8be1d"
    translation_hash: "31eced143ad1d84b"
  - id: "BIP-0113"
    summary: "Consensus rule that compares timelocks (`nLockTime`) to the median of the timestamps of the last 11 blocks (median time past), rather than to the timestamp of the block that includes the transaction. This median can only increase: a miner gains nothing by lying about the time of its block to include transactions sooner."
    source_hash: "48a2771bb1b8bfb7"
    translation_hash: "018d13672ce84c58"
  - id: "BIP-0114"
    summary: "New witness program type (MAST) that encodes the mutually exclusive branches of a script in a Merkle tree. When the output is spent, only the executed branch is revealed, which makes complex spending conditions possible, keeps unused branches secret, and allows adding non-consensus data at very low cost."
    source_hash: "5986895c52abd849"
    translation_hash: "4f567c45401068a3"
  - id: "BIP-0115"
    summary: "The `OP_CHECKBLOCKATHEIGHT` opcode, which redefines `OP_NOP5` so that a transaction is valid only on a chain that contains a specific block at a given height. In case of a lasting blockchain split, a transaction thus cannot be replayed on the other chain."
    source_hash: "804a63a148d41d37"
    translation_hash: "c6c10d417efa3d03"
  - id: "BIP-0116"
    summary: "The `MERKLEBRANCHVERIFY` opcode, which can be activated by soft fork and verifies that one or more elements belong to a Merkle tree whose root is the only thing the script contains. These elements can be public keys or subscripts: only those that are used are revealed at spending time, which saves space and preserves privacy."
    source_hash: "323055123c8ee918"
    translation_hash: "57a30a9349324863"
  - id: "BIP-0117"
    summary: "Tail call semantics for Script: if execution ends with more than one element on the stack, the last one is executed in turn as a script. Combined with `MERKLEBRANCHVERIFY` (BIP-0116), this mechanism commits a script to a large number of execution paths of which only the one used is revealed, a general form of MAST."
    source_hash: "d0917328f0892347"
    translation_hash: "413e9d02c798c2e4"
  - id: "BIP-0118"
    summary: "New public key type for Tapscript (BIP-0342) whose signatures, in `SIGHASH_ANYPREVOUT` or `SIGHASH_ANYPREVOUTANYSCRIPT` mode, do not commit to the UTXO being spent. A single signature then holds for any output with a compatible script, which off-chain protocols like eltoo need to respond to any published state."
    source_hash: "2021a7b022b030b2"
    translation_hash: "d18053cf36a47ff8"
  - id: "BIP-0119"
    summary: "The `OP_CHECKTEMPLATEVERIFY` (CTV) opcode, which redefines `OP_NOP4` so that an output can only be spent by a transaction that matches a hashed template: version, `nLockTime`, sequences, and the exact number of inputs and outputs. This simple covenant replaces many presigned transactions and reduces the trust and interactivity they require."
    source_hash: "3d44d98253872123"
    translation_hash: "2e63fe19c213ffe4"
  - id: "BIP-0120"
    summary: "Proof of Payment system: the wallet signs a never-broadcast transaction that reuses the inputs of a past payment, with a single `OP_RETURN` output containing the `txid` and a nonce supplied by the verifier. A hotel, a parking garage, or a video service can thus verify that a customer has paid."
    source_hash: "d6abd75dfc9c79ef"
    translation_hash: "7b93fca58cce681a"
  - id: "BIP-0121"
    summary: "The `btcpop:` URI scheme, which passes a proof-of-payment request (BIP-0120) to the customer's wallet through a QR code or NFC. It reuses BIP-0021 with 2 required parameters, `p` for the proof destination and `n` for the nonce, and an optional `txid` that identifies the transaction to prove."
    source_hash: "0081cfef0842e8fd"
    translation_hash: "e576e9dd2ecefed9"
  - id: "BIP-0122"
    summary: "The `blockchain:` URI scheme, which designates a block, a transaction, or an address, so that the user can open it in the explorer or application of their choice rather than the one imposed by their wallet. An optional identifier, the genesis block hash, specifies the chain concerned."
    source_hash: "8866af9f7a7475c4"
    translation_hash: "e53856bdc0d1fe3f"
  - id: "BIP-0123"
    summary: "Classification of BIPs into 4 layers, from the one with the strictest interoperability requirements to the least constrained: consensus, peer services, API/RPC, and applications. The text sets the criteria that assign a BIP to a layer: the lower the layer a change touches, the harder it is to get accepted."
    source_hash: "8af9af0ebf46ca3b"
    translation_hash: "83daca565ccf5779"
  - id: "BIP-0124"
    summary: "Format of script templates that lets several wallets generate the same scripts from the same BIP-0032 derivation paths. It targets multisig, timelocked or hash-locked contracts, and protocols like the Lightning Network, whose scripts evolve quickly."
    source_hash: "81566b28ef99ffdf"
    translation_hash: "fc8bc38a10d9eca7"
  - id: "BIP-0125"
    summary: "Opt-in Replace-by-Fee relay policy: a transaction signals that it is replaceable when at least one of its inputs has an `nSequence` below `0xfffffffe`. Nodes then agree to replace it in their mempool with a version that pays more fees, and the recipient knows to wait for a confirmation."
    source_hash: "e064909f3f04a7e7"
    translation_hash: "dbda9dd121752b32"
  - id: "BIP-0126"
    summary: "Best practices for transactions that spend outputs sent to several addresses, which reveals that they belong to the same person. The text defines a standard form (as many unique output scripts as input scripts, and at least 2 outputs of the same amount, including the largest) that limits information leakage."
    source_hash: "a6ea5abfc8a4bf02"
    translation_hash: "9d26643436d60b9e"
  - id: "BIP-0127"
    summary: "Standard proof-of-reserves format: a deliberately invalid transaction whose first input carries the hash of a message and whose other inputs, signed normally, reference the UTXOs held. A company that holds bitcoin for its customers thus proves that it controls these funds without moving them, and the format builds on the PSBT format of BIP-0174."
    source_hash: "a2297190d64d81b0"
    translation_hash: "d91b2051ad7b97a9"
  - id: "BIP-0128"
    summary: "JSON format for timelocked recovery plans, in case of seed loss or inheritance. A plan contains 2 presigned transactions: an alert transaction that consolidates the funds, then a recovery transaction, locked by a relative timelock, that sends them to backup wallets and leaves the owner time to cancel."
    source_hash: "74675c1d5bebc87b"
    translation_hash: "d26c94feffde278c"
  - id: "BIP-0129"
    summary: "The BSMS (Bitcoin Secure Multisig Setup) protocol for configuring a multisig wallet among signers from different manufacturers. A coordinator collects the signers' keys, optionally encrypted with a shared secret, then sends them back the complete configuration, which each verifies and records, so that an attacker can neither modify nor spy on it."
    source_hash: "da1bcf0671290103"
    translation_hash: "b8e4afdda5ae0c31"
  - id: "BIP-0130"
    summary: "The `sendheaders` message, by which a node asks its peers to announce new blocks to it directly with a `headers` message rather than an `inv`. The peer that receives the header no longer has to send a `getheaders`, which speeds up block propagation."
    source_hash: "ea5be880e8eef0c7"
    translation_hash: "99d949c954737bb8"
  - id: "BIP-0131"
    summary: "Proposal for so-called coalescing transactions, in which a wildcard input spends all the UTXOs that share the same `scriptPubKey` at once, with a single signature. Consolidating many small outputs would cost far less, which would shrink the UTXO set. This change required a hard fork."
    source_hash: "0f52e65c7b868d2a"
    translation_hash: "5a836f7e226d238d"
  - id: "BIP-0132"
    summary: "Proposal for a BIP acceptance process run by committees representing 4 segments (client developers, miners, merchants, and users). A BIP would be accepted after 4 weeks of comments and opinions if it gathers at least 70% of the represented share in 3 of the 4 segments."
    source_hash: "9f721564c6ce78da"
    translation_hash: "4626377c42e79cd5"
  - id: "BIP-0133"
    summary: "Adds the `feefilter` message to the P2P protocol, with which a node tells its peers the minimum fee rate of its mempool. Peers then stop announcing transactions below that rate, which the node would reject anyway, saving bandwidth."
    source_hash: "838633d309b47005"
    translation_hash: "216969457f7dba17"
  - id: "BIP-0134"
    summary: "Proposes a new transaction format (version 4) whose fields are encoded as tagged tokens, the Compact Message Format. This hard fork aimed to make transactions easier to evolve and to eliminate their malleability. It was never adopted."
    source_hash: "c818ad71f571dcaf"
    translation_hash: "e06e928bcccc5743"
  - id: "BIP-0135"
    summary: "Generalizes the version bits signaling of BIP-0009: each bit gets its own activation threshold, its own counting window, and its own lock-in period. The mechanism also covers consensus changes other than soft forks. It was never deployed."
    source_hash: "4ab4bd0ee989d20b"
    translation_hash: "836123de0705e837"
  - id: "BIP-0136"
    summary: "Defines TxRef, a short `Bech32` encoding that designates a confirmed transaction by its position in the blockchain (block height and index within the block), and optionally one of its outputs. Unlike the txid, this reference is not cryptographic: a reorganization can change which transaction it points to."
    source_hash: "9f8f06c2a9c5ae6f"
    translation_hash: "0cf0f0ed24df46b2"
  - id: "BIP-0137"
    summary: "Describes the format of messages signed with a Bitcoin private key, as software already used it. The header byte of the signature also indicates the address type (P2PKH, P2SH-P2WPKH, or P2WPKH), which removes ambiguity at verification. BIP-0322 has since proposed a more general format."
    source_hash: "62ca36b7ba6f542e"
    translation_hash: "634fdf50e02f4060"
  - id: "BIP-0138"
    summary: "Defines a compact encryption scheme for backing up descriptors, wallet policies (BIP-0388), or other metadata, without any private key. The encryption key is derived from the descriptor's public keys: every holder of a key can decrypt the backup, while the service that stores it sees neither the addresses nor the structure of the scripts."
    source_hash: "7a08e4dfae666448"
    translation_hash: "6f0390fdad9570f0"
  - id: "BIP-0139"
    summary: "Defines a common export format for wallet metadata: accounts, descriptors, signers, labels, transactions, coins, and PSBTs. One piece of software can thus read back what another has written. A field registry, appended to the BIP, lets developers declare the fields they use."
    source_hash: "ef24869eaafb3863"
    translation_hash: "ee35eaa0be97d398"
  - id: "BIP-0140"
    summary: "Proposes a normalized transaction ID (NTXID), computed without the signature scripts, which later transactions would use to refer to the coins they spend. Modifying a signature would no longer change this identifier, which would eliminate malleability. SegWit solved the problem differently."
    source_hash: "ea35ddd4722c2448"
    translation_hash: "e15f02e372997a67"
  - id: "BIP-0141"
    summary: "Defines SegWit at the consensus level: signatures and unlocking scripts move into a new structure, the witness, committed to in the block by the coinbase transaction rather than in the Merkle tree of transactions. This soft fork eliminates unintentional malleability and introduces the notion of block weight."
    source_hash: "87575dda985117bc"
    translation_hash: "c81133557e8ae5b8"
  - id: "BIP-0142"
    summary: "Proposed a `Base58check` address format for native SegWit P2WPKH and P2WSH outputs. BIP-0173 replaced it with `Bech32` addresses."
    source_hash: "dd8f96538425d7ee"
    translation_hash: "f12abe624181c99e"
  - id: "BIP-0143"
    summary: "Defines the new transaction hashing algorithm used to verify signatures of version 0 SegWit outputs. The cost of hashing no longer grows quadratically with the size of the transaction, and the signature covers the input amount, which lets an offline signing device know the fee."
    source_hash: "b7cd737025327166"
    translation_hash: "31e546f41c8898bb"
  - id: "BIP-0144"
    summary: "Defines the messages and the serialization format that let nodes relay SegWit transactions and blocks along with their witnesses. A node announces its SegWit support through the `NODE_WITNESS` service bit, and older nodes keep receiving the data without witnesses."
    source_hash: "c146ccb4bf3abbc0"
    translation_hash: "c2cb6521bcdef2ce"
  - id: "BIP-0145"
    summary: "Adapts the `getblocktemplate` RPC call (BIP-0022) to SegWit: the block template sent to miners now states the block weight limit, as well as the weight of each transaction and its identifier computed with the witness."
    source_hash: "af605eef41c95a1b"
    translation_hash: "32c8b276e42eacc6"
  - id: "BIP-0146"
    summary: "Proposes two consensus rules against malleability related to ECDSA signature encoding: `LOW_S` requires an S value in the lower half of the curve order, and `NULLFAIL` requires that a signature whose verification fails be empty. Bitcoin Core already enforced them for transaction relay, but this soft fork did not succeed."
    source_hash: "7c8b43d188fe4680"
    translation_hash: "bf9c3deadd246446"
  - id: "BIP-0147"
    summary: "Adds the `NULLDUMMY` consensus rule: the extra element that `OP_CHECKMULTISIG` and `OP_CHECKMULTISIGVERIFY` pop from the stack without ever reading it must be an empty byte array. Previously, any value was accepted there, which let a third party modify the transaction. The rule was deployed together with SegWit."
    source_hash: "2748a2712db72569"
    translation_hash: "719d7ed992f83e69"
  - id: "BIP-0148"
    summary: "Proposes a user-activated soft fork (UASF) for SegWit: from August 1 to November 15, 2017, nodes that enforce this BIP reject any block that does not signal SegWit with bit 1, as long as SegWit is not locked in. Miners are thus pushed to lock in SegWit before its deployment expires."
    source_hash: "05e18812ffd87cbe"
    translation_hash: "f7b4b0352d0b4f88"
  - id: "BIP-0149"
    summary: "Provides for a second SegWit deployment in case the first, based on BIP-0009, expired on November 15, 2017 without activating. This deployment follows BIP-0008 with guaranteed lock-in: if miners do not reach the signaling threshold, SegWit locks in anyway at the deadline of July 4, 2018."
    source_hash: "7db7651c40b5d978"
    translation_hash: "777209d0ab027318"
  - id: "BIP-0150"
    summary: "Describes a way for two nodes to authenticate each other with public keys exchanged in advance through another channel, without an observer being able to identify the node. An operator can thus reserve certain services for trusted peers and detect a man-in-the-middle attack. This scheme relied on the encryption of BIP-0151 and was abandoned."
    source_hash: "3873eb07efc19e40"
    translation_hash: "99851766341e4e9d"
  - id: "BIP-0151"
    summary: "Proposes encrypting communications between Bitcoin nodes, with session keys derived from an ephemeral ECDH exchange, to make mass surveillance and traffic manipulation harder. BIP-0324 (version 2 P2P transport) replaced it."
    source_hash: "a366f1af2f0f955e"
    translation_hash: "780b79280c6ce094"
  - id: "BIP-0152"
    summary: "Defines compact block relay: instead of sending all the transactions of a new block again, a node transmits the header and short identifiers, since the peer already has most of these transactions in its mempool. The peer requests only the ones it is missing, which reduces bandwidth spikes when each block arrives."
    source_hash: "a093ac5bd468c4b0"
    translation_hash: "afc24f904295fa8a"
  - id: "BIP-0154"
    summary: "Proposes a denial-of-service countermeasure: a node can require a peer to solve a proof-of-work challenge before granting it a connection slot. Flooding the network with fake connections would thus become expensive. The proposal was abandoned."
    source_hash: "d5e91d6c99b9dc88"
    translation_hash: "8f08fc9b969a93b1"
  - id: "BIP-0155"
    summary: "Adds the `addrv2` P2P message, which relays node addresses longer than the 128 bits provided for by the `addr` message. In particular, it makes it possible to relay the 256-bit addresses of Tor v3 onion services and those of the I2P network."
    source_hash: "d7951c57b33555bc"
    translation_hash: "b50f73a84430fc25"
  - id: "BIP-0156"
    summary: "Proposes Dandelion, a routing scheme that hides the origin of transactions: a new transaction first follows a random path from node to node (the stem), then spreads to the whole network (the fluff). A spy observing the propagation has a much harder time linking the transaction to its sender's IP address."
    source_hash: "e820b00e0f756d72"
    translation_hash: "247284debf46bb9a"
  - id: "BIP-0157"
    summary: "Defines a protocol for light clients: they download from full nodes compact filters that summarize each block, then only the blocks that concern them, without revealing their addresses as with the Bloom filters of BIP-0037. A chain of filter headers makes it possible to spot a peer that serves fake filters."
    source_hash: "be35abd8b5765276"
    translation_hash: "0990868e1cdb11b2"
  - id: "BIP-0158"
    summary: "Specifies the construction of the compact block filters used by BIP-0157. The `basic` filter contains the output scripts created and spent in the block, compressed with Golomb-Rice coding, making it a more compact alternative to the Bloom filters of BIP-0037."
    source_hash: "ac5714419235d217"
    translation_hash: "a106eb00994c8d85"
  - id: "BIP-0159"
    summary: "Defines the `NODE_NETWORK_LIMITED` service bit, by which a pruned node announces that it can serve at least the last 288 blocks (about 2 days), if not the full history. Other nodes thus know they can connect to it for recent blocks."
    source_hash: "d16daf6f33d97e0d"
    translation_hash: "7d71e538d1d43f8d"
  - id: "BIP-0171"
    summary: "Defines a common interface for asking a server for bitcoin exchange rates: standardized HTTP GET requests and JSON responses. A wallet could thus display prices in fiat currency without writing dedicated code for each provider. The proposal was closed."
    source_hash: "d27233be49944c91"
    translation_hash: "d7496bd69502c821"
  - id: "BIP-0172"
    summary: "Proposes fixing the name of bitcoin's smallest unit (one hundred-millionth of a BTC): \"satoshi\", plural \"satoshis\", abbreviated \"sats\". The text builds on the model of the dollar and the cent: bitcoin remains the main unit, and the satoshi is used to express small amounts."
    source_hash: "ad9bc8152990dd07"
    translation_hash: "04f6c3a3c5fa3f0d"
  - id: "BIP-0173"
    summary: "Introduces `Bech32`, a base 32 encoding with a BCH checksum, and uses it for the addresses of native SegWit outputs (prefix `bc1` on mainnet). These addresses have a single letter case, take less space in a QR code, and detect typos better than `Base58check` addresses."
    source_hash: "9263bf09dcf545b0"
    translation_hash: "a391f62f0c77a84c"
  - id: "BIP-0174"
    summary: "Defines the PSBT, a binary format that carries an incomplete transaction with all the information a signer needs, as well as the signatures already applied. Several programs, hardware wallets, or multisig cosigners can thus pass the same transaction around to complete it, sign it, and finalize it, even offline."
    source_hash: "b76bdae99d1b742a"
    translation_hash: "b7570095ed2e400e"
  - id: "BIP-0175"
    summary: "Specifies a pay-to-contract key derivation scheme based on HD wallets (BIP-0032 and BIP-0043): the payment address is derived from the recipient's public key and the terms of a contract. The payment thus proves who is paid and for what, while the address looks like any other on the network."
    source_hash: "c32425f06d0cba7f"
    translation_hash: "b412d2bd77481af6"
  - id: "BIP-0176"
    summary: "Proposes the \"bit\" as the standard term for 100 satoshis, or one millionth of a bitcoin. With bitcoin above $10,000, small amounts expressed in BTC pile up decimals, whereas in bits they become simple numbers again, easy to read and compare."
    source_hash: "28cffaf5f01fbe23"
    translation_hash: "91f71ad63a038f18"
  - id: "BIP-0177"
    summary: "Proposes redefining the \"bitcoin\" unit so that it designates the smallest indivisible unit, the current satoshi. The current BTC would then be worth 100,000,000 bitcoin, and amounts would be displayed without decimals, as whole numbers, the way the Bitcoin ledger already represents them."
    source_hash: "9fc0851c2f53c46e"
    translation_hash: "92757a59d11fe535"
  - id: "BIP-0178"
    summary: "Extends the WIF format for private keys: the key's suffix also indicates the associated address type (P2PKH, P2SH-P2WPKH, P2WPKH, and so on). A wallet that imports the key then knows which addresses to watch, instead of having to track every possible type."
    source_hash: "dfe0130b0a1660a9"
    translation_hash: "100c03cc6bd84da6"
  - id: "BIP-0179"
    summary: "Proposes replacing the word \"address\" with \"invoice\" (Bitcoin Invoice Address, where \"Bitcoin\" and \"Address\" are optional). A Bitcoin address should be used only once, whereas the word \"address\" evokes something lasting, like a postal address or an email address."
    source_hash: "89dc9b5fc8a0b8ce"
    translation_hash: "08219861d9a8e739"
  - id: "BIP-0180"
    summary: "Defines a fraud proof that lets a light client detect a block exceeding the size or weight limit, without downloading the whole block. The goal was to prevent an invalid chain, for example one resulting from a miner-imposed hard fork that increases the block size, from deceiving light clients."
    source_hash: "63854f870f9b59b2"
    translation_hash: "4833d89e035132d9"
  - id: "BIP-0197"
    summary: "Describes collateral scripts for loans between two blockchains (Atomic Loans): the borrower locks bitcoin as collateral in two P2SH addresses, and the loan is paid out on another blockchain. Secrets revealed over the course of the contract and timeouts decide who recovers the collateral, depending on whether the loan is repaid, liquidated, or neither."
    source_hash: "8c37ef3fe26ae664"
    translation_hash: "c0c8684909dd686c"
  - id: "BIP-0199"
    summary: "Describes the HTLC (hashed time-locked contract), a script that lets a recipient spend funds by revealing the preimage of a hash, and returns the funds to the sender once a delay has passed. This mechanism is used in atomic swaps and in payment channels such as Lightning."
    source_hash: "e4e93c454e836d61"
    translation_hash: "8cb85d3048c9087b"
  - id: "BIP-0300"
    summary: "Defines hashrate escrows, the first building block of drivechains: bitcoin sent to a sidechain stays locked on the main chain, and each withdrawal is subject to a vote by miners. A withdrawal must gather 13,150 favorable votes over a window of 26,300 blocks (about 6 months), which makes it slow and visible to everyone."
    source_hash: "271f95257e1c8be6"
    translation_hash: "74458788c4f9f48d"
  - id: "BIP-0301"
    summary: "Defines blind merged mining: the users of a sidechain build its blocks themselves and pay Bitcoin miners to include their hash. The miner collects these bids in BTC without running the sidechain software, and the BIP ensures that it accepts only one bid per sidechain in each block."
    source_hash: "cd095b67e120067e"
    translation_hash: "148d3a3f459b7b68"
  - id: "BIP-0310"
    summary: "Defines a generic extension mechanism for Stratum, the protocol that connects mining machines to pools, with a new `mining.configure` message. The main extension described, version rolling, lets the machine vary certain bits of the `nVersion` field of the block header."
    source_hash: "40668b3bd18223e2"
    translation_hash: "07a97bb082fd3484"
  - id: "BIP-0320"
    summary: "Reserves 16 bits of the block header's `nVersion` field for free use, removing them from soft fork signaling through version bits. Miners can then use them, for example for ASICBoost, without nodes displaying false warnings about unknown soft forks."
    source_hash: "25f3e3ad1b6c4a81"
    translation_hash: "ba0e1257179ff577"
  - id: "BIP-0321"
    summary: "Replaces BIP-0021 to describe the `bitcoin:` URI scheme, used in payment links and QR codes. It documents recent address types and common query parameters, explains how to add new payment instructions, and proposes an optional proof-of-payment extension."
    source_hash: "4f2621a3856aabd0"
    translation_hash: "bfcf6c333d95f607"
  - id: "BIP-0322"
    summary: "Defines a message signature format based on Bitcoin Script: the signer signs a virtual transaction that spends an output of the address in question. The format works with any address type, not just P2PKH, to prove control of funds or to commit to a message as a recipient."
    source_hash: "9025389110cded5f"
    translation_hash: "0d9e94527937f744"
  - id: "BIP-0323"
    summary: "Reserves 24 bits of the block header's `nVersion` field as extra nonce space for miners, instead of the 16 bits of BIP-0320, which it replaces. Some mining devices were already running out of room and had started taking bits from the `nTime` field."
    source_hash: "190056bd80629e06"
    translation_hash: "3ce525a6678d8877"
  - id: "BIP-0324"
    summary: "Defines version 2 of the P2P transport: connections between nodes are opportunistically encrypted, which prevents a passive observer from reading the traffic and makes tampering with it harder. The protocol also saves a little bandwidth and allows future upgrades to be negotiated. It replaces BIP-0151."
    source_hash: "df8a43c2989d4004"
    translation_hash: "81b9bf73b5de7d3f"
  - id: "BIP-0325"
    summary: "Defines Signet, a type of test network where each block must provide, in addition to the proof of work, a valid solution to a script fixed when the network is created (often a signature). Blocks thus arrive at a regular pace, without the large reorganizations of testnet, which suits long-running tests between several teams."
    source_hash: "aefcece52fa4be04"
    translation_hash: "aea975c9ec55679e"
  - id: "BIP-0326"
    summary: "Recommends that wallets protect their Taproot transactions against fee sniping by using the `nSequence` field often in place of `nLockTime`. Ordinary spends then look like the settlement transactions of off-chain protocols that use a timelock (Lightning, CoinSwap, DLCs), which improves the privacy of those protocols."
    source_hash: "3fe0acd593114935"
    translation_hash: "ad30ff1786884722"
  - id: "BIP-0327"
    summary: "Standardizes MuSig2, a multisignature scheme where several signers create an aggregate public key and together produce an ordinary Schnorr signature, compatible with BIP-0340. On the blockchain, the spend looks like that of a single key. The scheme is n-of-n: all signers must take part."
    source_hash: "be82c0bb2b5efff9"
    translation_hash: "8d76f0fed8bfb0e0"
  - id: "BIP-0328"
    summary: "Explains how to build a BIP-0032 extended public key from a MuSig2 aggregate key (BIP-0327), with a fixed chain code. The cosigners then derive all their addresses from this single key, without redoing an aggregation for each new address."
    source_hash: "3c92546599864491"
    translation_hash: "2ae05f7656d8279f"
  - id: "BIP-0329"
    summary: "Defines an export format, in JSON Lines, for the labels a user attaches to the transactions, addresses, public keys, inputs, outputs, or xpubs of their wallet. These annotations, useful for accounting and privacy, can thus move from one program to another."
    source_hash: "face28f08bb79f6d"
    translation_hash: "1a3689747d8f5887"
  - id: "BIP-0330"
    summary: "Specifies the reconciliation of transaction announcements between two nodes, a building block of the Erlay relay protocol. Rather than announcing every transaction ID to every peer, two nodes regularly compare compact summaries of their lists so as to exchange only the differences. A node can thus open more connections at almost no bandwidth overhead."
    source_hash: "08e4e7a94faf714e"
    translation_hash: "11816e51e1ef8d87"
  - id: "BIP-0331"
    summary: "Adds P2P messages to request and relay, as a package, the unconfirmed ancestors of a transaction. A parent transaction whose fee is too low for a peer's mempool can thus propagate with a child that pays for it (CPFP), because the node evaluates the fee rate of the whole package."
    source_hash: "00d71b3130aae195"
    translation_hash: "7bb02b7e07316792"
  - id: "BIP-0332"
    summary: "Adds the optional `staletip` P2P message, by which a node announces to its peers the recent blocks that stayed off the active chain (stale blocks), along with their headers, and indicates whether it can provide those blocks. Their frequency says something about the state of block relay: slow propagation, a network partition, or selfish mining."
    source_hash: "7098ebfc91e802fd"
    translation_hash: "5390d826d1943d3f"
  - id: "BIP-0337"
    summary: "Defines a compressed serialization format that can shrink a Bitcoin transaction to less than half its size, by removing padding and predictable values. Compressing the references to spent outputs is optional, because it can lose information, but it is what brings the transaction below 70% of its original size."
    source_hash: "880682333b43dca3"
    translation_hash: "5cfcd3cc926fad1d"
  - id: "BIP-0338"
    summary: "Adds the `disabletx` P2P message, by which a node warns its peer that no transactions will flow over the connection. It formalizes block-relay-only connections, already in use on the network, so that nodes can accept more inbound connections. The proposal was closed."
    source_hash: "5c097484db239bb4"
    translation_hash: "72e9b356acfa95b9"
  - id: "BIP-0339"
    summary: "Lets nodes announce and request transactions by their `wtxid`, the identifier that includes the SegWit witness, instead of the `txid`. Since the witness can change without changing the `txid`, a node that had rejected one version of a transaction would otherwise have to redownload every announcement of the same `txid`. Peers enable this mode with the `wtxidrelay` message."
    source_hash: "26f2b97b7755926f"
    translation_hash: "c083834adf8cc3ac"
  - id: "BIP-0340"
    summary: "Standardizes 64-byte Schnorr signatures on the secp256k1 curve, with 32-byte (x-only) public keys. Compared with ECDSA, they come with a security proof, can be verified in batches, and make multisignatures and key aggregation easier. Taproot uses them (BIP-0341 and BIP-0342)."
    source_hash: "f81b4ce850eaf082"
    translation_hash: "4c1e5b77bdd975c3"
  - id: "BIP-0341"
    summary: "Defines Taproot, the SegWit version 1 output type, which is spent either with a Schnorr signature from a tweaked key (key path) or by revealing a script from a Merkle tree (script path). Unused scripts stay hidden, and a key path spend looks like an ordinary payment. Taproot has been active since block 709,632."
    source_hash: "21f8e256680df171"
    translation_hash: "870068c7d311e0f4"
  - id: "BIP-0342"
    summary: "Defines Tapscript, the execution rules for scripts spent through the script path of Taproot. Signature opcodes there verify Schnorr signatures, `OP_CHECKSIGADD` replaces `OP_CHECKMULTISIG`, several limits of the old Script disappear, and `OP_SUCCESS` opcodes are reserved to simplify future soft forks."
    source_hash: "8682065bea7ae30e"
    translation_hash: "f2b0e4f4951e3f35"
  - id: "BIP-0343"
    summary: "Proposes activating Taproot through BIP-0008 with `LOT=true`, meaning signaling with bit 2 starting at block 681,408, a 90% threshold, and mandatory signaling in the last period if Taproot is not locked in before block 760,032. Miners could thus not block its activation indefinitely. Taproot was ultimately activated by another method."
    source_hash: "517b85c90841835d"
    translation_hash: "184905261cf49d81"
  - id: "BIP-0345"
    summary: "Proposes two Tapscript opcodes, `OP_VAULT` and `OP_VAULT_RECOVER`, to create vaults: a withdrawal succeeds only after a delay, during which the funds can still be sent to a recovery path fixed in advance. If a key is stolen, the owner has time to react. BIP-0443 is proposed as a replacement."
    source_hash: "7bcca8b21b4bc990"
    translation_hash: "eadb9cd25b6dcd4d"
  - id: "BIP-0346"
    summary: "Proposes the Tapscript opcode `OP_TXHASH`, which pushes onto the stack the hash of selected fields of the spending transaction. Combined with an opcode such as `OP_CHECKSIGFROMSTACK`, it makes it possible to build every type of sighash, including those of BIP-0118, and to impose conditions on the spending transaction without interaction between the participants."
    source_hash: "f8729f8cb1f7e4a2"
    translation_hash: "f5b89b7b61b7bc22"
  - id: "BIP-0347"
    summary: "Proposes reactivating `OP_CAT` in Tapscript, by redefining `OP_SUCCESS126`. The opcode concatenates the top two stack elements, within a limit of 520 bytes. Disabled in 2010 along with 15 other opcodes, it would make it possible to verify Merkle trees in a script, or to build Lamport signatures or vaults."
    source_hash: "1dca1697a25ea9ae"
    translation_hash: "8f948ce6de5e0a15"
  - id: "BIP-0348"
    summary: "Proposes the Tapscript opcode `OP_CHECKSIGFROMSTACK`, which verifies a Schnorr signature on an arbitrary message taken from the stack, rather than on the transaction. Combined with `OP_CHECKTEMPLATEVERIFY` (BIP-0119), it makes it possible, among other things, to build Lightning Symmetry channels."
    source_hash: "4020e5cd61b201da"
    translation_hash: "58433c5071d908c4"
  - id: "BIP-0349"
    summary: "Proposes the Tapscript opcode `OP_INTERNALKEY`, which pushes onto the stack the internal key of the Taproot output being spent. A script can thus require a signature from that key, often aggregated among several signers, without copying it into the script, which saves 8 vB."
    source_hash: "aa0c8f81419f8ace"
    translation_hash: "a13fe26a579653ac"
  - id: "BIP-0350"
    summary: "Defines `Bech32m`, a variant of `Bech32` that fixes a weakness in its checksum: when a string ends in \"p\", inserting or deleting \"q\"s just before it does not invalidate it. SegWit version 1 and later addresses (Taproot, in `bc1p`) use `Bech32m`, while version 0 keeps `Bech32`."
    source_hash: "12d1d4938578663e"
    translation_hash: "5408c2f31f9cf376"
  - id: "BIP-0351"
    summary: "Proposes payment codes that the recipient can publish without losing privacy: the payer first sends a notification transaction (an `OP_RETURN` output), then both parties use ECDH to compute a series of addresses that only they know. The BIP fixes privacy flaws in the payment codes of BIP-0047. The proposal was closed."
    source_hash: "885def66878bf00a"
    translation_hash: "a716b487a1590b0a"
  - id: "BIP-0352"
    summary: "Defines Silent Payments: the recipient publishes a static address, and each payer derives from it, through ECDH with the keys of their own inputs, a unique address that nothing publicly links to the static address. There is no interaction and no notification transaction, but the recipient must scan the blockchain's transactions to find their payments."
    source_hash: "f3255ca974dce40d"
    translation_hash: "c9ae657566bbc73b"
  - id: "BIP-0353"
    summary: "Defines how to publish Bitcoin payment instructions (a BIP-0021 URI) in a DNS TXT record signed with DNSSEC. A wallet can thus pay a human-readable identifier such as `alice@example.com`, which it resolves by querying `alice.user._bitcoin-payment.example.com`."
    source_hash: "7cd1f85312a37219"
    translation_hash: "8093080b5cb710e7"
  - id: "BIP-0360"
    summary: "Proposes, through a soft fork, a new output type, P2MR (Pay-to-Merkle-Root): an equivalent of Taproot with no key path spend, committing only to the root of a script tree. No public key appears in the output, which protects it from long-exposure quantum attacks on elliptic curve cryptography."
    source_hash: "2d798abaabcd23fc"
    translation_hash: "d04e134da3199815"
  - id: "BIP-0361"
    summary: "Provides, once a post-quantum output type is adopted, for the scheduled retirement of ECDSA and Schnorr signatures in two phases. The first forbids sending funds to addresses vulnerable to quantum computers; the second, on an announced date five years after activation, allows these coins to be spent only through a quantum-resistant rescue protocol."
    source_hash: "d406c2004cbaf136"
    translation_hash: "be4a40d3dbdf3c82"
  - id: "BIP-0370"
    summary: "Defines version 2 of the PSBT, which allows inputs and outputs to be added or removed after the transaction is created, something version 0 of BIP-0174 did not allow. Several participants can thus build the same transaction before signing it, each adding their own inputs and outputs."
    source_hash: "f6eb307058cfc54e"
    translation_hash: "b31f9d1059a51dd6"
  - id: "BIP-0371"
    summary: "Adds to the PSBT format (versions 0 and 2) the fields specific to Taproot: internal key, leaf scripts and paths in the tree, Schnorr signatures. A hardware wallet or another signer thus has everything it needs to sign a Taproot input."
    source_hash: "6099300cbd2805a3"
    translation_hash: "2e70f552ab89d44f"
  - id: "BIP-0372"
    summary: "Adds to the PSBT format fields for pay-to-contract (P2C) tweaks, when a public key has been modified to commit to a message. The signer, often an external device, thus knows which tweak to apply to the original private key to produce a valid signature."
    source_hash: "892c27692d13870f"
    translation_hash: "29c95a690b42e95f"
  - id: "BIP-0373"
    summary: "Adds to the PSBT format the fields needed for MuSig2 (BIP-0327): participant keys, public nonces, and partial signatures. The cosigners can thus run through the two rounds of the protocol by passing the PSBT around."
    source_hash: "47ae50f2f0496f19"
    translation_hash: "1fe78bdf2ad2df1c"
  - id: "BIP-0374"
    summary: "Standardizes 64-byte discrete log equality (DLEQ) proofs: the prover shows that the same private key was used for two points on the curve, without revealing anything about that key. They are used, for example, to prove that an ECDH secret was computed correctly, as required to send Silent Payments from a signing device."
    source_hash: "4a7a47e40e3ba227"
    translation_hash: "8f4927dc815cbe87"
  - id: "BIP-0375"
    summary: "Adds to PSBT version 2 the fields and rules needed to pay a Silent Payments address (BIP-0352). The output script can be computed only once all the inputs are known, and each signer provides its share of the ECDH secret along with a DLEQ proof (BIP-0374), so that the other participants can verify the output."
    source_hash: "c53c295d152bb7d0"
    translation_hash: "d2b14bd4d4ddb759"
  - id: "BIP-0376"
    summary: "Adds to PSBT version 2 per-input fields that carry the tweak of received Silent Payments outputs. The signer can thus spend these outputs, which BIP-0374 and BIP-0375, devoted to sending, do not provide for."
    source_hash: "097d68c2621e474e"
    translation_hash: "6c33cbb208fc6c21"
  - id: "BIP-0379"
    summary: "Specifies Miniscript, a language that writes a subset of Bitcoin scripts in a structured, composable way, from signatures, hash locks, and timelocks. Software can then analyze a script, combine spending conditions, compute the maximum witness size, and sign generically."
    source_hash: "d43d33edfd158202"
    translation_hash: "2013babecb5fd2e5"
  - id: "BIP-0380"
    summary: "Defines the general operation of output script descriptors, a language that describes a set of output scripts: syntax, checksum, and key expressions. Backing up a descriptor lets a restored wallet find all its scripts and addresses, something that private keys or the mnemonic phrase alone cannot guarantee."
    source_hash: "ff5da50707bd11c6"
    translation_hash: "8c972b9c7d4559e6"
  - id: "BIP-0381"
    summary: "Specifies the `pk()`, `pkh()`, and `sh()` descriptors, which describe the three standard script formats from before SegWit: P2PK, P2PKH, and P2SH."
    source_hash: "0c8dc401a03639b5"
    translation_hash: "878a56eba11ae729"
  - id: "BIP-0382"
    summary: "Specifies the `wpkh()` and `wsh()` descriptors, which describe the SegWit version 0 scripts P2WPKH and P2WSH, alone or nested in an `sh()`."
    source_hash: "763d7cacac2bdcbe"
    translation_hash: "c448afea1968956c"
  - id: "BIP-0383"
    summary: "Specifies the `multi()` and `sortedmulti()` descriptors, which describe a threshold multisig script (k keys out of n). `sortedmulti()` sorts the public keys in lexicographic order in the resulting script, so the order given in the descriptor no longer matters."
    source_hash: "ad8f2033d0d57c37"
    translation_hash: "762ec99386e80ea4"
  - id: "BIP-0384"
    summary: "Specifies the `combo()` descriptor, which produces from a single key all the scripts a classic wallet used to watch: P2PK and P2PKH, plus P2WPKH and P2SH-P2WPKH if the key is compressed. It eases the move from old key-based wallets to descriptor wallets."
    source_hash: "6d873040ff31f486"
    translation_hash: "0310c1511560a48f"
  - id: "BIP-0385"
    summary: "Specifies the `raw()` and `addr()` descriptors, which wrap, respectively, an arbitrary output script written in hexadecimal and an address. Any script or address in use can thus be expressed as a descriptor."
    source_hash: "22410216f3c40708"
    translation_hash: "d447c95ec8f71c4e"
  - id: "BIP-0386"
    summary: "Specifies the `tr()` descriptor, which describes a Taproot (P2TR) output from an internal key and, optionally, a script tree."
    source_hash: "a41cbbf5a6958468"
    translation_hash: "3c79f43f5ff5b660"
  - id: "BIP-0387"
    summary: "Specifies the `multi_a()` and `sortedmulti_a()` descriptors, equivalents of `multi()` and `sortedmulti()` for Tapscript: they produce a threshold multisig script usable only in a Taproot leaf."
    source_hash: "da903073d4a39207"
    translation_hash: "01a8a398f4c41df0"
  - id: "BIP-0388"
    summary: "Defines wallet policies, a simplified form of descriptors designed for signing devices with limited resources. A compact script template, separate from the list of keys, describes a whole account (receiving and change addresses), which the user can review and register on their hardware wallet."
    source_hash: "b8ec79c05324efc9"
    translation_hash: "f78f85f6129630fe"
  - id: "BIP-0389"
    summary: "Lets a descriptor's key expression contain a derivation step with several values, written for example as `<0;1>`. A single descriptor then describes both the receiving and the change addresses, which until now required two nearly identical descriptors."
    source_hash: "5cc376e5d8338887"
    translation_hash: "e835e75d4510ad5f"
  - id: "BIP-0390"
    summary: "Defines the `musig()` key expression for descriptors: it aggregates several keys into a MuSig2 public key (BIP-0327). A wallet can thus describe, for example inside a `tr()`, an output whose key is shared among several signers."
    source_hash: "1f16dbc621bcd7d0"
    translation_hash: "f58c5da845af796c"
  - id: "BIP-0391"
    summary: "Proposed a compact binary format to carry a descriptor with its metadata (name, creation block, and so on), based on the key-value maps of the PSBT (BIP-0174). A textual descriptor has neither a machine-recognizable header nor metadata, and its base58 keys take up space. The proposal is closed, with BIP-0393 proposed as a replacement."
    source_hash: "77f58dfdf7c0cac4"
    translation_hash: "18052e191212465e"
  - id: "BIP-0392"
    summary: "Specifies the `sp()` descriptor for Silent Payments (BIP-0352), with two new key expressions, `spscan` and `spspend`. A wallet can thus back up and restore Silent Payments outputs with the existing descriptor tooling."
    source_hash: "3f38d7c19116c69f"
    translation_hash: "d1f93934c5877bff"
  - id: "BIP-0393"
    summary: "Adds to descriptors an optional annotation syntax: key-value pairs written like URL parameters (`?`, `&`, `=`). They carry information useful for restoration, such as the block height at which to start scanning the blockchain or the gap limit, without changing the scripts produced."
    source_hash: "2e51be0b45d42bff"
    translation_hash: "ffd8d965d7b18926"
  - id: "BIP-0431"
    summary: "Describes the pinning problems that prevent a transaction from being accelerated, and a mempool policy that limits them: version 3 transactions, known as TRUC, are replaceable and can have only one unconfirmed ancestor and one unconfirmed descendant. Fee bumping becomes more reliable, which benefits protocols such as Lightning."
    source_hash: "e65c1811f6d2df83"
    translation_hash: "33aba10a5a2b1390"
  - id: "BIP-0433"
    summary: "Defines P2A (Pay to Anchor), a standard output that anyone can spend without a signature or witness, with the script `OP_1 <0x4e73>`. It is an attachment point for the pre-signed transactions of layer 2 protocols, such as Lightning: any participant can attach a child transaction to it to bump its fee (CPFP)."
    source_hash: "5d58f09cc1a065bc"
    translation_hash: "2e71389ad1892450"
  - id: "BIP-0434"
    summary: "Adds the `feature` P2P message, exchanged between the `version` and `verack` messages, to announce and negotiate support for new network features. An implementation can thus add a feature without increasing the protocol version number, which would have to be coordinated with the other implementations."
    source_hash: "15455f212d1d74c4"
    translation_hash: "f2c83cfbb57296ae"
  - id: "BIP-0440"
    summary: "Defines an operations budget, the varops budget, which extends to operations other than signatures the sigops budget of BIP-0342. Each opcode consumes a share of the budget according to the number of bytes it handles, which bounds a script's computation time and lets other BIPs relax the current limits of Script."
    source_hash: "07a8fdacd13ea0ec"
    translation_hash: "0792e1926e959da0"
  - id: "BIP-0441"
    summary: "Introduces a new Taproot leaf version (`0xc2`) that gives Script back its capabilities from before version 0.3.1: disabled opcodes are reenabled, stack elements can be up to 4,000,000 bytes, and numbers are no longer limited to 32 bits. The operations budget of BIP-0440 prevents the excessive computation behind the CVE-2010-5137 vulnerability."
    source_hash: "3a1d8914cd55e43b"
    translation_hash: "cd8830c21e19b223"
  - id: "BIP-0442"
    summary: "Proposes the Tapscript opcode `OP_PAIRCOMMIT`, which replaces the top two stack elements with a tagged hash of the pair. A script can thus commit to several elements with a single hash, for example to a Merkle tree of preimages, and have that commitment signed with `OP_CHECKSIGFROMSTACK`."
    source_hash: "644589023016c797"
    translation_hash: "98cc8f58377f87fe"
  - id: "BIP-0443"
    summary: "Proposes the Tapscript opcode `OP_CHECKCONTRACTVERIFY` (`OP_CCV`), which commits data into the Taproot key of an output and can constrain the internal key, the script tree, and the data of the outputs of the spending transaction. It enables covenants such as vaults, or the sharing of a UTXO among several users, as in Ark."
    source_hash: "271e29efc11198d8"
    translation_hash: "3bbc7c03e5bc5436"
  - id: "BIP-0446"
    summary: "Proposes the Tapscript opcode `OP_TEMPLATEHASH`, which pushes onto the stack a hash of the transaction that spends the output. A script can thus commit in advance to its spending transaction, without a pre-signed transaction, which reduces the exchanges between participants in layer 2 protocols such as Lightning, Ark, or LN-Symmetry."
    source_hash: "04f60af1e9c882ef"
    translation_hash: "2eb37b616b443e26"
  - id: "BIP-0448"
    summary: "Proposes deploying three Tapscript opcodes together: `OP_TEMPLATEHASH` (BIP-0446), `OP_CHECKSIGFROMSTACK` (BIP-0348), and `OP_INTERNALKEY` (BIP-0349). Combined, they enable \"rebindable\" transactions, which improve existing layer 2 protocols, such as LN-Symmetry, and make others possible."
    source_hash: "045d58708e0740c0"
    translation_hash: "b1206d9e6ee4102c"
  - id: "BIP-0449"
    summary: "Proposes the Tapscript opcode `OP_TWEAKADD`, which takes an x-only public key $P$ and an integer $t$, and pushes the key $P + tG$ onto the stack. A script can thus reproduce the key tweak used by Taproot and verify its result, without revealing a private key or relying on hash locks."
    source_hash: "5915ac3cedb9fe01"
    translation_hash: "42bf97be223e761c"
  - id: "BIP-0450"
    summary: "Describes Formosa, an extension of BIP-0039: each 33-bit block of entropy becomes a short sentence on a theme, built from small lists of typed words, instead of three unrelated words. The mnemonic phrase becomes easier to memorize and stays compatible with BIP-0039, which is itself a Formosa theme."
    source_hash: "89a6bbfb229a701c"
    translation_hash: "46866188535ac9a0"
  - id: "BIP-0451"
    summary: "Defines a protocol for getting rid of dust UTXOs received in an attack: the wallet spends them to an `OP_RETURN` output, leaving their entire value as fees, without mixing them with its other coins. An `ALL|ANYONECANPAY` signature lets a third party batch several of these spends into the same transaction."
    source_hash: "d3b4d300789a6163"
    translation_hash: "d7c6cc68c3cff87b"
  - id: "BIP-0461"
    summary: "Specifies an ECDSA signing algorithm whose output depends only on the private key and the message, with a signature of at most 70 bytes in DER. A signer, for example a hardware wallet, has no freedom left to hide fragments of its key in its signatures. Bitcoin Core has produced this type of signature since version 0.17.0."
    source_hash: "79fcb369e831d52c"
    translation_hash: "967907506b48b719"
