# bLIP: Bitcoin Lightning Improvement Proposals, English summaries.
# Translation of specifications/fr/blip.yaml: only the summaries; every other field lives there.

entries:
  - id: "bLIP-0001"
    summary: "Founding document that defines what a bLIP is and how to move one forward, from a draft discussed on the lightning-dev list to the Proposed, Active, or Final statuses. It also draws the line with the BOLTs: a feature meant to become universal on the Lightning Network must go through a BOLT."
    source_hash: "589b99d880365f8d"
    translation_hash: "5cf627362d34293a"
  - id: "bLIP-0002"
    summary: "Registry of the values reserved by bLIPs: feature bits above 255, message types between 32,768 and 65,535, and TLV fields added to BOLT messages and onion messages. It prevents two unrelated bLIPs from using the same value, which could split the network in two."
    source_hash: "1ce54bc99bf5725d"
    translation_hash: "75bc2112926f68b9"
  - id: "bLIP-0003"
    summary: "Specification of keysend, a spontaneous payment that needs no invoice. The sender picks a random 32-byte preimage, places it in a TLV field of the onion (type `5482373484`), and uses its `SHA256` hash as the payment hash; the recipient finds the preimage there, which lets it claim the payment."
    source_hash: "786097428bfbe748"
    translation_hash: "08bf23229925f804"
  - id: "bLIP-0004"
    summary: "Experiment in HTLC endorsement signaling, to prepare a defense against channel jamming. Each HTLC carries a one-byte `endorsed` TLV field (7 if endorsed, 0 otherwise) that nodes relay without using it to make decisions, to collect data for reputation algorithms. The experiment is set to end on January 1, 2026."
    source_hash: "401f64fb24394711"
    translation_hash: "d4e032527e4583fb"
  - id: "bLIP-0010"
    summary: "Format of the metadata that Podcasting 2.0 apps attach to their keysend payments: a JSON object placed in the `7629169` TLV field, naming the podcast, the episode, and the listening time. It covers streams, paid for each minute of listening, and boosts, manual payments that can carry a message called a boostagram."
    source_hash: "8f970e95b023d0c1"
    translation_hash: "48374e7651980313"
  - id: "bLIP-0011"
    summary: "Convention that puts the recipient's name at the start of a BOLT-11 invoice description, followed by a colon and two spaces. A compatible wallet displays this name separately, and a wallet that ignores the convention simply shows the whole description."
    source_hash: "cac4616fb90a81eb"
    translation_hash: "0eb7a939c5f0c5aa"
  - id: "bLIP-0017"
    summary: "Specification of hosted channels, channels without an on-chain transaction where the client trusts the host that holds the funds. Both parties sign every channel state, which makes balances verifiable, but the client cannot force a settlement on the blockchain. The model sits between a custodial wallet and a true Lightning channel."
    source_hash: "3da62c1ea2986fae"
    translation_hash: "08840d4cf5cd3419"
  - id: "bLIP-0025"
    summary: "Extension that lets the second-to-last hop forward less than the amount planned in the onion, by declaring the fee it takes in the `extra_fee` TLV field of `update_add_htlc`. The recipient rejects the HTLC if it did not expect this fee or if it is too high. The typical case is an LSP that opens a just-in-time channel and pays itself from the first payment."
    source_hash: "881f54a452d236d4"
    translation_hash: "849578950c994c9e"
  - id: "bLIP-0032"
    summary: "Protocol for DNS resolution through onion messages. A node sends a `dnssec_query` for a domain name and gets back a `dnssec_proof` with the TXT records and their DNSSEC proof, without contacting a DNS server itself. It is mainly used to turn a `user@domain` address (BIP-0353) into payment instructions."
    source_hash: "799c2a667401b0fd"
    translation_hash: "82bb3452da1cca60"
  - id: "bLIP-0039"
    summary: "Extension that adds a tagged field `b` to BOLT-11 invoices, carrying one or more blinded payment paths. The recipient thus benefits from the blinded paths of BOLT-04 without waiting for the whole network to support BOLT-12 offers."
    source_hash: "7a1223857145670d"
    translation_hash: "d760e695b9e79c8c"
  - id: "bLIP-0042"
    summary: "Extension that adds contact information to a BOLT-12 payment, in TLV fields of the `invoice_request`. The recipient recognizes a known contact or adds the payer to its contacts, and can pay it back with no further exchange using the offer or the BIP-0353 name that the payer reveals."
    source_hash: "b4dc6af9347edb83"
    translation_hash: "d6f9628f3035e6eb"
  - id: "bLIP-0050"
    summary: "Transport layer shared by the LSPS specifications between a Lightning service provider (LSP) and its clients. JSON-RPC 2.0 requests travel over the already open BOLT-08 connection, in messages of type `37913`, and the document fixes the common formats (amounts, fees, addresses, signatures) that LSPS1, LSPS2, and LSPS5 reuse."
    source_hash: "8d3e961dd6a44ae2"
    translation_hash: "40a4d7ef01f5a6ef"
  - id: "bLIP-0051"
    summary: "API by which a wallet buys a channel from an LSP. The client checks the terms with `lsps1.get_info`, places an order with `lsps1.create_order` (capacity, duration, balance on each side), then pays by BOLT-11 invoice, BOLT-12 offer, or on-chain transaction; if the opening fails, the LSP refunds it."
    source_hash: "4cb15702586cfd94"
    translation_hash: "2a0e714d0102d525"
  - id: "bLIP-0052"
    summary: "Protocol for negotiating just-in-time (JIT) channels: when a payment arrives for a client that has no channel yet, the LSP opens the channel at that moment and withholds the cost of the inbound liquidity from this first payment. The client first checks the fees with `lsps2.get_info`, then requests the channel with `lsps2.buy`."
    source_hash: "222e5eb81fa05a0a"
    translation_hash: "756af367e1eef431"
  - id: "bLIP-0055"
    summary: "Protocol for registering webhooks with an LSP, to wake up a mobile app that the system has suspended. The client declares a URL with `lsps5.set_webhook`, and the LSP calls it with a notification signed by its node key when a payment arrives, when an HTLC nears its expiry, or when an onion message is waiting."
    source_hash: "a45491cd49ca89fc"
    translation_hash: "e54c043cdd1893d2"
