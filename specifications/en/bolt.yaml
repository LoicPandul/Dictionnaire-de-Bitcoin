# BOLT: Basis of Lightning Technology, English summaries.
# Translation of specifications/fr/bolt.yaml: only the summaries; every other field lives there.

entries:
  - id: "BOLT-00"
    summary: "Entry document of the BOLT specifications (Basis of Lightning Technology). It introduces how the Lightning Network works (channels, conditional payments, routing, invoices), gives the index of the other BOLTs, and sets the glossary shared by the whole series."
    source_hash: "5d7cad98a596124f"
    translation_hash: "9573cd541faf17be"
  - id: "BOLT-01"
    summary: "Specification of the base messaging protocol between two Lightning nodes. It sets the message format and the TLV (Type-Length-Value) encoding, then describes the messages that open and maintain a connection between peers: `init`, `error`, `warning`, `ping`, and `pong`."
    source_hash: "286aa7f82e28a7fd"
    translation_hash: "0746f287136d3c19"
  - id: "BOLT-02"
    summary: "Specification of the exchange between the two peers of a channel, from opening to closing. It covers opening with a single funder or with two through interactive transaction construction, adding and settling HTLCs, channel quiescence, splicing, and cooperative close."
    source_hash: "0ca7eaa71dfd0d47"
    translation_hash: "75dbadabce483a5c"
  - id: "BOLT-03"
    summary: "Specification of the exact formats of a channel's Bitcoin transactions and scripts: the 2-of-2 multisig funding output, the commitment transactions, and the HTLC transactions. It also fixes key derivation, fee calculation, and dust limits, so that both parties sign exactly the same transactions."
    source_hash: "dd4a3389ffb93fb0"
    translation_hash: "93e663a2268b4d38"
  - id: "BOLT-04"
    summary: "Specification of onion routing. The sender encrypts the instructions for each hop in a fixed-size packet, so an intermediate node knows only the previous hop and the next one. The document also covers blinded paths, onion messages, and the encrypted return of errors."
    source_hash: "5fa911e6e6f18bbf"
    translation_hash: "8070c30dc07c74f1"
  - id: "BOLT-05"
    summary: "Specification of what a node must do when a channel settles on-chain, after a cooperative close, a unilateral close, or the publication of an old revoked state. It details how to recover each output, how long to watch the blockchain, and how to punish fraud with a penalty transaction."
    source_hash: "c1674b20feed2c18"
    translation_hash: "528f7cbb009702ac"
  - id: "BOLT-06"
    summary: "Former specification for interim discovery of nodes and channels through an IRC channel on the Freenode network, pending a peer-to-peer mechanism. The document left the repository in October 2017 and its number was not reassigned: node and channel discovery is now covered by BOLT-07."
    source_hash: "f9f72e5742d10828"
    translation_hash: "54b0ef526fb9d60a"
  - id: "BOLT-07"
    summary: "Specification of gossip, the peer-to-peer protocol by which nodes discover the network. The `channel_announcement`, `node_announcement`, and `channel_update` messages announce channels, nodes, and their routing conditions; queries synchronize this map and remove stale channels from it."
    source_hash: "d12115d4ceead979"
    translation_hash: "a437dae4ce9c2644"
  - id: "BOLT-08"
    summary: "Specification of the encrypted and authenticated transport layer between two nodes. It relies on the Noise protocol: a three-act handshake, for which the initiator must already know the responder's public key, produces the session keys that then encrypt every message."
    source_hash: "ba3aae9a6961a673"
    translation_hash: "bce773ecde56b4bb"
  - id: "BOLT-09"
    summary: "Registry of feature bits, the flags by which a node announces the features it supports, in `init`, in node and channel announcements, or in BOLT-11 invoices. Each feature occupies a pair of bits: the odd bit signals it as optional, the even bit as required."
    source_hash: "c733ec89266fd789"
    translation_hash: "ee9eb993f4edf1af"
  - id: "BOLT-10"
    summary: "Specification of the Lightning Network's DNS seeds. A node that starts up with no known peers queries them with `A`, `AAAA`, or `SRV` requests to get a random sample of peers, or to find the current address of a node it already knows."
    source_hash: "ce499c8761e46991"
    translation_hash: "368843753fcc5244"
  - id: "BOLT-11"
    summary: "Format of Lightning invoices, encoded in `Bech32` to fit in a QR code. An invoice states the network and an optional amount, carries tagged fields (payment hash, payment secret, description, expiry, routing hints), and ends with the recipient's signature."
    source_hash: "77c99c20170702e1"
    translation_hash: "a636d8a4651b3021"
  - id: "BOLT-12"
    summary: "Payment protocol based on offers, static and reusable payment requests. The payer gets a fresh invoice for each payment by sending an `invoice_request` in an onion message, and the recipient can hide its node behind blinded paths. The document also covers refunds and proofs of payment."
    source_hash: "e6cc13c12c150139"
    translation_hash: "c2d010ebe8e55374"
