# Parties du livre et catégories de chaque partie (édition 2027).
#
# La partie d'une définition se déduit de sa catégorie : chaque catégorie de
# categories.yaml est rangée dans une seule partie ci-dessous. `pictogram` est le nom
# du fichier de assets/pictograms/ (sans extension) imprimé à côté de la catégorie.
# `letter_pages` : une page entière par lettre (sinon un intertitre).

parts:
  - id: technique
    title: "Dictionnaire technique"
    letter_pages: true
    categories:
