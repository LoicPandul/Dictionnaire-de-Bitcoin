# Liste des catégories de définitions du glossaire
categories:
  # Les définitions des attaques et vulnérabilités associées à Bitcoin, ou à des
  # concepts connexes.
  - ATTAQUE

  # Uniquement les définitions relatives aux Bitcoin Improvement Proposals (BIP).
  - BIP

  # Tout ce qui concerne l'organisation des humains autour de Bitcoin.
  - COMMUNAUTÉ

  # L'ensemble des définitions traitant de la protection de la vie privée au sein
  # de l'écosystème Bitcoin. Elle inclut les protocoles et les techniques (tels que
  # coinjoin) conçus pour améliorer la confidentialité des transactions, mais
  # n'inclut pas les logiciels et portefeuilles qui seront dans la catégorie
  # « Outil ».
  - CONFIDENTIALITÉ

  # Toutes les définitions associées aux systèmes de seconde couche qui ne relèvent
  # pas des sidechains, de RGB ou du Lightning Network.
  - COUCHE SUPÉRIEURE

  # Toutes les définitions liées aux principes et techniques cryptographiques
  # appliqués en général, en dehors des cas spécifiques liés aux portefeuilles. Elle
  # aborde ainsi les algorithmes, les protocoles de chiffrement et les méthodes de
  # signature.
  - CRYPTOGRAPHIE

  # Toutes les définitions relatives aux aspects économiques, politiques,
  # réglementaires et légaux influant sur Bitcoin.
  - ÉCONOMIE ET RÉGULATION

  # Les définitions des événements et concepts historiques propres à Bitcoin. Elles
  # couvrent l'évolution, les faits marquants et les figures
  # emblématiques qui ont contribué à son développement. Les définitions avec des
  # noms de personnes ou des pseudos se trouveront ici.
  - HISTOIRE

  # L'ensemble des définitions relatives aux concepts informatiques généraux qui ne
  # sont pas spécifiquement liés à Bitcoin, tout en excluant celles relevant de la
  # catégorie « Cryptographie ». Elle couvre donc des notions techniques et
  # théoriques en informatique qui enrichissent la compréhension globale de
  # l'écosystème Bitcoin.
  - INFORMATIQUE

  # Tous les termes propres au Lightning Network, notamment les mécanismes de canaux
  # de paiement, la gestion des transactions hors chaîne et les innovations
  # techniques spécifiques à Lightning. Les définitions des noms de portefeuilles ou
  # logiciels dédiés au Lightning Network sont classées dans la catégorie « Outil ».
  - LIGHTNING NETWORK

  # L'ensemble des termes se rapportant au minage sur Bitcoin en dehors du
  # protocole, c'est-à-dire aux infrastructures associées (fermes, pools, ASICs,
  # etc.).
  - MINAGE

  # Entreprises et associations travaillant sur Bitcoin.
  - ORGANISATION

  # L'ensemble des logiciels, matériels et implémentations techniques qui ne
  # trouvent pas leur place dans les autres catégories. Elle comprend par exemple les
  # portefeuilles logiciels, les hardware wallets et autres outils d'analyse ou de
  # gestion utilisés dans l'écosystème Bitcoin.
  - OUTIL

  # Les définitions concernant les portefeuilles Bitcoin et les mécanismes de
  # dérivation de clés. Les termes désignant les noms de logiciels de portefeuilles
  # et les hardware wallets seront traités dans la catégorie « Outil ».
  - PORTEFEUILLE

  # L'ensemble des définitions se rapportant exclusivement au protocole Bitcoin dans
  # son ensemble. Elle exclut toutefois les définitions associées aux couches
  # supérieures (telles que RGB, sidechains, Lightning, etc.), aux portefeuilles,
  # ainsi qu'au réseau Bitcoin.
  - PROTOCOLE

  # Toutes les définitions spécifiques au protocole RGB.
  - RGB

  # Toutes les définitions liées à la partie réseau de Bitcoin.
  - RÉSEAU

  # Toutes les définitions concernant le langage Script utilisé sur Bitcoin, ce qui
  # inclut notamment les définitions d'opcodes, les spécificités du langage Script
  # et de ses variantes, telles que Miniscript.
  - SCRIPT

  # Les termes relatifs aux sidechains, notamment Liquid et les drivechains.
  - SIDECHAIN
