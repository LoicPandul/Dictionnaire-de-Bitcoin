# Termes en attente de définition
#
# Ce fichier liste les termes qui n'ont pas encore de définition dans le
# dictionnaire, mais qui sont prévus pour une integration future.
# Consultez cette liste avant de soumettre une issue pour eviter les doublons.
#
# Format :
#   - term: "NOM DU TERME"          # obligatoire, en majuscules
#     category: "CATEGORIE"          # optionnel, voir categories.yaml
#     note: "precision facultative"  # optionnel, contexte ou remarque

pending_terms:
  - term: "1P1C"
    category: "MEMPOOL ET FRAIS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé 1p1c-one-parent-one-child. Relais d'un parent à faibles frais avec son enfant, depuis Bitcoin Core 28.0 et étendu en 30.0."
  - term: "ACCUMULATEUR CRYPTOGRAPHIQUE"
    category: "CRYPTOGRAPHIE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé accumulateur. Structure qui résume un ensemble et prouve l'appartenance (Utreexo, MuHash)."
  - term: "AGRÉGATION DE SIGNATURES"
    category: "CRYPTOGRAPHIE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé agregation-de-signatures. Agrégation partielle ou complète de signatures Schnorr, avec un brouillon de BIP en 2026."
  - term: "ATTAQUE DES ANNIVERSAIRES"
    category: "ATTAQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé attaque-des-anniversaires. Attaque générique sur les fonctions de hachage, citée à propos de MuHash."
  - term: "ATTAQUE PAR CANAL AUXILIAIRE"
    category: "ATTAQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé attaque-par-canal-auxiliaire. Attaque qui exploite le temps de calcul ou la consommation d'un appareil de signature."
  - term: "ATTRIBUTABLE FAILURES"
    category: "PAIEMENTS LIGHTNING"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé attributable-failures. Messages d'erreur Lightning qui désignent le nœud responsable d'un échec de paiement."
  - term: "BITCOIN STACK EXCHANGE"
    category: "COMMUNAUTÉ ET FONDATION"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé bitcoin-stack-exchange. Site de questions et réponses dont Optech publie une sélection régulière."
  - term: "BITVM2"
    category: "ROLLUPS ET BITVM"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé bitvm2. Version de BitVM utilisée par le *bridge* Strata (2025)."
  - term: "BLOCKSONLY"
    category: "FONCTIONNEMENT DU NŒUD"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé blocksonly. Mode de nœud qui ne relaie pas les transactions."
  - term: "BRIDGE"
    category: "ROLLUPS ET BITVM"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé bridge. Mot courant pour les liaisons vers les surcouches (BitVM, Citrea)."
  - term: "CANAL ZERO-CONF"
    category: "LIGHTNING NETWORK"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé zero-conf-channel. Canal utilisable avant que sa transaction d'ouverture soit confirmée."
  - term: "CHAIN CODE DELEGATION"
    category: "PORTEFEUILLE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé chain-code-delegation. Mécanisme de 2025 pour les multisig avec un cosignataire qui ne voit pas les transactions."
  - term: "CHILLDKG"
    category: "CRYPTOGRAPHIE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé chilldkg. Protocole de génération de clés distribuée pour FROST, en brouillon de BIP depuis 2024."
  - term: "CHUNK"
    category: "MEMPOOL ET FRAIS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé chunk. Groupe de transactions d'un cluster triées ensemble par taux de frais dans Bitcoin Core 31.0."
  - term: "CIRCUITS BROUILLÉS"
    category: "CRYPTOGRAPHIE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé garbled-circuits. Technique cryptographique derrière les « garbled locks » et les contrats de type BitVM."
  - term: "CLÉ INTERNE"
    category: "SCRIPT"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé internal-key. Clé de départ d'une sortie Taproot avant le *tweak*."
  - term: "CLÉ NUMS"
    category: "CRYPTOGRAPHIE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé nums-nothing-up-my-sleeve. Clé publique sans clé privée connue, qui désactive le *key path* Taproot."
  - term: "CLTV EXPIRY DELTA"
    category: "PAIEMENTS LIGHTNING"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé cltv-expiry-delta. Marge de temps qu'un nœud Lightning réserve à chaque saut."
  - term: "COMPATIBILITÉ INCITATIVE"
    category: "MEMPOOL ET FRAIS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé compatibilite-incitative. Principe qui guide les règles de mempool et de RBF : un mineur doit gagner à les suivre."
  - term: "CPFP CARVE-OUT"
    category: "MEMPOOL ET FRAIS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé cpfp-carve-out. Exception de mempool utilisée par Lightning, retirée dans Bitcoin Core 31.0 au profit de TRUC et de la *sibling eviction*."
  - term: "CVE"
    category: "INFORMATIQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé cve-common-vulnerabilities-and-exposures. Identifiant public des failles que citent toutes les annonces de sécurité."
  - term: "CVE-2018-17144"
    category: "HISTOIRE ET CULTURE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé cve-2018-17144. Faille de Bitcoin Core découverte en 2018 qui laissait un bloc dépenser deux fois la même entrée."
  - term: "DARK SKIPPY"
    category: "ATTAQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé dark-skippy. Attaque d'exfiltration rapide de la graine par un appareil de signature piégé, publiée en 2024."
  - term: "DATUM"
    category: "POOLS DE MINAGE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé datum. Protocole d'OCEAN qui laisse le mineur construire son modèle de bloc, annoncé en 2024."
  - term: "DBCACHE"
    category: "FONCTIONNEMENT DU NŒUD"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé dbcache. Réglage de mémoire qui accélère l'IBD."
  - term: "ÉDITEUR DE BIP"
    category: "ÉVOLUTION DU PROTOCOLE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé editeur-de-bip. Rôle débattu en 2024, quand cinq éditeurs ont été ajoutés."
  - term: "EPHEMERAL DUST"
    category: "MEMPOOL ET FRAIS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé ephemeral-dust. Sortie de poussière tolérée si elle est dépensée dans le même paquet."
  - term: "EXTERNAL SIGNER"
    category: "PORTEFEUILLE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé external-signer. Interface de Bitcoin Core pour signer avec un appareil externe."
  - term: "FEERATE DIAGRAM"
    category: "MEMPOOL ET FRAIS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé feerate-diagram. Critère d'acceptation des remplacements RBF dans Bitcoin Core 31.0."
  - term: "FRAIS EXOGÈNES ET ENDOGÈNES"
    category: "MEMPOOL ET FRAIS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé frais-exogenes. Frais apportés par une entrée externe plutôt que pris dans le contrat, distinction qui revient dans les débats sur CTV et Lightning."
  - term: "FRAIS HORS BANDE"
    category: "MEMPOOL ET FRAIS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé out-of-band-fees. Frais payés au mineur hors de la transaction."
  - term: "FREE RELAY"
    category: "ATTAQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé free-relay. Attaque qui fait relayer des données sans payer les frais correspondants."
  - term: "FUZZING"
    category: "INFORMATIQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé fuzzing. Méthode de test citée dans 15 bulletins Optech, y compris le *fuzzing* différentiel entre implémentations."
  - term: "GETDATA"
    category: "RÉSEAU"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé getdata. Message P2P qui demande un bloc ou une transaction annoncés."
  - term: "GREAT SCRIPT RESTORATION"
    category: "ÉVOLUTION DU PROTOCOLE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé great-script-restoration. Série de quatre BIP qui rétablirait des opcodes désactivés sous un budget de calcul."
  - term: "GUIX"
    category: "INFORMATIQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé guix. Outil de compilation reproductible qui produit les binaires officiels de Bitcoin Core."
  - term: "HACHAGE QUADRATIQUE"
    category: "ATTAQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé hachage-quadratique. Coût de validation des scripts *legacy* qui croît au carré."
  - term: "HASHLOCK"
    category: "SCRIPT"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé hashlock. Condition de dépense par révélation d'une préimage, moitié d'un HTLC."
  - term: "HEADERS PRESYNC"
    category: "FONCTIONNEMENT DU NŒUD"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé headers-presync. Étape anti-DoS de l'IBD qui a permis à Bitcoin Core de retirer les checkpoints en 2025."
  - term: "INBOUND FEES"
    category: "PAIEMENTS LIGHTNING"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé inbound-fees. Frais de routage appliqués à l'entrée d'un canal, introduits par LND en 2024."
  - term: "INTROSPECTION"
    category: "COVENANTS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé introspection. Capacité d'un script à lire la transaction qui le dépense, au centre des propositions de covenants."
  - term: "INV"
    category: "RÉSEAU"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé inv. Message P2P d'annonce des transactions et des blocs, cité dans les analyses de trafic des nœuds."
  - term: "JOB DECLARATION"
    category: "POOLS DE MINAGE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé job-declaration. Rôle de Stratum V2 qui laisse le mineur choisir ses transactions."
  - term: "LEGACY WALLET"
    category: "PORTEFEUILLE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé legacy-wallet. Ancien format BDB de Bitcoin Core, retiré en 30.0."
  - term: "LIBRE RELAY"
    category: "IMPLÉMENTATION"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé libre-relay. Variante de Bitcoin Core de Peter Todd aux règles de relais plus larges (remplacements, annexe Taproot)."
  - term: "LINÉARISATION DE CLUSTER"
    category: "MEMPOOL ET FRAIS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé linearisation-de-cluster. Algorithme qui ordonne les transactions d'un cluster, fondement du mempool de Bitcoin Core 31.0."
  - term: "LN-PENALTY"
    category: "LIGHTNING NETWORK"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé ln-penalty. Nom du mécanisme de punition des canaux actuels, opposé à LN-Symmetry."
  - term: "LNHANCE"
    category: "COVENANTS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé lnhance. Paquet de soft fork proposé en 2024 (CTV, CSFS, INTERNALKEY, puis PAIRCOMMIT)."
  - term: "LOW-R GRINDING"
    category: "CRYPTOGRAPHIE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé low-r-grinding. Technique qui fait gagner un octet aux signatures ECDSA."
  - term: "LSPS"
    category: "LIGHTNING NETWORK"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé lsps. Spécifications communes des LSP (LSPS0 à LSPS5)."
  - term: "MEV"
    category: "MINAGE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé mev-miner-extractable-value. Revenu qu'un mineur tire de l'ordre ou du choix des transactions."
  - term: "MULTIPROCESS"
    category: "IMPLÉMENTATION"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé multiprocess. Découpage de Bitcoin Core en processus séparés, dont dépend l'interface de minage IPC expérimentale de la version 30.0."
  - term: "NAT-PMP"
    category: "RÉSEAU"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé nat-pmp. Protocole d'ouverture de port activé par défaut dans Bitcoin Core 30.0 pour accepter des connexions entrantes."
  - term: "NODE FINGERPRINTING"
    category: "CONFIDENTIALITÉ"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé node-fingerprinting. Recoupement d'un même nœud sur plusieurs réseaux à partir de ses messages P2P (addr)."
  - term: "OP_CHECKCONTRACTVERIFY"
    category: "COVENANTS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé op-checkcontractverify-0xbb. Opcode de covenant de Salvatore Ingala (BIP-0443)."
  - term: "OP_PAIRCOMMIT"
    category: "COVENANTS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé op-paircommit-0xcd. Opcode candidat au paquet LNHANCE (BIP-0442)."
  - term: "OP_TEMPLATEHASH"
    category: "COVENANTS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé op-templatehash-0xce. Variante de CTV pour Tapscript (BIP-0446), proposée avec CSFS et INTERNALKEY."
  - term: "PACKAGE RBF"
    category: "MEMPOOL ET FRAIS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé package-rbf. Remplacement d'un paquet parent et enfant, activé sous une forme limitée dans Bitcoin Core 28.0."
  - term: "PAYMENT SECRET"
    category: "PAIEMENTS LIGHTNING"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé payment-secret. Champ des factures BOLT11 que le payeur doit trouver avant de payer."
  - term: "PEER STORAGE"
    category: "LIGHTNING NETWORK"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé peer-storage. Sauvegarde chiffrée de l'état d'un canal chez son pair, ajoutée à Core Lightning 25.02."
  - term: "PICKHARDT PAYMENTS"
    category: "PAIEMENTS LIGHTNING"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé pickhardt-payments. Routage par flux à coût minimal issu des travaux de René Pickhardt, utilisé par le plugin askrene de Core Lightning."
  - term: "PREUVE DE FRAUDE"
    category: "ROLLUPS ET BITVM"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé preuve-de-fraude. Preuve qu'une partie a triché, base des schémas optimistes (BitVM, rollups, canaux JIT)."
  - term: "PREUVE DE PAIEMENT"
    category: "PAIEMENTS LIGHTNING"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé preuve-de-paiement. Garantie qu'un paiement a eu lieu (en Lightning, la préimage)."
  - term: "PREUVE DE VALIDITÉ"
    category: "CRYPTOGRAPHIE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé preuve-de-validite. Preuve qu'un calcul est correct (ZeroSync, rollups), pendant de la preuve de fraude."
  - term: "PREUVE DLEQ"
    category: "CRYPTOGRAPHIE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé dleq-discrete-log-equality. Preuve d'égalité de logarithmes discrets utilisée pour envoyer des silent payments."
  - term: "PRIVATE BROADCAST"
    category: "CONFIDENTIALITÉ"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé private-broadcast. Option de Bitcoin Core 31.0 qui diffuse ses propres transactions par Tor ou I2P seulement."
  - term: "REPRODUCIBLE BUILDS"
    category: "INFORMATIQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé reproducible-builds. Compilation qui donne des binaires identiques à partir du même code, pour vérifier ce qu'on installe."
  - term: "RÉUTILISATION DE NONCE"
    category: "CRYPTOGRAPHIE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé reutilisation-de-nonce. Erreur qui révèle la clé privée en ECDSA comme en Schnorr, rappelée par Optech en 2024."
  - term: "RFC 6979"
    category: "CRYPTOGRAPHIE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé rfc-6979. Méthode de nonce déterministe pour ECDSA."
  - term: "SHARECHAIN"
    category: "POOLS DE MINAGE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé sharechain. Chaîne de parts des pools décentralisés."
  - term: "SIBLING EVICTION"
    category: "MEMPOOL ET FRAIS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé sibling-eviction. Règle de Bitcoin Core 28.0 qui laisse un nouvel enfant d'une transaction TRUC évincer l'enfant existant."
  - term: "SIGNATURE À SEUIL"
    category: "CRYPTOGRAPHIE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé signature-a-seuil. Signature t-sur-n qui produit une seule signature (FROST)."
  - term: "SLOW BLOCK"
    category: "ATTAQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé slow-block. Bloc conçu pour être très long à valider, visé par le consensus cleanup et démontré sur signet."
  - term: "SUPERSCALAR"
    category: "LIGHTNING NETWORK"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé superscalar. Construction de *channel factory* à base de *timeout trees*, proposée en 2024."
  - term: "SWIFTSYNC"
    category: "FONCTIONNEMENT DU NŒUD"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé swiftsync. Accélération de l'IBD par indices précalculés, environ 5 fois plus rapide dans le prototype de 2025."
  - term: "TAPLEAF"
    category: "SCRIPT"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé tapleaf. Feuille de cet arbre, avec sa version de feuille."
  - term: "TAPTREE"
    category: "SCRIPT"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé taptree. Arbre de Merkle des scripts d'une sortie Taproot."
  - term: "TEE"
    category: "INFORMATIQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé tee-trusted-execution-environment. Enclave matérielle utilisée par des portefeuilles et pour émuler des soft forks."
  - term: "TEMPLATE PROVIDER"
    category: "POOLS DE MINAGE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé template-provider. Rôle de Stratum V2 tenu par un nœud qui fournit les modèles de blocs, relié à l'interface de minage de Bitcoin Core."
  - term: "TIMEOUT TREE"
    category: "COUCHE SUPÉRIEURE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé timeout-tree. Arbre de transactions qui expire au profit d'un fournisseur, base de SuperScalar et d'Ark."
  - term: "TRANSACTION DE 64 OCTETS"
    category: "ATTAQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé transaction-de-64-octets. Transaction dont la taille permet de tromper une preuve de Merkle."
  - term: "TRANSACTION PRÉ-SIGNÉE"
    category: "TRANSACTIONS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé transaction-pre-signee. Brique des vaults et des protocoles de type BitVM."
  - term: "TRANSACTIONS DUPLIQUÉES"
    category: "TRANSACTIONS"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé transaction-dupliquee. Deux transactions au même txid, à l'origine du problème du bloc 1 983 702 que traite le *consensus cleanup*."
  - term: "VARDIFF"
    category: "POOLS DE MINAGE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé vardiff. Ajustement automatique de la difficulté des parts par le pool, étudié en 2026."
  - term: "VERSION ROLLING"
    category: "MINAGE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé version-rolling. Usage de bits de nVersion comme espace de nonce par les mineurs."
  - term: "VULNÉRABILITÉ DE L'ARBRE DE MERKLE"
    category: "ATTAQUE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé vulnerabilite-de-l-arbre-de-merkle. Défauts de l'arbre de Merkle de Bitcoin (CVE-2012-2459, CVE-2017-12842)."
  - term: "WEAK BLOCKS"
    category: "RÉSEAU"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé weak-blocks. Blocs à preuve de travail partielle relayés pour améliorer la reconstruction des *compact blocks*, proposés en 2024."
  - term: "ZERO-FEE COMMITMENTS"
    category: "LIGHTNING NETWORK"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé zero-fee-commitments. Transactions d'engagement Lightning sans frais, construites sur TRUC et P2A."
  - term: "ZKVM"
    category: "CRYPTOGRAPHIE"
    note: "Priorité B (édition 2027, termes-candidats.md), slug proposé zkvm. Machine virtuelle qui prouve son exécution par une preuve à divulgation nulle."
  - term: "ACCIDENTAL CONFISCATION"
    category: "ÉVOLUTION DU PROTOCOLE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé accidental-confiscation. Risque qu'un soft fork rende des fonds indépensables."
  - term: "ANONYMOUS USAGE TOKENS"
    category: "CRYPTOGRAPHIE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé anonymous-usage-tokens. Jetons anonymes anti-Sybil proposés en 2024, par exemple pour les annonces de canaux."
  - term: "ARITHMÉTIQUE 64 BITS"
    category: "SCRIPT"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé arithmetique-64-bits. Proposition d'opérations sur 64 bits dans Script, discutée en 2024."
  - term: "BINANA"
    category: "ÉVOLUTION DU PROTOCOLE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé binana. Dépôt de spécifications hors BIP de Bitcoin Inquisition."
  - term: "BLOCK TEMPLATE SHARING"
    category: "MINAGE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé block-template-sharing. Partage des modèles de blocs entre nœuds pour repérer les écarts de mempool."
  - term: "BTC LISP"
    category: "SCRIPT"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé btc-lisp. Langage de script de type Lisp proposé comme alternative à Script, encore expérimental."
  - term: "CANAL DE SPILLMAN"
    category: "LIGHTNING NETWORK"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé canal-de-spillman. Premier canal de paiement unidirectionnel, cité pour l'histoire des canaux."
  - term: "CJDNS"
    category: "RÉSEAU"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé cjdns. Réseau chiffré pris en charge par Bitcoin Core à côté de Tor et I2P."
  - term: "CMAKE"
    category: "INFORMATIQUE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé cmake. Système de compilation de Bitcoin Core depuis 2024."
  - term: "COINGRINDER"
    category: "PORTEFEUILLE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé coingrinder. Algorithme de sélection des pièces ajouté à Bitcoin Core en 2024, à côté de branch-and-bound et knapsack-solver."
  - term: "COLLIDERSCRIPT"
    category: "COVENANTS"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé colliderscript. Covenants sans soft fork à partir de collisions de hachage de 160 bits, très coûteux."
  - term: "COUNTERSIGN"
    category: "PORTEFEUILLE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé countersign. Proposition ancienne de contre-signature."
  - term: "DÉPASSEMENT DES HORODATAGES EN 2106"
    category: "PROTOCOLE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé depassement-2106. Débordement des horodatages de blocs sur 32 bits en 2106, discuté en 2026."
  - term: "DUPLEX MICROPAYMENT CHANNELS"
    category: "LIGHTNING NETWORK"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé duplex-micropayment-channels. Ancien modèle de canal de paiement, repris dans les travaux sur les *timeout trees*."
  - term: "DYNAMIC COMMITMENTS"
    category: "LIGHTNING NETWORK"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé dynamic-commitments. Mise à niveau d'un canal Lightning sans le fermer."
  - term: "FEE SPONSORSHIP"
    category: "ÉVOLUTION DU PROTOCOLE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé fee-sponsorship. Proposition de transaction qui paie les frais d'une autre sans la dépenser."
  - term: "FLORESTA"
    category: "IMPLÉMENTATION"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé floresta. Nœud complet léger en Rust fondé sur Utreexo."
  - term: "FOUNTAIN CODES"
    category: "FONCTIONNEMENT DU NŒUD"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé fountain-codes. Codes correcteurs proposés pour que les nœuds élagués servent l'IBD."
  - term: "MUHASH"
    category: "CRYPTOGRAPHIE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé muhash. Fonction de hachage d'ensemble utilisée par coinstatsindex et SwiftSync."
  - term: "MUTATION TESTING"
    category: "INFORMATIQUE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé mutation-testing. Méthode de test appliquée à Bitcoin Core depuis 2024."
  - term: "MUTINYNET"
    category: "RÉSEAU"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé mutinynet. Signet à blocs de 30 secondes très utilisé pour tester Lightning et les covenants."
  - term: "OBLIVIOUS SHARES"
    category: "POOLS DE MINAGE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé oblivious-shares. Parts de minage qui empêchent un mineur de savoir s'il tient un bloc, parade à la rétention de bloc."
  - term: "OHTTP"
    category: "CONFIDENTIALITÉ"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé ohttp-oblivious-http. Protocole qui masque l'adresse IP de l'émetteur, utilisé par Payjoin v2 (BIP-0077)."
  - term: "OP_EXPIRE"
    category: "OPCODES"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé op-expire. Opcode proposé par Peter Todd pour faire expirer une transaction."
  - term: "OP_TWEAKADD"
    category: "COVENANTS"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé op-tweakadd. Opcode proposé (BIP-0449) pour calculer une clé Taproot dans un script."
  - term: "PAIEMENTS PROBABILISTES"
    category: "PAIEMENTS LIGHTNING"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé paiements-probabilistes. Paiement de très petites sommes par loterie, discuté en 2025."
  - term: "PEERSWAP"
    category: "LOGICIEL LIGHTNING"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé peerswap. Protocole d'échange de liquidité entre pairs Lightning par *atomic swap*."
  - term: "QUIESCENCE"
    category: "LIGHTNING NETWORK"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé quiescence. État d'un canal Lightning gelé le temps d'un *splicing*."
  - term: "REDUNDANT OVERPAYMENTS"
    category: "PAIEMENTS LIGHTNING"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé redundant-overpayments. Paiement Lightning envoyé en plus de parts que nécessaire pour éviter les nouvelles tentatives."
  - term: "SHIELDED CSV"
    category: "COUCHE SUPÉRIEURE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé shielded-csv. Validation côté client qui masque l'historique par des preuves à divulgation nulle, publiée en 2024."
  - term: "SIGNATURES BLS"
    category: "CRYPTOGRAPHIE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé signature-bls. Schéma de signature agrégeable non retenu pour Bitcoin."
  - term: "SIGNER DELEGATION"
    category: "SCRIPT"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé signer-delegation. Délégation du droit de signer à une autre clé (CSFS, graftroot)."
  - term: "SINGLE RANDOM DRAW"
    category: "PORTEFEUILLE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé srd-single-random-draw. Troisième algorithme de sélection des pièces de Bitcoin Core."
  - term: "SPACECHAIN"
    category: "SIDECHAIN"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé spacechain. Sidechain de Ruben Somsen fondée sur le minage fusionné aveugle."
  - term: "STATELESS INVOICES"
    category: "PAIEMENTS LIGHTNING"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé stateless-invoices. Factures Lightning qui ne demandent aucun stockage au destinataire."
  - term: "TRANSITORY SOFT FORK"
    category: "ÉVOLUTION DU PROTOCOLE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé transitory-soft-fork. Soft fork qui expire s'il n'est pas reconduit, proposé pour le consensus cleanup."
  - term: "UPFRONT FEES"
    category: "PAIEMENTS LIGHTNING"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé upfront-fees. Frais payés d'avance pour limiter le *jamming* Lightning."
  - term: "VAROPS BUDGET"
    category: "SCRIPT"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé varops-budget. Budget de calcul des scripts proposé par le BIP-0440, pièce de la Great Script Restoration."
  - term: "VÉRIFICATION FORMELLE"
    category: "INFORMATIQUE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé verification-formelle. Preuve mathématique qu'un code respecte sa spécification, appliquée à libsecp256k1 et au protocole en 2026."
  - term: "WARNET"
    category: "OUTIL DE DÉVELOPPEMENT"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé warnet. Outil de simulation de réseaux de nœuds Bitcoin pour tester des attaques P2P."
  - term: "WASTE METRIC"
    category: "PORTEFEUILLE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé waste-metric. Score de la sélection des pièces de Bitcoin Core qui départage les solutions."
  - term: "ZAWY'S ALTERNATING TIMESTAMP ATTACK"
    category: "ATTAQUE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé alternating-timestamp-attack. Variante d'attaque sur les horodatages étudiée avec le *time warp*."
  - term: "ZKCP"
    category: "CRYPTOGRAPHIE"
    note: "Priorité C (édition 2027, termes-candidats.md), slug proposé zkcp-zero-knowledge-contingent-payment. Paiement conditionné à une preuve à divulgation nulle, cité avec BitVM et l'ecash."
