editions:
  complete:
    title: "Bitcoin Dictionary"
    subtitle: "The complete technical vocabulary of Bitcoin"
    file: "bitcoin-dictionary"
    sections:
      chronologie:
        title: "Timeline"
        intro: >
          The major events of Bitcoin, of the cypherpunk movement, and of the cryptography
          that matters to Bitcoin, in the order in which they happened. Each date is
          cross-checked against at least 2 sources.
      bip:
        title: "BIP"
        intro: >
          BIPs (Bitcoin Improvement Proposals) are the documents that propose and describe
          changes to Bitcoin. Each entry gives its number, its original title, its status,
          and a summary, followed by the full definition when there is one.
      bolt:
        title: "BOLT and bLIP"
        intro: >
          BOLTs (Basis of Lightning Technology) make up the specification of the Lightning
          Network, and bLIPs (Bitcoin Lightning Improvement Proposals) describe the optional
          features proposed on top of it. Each entry gives its status and a summary,
          followed by the full definition when there is one.
  essentiel:
    title: "Bitcoin Dictionary"
    subtitle: "The essentials in short definitions"
    file: "bitcoin-dictionary-essentials"
