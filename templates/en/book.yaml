# English labels of the book. Ids stay those of templates/parts.yaml and templates/editions.yaml;
# everything not listed here falls back to the French.

parts:
  technique:
    title: "Technical dictionary"
    intro: >
      The terms of Bitcoin and of the protocols built on it, in alphabetical order. Each
      entry shows its category, recognizable by its pictogram.
  ecosysteme:
    title: "Companies, applications, and software"
    intro: >
      The companies, associations, software, wallets, hardware, and services that make up
      the Bitcoin ecosystem, in alphabetical order. The mechanisms they implement are
      defined in the technical dictionary.
  personnes:
    title: "People"
    intro: >
      The historical figures of Bitcoin and of the cypherpunk movement, along with the main
      personalities of the ecosystem, in alphabetical order. Each entry begins with the
      person's role, then ties it to Bitcoin.
  specifications:
    title: "Specifications"

