# Langues du dictionnaire (docs/traduction.md).
#
# `source` : langue d'origine, dans laquelle on crée les entrées et on génère le livre
# aujourd'hui. `translations` : langues traduites, chacune avec son périmètre (`parts`,
# des identifiants de templates/parts.yaml). Une entrée hors périmètre peut être traduite ;
# elle n'est simplement pas comptée comme manquante tant qu'elle ne l'est pas.

source: fr

translations:
  en:
    name: "English"
    parts:
      - technique
      - ecosysteme
      - personnes
      - specifications
      - resumes-specifications   # specifications/en/*.yaml
      - chronologie              # chronologie/en/*.yaml
    # Entrées françaises sans objet dans cette langue (slugs de definitions/fr), avec la raison.
    exclude:
      - crypter      # remarque sur l'usage du français (« crypter » n'existe pas, on dit « chiffrer »)
      - perime-bloc  # doublon de obsolete-bloc : un seul « stale block » en anglais
    # Traductions suspendues à une décision de Loïc (slugs ou catégories de definitions/fr) :
    # les entrées non traduites sont « en attente », pas « manquantes ».
    pending:
      - APPLICATION NOSTR             # garder ou retirer les applications Nostr (question du 29/10/2026)
      - NOSTR                         # même question pour les notions Nostr (déjà traduites)
      - ndk-nostr-development-kit     # outil de développement Nostr
