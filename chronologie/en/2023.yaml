# Bitcoin timeline: 2023.
# Translation of chronologie/fr/2023.yaml: dates, related entries and sources live there.

events:
  - date: "2023-01-09"
    title: "James O'Beirne proposes OP_VAULT"
    text: "James O'Beirne publishes on the bitcoin-dev list a soft fork draft that adds two opcodes, `OP_VAULT` and `OP_UNVAULT`, to build vaults. Every withdrawal goes through a delay during which a safer spending path, chosen when the vault is created, can recover the funds."
    source_hash: "1631a14f5d0e697c"
    translation_hash: "e5c445be769319f7"
  - date: "2023-01-20"
    title: "Ordinals inscriptions reach mainnet"
    text: "Casey Rodarmor releases ord 0.4.0 and announces that inscriptions are ready for mainnet. The Ordinals protocol numbers satoshis and lets users attach content (image, text) placed in the witness of a Taproot transaction. Within weeks, inscriptions fill blocks."
    source_hash: "5a7ad4f7e0c1e8a6"
    translation_hash: "ad5117bbdb9225c2"
  - date: "2023-05-22"
    title: "Burak Keceli proposes Ark"
    text: "Burak Keceli presents Ark on the bitcoin-dev list: a second-layer protocol in which an operator, the Ark Service Provider, coordinates shared transactions every five seconds. Users hold virtual outputs (vTXOs) that expire after four weeks, with no inbound liquidity to manage."
    source_hash: "fed0ceb1b25cd91d"
    translation_hash: "6f138570b2c764a8"
  - date: "2023-06-15"
    title: "BlackRock files for a spot bitcoin ETF"
    text: "BlackRock files with the SEC the registration statement for the iShares Bitcoin Trust, an exchange-traded fund that will hold bitcoin in custody with Coinbase Custody."
    source_hash: "d47e289f015ed3b7"
    translation_hash: "0479e4901f677e35"
  - date: "2023-06-29"
    title: "MiCA enters into force"
    text: "The European MiCA regulation on crypto-asset markets, published in the Official Journal on June 9, enters into force. Its rules on stablecoins apply from June 30, 2024, and the rest, including the licensing of service providers, from December 30, 2024."
    source_hash: "05defab391bcb9a7"
    translation_hash: "3c7c0907222d1520"
  - date: "2023-08-29"
    title: "Grayscale wins its appeal against the SEC"
    text: "The federal court of appeals for the District of Columbia finds the SEC's refusal to convert the Grayscale Bitcoin Trust into an ETF “arbitrary and capricious”, given that it has authorized futures-based ETFs. The ruling does not, however, oblige the SEC to approve the fund."
    source_hash: "abcbb181f1adb177"
    translation_hash: "170eccf65f003d9b"
  - date: "2023-10-09"
    title: "Robin Linus publishes BitVM"
    text: "Robin Linus presents BitVM on the bitcoin-dev list, a method for making a bitcoin payment conditional on the correct execution of an arbitrary program, without changing consensus. The computation happens off-chain and the chain only settles a dispute, on the model of optimistic rollups."
    source_hash: "387cbb6ee6173c2b"
    translation_hash: "08038b3f0deefc4a"
  - date: "2023-10-18"
    title: "Taproot Assets on mainnet"
    text: "Lightning Labs releases the mainnet alpha version of Taproot Assets (v0.3), a protocol for issuing and managing assets, including stablecoins, on the Bitcoin chain. The team's next goal is to have them circulate on Lightning."
    source_hash: "0efbf71982c6d88a"
    translation_hash: "c15d194925bc91f9"
