# Bitcoin timeline: 2020.
# Translation of chronologie/fr/2020.yaml: dates, related entries and sources live there.

events:
  - date: "2020-03-12"
    title: "Black Thursday, bitcoin price collapses"
    text: "Amid the market panic over Covid-19, the price of bitcoin loses nearly half its value in a day. In the night of March 12 to 13, it falls below $4,000, down to $3,858 on Bitstamp."
    source_hash: "ebdeac6bfa90d970"
    translation_hash: "3275b2db1d9e97b0"
  - date: "2020-05-11"
    title: "Third halving"
    text: "Block 630,000, mined by AntPool at 19:23 UTC, halves the block subsidy, which goes from 12.5 to 6.25 BTC."
    source_hash: "b34ca64982cf148f"
    translation_hash: "844e2ff12cffbd06"
  - date: "2020-08-11"
    title: "MicroStrategy buys 21,454 bitcoin"
    text: "MicroStrategy, a Nasdaq-listed software company, announces the purchase of 21,454 bitcoin for $250 million, fees included, and makes bitcoin its main treasury asset. Its CEO Michael Saylor judges it superior to holding cash."
    source_hash: "2807b18323a831cf"
    translation_hash: "273e5b8afedd4fff"
  - date: "2020-10-14"
    title: "MuSig2 published"
    text: "Jonas Nick, Tim Ruffing, and Yannick Seurin file with the IACR archive the paper describing MuSig2, a Schnorr multisignature scheme with two communication rounds, without a zero-knowledge proof. The first round, the exchange of nonces, can be done in advance."
    source_hash: "5df41a64adb0883c"
    translation_hash: "01984257b97d31de"
  - date: "2020-10-15"
    title: "Taproot merged into Bitcoin Core"
    text: "Pull request #19953, which adds to Bitcoin Core the validation of BIP-0340 through BIP-0342 (Schnorr, Taproot, and Tapscript), is merged. The new rules only apply to the private test mode regtest for now, since there is no activation on mainnet."
    source_hash: "cdc0c29b9b011129"
    translation_hash: "f7e22d345e7fc156"
