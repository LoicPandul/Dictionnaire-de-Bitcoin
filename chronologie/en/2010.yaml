# Bitcoin timeline: 2010.
# Translation of chronologie/fr/2010.yaml: dates, related entries and sources live there.

events:
  - date: "2010-03-17"
    title: "Bitcoin Market opens, the first exchange"
    text: "Bitcoin Market, which dwdollar proposed on the forum on January 15, opens for real trades, with PayPal for dollars. The day before, he places a buy order there for 500 BTC at 0.0067 USD, the New Liberty Standard rate according to him."
    source_hash: "bc8f7d2ec43021ec"
    translation_hash: "e324503430139f73"
  - date: "2010-05-22"
    title: "Pizza Day: 10,000 BTC for two pizzas"
    text: "At 19:17 UTC, Laszlo Hanyecz announces that he traded 10,000 BTC for two pizzas, supplied by jercos. The payment, confirmed in block 57,043, is the first known purchase of a physical good with bitcoin."
    source_hash: "9dbda3b0856dad4a"
    translation_hash: "31d4a0c1a14123e4"
  - date: "2010-06-17"
    title: "Satoshi Nakamoto: the design is “set in stone”"
    text: "Satoshi Nakamoto writes that, once version 0.1 was released, Bitcoin's core design was frozen (“set in stone”). He therefore created Script to cover future transaction types, and judges that a second compatible implementation would be “a menace to the network”."
    source_hash: "4f17cb1bab651959"
    translation_hash: "70fedd124b807cfa"
  - date: "2010-07-15"
    title: "1 MB constant appears in the code"
    text: "Satoshi Nakamoto adds the constant `MAX_BLOCK_SIZE` to the code, set to 1,000,000 bytes, in a commit titled “fix openssl linkage problems”. For now, it only caps the size of the blocks that the node assembles for mining."
    source_hash: "c8decbceb5c97c0d"
    translation_hash: "d90e1903d18b9314"
  - date: "2010-07-18"
    title: "Mt. Gox opens"
    text: "At 01:57 UTC, Jed McCaleb announces on bitcointalk the opening of Mt. Gox, on a domain bought in 2007 for a Magic: The Gathering card exchange site. The platform's first trade takes place the day before, at 23:09 UTC: 20 BTC at 0.04951 USD."
    source_hash: "19c2fbf043ca3e66"
    translation_hash: "cc908bea32997bba"
  - date: "2010-08-15"
    title: "Value overflow incident: 184 billion bitcoin created"
    text: "A block at height 74,638, timestamped 17:05 UTC, contains a transaction with two outputs worth 92,233,720,368.54 BTC each. An integer overflow made it possible to create about 184 billion bitcoin. Jeff Garzik reports it on the forum at 18:08 UTC."
    source_hash: "263a2a4cf66c7ed1"
    translation_hash: "fd3cfcc18489402c"
  - date: "2010-08-15"
    title: "OP_CAT and other opcodes disabled"
    text: "In a commit titled “misc changes”, Satoshi Nakamoto disables 15 opcodes, including `OP_CAT`, `OP_MUL`, and `OP_LSHIFT`. The same commit lowers the maximum size of an element pushed onto the stack from 5,000 to 520 bytes."
    source_hash: "f3325e76adcad835"
    translation_hash: "b07a09dcfba33565"
  - date: "2010-09-07"
    title: "The 1 MB limit becomes a consensus rule"
    text: "In the version 0.3.12 commit, Satoshi Nakamoto makes blocks larger than 1,000,000 bytes invalid beyond block 79,400. That block is mined on September 12, and the limit applies from the next one."
    source_hash: "05f7c3f973a093a7"
    translation_hash: "b72d016084e9e270"
  - date: "2010-11-27"
    title: "First mining pool announced, future Slush Pool"
    text: "Marek Palatinus, alias slush, announces on bitcointalk a cooperative mining server that relies on `getwork`. Miners pool their computing power there and share each 50 BTC reward in proportion to their work. This pool will become Slush Pool, then Braiins Pool."
    source_hash: "6e2a3c3e9ef8c50c"
    translation_hash: "a21af56312c39c5d"
  - date: "2010-12-12"
    title: "Satoshi Nakamoto's last message on bitcointalk"
    text: "At 18:22 UTC, Satoshi Nakamoto announces version 0.3.19, which adds limits against denial of service and removes alerts from safe mode. It is his last message on bitcointalk."
    source_hash: "cb10688086d37358"
    translation_hash: "1e3959bee56b9733"
