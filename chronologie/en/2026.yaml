# Bitcoin timeline: 2026.
# Translation of chronologie/fr/2026.yaml: dates, related entries and sources live there.

events:
  - date: "2026-02-11"
    title: "BIP-0360 (P2MR) enters the BIPs repository"
    text: "BIP-0360 specifies P2MR (Pay-to-Merkle-Root), an output type close to P2TR but without a key path spend: it commits only to the root of the script tree. It is the first output type designed against quantum attacks to be published as a BIP, with no activation parameters."
    source_hash: "ccb3d7ec7f74ca72"
    translation_hash: "e5553b626e594e4b"
  - date: "2026-03-09"
    title: "The 20 millionth bitcoin is issued"
    text: "Block 939,999, mined by Foundry USA, brings the number of bitcoin issued to 20 million, about 95.2% of the 21 million. The last million will be created over about 114 years, at the decreasing pace of the halvings."
    source_hash: "49bdc84761800f99"
    translation_hash: "4e61e53c8f34510b"
  - date: "2026-03-17"
    title: "SEC says that most crypto assets are not securities"
    text: "The SEC publishes, with the backing of the CFTC, a 68-page interpretation under which most crypto assets are not in themselves securities. The text sets stablecoins, digital commodities, and digital tools apart, and addresses mining and staking."
    source_hash: "2c8a97b0d18b4938"
    translation_hash: "e5d51ea261cf3721"
  - date: "2026-03-31"
    title: "Google cuts the cost of a quantum attack on elliptic curves 20-fold"
    text: "Google Quantum AI estimates that a quantum computer of fewer than 500,000 physical qubits could solve the discrete logarithm on a 256-bit elliptic curve in a few minutes, with about 20 times fewer resources than earlier estimates. No machine of that size exists."
    source_hash: "0347b2471bd52fc5"
    translation_hash: "86fd39852817f83b"
  - date: "2026-04-14"
    title: "BIP-0361 proposes to phase out old signatures"
    text: "BIP-0361, by Jameson Lopp and five coauthors, enters the repository with Draft status. It plans to forbid sends to quantum-vulnerable addresses first, then to restrict ECDSA and Schnorr spends, with a quantum-resistant rescue protocol for coins that have not migrated."
    source_hash: "65876928fdee04a7"
    translation_hash: "06a7199bc8ef2764"
  - date: "2026-04-19"
    title: "Bitcoin Core 31.0 and cluster mempool released"
    text: "Bitcoin Core 31.0 reimplements the mempool on the cluster mempool model: ancestor and descendant limits give way to clusters of at most 64 transactions and 101 kvB. The release adds the `-privatebroadcast` option and raises the default `-dbcache` to 1,024 MiB."
    source_hash: "1384425c4a317cfb"
    translation_hash: "cbf826f36f38cfb6"
  - date: "2026-05-22"
    title: "BIP-0054 (Consensus Cleanup) reaches Complete status"
    text: "BIP-0054, which fixes the timewarp attack, the slow validation of certain scripts, 64-byte transactions, and duplicate coinbases, moves to Complete status. It is the most advanced soft fork of 2026, but no activation parameters are set as of October 25."
    source_hash: "75a879a6d94401b4"
    translation_hash: "d0646e51c70cc7f3"
  - date: "2026-08-08"
    title: "BIP-0110 fails, its nodes go off on a minority chain"
    text: "At block 961,632, the start of BIP-0110's mandatory signaling, the nodes that enforce it reject an AntPool block without bit 4, although 2.53% of blocks had signaled. Their branch stalls after two blocks, and Luke Dashjr is removed as a BIP editor on August 10."
    source_hash: "ddc1ce0728a4f8c2"
    translation_hash: "ecfad21f62a938b8"
