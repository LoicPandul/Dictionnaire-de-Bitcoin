# Bitcoin timeline: 2025.
# Translation of chronologie/fr/2025.yaml: dates, related entries and sources live there.

events:
  - date: "2025-01-21"
    title: "Ross Ulbricht pardoned"
    text: "The day after his inauguration, Donald Trump grants a full and unconditional pardon to Ross Ulbricht, founder of the Silk Road black market. Sentenced to life in prison in 2015, Ulbricht is released after more than 11 years of detention."
    source_hash: "99cf526de4148bf1"
    translation_hash: "289400e5cdd10b48"
  - date: "2025-03-06"
    title: "US Strategic Bitcoin Reserve created"
    text: "Donald Trump signs the executive order that creates the Strategic Bitcoin Reserve, funded by the bitcoin seized by the federal government, which must not be sold. The Secretaries of the Treasury and of Commerce must look for ways to acquire more at no cost to taxpayers."
    source_hash: "387fa36bc1518036"
    translation_hash: "1d6d07d90bb6e6b0"
  - date: "2025-06-09"
    title: "Open letter to activate CTV and CSFS"
    text: "Dozens of developers and companies sign a letter, published by James O'Beirne, which holds that the best next step for Bitcoin would be to activate `OP_CHECKTEMPLATEVERIFY` (BIP-0119) and `OP_CHECKSIGFROMSTACK` (BIP-0348). It asks Bitcoin Core contributors to prioritize their review and integration within 6 months."
    source_hash: "bd436d758f81b753"
    translation_hash: "988604d62359b9e1"
  - date: "2025-06-09"
    title: "Bitcoin Core lifts the OP_RETURN output limit"
    text: "Gloria Zhao merges Greg Sanders's pull request #32406: the default value of `-datacarriersize` goes from 83 to 100,000 bytes, and a transaction can contain several `OP_RETURN` outputs. The change is planned for Bitcoin Core 30.0."
    source_hash: "b9b1abcd03d74383"
    translation_hash: "cc5469b55673aef2"
  - date: "2025-10-06"
    title: "Bitcoin passes $126,000"
    text: "Bitcoin exceeds $126,000 for the first time in its history and touches $126,223 according to Reuters. The previous week, US spot bitcoin ETFs received $3.24 billion in net inflows, their record for the year."
    source_hash: "4f8b1990f7759205"
    translation_hash: "a637a3b80801eab8"
