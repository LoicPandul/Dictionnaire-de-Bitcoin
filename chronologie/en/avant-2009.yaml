# Bitcoin timeline: before 2009.
# Translation of chronologie/fr/avant-2009.yaml: dates, related entries and sources live there.

events:
  - date: "1976-11"
    title: "Diffie and Hellman invent public-key cryptography"
    text: "Whitfield Diffie and Martin Hellman publish “New Directions in Cryptography” in the journal IEEE Transactions on Information Theory. They describe a key exchange over an insecure channel and lay the foundations of public-key cryptography."
    source_hash: "595b89783644a715"
    translation_hash: "95c6af6c97882e36"
  - date: "1978-02"
    title: "RSA algorithm published"
    text: "Ron Rivest, Adi Shamir, and Leonard Adleman publish in Communications of the ACM a public-key encryption and signature system, known ever since as RSA. The journal had received the paper on April 4, 1977."
    source_hash: "4fc767404be1c99d"
    translation_hash: "58ddd01a1d3917d0"
  - date: "1979"
    title: "Ralph Merkle describes the hash tree"
    text: "In his Stanford thesis dated June 1979, Ralph Merkle describes hash tree authentication, then files the corresponding patent on September 5, 1979. Bitcoin uses this structure, the Merkle tree, to summarize the transactions of each block."
    source_hash: "2a9a160ff16491ac"
    translation_hash: "86bd2d9d1d1bbb3a"
  - date: "1982"
    title: "David Chaum invents the blind signature"
    text: "At the Crypto 82 conference, David Chaum presents “Blind Signatures for Untraceable Payments”. The blind signature lets a bank sign a digital coin without seeing its content, which makes electronic payment untraceable."
    source_hash: "ed10ff914305706e"
    translation_hash: "e4bd4e705344276a"
  - date: "1982-07"
    title: "Byzantine Generals Problem formalized"
    text: "Leslie Lamport, Robert Shostak, and Marshall Pease publish “The Byzantine Generals Problem”: how can participants agree when some of them lie? In November 2008, Satoshi Nakamoto will present the proof-of-work chain as a solution to this problem."
    source_hash: "edf4e308fa4ffe67"
    translation_hash: "976898e5d77a9bb7"
  - date: "1985"
    title: "Elliptic curve cryptography is born"
    text: "Victor Miller, at the Crypto 85 conference, and Neal Koblitz, independently, propose using elliptic curves over finite fields for cryptography. Koblitz's paper appears in *Mathematics of Computation* in 1987. Bitcoin's transaction signatures rely on a curve of this type."
    source_hash: "3ae25cd65cafd883"
    translation_hash: "9935e427e796dc0a"
  - date: "1989"
    title: "Claus-Peter Schnorr presents his signature"
    text: "At Crypto 89, Claus-Peter Schnorr presents an efficient identification and signature scheme, designed for smart cards, which he protects with a US patent granted on February 19, 1991. Bitcoin adopts a variant of these signatures on secp256k1 with BIP-0340."
    source_hash: "8a7a65ffe91c3278"
    translation_hash: "2b66c34fd3c2d9f5"
  - date: "1991-01"
    title: "Haber and Stornetta timestamp digital documents"
    text: "Stuart Haber and W. Scott Stornetta publish “How to Time-Stamp a Digital Document” in the Journal of Cryptology. The Bitcoin white paper cites this paper in its section on the timestamp server."
    source_hash: "69eb241866eff5f1"
    translation_hash: "197cb76e4ea532e7"
  - date: "1991-06-05"
    title: "PGP 1.0 released"
    text: "Phil Zimmermann sends friends the first version of PGP, a public-key encryption program, so they can put it online. Ten years later, he will write that he no longer knows whether the first postings on the Internet date from June 5 or June 6."
    source_hash: "a34db73477a53d06"
    translation_hash: "cdfcd932f1afd2a7"
  - date: "1992-08"
    title: "Dwork and Naor describe proof of work"
    text: "At the Crypto 92 conference, Cynthia Dwork and Moni Naor propose requiring a moderately expensive computation to access a resource, for example to send an email, in order to curb spam. Adam Back will acknowledge this prior work on hashcash."
    source_hash: "f466cbf87d51fc10"
    translation_hash: "77f32ddd67b45994"
  - date: "1992-09"
    title: "Cypherpunks founded"
    text: "Eric Hughes, Timothy C. May, and John Gilmore bring together the first cypherpunks and launch a mailing list hosted by Gilmore. The group defends privacy through cryptography. Adam Back will announce hashcash on this list in 1997."
    source_hash: "0c5ec80e881161fa"
    translation_hash: "ed59caed64bac8c3"
  - date: "1993-03-09"
    title: "Eric Hughes publishes the Cypherpunk Manifesto"
    text: "Eric Hughes signs “A Cypherpunk's Manifesto”. In it, he writes that privacy is necessary for an open society in the electronic age, and that cypherpunks write code to defend it."
    source_hash: "5f45d5b678b5bbcb"
    translation_hash: "6bc05e3645de47c4"
  - date: "1997-03-28"
    title: "Adam Back announces hashcash"
    text: "Adam Back posts on the cypherpunks list a first implementation of hashcash, an electronic stamp based on a partial hash collision: expensive to compute, instantly verifiable. Bitcoin reuses this principle for its proof of work."
    source_hash: "b5e24dd12debd13f"
    translation_hash: "d13f5af69c1c67da"
  - date: "1998-11"
    title: "Wei Dai publishes b-money"
    text: "Wei Dai describes b-money, an electronic money system for pseudonymous entities, where anyone can create money by broadcasting the solution to a computational problem. Satoshi Nakamoto will cite this text in the white paper."
    source_hash: "5d8171329b381359"
    translation_hash: "ca44ece230c7e645"
  - date: "1998-11-04"
    title: "DigiCash goes bankrupt"
    text: "DigiCash, the electronic money company founded by David Chaum, files for protection under chapter 11 of US bankruptcy law, after cutting its staff to about 6 people."
    source_hash: "d2481e1fc13328be"
    translation_hash: "0424b9a1cc67e91b"
  - date: "2000-09-20"
    title: "secp256k1 curve published"
    text: "Certicom publishes version 1.0 of SEC 2, which recommends elliptic curve parameters, including secp256k1. Bitcoin will use this curve for its keys and signatures."
    source_hash: "c0b2fb9a3d3517bc"
    translation_hash: "f2e321eca9e490fa"
  - date: "2002-08-01"
    title: "NIST publishes the SHA-256 standard"
    text: "NIST publishes the FIPS 180-2 standard, which defines the hash functions SHA-256, SHA-384, and SHA-512 alongside SHA-1. Bitcoin uses SHA-256 for its proof of work and for its transaction IDs."
    source_hash: "e266a460844aff3d"
    translation_hash: "dbf09aa9f0527202"
  - date: "2004-08-15"
    title: "Hal Finney launches RPOW"
    text: "Hal Finney presents RPOW on the cypherpunks list. His server receives a hashcash token and returns a signed token, transferable from person to person: each token can be used only once, but it gives rise to a new token of the same value."
    source_hash: "a4e770ed56c269cf"
    translation_hash: "0e84b10a5faded1c"
  - date: "2005-12-29"
    title: "Nick Szabo describes bit gold"
    text: "Nick Szabo publishes on his blog Unenumerated the description of bit gold: strings of bits produced by proof of work, timestamped, then recorded in a distributed property registry, each string serving as the challenge for the next."
    source_hash: "22f91f49615da48a"
    translation_hash: "2bbd4da8a4504e31"
  - date: "2008-10-31"
    title: "Satoshi Nakamoto announces the white paper"
    text: "At 18:10 UTC, Satoshi Nakamoto announces on the Cryptography mailing list his paper “Bitcoin: A Peer-to-Peer Electronic Cash System”, which describes a peer-to-peer electronic cash system with no trusted third party."
    source_hash: "6c032251ca964d24"
    translation_hash: "2c0be2ce0d92a334"
