# Bitcoin timeline: 2013.
# Translation of chronologie/fr/2013.yaml: dates, related entries and sources live there.

events:
  - date: "2013-01-30"
    title: "First ASIC miner delivered to the public"
    text: "Avalon ships its first ASIC miners, machines built solely for Bitcoin's `SHA256` hashing. Jeff Garzik receives one of the first units sold to the public and confirms that it computes at 68 GH/s."
    source_hash: "3dce03e3e23385f5"
    translation_hash: "138efdd0fa838bfe"
  - date: "2013-02-19"
    title: "Bitcoin 0.8.0 released"
    text: "Gavin Andresen releases Bitcoin-Qt and bitcoind 0.8.0. The block and transaction indexes move from Berkeley DB to the faster LevelDB, and the network protocol gains the Bloom filters of BIP-0037, which serve light wallets."
    source_hash: "caf1d7db14d8e6bb"
    translation_hash: "6116bef80a497e3d"
  - date: "2013-03-11"
    title: "Chain split between versions 0.7 and 0.8"
    text: "A miner running version 0.8.0 produces block 225,430, which earlier versions reject for lack of enough Berkeley DB locks. The chain splits; the pools BTC Guild and Slush go back to 0.7 to put the majority of the hashrate back on a single chain."
    source_hash: "019c8db7f41c4731"
    translation_hash: "42f5ff6dab827f1e"
  - date: "2013-03-18"
    title: "FinCEN issues rules on virtual currencies"
    text: "The US financial regulator publishes guidance FIN-2013-G001. A mere user of virtual currency is not covered, but an administrator or an exchange becomes a money transmitter, subject to anti-money laundering obligations."
    source_hash: "e95f8d2ade7b65ea"
    translation_hash: "ba74f7ea5092fd44"
  - date: "2013-03-25"
    title: "BIP-0034 becomes mandatory"
    text: "From block 227,931, nodes reject version 1 blocks and require the coinbase transaction to begin with the block height."
    source_hash: "b8bd737519f6bc10"
    translation_hash: "b3dc5d5da0efab70"
  - date: "2013-08-22"
    title: "Gregory Maxwell proposes CoinJoin"
    text: "Gregory Maxwell describes CoinJoin on bitcointalk: several users who want to make payments build a single transaction together, which blurs the link between inputs and outputs. The idea requires no change to the protocol."
    source_hash: "1e0c3a9f90027395"
    translation_hash: "95c8292978fca785"
  - date: "2013-09-10"
    title: "BIP-0039 proposed"
    text: "Marek Palatinus (Slush) presents BIP-0039 on bitcoin-dev, which turns a wallet's seed into a list of words that is easy to write down. He wants to standardize one algorithm across software and fix the flaws of Electrum's."
    source_hash: "a43e5e49b2cdb135"
    translation_hash: "a36e9f95ad39b89f"
  - date: "2013-10-01"
    title: "Silk Road shut down and Ross Ulbricht arrested"
    text: "The FBI shuts down Silk Road and arrests Ross Ulbricht in San Francisco, accused of being “Dread Pirate Roberts”. Authorities seize about 29,655 BTC on the site, then announce on October 25 the seizure of 144,336 BTC from his computers."
    source_hash: "40112ea43a60a49a"
    translation_hash: "68db4afebb0411fa"
  - date: "2013-11-27"
    title: "Bitcoin passes $1,000 on Mt. Gox"
    text: "The price crosses $1,000 on Mt. Gox, peaking at $1,030, after a rise of more than 62% in one week."
    source_hash: "f10a210a899a4b66"
    translation_hash: "25659fd2e0c117b1"
  - date: "2013-12-05"
    title: "China bans bitcoin for its banks"
    text: "The People's Bank of China and 4 other authorities forbid financial institutions and payment services from offering bitcoin services. Individuals remain free to trade it, at their own risk. The price falls back below $1,000."
    source_hash: "b070e69ed7ae7e9f"
    translation_hash: "aeb7bf6936e0af97"
