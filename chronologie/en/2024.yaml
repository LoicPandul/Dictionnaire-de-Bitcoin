# Bitcoin timeline: 2024.
# Translation of chronologie/fr/2024.yaml: dates, related entries and sources live there.

events:
  - date: "2024-01-10"
    title: "SEC approves spot bitcoin ETFs"
    text: "The SEC approves the listing of 11 spot bitcoin ETFs, including those of BlackRock, Fidelity, and Grayscale, on NYSE Arca, Nasdaq, and Cboe BZX. The day before, a hacker who had taken over the SEC's X account through a SIM swap had announced the approval too early."
    source_hash: "68a0bc8617571d54"
    translation_hash: "79b85272e36024ca"
  - date: "2024-01-11"
    title: "First trading day of US bitcoin ETFs"
    text: "The 11 spot bitcoin ETFs open for trading in the United States. More than $4.6 billion in shares trade during the day, a good part of it on Grayscale's fund, which came from the conversion of its former trust."
    source_hash: "d5dd441ad839f939"
    translation_hash: "2f7b84c714bbadfd"
  - date: "2024-04-20"
    title: "Fourth halving at block 840,000 and launch of Runes"
    text: "ViaBTC mines block 840,000 at 00:09 UTC and the reward goes from 6.25 to 3.125 BTC. Casey Rodarmor's Runes token protocol starts at the same block: the race for the first etchings pushes fees to a record of 37.6 BTC."
    source_hash: "14b088fcaea6bd05"
    translation_hash: "7cd723e406b11d7c"
  - date: "2024-04-24"
    title: "Samourai Wallet founders arrested"
    text: "US prosecutors charge Keonne Rodriguez and William Lonergan Hill, founders of Samourai Wallet, with money laundering and operating an unlicensed money transmitting business. Rodriguez is arrested in Pennsylvania, Hill in Portugal, and the service is seized. The indictment alleges more than $2 billion in illegal transactions."
    source_hash: "fb1ed7c7ed543428"
    translation_hash: "cb46378998c6c6a5"
  - date: "2024-05-08"
    title: "Silent Payments become BIP-0352"
    text: "The BIPs repository merges BIP-0352, Silent Payments: the recipient publishes a static address, and each payer derives from it a unique on-chain address, with no interaction with the recipient."
    source_hash: "c8b7bed3885db1fa"
    translation_hash: "7fcf60ae8394b21f"
  - date: "2024-07-05"
    title: "Mt. Gox begins repaying in bitcoin"
    text: "Ten years after the bankruptcy, the trustee Nobuaki Kobayashi makes the first repayments in bitcoin and bitcoin cash through designated exchanges. According to Arkham Intelligence, Mt. Gox's wallets still hold 138,985 BTC."
    source_hash: "1e2439d6a6d131a1"
    translation_hash: "c497ac447d5fc2af"
  - date: "2024-07-27"
    title: "Donald Trump promises a strategic bitcoin reserve"
    text: "At the Bitcoin 2024 conference in Nashville, Republican candidate Donald Trump promises, if elected, to keep 100% of the federal government's bitcoin as the core of a strategic reserve, and to fire Gary Gensler, the SEC chairman."
    source_hash: "55df0c9594bb31fa"
    translation_hash: "7937d8601989f546"
  - date: "2024-09-24"
    title: "BOLT-12 joins the Lightning specification"
    text: "The maintainers of the Lightning specification merge BOLT-12, the offers proposed in 2019. Two nodes negotiate the invoice through onion messages, and the recipient can hide its node behind blinded paths."
    source_hash: "cfcbbbfcd8c1b890"
    translation_hash: "0886a875d61fe7c6"
  - date: "2024-11-06"
    title: "Donald Trump elected, bitcoin at a new record"
    text: "The day after the vote, Donald Trump is declared winner of the US presidential election. Bitcoin climbs to a record of $75,345."
    source_hash: "15a62579c6b79559"
    translation_hash: "64def66c9759a281"
  - date: "2024-12-05"
    title: "Bitcoin passes $100,000"
    text: "For the first time, bitcoin crosses $100,000, a few hours after Donald Trump picked Paul Atkins, who is favorable to cryptocurrencies, to replace Gary Gensler as head of the SEC."
    source_hash: "d87e101a8e070ff9"
    translation_hash: "0fda6e9e261064e1"
  - date: "2024-12-18"
    title: "El Salvador backs off on bitcoin for an IMF loan"
    text: "The IMF reaches a staff-level agreement with El Salvador for a loan of about $1.4 billion over 40 months. In exchange, private-sector acceptance of bitcoin becomes optional, taxes are paid in dollars, and the state gradually withdraws from the Chivo wallet."
    source_hash: "8d99ce0bc101a60b"
    translation_hash: "c1218c00ef124c64"
