# Bitcoin timeline: 2014.
# Translation of chronologie/fr/2014.yaml: dates, related entries and sources live there.

events:
  - date: "2014-02-10"
    title: "Mt.Gox blames transaction malleability"
    text: "Mt.Gox extends the withdrawal suspension indefinitely and blames transaction malleability, which makes it possible to change a transaction's ID without invalidating its signature. On its platform, bitcoin falls to $500, from $692 three days earlier."
    source_hash: "0942f6513d4e583f"
    translation_hash: "b107e34f9ce44606"
  - date: "2014-02-28"
    title: "Mt.Gox goes bankrupt"
    text: "Mt.Gox files for bankruptcy protection in Tokyo. Mark Karpelès announces the disappearance of 850,000 BTC: 750,000 belonging to customers and 100,000 to the company. Debts exceed 6.5 billion yen."
    source_hash: "353be4d7db54461b"
    translation_hash: "47c28ebe997c483f"
  - date: "2014-04-07"
    title: "Wladimir van der Laan takes the lead of Bitcoin Core"
    text: "Gavin Andresen steps down as lead developer of Bitcoin Core to focus on his post as Chief Scientist of the Bitcoin Foundation. Wladimir van der Laan, whom the foundation already pays full time to work on the software, succeeds him as maintainer."
    source_hash: "322dfbf28d50f242"
    translation_hash: "c3d6e4a93ed7c3df"
  - date: "2014-06"
    title: "GHash.io exceeds 51% of the hashrate"
    text: "The pool GHash.io repeatedly supplies more than 51% of the network's hashrate, for up to 12 hours at a stretch. To reduce its share, BitFury pulls 1.5 PH/s from the pool on June 13."
    source_hash: "2c164ce953c43787"
    translation_hash: "5e89ecff667422fe"
  - date: "2014-08-28"
    title: "Death of Hal Finney"
    text: "Hal Finney, recipient of the first Bitcoin transaction, dies in Phoenix at age 58. Paralyzed by ALS, diagnosed in 2009, he is entrusted, as he wished, to the Alcor foundation, which preserves his body by cryonics."
    source_hash: "c0bf0258d89712d2"
    translation_hash: "22ea6b016b549bd9"
  - date: "2014-10-01"
    title: "Peter Todd proposes OP_CHECKLOCKTIMEVERIFY"
    text: "Peter Todd submits to the bitcoin-development list a draft BIP for the `OP_CHECKLOCKTIMEVERIFY` opcode, which prevents spending an output before a given date or block height. The text becomes BIP-0065."
    source_hash: "9108b9233b2899f2"
    translation_hash: "8af95db3dc620d67"
  - date: "2014-10-22"
    title: "Sidechains paper published"
    text: "Adam Back, Gregory Maxwell, Pieter Wuille, and six coauthors publish \"Enabling Blockchain Innovations with Pegged Sidechains\". The paper describes separate chains, the sidechains, to which bitcoin can move and then return thanks to a two-way peg."
    source_hash: "f9a115c76680ed61"
    translation_hash: "aa3263b5a77380e3"
