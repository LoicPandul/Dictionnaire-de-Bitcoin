# Bitcoin timeline: 2011.
# Translation of chronologie/fr/2011.yaml: dates, related entries and sources live there.

events:
  - date: "2011-02"
    title: "Silk Road opens"
    text: "Silk Road, a black market reachable only through Tor where users pay in bitcoin, opens in February. At the end of January, a user named \"altoid\", whom the FBI will identify as Ross Ulbricht, promoted it on the Shroomery forum and then on bitcointalk."
    source_hash: "676a579192f5c0e3"
    translation_hash: "95748c12f515e7e7"
  - date: "2011-02-09"
    title: "Bitcoin reaches parity with the dollar"
    text: "For the first time, 1 BTC trades for 1 USD. Around 22:00 UTC, bitcointalk's \"Parity Party\" thread, opened a month earlier to wait for this moment, comes alive, and Slashdot picks up the news the next day."
    source_hash: "e6abb9d87d7acd3e"
    translation_hash: "70abb287709659b2"
  - date: "2011-04-23"
    title: "Satoshi Nakamoto's last known email to Mike Hearn"
    text: "Satoshi Nakamoto replies to Mike Hearn: \"I've moved on to other things. It's in good hands with Gavin and everyone.\" It is the last known message he sends him, four days before Gavin Andresen announces his visit to the CIA."
    source_hash: "6506df974c1f11ab"
    translation_hash: "0791909cc840d6ed"
  - date: "2011-06-19"
    title: "Mt. Gox hacked, price crashes to $0.01"
    text: "Around 18:00 UTC, a hacker takes over a Mt. Gox administrator account, credits himself with fictitious bitcoin, and sells it: the price falls from $17.50 to $0.01 in 30 minutes. He withdraws about 2,000 BTC, and the user database circulates online."
    source_hash: "72b59d9b88254ce6"
    translation_hash: "fb003d5f32468f18"
  - date: "2011-09-19"
    title: "Amir Taaki writes BIP-0001"
    text: "Amir Taaki creates the page BIP-0001 on the Bitcoin wiki, which describes the process for Bitcoin Improvement Proposals (BIPs). He starts from Python's PEP 1. On October 18, Gavin Andresen proposes on the mailing list to make him the BIP editor."
    source_hash: "371fb6cf160fdda2"
    translation_hash: "b9c59a84ed20494c"
  - date: "2011-10-18"
    title: "Gavin Andresen writes BIP-0011, BIP-0012, and BIP-0013"
    text: "Gavin Andresen writes three proposals for multisignature transactions: BIP-0011 makes M-of-N transactions standard, BIP-0012 creates the `OP_EVAL` opcode, and BIP-0013 defines an address format for paying to the hash of a script."
    source_hash: "7160c280252fd573"
    translation_hash: "e1b6a666beb98195"
  - date: "2011-11-21"
    title: "Bitcoin 0.5.0 released with Bitcoin-Qt"
    text: "Bitcoin 0.5.0 replaces the old interface with Bitcoin-Qt, an entirely new graphical interface built on the Qt library and translated into German, Spanish, and Dutch, among other languages. The `bitcoind` daemon is still shipped alongside it."
    source_hash: "e809b6c72aba96b7"
    translation_hash: "f1325d59cf0e1c8f"
