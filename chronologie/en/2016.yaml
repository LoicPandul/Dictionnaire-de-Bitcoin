# Bitcoin timeline: 2016.
# Translation of chronologie/fr/2016.yaml: dates, related entries and sources live there.

events:
  - date: "2016-02-21"
    title: "Hong Kong Roundtable agreement"
    text: "At Cyberport, miners, companies, and five Bitcoin Core contributors sign a roadmap: SegWit is released, then a hard fork is proposed within the following three months, with about 2 MB of non-witness data and 4 MB at most in total."
    source_hash: "e5507bea6b165af7"
    translation_hash: "4e7eb9dd0d82a02f"
  - date: "2016-05-02"
    title: "Craig Wright claims to be Satoshi Nakamoto"
    text: "Australian Craig Wright tells the BBC, The Economist, and GQ that he is Satoshi Nakamoto. The same day, Gavin Andresen writes on his blog that he believes him, after a private demonstration in London."
    source_hash: "f5677b2482098ebc"
    translation_hash: "41d2c75b68c44cae"
  - date: "2016-06-24"
    title: "SegWit merged into Bitcoin Core"
    text: "Wladimir van der Laan merges Pieter Wuille's pull request 8149: the SegWit code enters Bitcoin Core's main branch. Its mainnet activation parameters remain to be defined."
    source_hash: "b8f66939e53ef369"
    translation_hash: "129bde0d9e475ed6"
  - date: "2016-07-04"
    title: "CSV soft fork activated"
    text: "The CSV soft fork, which bundles BIP-0068, BIP-0112, and BIP-0113, becomes active at block 419,328. It adds relative timelocks, including the `OP_CHECKSEQUENCEVERIFY` opcode."
    source_hash: "6a4ac5f6c4bb3a20"
    translation_hash: "9acd35ea9429e9c2"
  - date: "2016-07-09"
    title: "Second halving"
    text: "Block 420,000, mined at 16:46 UTC, triggers the second halving: the block subsidy goes from 25 to 12.5 BTC."
    source_hash: "cf9b7ae4c2bb66fe"
    translation_hash: "7fa2a37fb4b142f1"
  - date: "2016-08-02"
    title: "Bitfinex hacked"
    text: "Bitfinex, a Hong Kong-based exchange, suspends trading after a hack: 119,756 BTC, about $72 million, are stolen from its customers' segregated wallets."
    source_hash: "067d081aa7bab2aa"
    translation_hash: "ae754f3e4e99ba85"
  - date: "2016-10-27"
    title: "Bitcoin Core 0.13.1 deploys SegWit"
    text: "Bitcoin Core 0.13.1 sets the SegWit deployment (BIP-0141). From November 15, 2016, miners signal it with bit 1; if 95% of the blocks in a 2,016-block period do so, the soft fork locks in."
    source_hash: "4b99ad084c4768e3"
    translation_hash: "67f0037fc0d303df"
