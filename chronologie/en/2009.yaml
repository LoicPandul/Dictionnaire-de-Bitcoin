# Bitcoin timeline: 2009.
# Translation of chronologie/fr/2009.yaml: dates, related entries and sources live there.

events:
  - date: "2009-01-03"
    title: "Genesis block mined"
    text: "Block 0 of Bitcoin is timestamped 18:15:05 UTC. Its coinbase transaction contains the headline of that day's Times: \"Chancellor on brink of second bailout for banks\"."
    source_hash: "9e246cbe1208d07d"
    translation_hash: "4e56977270504ed5"
  - date: "2009-01-08"
    title: "Bitcoin v0.1 released"
    text: "At 19:27 UTC, Satoshi Nakamoto announces on the Cryptography list the first version of Bitcoin, for Windows only, C++ source code included. The software is available for download on SourceForge."
    source_hash: "60ceb068c42dac6e"
    translation_hash: "cd0a5efc1a491625"
  - date: "2009-01-09"
    title: "Block 1 mined"
    text: "Block 1 is timestamped 02:54 UTC, nearly 6 days after the genesis block. The blockchain begins to grow with the release of the software."
    source_hash: "3682ae1da102506c"
    translation_hash: "4912ca2c0d4bc5d4"
  - date: "2009-01-11"
    title: "Hal Finney tweets \"Running bitcoin\""
    text: "At 03:33 UTC, Hal Finney posts \"Running bitcoin\" on Twitter. In 2013, he will recount that he downloaded the software as soon as Satoshi Nakamoto announced it, and he believes he was the first person after him to run it."
    source_hash: "7b837612fcf63efa"
    translation_hash: "3439e6812de84b4f"
  - date: "2009-01-12"
    title: "First transaction between two people"
    text: "Block 170, timestamped 03:30 UTC, contains Satoshi Nakamoto's first transaction to another person: he sends 10 BTC to Hal Finney as a test, and sends himself 40 BTC in change."
    source_hash: "20d47001b2894598"
    translation_hash: "1d099770232d93d2"
  - date: "2009-10-05"
    title: "First published exchange rate between bitcoin and the dollar"
    text: "The site New Liberty Standard publishes its first rate: 1 USD is worth 1,309.03 BTC. The price does not come from actual trades but from a calculation based on the cost of the electricity needed to mine those bitcoin."
    source_hash: "ec3369161323a958"
    translation_hash: "3e2b3a1c78b25868"
  - date: "2009-10-12"
    title: "First known sale of bitcoin for dollars"
    text: "Martti Malmi sells 5,050 BTC for 5.02 USD. In 2014, he will find the trace of this trade in his emails: it is the oldest known sale of bitcoin for dollars."
    source_hash: "13fcf00e24cb8179"
    translation_hash: "0af23cb3e885e00e"
