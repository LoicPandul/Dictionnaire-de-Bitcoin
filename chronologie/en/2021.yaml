# Bitcoin timeline: 2021.
# Translation of chronologie/fr/2021.yaml: dates, related entries and sources live there.

events:
  - date: "2021-01-05"
    title: "Bech32m proposed (BIP-0350)"
    text: "Pieter Wuille submits to the bitcoin-dev list BIP-0350, which defines `Bech32m`, a variant of `Bech32` with a modified checksum. It fixes a weakness: `q` characters inserted or deleted before a final `p` go undetected. `Bech32m` will be used for SegWit version 1 and later addresses, including Taproot."
    source_hash: "c60c25df010349ba"
    translation_hash: "9e5028755fdddbda"
  - date: "2021-02-08"
    title: "Tesla buys $1.5 billion of bitcoin"
    text: "In a filing with the SEC, Tesla reveals that it bought $1.5 billion of bitcoin in January and announces that it will accept bitcoin as payment for its products. The price tops $44,000 the same day."
    source_hash: "1629d4609bc91e8a"
    translation_hash: "dfaae141683a4a44"
  - date: "2021-02-18"
    title: "First bitcoin ETF in North America"
    text: "The Purpose Bitcoin ETF begins trading on the Toronto Stock Exchange under the symbols BTCC.B and BTCC.U. The first bitcoin ETF in North America, it holds bitcoin directly. It raises $421 million in two days, according to Bloomberg Intelligence."
    source_hash: "360840b12b95531a"
    translation_hash: "3b8ec6ce37dea70e"
  - date: "2021-05-01"
    title: "Taproot signaling begins (Speedy Trial)"
    text: "Block 681,408 opens the first Taproot signaling period. Under Speedy Trial, a variant of BIP-0009, Taproot locks in if 90% of the blocks in a 2,016-block period signal it before August 11. Bitcoin Core 0.21.1, released the same day, contains this logic."
    source_hash: "71827422c9b1152f"
    translation_hash: "8f3db4802b19414e"
  - date: "2021-05-21"
    title: "Beijing calls for a crackdown on mining"
    text: "The financial stability committee of China's State Council, convened by Vice Premier Liu He, calls to \"crack down on bitcoin mining and trading behavior\". The price falls back below $37,000."
    source_hash: "50c1b83b9199ce8f"
    translation_hash: "1a88d0d91f1ff7b9"
  - date: "2021-06-09"
    title: "El Salvador passes the Bitcoin Law"
    text: "In the night of June 8 to 9, El Salvador's Legislative Assembly adopts the Bitcoin Law by 62 votes out of 84, a few days after Nayib Bukele announced it. Bitcoin will be legal tender alongside the US dollar."
    source_hash: "24bcf7c534839626"
    translation_hash: "83867a8b34e10671"
  - date: "2021-06-12"
    title: "Taproot locks in"
    text: "Block 687,284 is the 1,815th block of its 2,016-block period to signal Taproot, which is the 90% threshold: Taproot is locked in. Its rules will apply from block 709,632, expected in November."
    source_hash: "d0230fa831b395f3"
    translation_hash: "9a17f615d7db0678"
  - date: "2021-07-03"
    title: "Largest difficulty decrease in history"
    text: "The adjustment at block 689,472 lowers the mining difficulty by 27.94%, the largest drop since 2009. It follows the collapse in hashrate caused by the shutdown of mining farms in China."
    source_hash: "e59f6bdfe1e07f03"
    translation_hash: "401757bd607a71eb"
  - date: "2021-09-07"
    title: "Bitcoin becomes legal tender in El Salvador"
    text: "The Bitcoin Law takes effect: bitcoin is legal tender in El Salvador alongside the dollar. The public wallet Chivo, which offers $30 in bitcoin to every signup, is taken offline for a few hours for lack of server capacity. The price drops by up to 16% in the morning."
    source_hash: "36cc94538c91aa6e"
    translation_hash: "e8829a88b3b7a27b"
  - date: "2021-09-24"
    title: "China declares cryptocurrency transactions illegal"
    text: "The People's Bank of China declares all cryptocurrency-related activities illegal, including the services that foreign platforms provide to Chinese residents. Bitcoin loses about $2,000 during the day."
    source_hash: "bd5209c335af0a87"
    translation_hash: "34bbe863b689cc83"
  - date: "2021-10-19"
    title: "First US bitcoin ETF (BITO)"
    text: "The ProShares Bitcoin Strategy ETF (BITO) begins trading on the New York Stock Exchange. The first US bitcoin-linked ETF, it tracks CME futures rather than bitcoin itself. About $1 billion in shares change hands on the first day."
    source_hash: "76c543485216695c"
    translation_hash: "1282d4d7c3d07b3a"
  - date: "2021-11-10"
    title: "Price record near $69,000"
    text: "After a higher-than-expected US inflation figure for October, bitcoin reaches a record of about $68,950 according to CoinDesk, or $69,000 according to Forklog, then gives back part of its gains."
    source_hash: "2aec1f3d2cef9516"
    translation_hash: "9451dc830f053eef"
  - date: "2021-11-14"
    title: "Taproot activated"
    text: "Block 709,632, mined by F2Pool at 05:15 UTC, activates Taproot: Schnorr signatures (BIP-0340), Taproot (BIP-0341), and Tapscript (BIP-0342) take effect. Several large pools at first include no Taproot spends in their blocks."
    source_hash: "1a316c9feae1ee73"
    translation_hash: "2a48637fc1995a41"
