# Bitcoin timeline: 2017.
# Translation of chronologie/fr/2017.yaml: dates, related entries and sources live there.

events:
  - date: "2017-03-10"
    title: "SEC rejects the Winklevoss ETF"
    text: "The SEC refuses to approve Bats BZX's listing of the Winklevoss Bitcoin Trust. It notes that the major bitcoin markets are unregulated and that no surveillance-sharing agreement protects the product against fraud and manipulation."
    source_hash: "27c9bd1d665b0396"
    translation_hash: "39bb5c5ee54cf734"
  - date: "2017-03-12"
    title: "Shaolin Fry proposes the SegWit UASF (BIP-0148)"
    text: "On the bitcoin-dev list, Shaolin Fry proposes to activate SegWit through nodes rather than miners. From August 1, 2017, BIP-0148 nodes will reject any block that does not signal SegWit, as long as the soft fork is not locked in."
    source_hash: "9a5c63c1f315f754"
    translation_hash: "6ea12a337e91ea27"
  - date: "2017-03-20"
    title: "Bech32 addresses proposed (BIP-0173)"
    text: "Pieter Wuille proposes to the bitcoin-dev list a native address format for SegWit, in base 32, with a checksum able to detect typing errors. This format, `Bech32`, will become BIP-0173 and produce the addresses starting with `bc1`."
    source_hash: "8390d3dedd9c36b0"
    translation_hash: "e6dc92c7cf5df09f"
  - date: "2017-05-23"
    title: "New York Agreement (SegWit2x)"
    text: "Digital Currency Group publishes an agreement reached on the sidelines of Consensus: activate SegWit at 80% signaling, then a hard fork to 2 MB blocks within six months. By May 25, 58 companies representing 83.28% of the hashrate have signed it."
    source_hash: "f5c58ea37b0613fd"
    translation_hash: "9b431735d9d46676"
  - date: "2017-07-21"
    title: "BIP-0091 locks in"
    text: "More than 80% of the blocks in a 336-block window signal bit 4: BIP-0091, proposed by James Hilliard, locks in. It activates on July 23 at block 477,120. From then on, nodes that enforce it reject any block that does not signal SegWit, which guarantees SegWit's lock-in."
    source_hash: "27b404fd98ae19aa"
    translation_hash: "3874983072696457"
  - date: "2017-08-01"
    title: "Bitcoin Cash is born"
    text: "After block 478,558, some of the miners and nodes leave the Bitcoin chain. ViaBTC mines the first Bitcoin Cash block, 1.9 MB with 6,985 transactions, which would be impossible under Bitcoin's 1 MB limit."
    source_hash: "94986272109dbc32"
    translation_hash: "daf0af235166eb4d"
  - date: "2017-08-18"
    title: "PSBT proposed (BIP-0174)"
    text: "Ava Chow proposes on the bitcoin-dev list a standard format for partially signed transactions, the PSBT. It lets an unsigned transaction circulate between software, hardware wallets, and multisig cosigners. The format will become BIP-0174."
    source_hash: "2f27087646c2b4b8"
    translation_hash: "e26fb0822d36bd7f"
  - date: "2017-08-24"
    title: "SegWit activated"
    text: "At 01:57 UTC, block 481,824, mined by BTCC, activates SegWit (BIP-0141). The soft fork fixes transaction malleability and replaces the block size limit with a weight limit of 4 million units."
    source_hash: "3ff61c1860bea5d8"
    translation_hash: "5d7193971eb9f38d"
  - date: "2017-11-08"
    title: "SegWit2x called off"
    text: "Mike Belshe, Wences Casares, Jihan Wu, Jeff Garzik, Peter Smith, and Erik Voorhees suspend the hard fork to 2 MB blocks planned under the New York Agreement, for lack of consensus. The price of bitcoin hits a record high the next day."
    source_hash: "6d419f8a2c4138bd"
    translation_hash: "3fca41cc6c2fdc25"
  - date: "2017-12-06"
    title: "Lightning specification version 1.0"
    text: "ACINQ, Blockstream, and Lightning Labs publish release candidate 1.0 of the BOLTs and carry out the first test Lightning payments on mainnet between their three implementations, eclair, c-lightning, and lnd."
    source_hash: "389c643ba9d41b08"
    translation_hash: "cd97d275023c024c"
  - date: "2017-12-10"
    title: "Cboe launches the first bitcoin futures"
    text: "At 17:00 Chicago time, Cboe opens trading of its bitcoin futures, under the symbol XBT. Demand takes down the exchange's website, and a 25% jump triggers a trading halt."
    source_hash: "2a17192bbd7d5176"
    translation_hash: "23eea354e67f0ce4"
  - date: "2017-12-17"
    title: "Bitcoin record at $19,783"
    text: "Early in the day, the CoinDesk index reaches $19,783, its record for the year, a few hundred dollars short of $20,000. The price has risen almost twentyfold since January 1. It loses about 30% in the following days."
    source_hash: "0f0bacdbd84e917c"
    translation_hash: "48eea4c132e4d644"
