# Bitcoin timeline: 2018.
# Translation of chronologie/fr/2018.yaml: dates, related entries and sources live there.

events:
  - date: "2018-01"
    title: "MuSig published"
    text: "Gregory Maxwell, Andrew Poelstra, Yannick Seurin, and Pieter Wuille publish MuSig, a multisignature scheme based on Schnorr signatures. Several signers produce a single signature, verifiable against an aggregated public key: a cooperative multisig then looks like a single-key spend."
    source_hash: "691dadf8c945cd64"
    translation_hash: "176e20e82df2e0b6"
  - date: "2018-01-23"
    title: "Gregory Maxwell proposes Taproot"
    text: "Gregory Maxwell describes Taproot on the bitcoin-dev list. An output commits to a public key that can spend on its own, or reveal a hidden script if the participants do not cooperate. A cooperative spend then looks like a simple payment to a key."
    source_hash: "a5b107522151ff45"
    translation_hash: "c7b0a2ddbfeaafad"
  - date: "2018-03-15"
    title: "lnd 0.4-beta, first release for mainnet"
    text: "Lightning Labs releases lnd 0.4-beta, the first version of its Lightning implementation that can run on the Bitcoin mainnet. At the same time, the team announces a $2.5 million raise, with Jack Dorsey and Charlie Lee among the investors."
    source_hash: "280d607e6b8d580d"
    translation_hash: "c787652f28430fe3"
  - date: "2018-04-30"
    title: "eltoo and SIGHASH_NOINPUT published"
    text: "Christian Decker, Rusty Russell, and Olaoluwa Osuntokun publish eltoo, a mechanism for updating Lightning channels in which a recent state replaces an older published state, without penalty. The same day, Decker proposes the `SIGHASH_NOINPUT` flag that eltoo needs, the future BIP-0118."
    source_hash: "16cc5cdd5a817aa2"
    translation_hash: "3bdb5432c00dbfb9"
  - date: "2018-07-06"
    title: "Pieter Wuille proposes a BIP for Schnorr signatures"
    text: "Pieter Wuille submits to the bitcoin-dev list a draft BIP for 64-byte Schnorr signatures on the secp256k1 curve. The text sets the signature format without yet proposing a soft fork. It will lead to BIP-0340."
    source_hash: "07c4b8cd975b19f9"
    translation_hash: "c74ef1fb2cccbf6f"
  - date: "2018-09-18"
    title: "Bitcoin Core 0.16.3 fixes CVE-2018-17144"
    text: "Bitcoin Core 0.16.3 fixes a flaw in versions 0.14.0 to 0.16.2: a block that spends the same input twice crashes the node. On September 20, the developers reveal that the flaw also made it possible, on some versions, to create excess bitcoin."
    source_hash: "e0eb035a77b2a0a7"
    translation_hash: "8e6785b64cf6f6c6"
  - date: "2018-10-10"
    title: "Liquid sidechain launched"
    text: "Blockstream announces the launch of Liquid, a federated Bitcoin sidechain intended for settlement between exchanges. Its chain has been running since September 27, operated by 23 members including Bitfinex, BitMEX, and Xapo."
    source_hash: "ae025416c9be1ae0"
    translation_hash: "8a0c53ba5112af5e"
  - date: "2018-11-15"
    title: "Bitcoin Cash splits into ABC and SV"
    text: "At 18:02 UTC, a hard fork divides Bitcoin Cash into two chains: Bitcoin ABC and Bitcoin SV, developed by nChain, Craig Wright's company. A hash war begins between the miners of the two camps."
    source_hash: "b5ec21fac279749e"
    translation_hash: "e35b11b62a841193"
  - date: "2018-11-28"
    title: "OFAC sanctions bitcoin addresses for the first time"
    text: "The US Treasury sanctions two Iranians who converted into rials the bitcoin ransoms of the SamSam ransomware. For the first time, OFAC adds bitcoin addresses to its list of sanctioned persons: two addresses, through which more than 7,000 transactions passed."
    source_hash: "76f0232dff2bfd42"
    translation_hash: "c5d227a325ad6e4c"
