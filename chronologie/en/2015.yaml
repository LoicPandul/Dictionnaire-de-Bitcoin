# Bitcoin timeline: 2015.
# Translation of chronologie/fr/2015.yaml: dates, related entries and sources live there.

events:
  - date: "2015-02-23"
    title: "First presentation of the Lightning Network"
    text: "Joseph Poon and Thaddeus Dryja present the Lightning Network at a developer seminar in San Francisco: a network of off-chain payment channels to process billions of transactions per day. The draft of their white paper (version 0.5) circulates the same month."
    source_hash: "c4d5127025fc4c1f"
    translation_hash: "e7d9a1ce9f851050"
  - date: "2015-06-22"
    title: "Gavin Andresen proposes BIP-0101"
    text: "Gavin Andresen submits to the bitcoin-dev list the draft of the future BIP-0101: a hard fork that raises the maximum block size to 8 MB on January 11, 2016, then doubles it every two years until 2036."
    source_hash: "4bee7321db2daef2"
    translation_hash: "8732d97e20e6c7a6"
  - date: "2015-07-04"
    title: "BIP-0066 activated"
    text: "The BIP-0066 soft fork, which enforces strict DER encoding of signatures, applies from block 363,725, once 950 of the last 1,000 blocks announce version 3. Up-to-date nodes now reject version 2 blocks."
    source_hash: "7c1c424f1ec94280"
    translation_hash: "a234af196752fc60"
  - date: "2015-07-04"
    title: "Chain split caused by SPV mining"
    text: "Shortly after the activation of BIP-0066, a small miner produces an invalid block. About half of the hashrate, which mines without validating blocks, builds on top of it. Bitcoin.org advises waiting for 30 more confirmations, and these miners lose more than $50,000 in rewards."
    source_hash: "d535864732aab680"
    translation_hash: "9b3522b513fd665f"
  - date: "2015-08-15"
    title: "Bitcoin XT 0.11A released"
    text: "Mike Hearn releases Bitcoin XT 0.11A, a variant of Bitcoin Core that includes BIP-0101. If 75% of the last 1,000 blocks signal it, its nodes accept 8 MB blocks. Gavin Andresen supports the project."
    source_hash: "7b3009eee908ccdb"
    translation_hash: "c5cee2f9f0b1d3cc"
  - date: "2015-09-17"
    title: "CFTC classifies bitcoin as a commodity"
    text: "In sanctioning the options platform Coinflip (Derivabit), the US Commodity Futures Trading Commission rules for the first time that bitcoin and other virtual currencies are commodities subject to the Commodity Exchange Act."
    source_hash: "f0d33b4c04bd2435"
    translation_hash: "10e5d7303ea1faa6"
  - date: "2015-10-22"
    title: "EU Court of Justice exempts bitcoin exchange from VAT"
    text: "In the Hedqvist ruling (C-264/14), the Court of Justice of the European Union holds that the exchange of traditional currencies for bitcoin is exempt from VAT, like transactions in currencies."
    source_hash: "878204219967cf40"
    translation_hash: "91958f6da53c2ec7"
  - date: "2015-11-27"
    title: "Bitcoin Core merges opt-in RBF"
    text: "Wladimir van der Laan merges Peter Todd's opt-in Replace-by-Fee into Bitcoin Core. A transaction that signals it through its `nSequence` field can be replaced in the mempool by a version that pays higher fees. The feature ships with version 0.12.0."
    source_hash: "e03f394ae7be3b02"
    translation_hash: "e49ffc7f3dff1ae8"
  - date: "2015-12-07"
    title: "Pieter Wuille presents SegWit"
    text: "At Scaling Bitcoin Hong Kong, Pieter Wuille presents Segregated Witness, a soft fork that stores signatures separately in blocks, outside the current size limit. The proposal also removes signature malleability."
    source_hash: "869d36f4b379210b"
    translation_hash: "191038607574bd54"
  - date: "2015-12-07"
    title: "Bitcoin Core capacity roadmap"
    text: "Gregory Maxwell posts “Capacity increases for the Bitcoin system” on bitcoin-dev, a capacity-increase plan built on SegWit, deployed as a soft fork. Bitcoin Core adopts it on December 21 as a statement signed by its contributors."
    source_hash: "2f135f2e7df9c2eb"
    translation_hash: "ad0b487039166540"
  - date: "2015-12-14"
    title: "BIP-0065 activated"
    text: "`OP_CHECKLOCKTIMEVERIFY` becomes a consensus rule from block 388,381. Up-to-date nodes now reject blocks with a version lower than 4."
    source_hash: "2ab20e44adba51ff"
    translation_hash: "91b08ef7a83ebd9f"
