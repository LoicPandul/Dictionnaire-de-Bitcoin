# Chronologie de Bitcoin : 2019.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2019-01-03"
    title: "BitMEX remercie Satoshi en une du Times"
    text: "Dix ans jour pour jour après le bloc genèse, BitMEX place un encart en une du Times, le journal que cite sa transaction coinbase. L'encart reproduit l'empreinte d'un bloc miné par BTC.com le 19 décembre 2018 (hauteur 554 509), dont la coinbase contient le message « ThanksSatoshi »."
    related: ["genese", "nakamoto-satoshi"]
    sources:
      - "https://forklog.com/en/?p=6410"
      - "https://mempool.space/block/554509"

  - date: "2019-01-03"
    title: "Premier Proof of Keys"
    text: "À l'appel de Trace Mayer, des détenteurs retirent leurs bitcoins des plateformes d'échange le jour anniversaire du bloc genèse, pour prouver qu'ils détiennent leurs clés et vérifier que les plateformes ont bien les fonds de leurs clients. Mayer veut en faire un rendez-vous annuel."
    related: ["proof-of-key-day", "self-custody", "reserves-fractionnaires"]
    sources:
      - "https://cryptopotato.com/the-proof-of-keys-campaign-to-gain-control-on-your-crypto-assets-what-is-it-all-about/"
      - "https://bitcoinist.com/hitbtc-trace-mayer-john-mcafee-keys/"


  - date: "2019-01-07"
    title: "Ledger présente le Nano X"
    text: "Au CES de Las Vegas, la société française Ledger présente le Nano X, un portefeuille matériel qui se connecte en Bluetooth à l'application mobile Ledger Live. Les clés privées restent dans l'appareil."
    related: ["ledger"]
    sources:
      - "https://www.ledger.com/ledger-unveils-new-nano-x-hardware-wallet-at-ces-2019"
      - "https://www.journaldugeek.com/2019/01/07/2019-ledger-lance-nano-x-hardware-wallet/"
  - date: "2019-01-13"
    title: "L'énigme de la fresque de Pascal Boyart est résolue"
    text: "Une semaine après l'avoir révélée, le peintre Pascal Boyart annonce que quelqu'un a trouvé la clé cachée dans sa fresque parisienne « La Liberté guidant le peuple 2019 », peinte pour les dix ans du bloc genèse. La récompense passe de 0,26 BTC à 0,28 BTC grâce à des dons."
    sources:
      - "https://hyperallergic.com/479404/a-street-artist-hid-over-1000-worth-of-bitcoin-in-paris-mural-and-someone-found-it/"
      - "https://bitcoinist.com/1000-bitcoin-puzzle-hidden-in-paris-street-mural-now-solved/"

  - date: "2019-01-14"
    title: "QuadrigaCX annonce la mort de Gerald Cotten"
    text: "La plateforme canadienne QuadrigaCX annonce la mort de son fondateur Gerald Cotten, survenue en Inde le 9 décembre 2018. Unique dirigeant, il était le seul à déplacer les fonds des portefeuilles froids : l'argent des clients devient inaccessible."
    related: ["custody"]
    sources:
      - "https://www.osc.ca/quadrigacxreport/"
      - "https://www.npr.org/2019/02/04/691296170/cryptocurrency-exchange-says-it-cant-access-millions-after-founder-s-unexpected"

  - date: "2019-01-19"
    title: "Départ de la Lightning Torch"
    text: "Le bitcoiner hodlonaut envoie 100 000 satoshis par Lightning à un inconnu, chargé d'ajouter 10 000 satoshis et de passer la « torche » à quelqu'un d'autre. Après 292 passages dans 56 pays, elle atteint en avril la limite de 4,29 millions de satoshis et finit chez l'association Bitcoin Venezuela."
    related: ["lightning-network"]
    sources:
      - "https://bitcoinmagazine.com/technical/lightning-torchs-bitcoin-payment-is-running-a-worldwide-marathon"
      - "https://www.btc-echo.de/bitcoins-lightning-torch-wird-immer-teurer-ist-lightning-abgebrannt/"
      - "https://bitcoinmagazine.com/culture/vidi-vici-satoshi-lightning-torch-has-reached-its-final-destination"

  - date: "2019-02-05"
    title: "QuadrigaCX placée sous protection judiciaire"
    text: "La Cour suprême de Nouvelle-Écosse accorde à QuadrigaCX la protection contre ses créanciers. Environ 115 000 clients attendent leurs fonds. La Commission des valeurs mobilières de l'Ontario chiffrera plus tard la dette à 215 millions de dollars canadiens, dont 169 millions manquants, en majorité à cause des fraudes de Cotten."
    related: ["custody"]
    sources:
      - "https://www.cbc.ca/lite/story/1.5006164"
      - "https://www.osc.ca/quadrigacxreport/"

  - date: "2019-03-01"
    title: "Sortie de c-lightning 0.7"
    text: "Blockstream publie c-lightning 0.7, qui introduit un système de greffons (*plugins*) pour étendre le nœud sans toucher à son code. C'est aussi la première version de c-lightning dont les binaires sont reproductibles."
    related: ["cln-c-lightning", "blockstream"]
    sources:
      - "https://github.com/ElementsProject/lightning/releases/tag/v0.7.0"
      - "https://bitcoinops.org/en/newsletters/2019/03/05/"

  - date: "2019-03-06"
    title: "Proposition du Great Consensus Cleanup"
    text: "Matt Corallo propose sur bitcoin-dev un soft fork de nettoyage des règles de consensus. Il corrige l'attaque *time warp*, réduit le coût de validation des pires scripts et ferme une attaque connue contre les clients légers. La proposition n'avance pas en 2019."
    related: ["consensus-cleanup", "time-warp", "soft-fork"]
    sources:
      - "https://web.archive.org/web/2022/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2019-March/016714.html"
      - "https://bitcoinops.org/en/newsletters/2019/03/12/"

  - date: "2019-03-08"
    title: "Proposition de Signet"
    text: "Karl-Johan Alm (Kalle Alm) présente Signet sur bitcoin-dev : un réseau de test où chaque bloc doit être signé par une autorité, pour offrir aux développeurs un environnement stable, sans les réorganisations du testnet. La proposition deviendra le BIP-0325."
    related: ["signet", "bip-0325"]
    sources:
      - "https://web.archive.org/web/2022/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2019-March/016734.html"
      - "https://bitcoinops.org/en/newsletters/2019/03/12/"

  - date: "2019-03-20"
    title: "Lightning Labs lance Lightning Loop"
    text: "Lightning Labs annonce Loop, un service non custodial qui échange des fonds d'un canal Lightning contre des bitcoins sur la chaîne grâce à des HTLC, sans fermer le canal. Le transfert réussit en entier ou l'utilisateur récupère ses fonds, frais de transaction mis à part."
    related: ["loop", "loop-out", "lightning-labs"]
    sources:
      - "https://lightning.engineering/posts/2019-03-20-loop/"
      - "https://bitcoinops.org/en/newsletters/2019/03/26/"

  - date: "2019-03-22"
    title: "PlanB publie le modèle stock-to-flow"
    text: "L'analyste pseudonyme PlanB publie « Modeling Bitcoin's Value with Scarcity ». Il relie la capitalisation du bitcoin à son ratio stock sur flux (25 à l'époque) et prédit, après le halving de mai 2020, une valeur de marché de 1 000 milliards de dollars, soit 55 000 dollars par bitcoin."
    sources:
      - "https://web.archive.org/web/20190324033221/https://medium.com/@100trillionUSD/modeling-bitcoins-value-with-scarcity-91fa0fc03e25"
      - "https://stephanlivera.com/episode/67/"

  - date: "2019-04-02"
    title: "Le bitcoin bondit à 5 000 dollars"
    text: "Le bitcoin gagne jusqu'à 20 % en quelques heures pendant la séance asiatique et touche 5 000 dollars sur Bitstamp, son plus haut niveau depuis fin novembre 2018, avant de retomber vers 4 730 dollars."
    sources:
      - "https://www.thejakartapost.com/news/2019/04/02/bitcoin-briefly-hits-5000-after-20-percent-surge"
      - "https://forklog.com/en/bitcoin-looks-bullish-after-shortly-breaking-the-5000-mark/"

  - date: "2019-04-02"
    title: "Proposition d'AssumeUTXO"
    text: "James O'Beirne propose sur bitcoin-dev AssumeUTXO : un nœud neuf charge un instantané de l'ensemble des UTXO pour être utilisable en quelques minutes, puis revalide toute la chaîne en arrière-plan jusqu'à confirmer l'instantané."
    related: ["assume-utxo", "bitcoin-core"]
    sources:
      - "https://web.archive.org/web/2022/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2019-April/016825.html"
      - "https://bitcoinops.org/en/newsletters/2019/04/09/"

  - date: "2019-04-16"
    title: "Sortie de LND 0.6-beta"
    text: "Lightning Labs publie LND 0.6-beta, qui introduit les sauvegardes statiques de canaux (*Static Channel Backups*) : un utilisateur qui a perdu l'état récent de ses canaux peut quand même récupérer ses fonds. La version intègre aussi Lightning Loop."
    related: ["lnd", "lightning-labs", "loop"]
    sources:
      - "https://lightning.engineering/posts/2019-04-16-lnd-v0.6/"
      - "https://bitcoinops.org/en/newsletters/2019/04/23/"

  - date: "2019-04-25"
    title: "La procureure de New York poursuit Bitfinex et Tether"
    text: "La procureure générale de New York, Letitia James, obtient une ordonnance contre Bitfinex et Tether. Elle les accuse d'avoir caché la perte de 850 millions de dollars confiés à Crypto Capital, au Panama, et d'avoir comblé le trou avec les réserves censées garantir le tether."
    sources:
      - "https://ag.ny.gov/press-release/2019/attorney-general-james-announces-court-order-against-crypto-currency-company"
      - "https://www.theblock.co/post/20978/ny-attorney-general-sues-bitfinex-and-tether"

  - date: "2019-05-02"
    title: "Sortie de Bitcoin Core 0.18.0"
    text: "Bitcoin Core 0.18.0 améliore la prise en charge des transactions partiellement signées (PSBT, BIP-0174) et des descripteurs de scripts de sortie. Ensemble, ils permettent d'utiliser le nœud avec les portefeuilles matériels via l'outil HWI."
    related: ["bitcoin-core", "psbt", "bip-0174", "output-script-descriptors", "hwi"]
    sources:
      - "https://bitcoincore.org/en/2019/05/02/release-0.18.0/"
      - "https://bitcoincore.org/en/releases/0.18.0/"
      - "https://bitcoinops.org/en/newsletters/2019/05/07/"

  - date: "2019-05-06"
    title: "Pieter Wuille propose Taproot"
    text: "Pieter Wuille publie sur bitcoin-dev les propositions bip-taproot et bip-tapscript, qui s'appuient sur bip-schnorr. Une sortie Taproot se dépense par une seule signature Schnorr ou par une branche de script cachée dans un arbre de Merkle. Ces textes deviendront les BIP-0340, BIP-0341 et BIP-0342."
    related: ["taproot", "tapscript", "schnorr-protocole", "bip-0340", "bip-0341", "bip-0342"]
    sources:
      - "https://web.archive.org/web/2022/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2019-May/016914.html"
      - "https://bitcoinops.org/en/newsletters/2019/05/14/"

  - date: "2019-05-07"
    title: "Binance piratée de 7 000 BTC"
    text: "Des pirates retirent 7 000 BTC (environ 40 millions de dollars) d'un portefeuille chaud de Binance en une seule transaction, après avoir obtenu des clés d'API et des codes 2FA de clients. Binance suspend les retraits pendant une semaine et couvre la perte avec son fonds SAFU."
    sources:
      - "https://decrypt.co/6930/binance-hack-security-breach"
      - "https://thehackernews.com/2019/05/binance-cryptocurrency-hacked.html"

  - date: "2019-05-09"
    title: "Sortie d'Eclair 0.3"
    text: "ACINQ publie Eclair 0.3, son implémentation de Lightning en Scala. Elle renforce la sécurité des sauvegardes, accepte des greffons et peut fonctionner comme service caché Tor."
    related: ["eclair", "acinq", "tor-the-onion-router"]
    sources:
      - "https://github.com/ACINQ/eclair/releases/tag/v0.3"
      - "https://bitcoinops.org/en/newsletters/2019/12/28/"

  - date: "2019-05-10"
    title: "Proposition de SIGHASH_ANYPREVOUT"
    text: "Anthony Towns propose deux nouveaux types de signature pour Tapscript, `SIGHASH_ANYPREVOUT` et `SIGHASH_ANYPREVOUTANYSCRIPT`, qui ne désignent pas l'UTXO dépensé. Héritiers de `SIGHASH_NOINPUT` (BIP-0118), ils servent surtout à rendre possible Eltoo pour Lightning."
    related: ["sighash-anyprevout", "sighash-anyprevoutanyscript", "apo-anyprevout", "bip-0118", "eltoo"]
    sources:
      - "https://web.archive.org/web/2022/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2019-May/016929.html"
      - "https://bitcoinops.org/en/newsletters/2019/05/21/"

  - date: "2019-05-20"
    title: "Jeremy Rubin propose l'ancêtre de CTV"
    text: "Jeremy Rubin propose sur bitcoin-dev l'opcode `OP_CHECKOUTPUTSHASHVERIFY`, une forme limitée de *covenant* qui impose les sorties de la transaction qui dépensera une pièce. Renommé `OP_SECURETHEBAG` en juin, il deviendra `OP_CHECKTEMPLATEVERIFY` (BIP-0119)."
    related: ["op-checktemplateverify-0xb3", "bip-0119"]
    sources:
      - "https://web.archive.org/web/2021/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2019-May/016934.html"
      - "https://bitcoinops.org/en/newsletters/2019/05/29/"

  - date: "2019-05-22"
    title: "Le Copyright Office désavoue Craig Wright"
    text: "Craig Wright annonce le 21 mai avoir enregistré auprès du Copyright Office américain des droits d'auteur sur le livre blanc et le code de Bitcoin. Le lendemain, l'office précise qu'un enregistrement ne vérifie pas qui est l'auteur d'une œuvre parue sous pseudonyme."
    related: ["nakamoto-satoshi", "bsv-bitcoin-satoshi-vision"]
    sources:
      - "https://www.copyright.gov/press-media-info/press-updates.html"
      - "https://decrypt.co/7145/copyright-office-craig-wright-bitcoin"

  - date: "2019-05-28"
    title: "Proposition d'Erlay"
    text: "Gleb Naumenko, Pieter Wuille, Gregory Maxwell, Sasha Fedorova et Ivan Beschastnikh publient Erlay, un protocole de relais des transactions par réconciliation d'ensembles (`libminisketch`). Il réduirait d'environ 84 % la bande passante des annonces et permettrait plus de connexions sortantes. Il deviendra le BIP-0330."
    related: ["erlay", "bip-0330"]
    sources:
      - "https://web.archive.org/web/2022/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2019-May/016994.html"
      - "https://bitcoinops.org/en/newsletters/2019/06/05/"

  - date: "2019-06-21"
    title: "Le bitcoin repasse 10 000 dollars"
    text: "Le cours du bitcoin dépasse 10 000 dollars pour la première fois depuis le 8 mars 2018, après une hausse de plus de 160 % en six mois."
    related: ["bull-market"]
    sources:
      - "https://news.bitcoin.com/more-than-a-year-later-btc-price-skyrockets-to-10k/"
      - "https://businesstoday.in/commodities/story/bitcoin-breaches-10000-for-the-first-time-in-15-months-heres-why-209174-2019-06-22"


  - date: "2019-06-25"
    title: "Samourai Wallet lance Whirlpool en bêta"
    text: "Samourai Wallet publie la bêta publique de Whirlpool, son implémentation de coinjoin dérivée de ZeroLink, sur ordinateur et sur Android. Le logiciel mélange les pièces de plusieurs utilisateurs pour casser le lien entre adresses d'envoi et de réception."
    related: ["whirlpool", "samourai-wallet", "pool-coinjoin"]
    sources:
      - "https://www.coindesk.com/markets/2019/06/25/samourai-wallet-releases-privacy-enhancing-coinjoin-feature"
      - "https://bitcoinmagazine.com/culture/samourai-wallets-privacy-enhancing-whirlpool-now-in-public-beta"
      - "https://en.cryptonomist.ch/2019/06/26/samourai-wallet-coinjoin/"
  - date: "2019-06-26"
    title: "Pic de l'année près de 14 000 dollars"
    text: "Le bitcoin dépasse 13 000 dollars pour la première fois depuis janvier 2018 et monte près de 13 900 dollars. Vers 20 h 45 UTC, une panne de Coinbase coïncide avec une chute d'environ 1 800 dollars en quinze minutes."
    related: ["coinbase"]
    sources:
      - "https://www.businesslive.co.za/bd/markets/2019-06-26-bitcoins-june-boom-looks-suspiciously-like-2017s-mania/"
      - "https://www.bloomberg.com/news/articles/2019-06-27/a-1-800-drop-in-minutes-bitcoin-volatility-is-on-full-display"
      - "https://www.indianweb2.com/2019/06/bitcoin-price-drops-18k-in-15-minutes.html"

  - date: "2019-07-02"
    title: "Sortie de LND 0.7-beta et des watchtowers"
    text: "Lightning Labs publie LND 0.7-beta, qui intègre des tours de guet (*watchtowers*) altruistes : un tiers surveille les canaux d'un utilisateur hors ligne et diffuse la transaction de pénalité si son pair publie un ancien état."
    related: ["lnd", "watchtower", "lightning-labs"]
    sources:
      - "https://lightning.engineering/posts/2019-07-02-lnd-v0.7/"
      - "https://github.com/lightningnetwork/lnd/releases/tag/v0.7.0-beta"
      - "https://bitcoinops.org/en/newsletters/2019/07/03/"

  - date: "2019-07-11"
    title: "Piratage de Bitpoint"
    text: "La plateforme japonaise Bitpoint découvre une sortie frauduleuse de fonds de ses portefeuilles chauds, dont 1 225 BTC. Le vol total, toutes cryptomonnaies confondues, atteint environ 3,5 milliards de yens (32 millions de dollars), dont 2,5 milliards appartenant aux clients. Bitpoint suspend tous ses services."
    sources:
      - "https://www.financemagnates.com/cryptocurrency/news/bitpoint-resuming-trading-services-amid-hack/"
      - "https://www.bitdefender.com/blog/hotforsecurity/hackers-steal-32-million-from-japanese-cryptocurrency-exchange-bitpoint"

  - date: "2019-07-12"
    title: "Bitcoin Core accepte les compilations Guix"
    text: "Bitcoin Core fusionne la PR #15277 de Carl Dong, qui permet de compiler les binaires Linux de façon reproductible avec GNU Guix. Plus simple à installer que Gitian, Guix dépend aussi de beaucoup moins de paquets à qui faire confiance."
    related: ["bitcoin-core"]
    sources:
      - "https://github.com/bitcoin/bitcoin/pull/15277"
      - "https://bitcoinops.org/en/newsletters/2019/07/17/"

  - date: "2019-08-07"
    title: "Bryan Bishop décrit des coffres sans covenant"
    text: "Bryan Bishop publie sur bitcoin-dev une méthode de coffre-fort (*vault*) à transactions présignées et clés supprimées, sans nouvel opcode. Un voleur de la clé habituelle ne peut retirer qu'une part limitée des fonds, et le propriétaire dispose d'un délai pour les rapatrier vers une clé de secours."
    related: ["vault"]
    sources:
      - "https://mailing-list.bitcoindevs.xyz/bitcoindev/CABaSBawe_oF_zoso2RQBX+7OWDoCwC7T2MeKSX9fYRUQaY_xmg@mail.gmail.com/"
      - "https://bitcoinops.org/en/newsletters/2019/08/14/"

  - date: "2019-08-08"
    title: "Lancement de Blockstream Mining et Blockstream Pool"
    text: "Blockstream ouvre un service d'hébergement de machines de minage au Québec et en Géorgie (États-Unis), soit plus de 300 MW, et un pool fondé sur le protocole BetterHash. Le Fidelity Center for Applied Technology figure parmi les premiers clients."
    related: ["blockstream", "mining-pool"]
    sources:
      - "https://web.archive.org/web/2019/https://blockstream.com/2019/08/08/en-mining-launch/"
      - "https://forklog.com/news/blockstream-zapustila-dva-krupnyh-majning-tsentra"
      - "https://bitcoinmagazine.com/business/blockstream-mining-a-grassroots-vision-for-redistributing-hashrate"

  - date: "2019-09-23"
    title: "Bakkt lance ses contrats à terme livrés en bitcoins"
    text: "Bakkt, filiale d'Intercontinental Exchange (maison mère du NYSE), ouvre ses contrats à terme sur le bitcoin réglés en bitcoins réels, et non en dollars. Le premier jour, 72 contrats d'un bitcoin s'échangent (71 mensuels, un journalier)."
    sources:
      - "https://www.theblock.co/linked/40798/bakkt-sees-72-bitcoin-future-contracts-traded-on-first-day-of-launch"
      - "https://www.crowdfundinsider.com/2019/09/151886-highly-anticipated-digital-asset-trading-platform-bakkt-launches-only-26-btc-in-volume-traded-so-far/"

  - date: "2019-09-27"
    title: "Divulgation de failles dans trois implémentations Lightning"
    text: "Rusty Russell publie le détail des failles CVE-2019-12998, CVE-2019-12999 et CVE-2019-13000 : c-lightning, LND et Eclair ne vérifiaient pas toujours que la transaction de financement d'un canal payait le bon script et le bon montant. Un attaquant pouvait ouvrir un faux canal et voler des fonds relayés."
    related: ["lightning-network", "cln-c-lightning", "lnd", "eclair"]
    sources:
      - "https://web.archive.org/web/2022/https://lists.linuxfoundation.org/pipermail/lightning-dev/2019-September/002174.html"
      - "https://bitcoinops.org/en/newsletters/2019/10/02/"

  - date: "2019-10-09"
    title: "La SEC rejette l'ETF bitcoin de Bitwise"
    text: "La SEC refuse la cotation sur NYSE Arca de l'ETF bitcoin de Bitwise. Elle estime que la Bourse n'a pas démontré que le produit serait protégé contre la fraude et la manipulation des cours. Bitwise soutenait pourtant que 95 % des volumes déclarés du marché au comptant étaient fictifs."
    related: ["etf"]
    sources:
      - "https://bitcoinmagazine.com/markets/sec-rejects-bitwises-bitcoin-etf-proposal"
      - "https://www.financemagnates.com/cryptocurrency/news/sec-rejects-bitwises-bitcoin-etf-proposal/"

  - date: "2019-10-16"
    title: "Démantèlement de Welcome to Video"
    text: "Le département de la Justice américain annonce la fermeture de Welcome to Video, site pédocriminel du darknet payé en bitcoins. L'analyse des paiements sur la chaîne et les données d'identité des plateformes d'échange mènent à 337 arrestations dans 38 pays et au sauvetage de 23 enfants."
    related: ["analyse-de-chaine", "kyc-know-your-customer"]
    sources:
      - "https://www.justice.gov/opa/pr/south-korean-national-and-hundreds-others-charged-worldwide-takedown-largest-darknet-child"
      - "https://www.vice.com/en/article/feds-bust-one-of-the-dark-webs-biggest-child-porn-sites-thanks-to-tremendously-bad-opsec"
      - "https://www.hppr.org/2019-10-16/one-of-the-worst-forms-of-evil-more-than-330-arrested-in-child-porn-site-bust"

  - date: "2019-10-25"
    title: "Plus forte hausse journalière depuis 2011"
    text: "Dans la nuit du 25 au 26 octobre, le bitcoin passe d'environ 7 400 dollars à 10 350 dollars sur Bitstamp, sa plus forte hausse sur une journée depuis 2011. Le marché l'attribue surtout à un discours de Xi Jinping favorable à la blockchain."
    sources:
      - "https://cointelegraph.com/markets/bitcoin-price-soars-42-to-10-500-biggest-daily-gain-since-2011"
      - "https://cryptopotato.com/bitcoins-price-touches-10350-recording-its-highest-daily-increase-since-2011/"

  - date: "2019-11-19"
    title: "Bitcoin Core se passe d'OpenSSL"
    text: "Bitcoin Core fusionne la PR #17265, qui retire la dépendance à OpenSSL présente depuis la version 0.1 de 2009. La bibliothèque avait causé des failles de consensus et des fuites de mémoire. La prise en charge de BIP-0070, qui en dépendait, avait été retirée le 26 octobre."
    related: ["bitcoin-core", "bip-0070"]
    sources:
      - "https://github.com/bitcoin/bitcoin/pull/17265"
      - "https://bitcoinops.org/en/newsletters/2019/11/27/"

  - date: "2019-11-24"
    title: "Sortie de Bitcoin Core 0.19.0.1"
    text: "Bitcoin Core 0.19.0.1 introduit la règle de relais CPFP *carve-out*, utile aux canaux Lightning, et calcule les filtres de blocs BIP-0158. Il désactive par défaut les filtres de Bloom BIP-0037 et le protocole de paiement BIP-0070, et l'interface graphique crée des adresses `bech32` par défaut."
    related: ["bitcoin-core", "cpfp-child-pay-for-parent", "bip-0158", "bip-0037", "bip-0070", "bloom-filter", "bech32-et-bech32m"]
    sources:
      - "https://bitcoincore.org/en/2019/11/24/release-0.19.0/"
      - "https://bitcoincore.org/en/releases/0.19.0.1/"
      - "https://bitcoinops.org/en/newsletters/2019/11/27/"

  - date: "2019-12-16"
    title: "Sortie de c-lightning 0.8 et paiements multichemins"
    text: "Blockstream publie c-lightning 0.8, qui prend en charge les paiements multichemins (MPP) : un paiement se découpe en plusieurs parts routées par des canaux différents. Le logiciel passe aussi par défaut sur le réseau principal et accepte PostgreSQL comme base de données."
    related: ["cln-c-lightning", "mpp-multi-path-payments", "blockstream"]
    sources:
      - "https://github.com/ElementsProject/lightning/releases/tag/v0.8.0"
      - "https://bitcoinops.org/en/newsletters/2019/12/28/"
