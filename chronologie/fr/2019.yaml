# Chronologie de Bitcoin : 2019.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2019-03-06"
    title: "Proposition du Great Consensus Cleanup"
    text: "Matt Corallo propose sur bitcoin-dev un soft fork de nettoyage des règles de consensus. Il corrige l'attaque *time warp*, réduit le coût de validation des pires scripts et ferme une attaque connue contre les clients légers. La proposition n'avance pas en 2019."
    related: ["consensus-cleanup", "time-warp", "soft-fork"]
    sources:
      - "https://web.archive.org/web/2022/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2019-March/016714.html"
      - "https://bitcoinops.org/en/newsletters/2019/03/12/"

  - date: "2019-05-06"
    title: "Pieter Wuille propose Taproot"
    text: "Pieter Wuille publie sur bitcoin-dev les propositions bip-taproot et bip-tapscript, qui s'appuient sur bip-schnorr. Une sortie Taproot se dépense par une seule signature Schnorr ou par une branche de script cachée dans un arbre de Merkle. Ces textes deviendront les BIP-0340, BIP-0341 et BIP-0342."
    related: ["taproot", "tapscript", "schnorr-protocole", "bip-0340", "bip-0341", "bip-0342"]
    sources:
      - "https://web.archive.org/web/2022/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2019-May/016914.html"
      - "https://bitcoinops.org/en/newsletters/2019/05/14/"

  - date: "2019-05-10"
    title: "Proposition de SIGHASH_ANYPREVOUT"
    text: "Anthony Towns propose deux nouveaux types de signature pour Tapscript, `SIGHASH_ANYPREVOUT` et `SIGHASH_ANYPREVOUTANYSCRIPT`, qui ne désignent pas l'UTXO dépensé. Héritiers de `SIGHASH_NOINPUT` (BIP-0118), ils servent surtout à rendre possible Eltoo pour Lightning."
    related: ["sighash-anyprevout", "sighash-anyprevoutanyscript", "apo-anyprevout", "bip-0118", "eltoo"]
    sources:
      - "https://web.archive.org/web/2022/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2019-May/016929.html"
      - "https://bitcoinops.org/en/newsletters/2019/05/21/"
