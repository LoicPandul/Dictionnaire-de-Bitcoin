# Chronologie de Bitcoin : 2016.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2016-02-21"
    title: "Accord de Hong Kong"
    text: "À Cyberport, des mineurs, des entreprises et cinq contributeurs de Bitcoin Core signent une feuille de route : sortie de SegWit, puis un *hard fork* proposé dans les trois mois suivants, avec environ 2 Mo de données hors témoin et 4 Mo au plus au total."
    related: ["hong-kong-roundtable", "segwit", "hard-fork", "blocksize-war"]
    sources:
      - "https://medium.com/@bitcoinroundtable/bitcoin-roundtable-consensus-266d475a61ff"
      - "https://cointelegraph.com/news/bitcoin-conference-hong-kong-hard-fork"
  - date: "2016-05-02"
    title: "Craig Wright se dit Satoshi Nakamoto"
    text: "L'Australien Craig Wright affirme à la BBC, à The Economist et à GQ être Satoshi Nakamoto. Le même jour, Gavin Andresen écrit sur son blog qu'il le croit, après une démonstration privée à Londres."
    related: ["nakamoto-satoshi"]
    sources:
      - "https://www.bbc.com/news/technology-36168863"
      - "http://gavinandresen.ninja/satoshi"
      - "https://www.theguardian.com/technology/2016/may/02/craig-wright-bitcoin-founder-satoshi-nakamoto-claim"
  - date: "2016-06-24"
    title: "SegWit fusionné dans Bitcoin Core"
    text: "Wladimir van der Laan fusionne la *pull request* 8149 de Pieter Wuille : le code de SegWit entre dans la branche principale de Bitcoin Core. Ses paramètres d'activation sur le réseau principal restent à définir."
    related: ["segwit", "bip-0141", "bitcoin-core"]
    sources:
      - "https://github.com/bitcoin/bitcoin/pull/8149"
      - "https://bitcoinmagazine.com/technical/segregated-witness-will-be-merged-into-bitcoin-core-release-soon-1466787770"
  - date: "2016-07-04"
    title: "Activation du soft fork CSV"
    text: "Le *soft fork* CSV, qui regroupe les BIP-0068, BIP-0112 et BIP-0113, devient actif au bloc 419 328. Il ajoute les verrous temporels relatifs, dont l'opcode `OP_CHECKSEQUENCEVERIFY`."
    related: ["soft-fork", "bip-0068", "bip-0112", "bip-0113", "op-checksequenceverify-0xb2", "timelock"]
    sources:
      - "https://mempool.space/block/000000000000000004a1b34462cb8aeebd5799177f7a29cf28f2d1961716b5b5"
      - "https://blockstream.info/block/000000000000000004a1b34462cb8aeebd5799177f7a29cf28f2d1961716b5b5"
      - "https://github.com/bitcoin/bitcoin/blob/master/src/kernel/chainparams.cpp"
  - date: "2016-07-09"
    title: "Deuxième halving"
    text: "Le bloc 420 000, miné à 16 h 46 UTC, déclenche le deuxième halving : la subvention de bloc passe de 25 à 12,5 BTC."
    related: ["halving", "subvention-de-bloc", "recompense-de-bloc"]
    sources:
      - "https://mempool.space/block/000000000000000002cce816c0ab2c5c269cb081896b7dcb34b8422d6b74ffa1"
      - "https://blockstream.info/block/000000000000000002cce816c0ab2c5c269cb081896b7dcb34b8422d6b74ffa1"
  - date: "2016-08-02"
    title: "Piratage de Bitfinex"
    text: "Bitfinex, plateforme basée à Hong Kong, suspend ses échanges après un piratage : 119 756 BTC, environ 72 millions USD, sont dérobés dans les portefeuilles séparés de ses clients."
    sources:
      - "https://fortune.com/2016/08/03/bitcoin-stolen-bitfinex-hack-hong-kong"
      - "https://www.pcworld.com/article/3103609/hacking/bitcoin-exchange-bitfinex-apparently-loses-63-million-to-hackers.html"
  - date: "2016-10-27"
    title: "Bitcoin Core 0.13.1 déploie SegWit"
    text: "Bitcoin Core 0.13.1 fixe le déploiement de SegWit (BIP-0141). À partir du 15 novembre 2016, les mineurs le signalent avec le bit 1 ; si 95 % des blocs d'une période de 2 016 blocs le font, le *soft fork* se verrouille."
    related: ["bitcoin-core", "segwit", "bip-0141", "bip-0009", "soft-fork"]
    sources:
      - "https://bitcoincore.org/en/releases/0.13.1/"
      - "https://mailing-list.bitcoindevs.xyz/bitcoindev/20161027184235.GA30297@amethyst.visucore.com/"
      - "https://github.com/bitcoin/bips/blob/master/bip-0141.mediawiki"
