    text: "Donald Trump gracie Changpeng Zhao, fondateur de Binance, condamné en avril 2024 à 4 mois de prison et 50 millions de dollars d'amende pour défaut de programme anti-blanchiment. La Maison-Blanche annonce la grâce le 23 octobre."
