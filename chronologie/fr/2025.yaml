# Chronologie de Bitcoin : 2025.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2025-01-20"
    title: "Record du bitcoin le jour de l'investiture de Trump"
    text: "Quelques heures avant l'investiture de Donald Trump, qui a promis de déréglementer le secteur, le bitcoin atteint un nouveau record à 109 241 dollars."
    related: ["ath-all-time-high"]
    sources:
      - "https://www.malaymail.com/news/money/2025/01/20/bitcoin-hits-record-above-us109000-awaiting-trump/163954"
      - "https://www.business-standard.com/markets/cryptocurrency/bitcoin-rises-to-fresh-record-over-109k-ahead-of-trump-inauguration-in-us-125012000580_1.html"
  - date: "2025-01-21"
    title: "Enlèvement de David Balland, cofondateur de Ledger"
    text: "David Balland, cofondateur de Ledger, et sa compagne sont enlevés à l'aube à leur domicile du Cher. Les ravisseurs exigent une forte rançon en cryptomonnaies. La gendarmerie libère David Balland le lendemain."
    related: ["ledger", "wrench-attack"]
    sources:
      - "https://www.maddyness.com/2025/01/23/fin-de-langoisse-autour-de-ledger-le-co-fondateur-kidnappe-a-ete-libere/"
      - "https://decrypt.co/302430/ledger-co-founder-kidnapped-crypto-ransom"
  - date: "2025-01-21"
    title: "Grâce de Ross Ulbricht"
    text: "Au lendemain de son investiture, Donald Trump accorde une grâce totale et inconditionnelle à Ross Ulbricht, fondateur du marché noir Silk Road. Condamné en 2015 à la prison à vie, Ulbricht sort après plus de 11 ans de détention."
    related: ["silk-road"]
    sources:
      - "https://www.justice.gov/pardon/clemency-grants-president-donald-j-trump-2025-present"
      - "https://www.aljazeera.com/economy/2025/1/22/trump-pardons-ross-ulbricht-creator-of-dark-web-marketplace-silk-road"
      - "https://thehackernews.com/2025/01/president-trump-pardons-silk-road.html"
  - date: "2025-01-23"
    title: "Décret de Trump sur les actifs numériques"
    text: "Donald Trump signe le décret 14178, qui interdit toute monnaie numérique de banque centrale aux États-Unis et défend le droit de miner comme celui de garder soi-même ses actifs. Un groupe de travail doit étudier un stock national d'actifs numériques constitué des saisies de l'État."
    related: ["cbdc", "self-custody"]
    sources:
      - "https://www.govinfo.gov/content/pkg/DCPD-202500169/html/DCPD-202500169.htm"
      - "https://www.whitehouse.gov/presidential-actions/2025/01/strengthening-american-leadership-in-digital-financial-technology/"
      - "https://www.wilmerhale.com/en/insights/client-alerts/20250210-president-trump-signs-executive-order-to-strengthen-american-leadership-in-digital-financial-technology"
  - date: "2025-01-29"
    title: "Le Salvador rend l'acceptation du bitcoin volontaire"
    text: "Pour obtenir un prêt de 1,4 milliard de dollars du FMI, l'Assemblée législative du Salvador réforme la loi bitcoin de 2021. Le bitcoin garde le cours légal, mais son acceptation devient volontaire et réservée au secteur privé, et l'État ne l'accepte plus pour le paiement des impôts."
    related: ["cours-legal"]
    sources:
      - "https://diario.elmundo.sv/politica/asamblea-reforma-ley-bitcoin-y-elimina-la-obligacion-de-aceptar-pagos-con-la-criptomoneda"
      - "https://www.theblock.co/post/337885/el-salvador-passes-bill-to-revise-bitcoin-adoption-strategy-per-imf-deal-reuters"
      - "https://finance.yahoo.com/news/el-salvador-changes-bitcoin-rules-164742636.html"
  - date: "2025-01-30"
    title: "Tether annonce l'USDT sur Lightning"
    text: "Au Plan B Forum du Salvador, Paolo Ardoino (Tether) et Elizabeth Stark (Lightning Labs) annoncent l'arrivée de l'USDT sur la chaîne Bitcoin et sur le Lightning Network, grâce au protocole Taproot Assets."
    related: ["taproot-assets-protocol", "stablecoin", "lightning-labs", "lightning-network"]
    sources:
      - "https://tether.io/news/tether-brings-usdt-to-bitcoins-lightning-network-ushering-in-a-new-era-of-unstoppable-technology/"
      - "https://www.nobsbitcoin.com/tether-lightning-labs-announce-usdt-on-lightning-network/"
  - date: "2025-02-05"
    title: "MicroStrategy devient Strategy"
    text: "La société de Michael Saylor adopte le nom commercial Strategy et un logo en forme de B, avec l'orange comme couleur principale. Elle détient alors 471 107 BTC et se présente comme la première et la plus grande « Bitcoin Treasury Company »."
    related: ["bitcoin-treasury-company"]
    sources:
      - "https://www.fool.com/earnings/call-transcripts/2025/02/05/microstrategy-mstr-q4-2024-earnings-call-transcrip/"
      - "https://qz.com/microstrategy-rebrands-strategy-bitcoin-michael-saylor-1851756216"
      - "https://decrypt.co/304632/bitcoin-giant-microstrategy-rebrands-strategy"
  - date: "2025-02-21"
    title: "Piratage de Bybit"
    text: "Des pirates détournent un transfert depuis un portefeuille à froid de la plateforme Bybit et emportent environ 401 000 ETH, près de 1,5 milliard de dollars, le plus gros vol jamais subi par une plateforme d'échange. Le 26 février, le FBI l'attribue à la Corée du Nord (groupe TraderTraitor)."
    related: ["cold-wallet"]
    sources:
      - "https://therecord.media/hackers-drained-bybit-crypto-exchange-hack"
      - "https://www.ic3.gov/PSA/2025/PSA250226"
  - date: "2025-03-06"
    title: "Création de la réserve stratégique de bitcoin des États-Unis"
    text: "Donald Trump signe le décret qui crée la réserve stratégique de bitcoin, alimentée par les bitcoins confisqués par l'État fédéral, qui ne doivent pas être vendus. Les secrétaires au Trésor et au Commerce doivent chercher comment en acquérir davantage sans coût pour le contribuable."
    related: ["reserve-strategique-de-bitcoin"]
    sources:
      - "https://www.whitehouse.gov/presidential-actions/2025/03/establishment-of-the-strategic-bitcoin-reserve-and-united-states-digital-asset-stockpile/"
      - "https://www.whitehouse.gov/fact-sheets/2025/03/fact-sheet-president-donald-j-trump-establishes-the-strategic-bitcoin-reserve-and-u-s-digital-asset-stockpile/"
      - "https://www.rte.ie/news/business/2025/0307/1500739-trump-signs-order-to-establish-strategic-bitcoin-reserve/"
  - date: "2025-04-07"
    title: "Le ministère de la Justice américain abandonne la « régulation par les poursuites »"
    text: "Le procureur général adjoint Todd Blanche dissout l'unité crypto du ministère de la Justice (NCET). Son mémo demande de ne plus poursuivre les plateformes d'échange, les mélangeurs ni les portefeuilles hors ligne pour les actes de leurs utilisateurs."
    related: ["melangeur"]
    sources:
      - "https://www.justice.gov/dag/media/1395781/dl?inline"
      - "https://fortune.com/crypto/2025/04/08/doj-ncet-disbands-memo-todd-blanche-trump/"
      - "https://www.steptoe.com/en/news-publications/blockchain-blog/deputy-attorney-general-memorandum-ending-regulation-by-prosecution.html"
  - date: "2025-04-14"
    title: "Sortie de Bitcoin Core 29.0"
    text: "Bitcoin Core 29.0 remplace UPnP, en cause dans plusieurs failles passées, par sa propre implémentation de PCP et NAT-PMP. Le nœud demande aussi les parents d'une transaction orpheline à tous les pairs qui l'ont annoncée, et la compilation passe d'Autotools à CMake."
    related: ["bitcoin-core"]
    sources:
      - "https://bitcoincore.org/en/releases/29.0/"
      - "https://bitcoinops.org/en/newsletters/2025/04/18/"
  - date: "2025-04-17"
    title: "Début du débat sur la limite des sorties OP_RETURN"
    text: "Sur la liste bitcoindev, Antoine Poinsot propose de supprimer les règles de standardisation qui limitent les sorties `OP_RETURN` à une par transaction et à 83 octets de script. Le 27 avril, Peter Todd ouvre la *pull request* #32359. Des opposants passent à Bitcoin Knots, qui garde ces limites."
    related: ["op-return-0x6a", "regles-de-standardisation", "bitcoin-knots", "politique-de-mempool"]
    sources:
      - "https://mailing-list.bitcoindevs.xyz/bitcoindev/rhfyCHr4RfaEalbfGejVdolYCVWIyf84PT2062DQbs5-eU8BPYty5sGyvI3hKeRZQtVC7rn_ugjUWFnWCymz9e9Chbn7FjWJePllFhZRKYk=@protonmail.com/T/"
      - "https://github.com/bitcoin/bitcoin/pull/32359"
      - "https://bitcoinops.org/en/newsletters/2025/05/02/"
      - "https://forklog.com/en/core-vs-knots-the-83-byte-row-that-split-the-bitcoin-community"
  - date: "2025-04-23"
    title: "Annonce de Twenty One Capital"
    text: "Tether, Bitfinex et SoftBank lancent Twenty One Capital, dirigée par Jack Mallers, par fusion avec le SPAC Cantor Equity Partners de Cantor Fitzgerald. La société doit démarrer avec plus de 42 000 BTC, ce qui en ferait la troisième trésorerie en bitcoin du monde."
    related: ["bitcoin-treasury-company"]
    sources:
      - "https://www.sec.gov/Archives/edgar/data/1865602/000121390025034374/ea023922201ex99-1_cantor.htm"
      - "https://finance.yahoo.com/news/softbank-backed-consortium-partners-spac-133911271.html"
  - date: "2025-05-06"
    title: "Le New Hampshire autorise une réserve en bitcoin"
    text: "La gouverneure Kelly Ayotte signe la loi HB 302 : le trésorier peut placer jusqu'à 5 % des fonds publics en métaux précieux ou en actifs numériques de plus de 500 milliards de dollars de capitalisation, soit le seul bitcoin. C'est la première loi de ce type aux États-Unis."
    related: ["reserve-strategique-de-bitcoin"]
    sources:
      - "https://decrypt.co/318147/new-hampshire-signs-bitcoin-reserve-bill"
      - "https://bitcoinmagazine.com/news/new-hampshire-becomes-first-state-to-pass-strategic-bitcoin-reserve-bill-into-law"
  - date: "2025-05-13"
    title: "Tentative d'enlèvement à Paris contre la famille du PDG de Paymium"
    text: "Quatre hommes cagoulés attaquent en pleine rue, dans le 11e arrondissement de Paris, la fille de Pierre Noizat, PDG de la plateforme Paymium, son mari et leur enfant. Le mari, aidé de voisins, les met en fuite. L'affaire suit plusieurs enlèvements visant le milieu des cryptomonnaies en France depuis janvier."
    related: ["wrench-attack"]
    sources:
      - "https://www.thelocal.fr/20250516/french-crypto-boss-hails-heroic-duo-for-foiling-kidnap-bid"
      - "https://www.occrp.org/en/news/france-over-20-arrested-in-connection-to-crypto-related-kidnappings"
  - date: "2025-05-15"
    title: "Fuite de données de clients chez Coinbase"
    text: "Coinbase révèle que des malfaiteurs ont payé des agents de support hors des États-Unis pour extraire des données de clients, puis exigé une rançon de 20 millions de dollars. La plateforme refuse de payer et estime le coût de l'incident entre 180 et 400 millions de dollars."
    related: ["coinbase", "kyc-know-your-customer"]
    sources:
      - "https://www.sec.gov/Archives/edgar/data/1679788/000167978825000094/coin-20250514.htm"
      - "https://www.cnbc.com/2025/05/15/coinbase-says-hackers-bribed-staff-to-steal-customer-data-and-are-demanding-20-million-ransom.html"
  - date: "2025-05-16"
    title: "Steak 'n Shake accepte le bitcoin par Lightning"
    text: "La chaîne de restauration rapide américaine Steak 'n Shake accepte désormais les paiements en bitcoin sur le réseau Lightning dans ses restaurants des États-Unis, une semaine après l'avoir annoncé."
    related: ["lightning-network", "commercant"]
    sources:
      - "https://bitcoinmagazine.com/news/steak-n-shake-now-accepting-bitcoin-via-lightning-network-across-u-s-locations"
      - "https://decrypt.co/318712/steak-n-shake-to-roll-out-us-bitcoin-payments-nationwide"
  - date: "2025-05-28"
    title: "JD Vance et le Pakistan à la conférence Bitcoin 2025"
    text: "À la conférence Bitcoin 2025 de Las Vegas, le vice-président américain JD Vance affirme que les cryptomonnaies ont « enfin un champion et un allié à la Maison-Blanche ». Le même jour, Bilal Bin Saqib, conseiller du Premier ministre pakistanais, annonce une réserve stratégique de bitcoin pour son pays."
    related: ["reserve-strategique-de-bitcoin"]
    sources:
      - "https://bitcoinmagazine.com/news/jd-vance-says-bitcoin-finally-has-a-champion-in-the-white-house"
      - "https://www.theblock.co/news/regulation/2025-05-28-jd-vance-calls-for-market-structure-bill-at-bitcoin-2025-says-trump-administration-will-fire-anti-crypto-regulators-356074"
      - "https://www.theblock.co/news/ecosystems/2025-05-28-pakistan-is-setting-up-a-government-lead-strategic-bitcoin-reserve-pakistan-crypto-council-ceo-bilal-bin-saqib-says-356116"
      - "https://decrypt.co/322534/pakistan-launch-bitcoin-reserve-crypto-minister"
  - date: "2025-06-09"
    title: "Lettre ouverte pour activer CTV et CSFS"
    text: "Des dizaines de développeurs et d'entreprises signent une lettre, publiée par James O'Beirne, qui juge que la meilleure prochaine étape pour Bitcoin serait d'activer `OP_CHECKTEMPLATEVERIFY` (BIP-0119) et `OP_CHECKSIGFROMSTACK` (BIP-0348). Elle demande aux contributeurs de Bitcoin Core d'en prioriser la revue et l'intégration dans les 6 mois."
    related: ["op-checktemplateverify-0xb3", "op-checksigfromstack-0xcc", "soft-fork", "covenant"]
    sources:
      - "https://ctv-csfs.com/"
      - "https://groups.google.com/g/bitcoindev/c/KJF6A55DPJ8"
  - date: "2025-06-09"
    title: "Bitcoin Core lève la limite des sorties OP_RETURN"
    text: "Gloria Zhao fusionne la *pull request* #32406 de Greg Sanders : la valeur par défaut de `-datacarriersize` passe de 83 à 100 000 octets, et une transaction peut contenir plusieurs sorties `OP_RETURN`. Le changement est prévu pour Bitcoin Core 30.0."
    related: ["op-return-0x6a", "bitcoin-core", "regles-de-standardisation"]
    sources:
      - "https://github.com/bitcoin/bitcoin/pull/32406"
      - "https://bitcoinops.org/en/newsletters/2025/06/13/"
      - "https://forklog.com/en/bitcoin-core-developers-release-controversial-update/"
  - date: "2025-06-20"
    title: "Le Texas crée sa réserve stratégique de bitcoin"
    text: "Le gouverneur Greg Abbott signe la loi SB 21, qui crée la Texas Strategic Bitcoin Reserve, un fonds placé sous l'autorité du contrôleur des comptes publics et destiné à investir en cryptomonnaies. La loi entre en vigueur immédiatement."
    related: ["reserve-strategique-de-bitcoin"]
    sources:
      - "https://capitol.texas.gov/BillLookup/History.aspx?LegSess=89R&Bill=SB21"
      - "https://www.theblock.co/post/359089/texas-governor-greg-abbott-signs-strategic-bitcoin-reserve-bill-into-law"
      - "https://news.bloomberglaw.com/tech-and-telecom-law/texas-gov-abbott-signs-bill-to-create-state-bitcoin-reserve"
  - date: "2025-07-14"
    title: "Le bitcoin dépasse 120 000 dollars"
    text: "Le bitcoin franchit pour la première fois 120 000 dollars, puis 123 000 dollars dans la journée. C'est le premier jour de la « Crypto Week », la semaine que la Chambre des représentants américaine consacre à plusieurs lois sur les cryptomonnaies."
    related: ["ath-all-time-high", "bull-market"]
    sources:
      - "https://www.coindesk.com/markets/2025/07/14/bitcoin-hits-new-all-time-high-above-120k-as-us-inflation-data-looms"
      - "https://www.cnbc.com/2025/07/14/bitcoin-hits-new-all-time-high-above-120000-fueled-by-etf-inflows-crypto.html"
      - "https://bitcoinmagazine.com/news/bitcoin-sets-a-new-123k-all-time-high-as-congress-prepares-for-crypto-week"
  - date: "2025-07-18"
    title: "Trump promulgue le GENIUS Act"
    text: "Donald Trump signe le GENIUS Act, première loi fédérale américaine sur les *stablecoins* : réserves à 100 % en dollars ou en bons du Trésor à court terme, composition publiée chaque mois. La Chambre l'avait adoptée la veille par 308 voix contre 122, après le Sénat (68 contre 30)."
    related: ["stablecoin"]
    sources:
      - "https://www.whitehouse.gov/fact-sheets/2025/07/fact-sheet-president-donald-j-trump-signs-genius-act-into-law/"
      - "https://www.coindesk.com/policy/2025/07/18/trump-signs-genius-act-into-law-elevating-first-major-crypto-effort-to-become-policy"
  - date: "2025-07-25"
    title: "Galaxy vend 80 000 BTC pour un investisseur de l'ère Satoshi"
    text: "Galaxy Digital annonce avoir vendu plus de 80 000 BTC, soit plus de 9 milliards de dollars, pour un investisseur de l'ère Satoshi qui organise sa succession. Ces bitcoins, reçus en 2011, avaient quitté le 4 juillet huit adresses restées inactives plus de 14 ans."
    related: ["whale"]
    sources:
      - "https://www.galaxy.com/newsroom/galaxy-executes-one-of-the-largest-notional-bitcoin-transactions"
      - "https://www.dlnews.com/articles/markets/bitcoin-shrugs-off-9bn-dollar-galaxy-dump-with-barely-a-blip/"
      - "https://www.coindesk.com/markets/2025/07/05/eight-bitcoin-wallets-move-80000-btc-in-largest-ever-satoshi-era-transfers"
  - date: "2025-07-30"
    title: "Les fondateurs de Samourai Wallet plaident coupables"
    text: "Keonne Rodriguez et William Lonergan Hill plaident coupables, devant un tribunal fédéral de New York, de complot en vue d'exploiter une entreprise de transmission d'argent ayant transféré des fonds d'origine criminelle. Ils acceptent de confisquer 237 832 360,55 dollars, et l'accusation de blanchiment est abandonnée."
    related: ["samourai-wallet", "whirlpool"]
    sources:
      - "https://www.justice.gov/usao-sdny/pr/founders-samourai-wallet-cryptocurrency-mixing-service-plead-guilty"
      - "https://decrypt.co/332719/bitcoin-app-samourai-founders-5-years-prison-guilty-plea"
  - date: "2025-07-31"
    title: "Simplicity arrive sur Liquid"
    text: "Blockstream active Simplicity sur le réseau principal de Liquid, sa *sidechain* de Bitcoin. Ce langage de contrats volontairement non Turing-complet, sans récursion ni boucle non bornée, est l'aboutissement d'un projet que Blockstream a lancé en 2017."
    related: ["simplicity", "liquid-network", "blockstream"]
    sources:
      - "https://docs.simplicity-lang.org/news/2025/07/31/simplicity-launches-on-liquid-mainnet/"
      - "https://www.theblock.co/post/365054/blockstream-launches-simplicity-smart-contract-language-on-bitcoin-l2-liquid-network"
      - "https://blog.blockstream.com/blockstream-quarterly-update-q3-2025/"
  - date: "2025-10-06"
    title: "Le bitcoin dépasse 126 000 dollars"
    text: "Le bitcoin dépasse 126 000 dollars pour la première fois de son histoire et touche 126 223 dollars selon Reuters. La semaine précédente, les ETF bitcoin au comptant américains ont reçu 3,24 milliards de dollars d'entrées nettes, leur record de l'année."
    related: ["ath-all-time-high", "etf"]
    sources:
      - "https://www.kitco.com/news/off-the-wire/2025-10-07/global-crypto-etfs-attract-record-595-billion-bitcoin-scales-new-highs"
      - "https://www.coindesk.com/markets/2025/10/27/how-october-was-the-most-destructive-month-in-recent-memory-for-crypto-traders"
      - "https://www.fxstreet.com/cryptocurrencies/news/breaking-bitcoin-hits-new-all-time-high-following-largest-etf-inflow-in-2025-202510061758"
  - date: "2025-10-08"
    title: "Le fonds souverain du Luxembourg investit dans le bitcoin"
    text: "En présentant le budget 2026 à la Chambre des députés, le ministre des Finances Gilles Roth annonce que le Fonds souverain intergénérationnel (FSIL) a placé 1 % de son portefeuille dans des ETF bitcoin. C'est le premier fonds public de la zone euro à le faire."
    related: ["etf"]
    sources:
      - "https://www.coindesk.com/policy/2025/10/09/luxembourg-claims-bragging-rights-as-first-eurozone-nation-to-invest-in-bitcoin"
      - "https://bitcoinmagazine.com/news/luxembourg-joins-the-bitcoin-arms-race-nations-wealth-fund-to-buy-bitcoin-for-the-first-time"
  - date: "2025-10-08"
    title: "Square ouvre le paiement en bitcoin à ses commerçants"
    text: "Block présente Square Bitcoin : les commerçants américains de Square pourront accepter le bitcoin à la caisse, sans frais de traitement la première année, et convertir jusqu'à 50 % de leurs ventes quotidiennes en bitcoin. Les paiements, réglés par Lightning, sont annoncés pour le 10 novembre."
    related: ["lightning-network", "commercant"]
    sources:
      - "https://squareup.com/us/en/press/square-bitcoin"
      - "https://squareup.com/us/en/press/block-to-roll-out-bitcoin-payments-on-square"
      - "https://www.coindesk.com/business/2025/10/08/square-launches-bitcoin-payment-tools-for-small-businesses-expanding-crypto-access"
  - date: "2025-10-10"
    title: "Krach et record de liquidations"
    text: "Donald Trump annonce des droits de douane supplémentaires de 100 % sur les produits chinois. Le bitcoin chute de plus de 121 000 à moins de 106 000 dollars, et 19,13 milliards de dollars de positions à effet de levier sont liquidées en 24 heures, un record selon CoinGlass."
    related: ["volatilite"]
    sources:
      - "https://decrypt.co/343941/bitcoin-ethereum-dogecoin-down-record-19-billion-crypto-liquidations"
      - "https://www.businesstoday.in/personal-finance/investment/story/crypto-crash-19-bn-wiped-out-as-trumps-100-china-tariff-sparks-largest-liquidation-in-history-497823-2025-10-11"
      - "https://www.coindesk.com/markets/2025/10/27/how-october-was-the-most-destructive-month-in-recent-memory-for-crypto-traders"
  - date: "2025-10-10"
    title: "Sortie de Bitcoin Core 30.0"
    text: "Bitcoin Core 30.0 lève la limite des sorties `OP_RETURN`, abaisse à 0,1 sat/vB le minimum de frais pour relayer une transaction et ne charge plus les anciens portefeuilles, à migrer vers les descripteurs. Le 13 octobre, Bitcoin Knots fait tourner 5 114 nœuds, soit 21,48 % du réseau selon BitRef."
    related: ["bitcoin-core", "op-return-0x6a", "bitcoin-knots", "output-script-descriptors"]
    sources:
      - "https://bitcoincore.org/en/releases/30.0/"
      - "https://bitcoinops.org/en/newsletters/2025/10/17/"
      - "https://cointelegraph.com/news/bitcoin-core-v30-controversial-op-return-function-now-live"
  - date: "2025-10-14"
    title: "127 271 BTC du Prince Group visés par la justice américaine"
    text: "Le département de la Justice inculpe Chen Zhi, fondateur du conglomérat cambodgien Prince Group, pour des escroqueries menées depuis des camps de travail forcé. Il engage la confiscation d'environ 127 271 BTC déjà sous sa garde (près de 15 milliards de dollars), la plus grosse de son histoire."
