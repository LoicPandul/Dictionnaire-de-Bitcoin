# Chronologie de Bitcoin : 2014.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2014-01-02"
    title: "Counterparty crée son jeton en détruisant des bitcoins"
    text: "Counterparty, un protocole d'actifs construit sur Bitcoin, ouvre la création de son jeton XCP par *proof of burn*. Jusqu'au 3 février, chaque bitcoin envoyé à l'adresse inutilisable `1CounterpartyXXXXXXXXXXXXXXXUWLpVr` est détruit contre 1 000 à 1 500 XCP, dans la limite de 1 BTC par adresse."
    related: ["counterparty", "burn-address"]
    sources:
      - "https://bitcointalk.org/index.php?topic=395761.0"
      - "https://docs.counterparty.io/docs/basics/what-is-xcp/"
  - date: "2014-01-09"
    title: "Overstock accepte le bitcoin"
    text: "Overstock.com devient le premier grand site de vente en ligne à accepter le bitcoin. Coinbase traite les paiements et convertit chaque bitcoin reçu en dollars pour le commerçant."
    related: ["coinbase"]
    sources:
      - "https://s203.q4cdn.com/409549452/files/doc_news/2014/01/News-Release-1698084232425587.pdf"
      - "https://siliconangle.com/2014/01/10/overstock-com-jumps-on-the-bitcoin-bandwagon-starts-accepting-payments/"
  - date: "2014-01-21"
    title: "Marc Andreessen publie « Why Bitcoin Matters »"
    text: "Dans le New York Times, l'investisseur Marc Andreessen compare Bitcoin à l'ordinateur personnel en 1975 et à Internet en 1993. Sa société, Andreessen Horowitz, a déjà placé près de 50 millions USD dans des start-up liées à Bitcoin."
    sources:
      - "https://dealbook.nytimes.com/2014/01/21/why-bitcoin-matters/"
      - "https://www.techmeme.com/140122/p12"
  - date: "2014-01-27"
    title: "Inculpation de Charlie Shrem"
    text: "Le procureur fédéral de Manhattan inculpe Charlie Shrem, patron de BitInstant arrêté la veille à l'aéroport JFK, et Robert Faiella. Il les accuse d'avoir vendu plus de 1 million USD de bitcoins à des utilisateurs de Silk Road."
    related: ["silk-road"]
    sources:
      - "https://www.justice.gov/usao-sdny/pr/manhattan-us-attorney-announces-charges-against-bitcoin-exchangers-including-ceo"
      - "https://www.theregister.co.uk/2014/01/27/feds_collar_bigname_bitcoin_trader_in_moneylaundering_investigation/"
  - date: "2014-02-04"
    title: "Ross Ulbricht inculpé à New York"
    text: "Un grand jury fédéral de New York inculpe Ross Ulbricht, accusé d'avoir créé et dirigé Silk Road. Les chefs retenus : trafic de stupéfiants, direction d'une entreprise criminelle, piratage informatique et blanchiment."
    related: ["silk-road"]
    sources:
      - "https://money.cnn.com/2014/02/04/technology/silk-road/"
      - "https://www.pcworld.com/article/443707/alleged-silk-road-creator-indicted-on-kingpin-charges-in-new-york.html"
  - date: "2014-02-06"
    title: "Le parquet russe proscrit le bitcoin"
    text: "Le parquet général de Russie déclare que les monnaies virtuelles comme le bitcoin sont des « substituts monétaires » que ni les particuliers ni les entreprises ne peuvent utiliser. Il s'appuie sur la loi fédérale qui fait du rouble la seule monnaie officielle du pays."
    sources:
      - "https://www.financemagnates.com/cryptocurrency/news/its-official-bitcoin-ilegal-in-russia/"
      - "https://www.ft.lk/financial-services/russian-authorities-say-bitcoin-illegal/42-253294"
      - "https://www.computing.co.uk/news/2327858/russia-rules-bitcoin-to-be-illegal"
  - date: "2014-02-07"
    title: "Mt.Gox suspend les retraits de bitcoins"
    text: "Mt.Gox, plateforme d'échange installée à Tokyo, suspend tous les retraits de bitcoins. Elle invoque un problème technique sur certains retraits et dit avoir besoin d'examiner ses processus."
    related: ["mtgox"]
    sources:
      - "https://web.archive.org/web/20140207054536/https://www.mtgox.com/press_release_20140207.html"
      - "https://www.pcworld.com/article/2095880/bitcoin-takes-a-dive-as-mt-gox-a-major-exchange-suspends-withdrawals.html"
  - date: "2014-02-10"
    title: "Mt.Gox accuse la malléabilité des transactions"
    text: "Mt.Gox prolonge sans date de fin la suspension des retraits et accuse la malléabilité des transactions, qui permet de modifier l'identifiant d'une transaction sans invalider sa signature. Sur sa plateforme, le bitcoin tombe à 500 USD, contre 692 USD trois jours plus tôt."
    related: ["mtgox", "malleabilite-transaction"]
    sources:
      - "https://web.archive.org/web/20140210122955/https://www.mtgox.com/press_release_20140210.html"
      - "https://proof.csmonitor.com/Business/Latest-News-Wires/2014/0210/Bitcoin-crash-Prices-fall-after-withdrawals-are-frozen"
  - date: "2014-02-11"
    title: "Bitstamp suspend à son tour les retraits"
    text: "La plateforme slovène Bitstamp suspend les retraits de bitcoins. Elle accuse une attaque par déni de service qui exploite la malléabilité des transactions pour fausser le contrôle des soldes de son portefeuille, le même problème que Mt.Gox invoque depuis la veille."
    related: ["malleabilite-transaction", "mtgox"]
    sources:
      - "https://www.csmonitor.com/Technology/2014/0213/Bitstamp-halts-transactions-Bitcoin-woes-continue"
      - "https://www.eweek.com/security/bitcoin-hit-by-ddos-transaction-malleability/"
  - date: "2014-02-13"
    title: "Silk Road 2.0 vidée de ses bitcoins"
    text: "Defcon, qui administre Silk Road 2.0, annonce le vol de 4 474,26 BTC, soit environ 2,7 millions USD, qui vide le compte de séquestre du site. Il attribue l'attaque à la malléabilité des transactions."
    related: ["silk-road", "malleabilite-transaction"]
    sources:
      - "https://techcrunch.com/2014/02/13/silk-road-2-hacked-88000-bitcoin-allegedly-stolen"
      - "https://www.finextra.com/newsarticle/25726/bitcoin-plunges-again-after-dark-market-web-hack"
  - date: "2014-02-25"
    title: "Mt.Gox disparaît du web"
    text: "Le site de Mt.Gox cesse de répondre et toutes les transactions s'arrêtent. Un document interne qui circule, le « Crisis Strategy Draft », évoque la perte de 744 408 BTC."
    related: ["mtgox"]
    sources:
      - "https://thenextweb.com/news/mt-gox-goes-offline-insolvency-rumors-swirl"
      - "https://www.pbs.org/newshour/economy/mt-gox-goes-offline-amid-allegations-largest-ever-bitcoin-heist"
  - date: "2014-02-28"
    title: "Faillite de Mt.Gox"
    text: "Mt.Gox se place à Tokyo sous la protection de la loi sur les faillites. Mark Karpelès annonce la disparition de 850 000 BTC : 750 000 appartenant aux clients et 100 000 à la société. Les dettes dépassent 6,5 milliards de yens."
    related: ["mtgox"]
    sources:
      - "https://csmonitor.com/layout/set/amphtml/Business/Latest-News-Wires/2014/0228/Mt.-Gox-bitcoin-exchange-files-for-bankruptcy-in-Japan"
      - "https://www.mprnews.org/story/2014/02/28/bitcoin-exchange-mtgox-files-for-bankruptcy"
  - date: "2014-03-02"
    title: "Piratage de Flexcoin"
    text: "Un attaquant vide le portefeuille chaud de Flexcoin, qui se présente comme une « banque bitcoin », et emporte 896 BTC. Le lendemain, Flexcoin annonce sa fermeture, faute de moyens pour absorber la perte."
    sources:
      - "https://web.archive.org/web/20140305/http://www.flexcoin.com/"
      - "https://welivesecurity.com/2014/03/05/bitcoin-bank-flexcoin-shuts-down-after-attackers-loot-570000-from-hot-wallet"
  - date: "2014-03-06"
    title: "Newsweek désigne Dorian Nakamoto"
    text: "Newsweek affirme que Satoshi Nakamoto est Dorian Nakamoto, un Américain d'origine japonaise de 64 ans qui vit en Californie. L'homme dément. Le même jour, le compte de Satoshi sur le site de la P2P Foundation publie : « I am not Dorian Nakamoto »."
    related: ["nakamoto-satoshi"]
    sources:
      - "https://www.wunc.org/2014-03-06/newsweek-says-it-found-bitcoins-founder-4-things-to-know"
      - "https://techcrunch.com/2014/03/06/satoshi-dorian/"
      - "https://www.pcworld.com/article/444245/both-satoshi-nakamotos-say-accused-satoshi-nakamoto-isnt-bitcoins-creator.html"
  - date: "2014-03-07"
    title: "Le Japon dit que le bitcoin n'est pas une monnaie"
    text: "Le gouvernement de Shinzo Abe approuve une réponse écrite à un parlementaire de l'opposition : aucune loi ne définit le bitcoin, qui n'est pas une monnaie, mais ses transactions peuvent être imposées."
    sources:
      - "https://www.fsa.go.jp/en/conference/minister/2014/20140307.html"
      - "https://www.bloomberg.com/news/articles/2014-03-07/japan-says-bitcoin-is-not-a-currency-amid-calls-for-regulation"
  - date: "2014-03-19"
    title: "Bitcoin Core 0.9.0"
    text: "Gavin Andresen publie la version 0.9.0 du logiciel de référence, rebaptisé Bitcoin Core pour distinguer le logiciel du réseau. Elle rend standard les sorties `OP_RETURN`, gère les demandes de paiement de BIP-0070 et corrige plusieurs failles liées à la malléabilité."
    related: ["bitcoin-core", "op-return-0x6a", "bip-0070"]
    sources:
      - "https://mailing-list.bitcoindevs.xyz/bitcoindev/CABsx9T3wa-ZnkDrYfeHYEy4UftgE+Bwcco2tR0Yn7KqtXHBrAg@mail.gmail.com/"
      - "https://www.computerworld.com/article/1506821/bitcoin-software-gets-security-update.html"
  - date: "2014-03-20"
    title: "Mt.Gox retrouve 200 000 BTC"
    text: "Mt.Gox annonce avoir retrouvé 199 999,99 BTC dans un ancien portefeuille, utilisé avant juin 2011 et qu'elle croyait vide. La société dit avoir fait la découverte le 7 mars, après sa demande de protection."
    related: ["mtgox"]
    sources:
      - "https://web.archive.org/web/2014/https://www.mtgox.com/img/pdf/20140320-btc-announce.pdf"
      - "https://www.cnbc.com/2014/03/20/mtgox-says-it-found-200000-bitcoins-in-forgotten-wallet.html"
      - "https://silicon.co.uk/workspace/mt-gox-bitcoin-btc-wallet-142122"
  - date: "2014-03-25"
    title: "Le fisc américain classe le bitcoin comme un bien"
    text: "L'IRS publie la Notice 2014-21 : pour l'impôt fédéral américain, les monnaies virtuelles comme le bitcoin sont des biens (*property*) et non des devises. Vendre des bitcoins ou payer avec peut donc créer une plus-value imposable."
    sources:
      - "https://www.irs.gov/pub/irs-news/IR-14-036.pdf"
      - "https://www.fm-magazine.com/news/2014/mar/20149850/"
  - date: "2014-03-26"
    title: "Une étude contredit la version de Mt.Gox"
    text: "Christian Decker et Roger Wattenhofer, de l'ETH Zurich, publient l'analyse de plus d'un an de trafic du réseau Bitcoin. Les attaques par malléabilité existent, concluent-ils, mais elles n'ont pas été utilisées à grande échelle avant la fermeture de Mt.Gox."
    related: ["mtgox", "malleabilite-transaction"]
    sources:
      - "https://arxiv.org/abs/1403.6676"
      - "https://www.theregister.co.uk/2014/04/09/mt_goxs_transaction_malleability_claim_rubbished_by_researchers/"
  - date: "2014-03-27"
    title: "La Chine coupe les comptes bancaires des plateformes"
    text: "Selon le magazine Caixin, la banque centrale chinoise ordonne aux banques et aux sociétés de paiement de fermer avant le 15 avril les comptes des plateformes d'échange de bitcoins. Le cours perd près de 10 % dans la journée."
    sources:
      - "https://www.caixinglobal.com/2014-03-27/pboc-rule-means-bitcoin-websites-in-china-must-close-expert-says-101013468.html"
      - "https://www.bloomberg.com/news/articles/2014-03-27/pboc-orders-banks-to-shut-bitcoin-exchange-accounts-caixin-says"
      - "https://www.cnbc.com/2014/04/28/bitcoin-price-slips-as-china-steps-up-regulation.html"
  - date: "2014-04-07"
    title: "Wladimir van der Laan prend la tête de Bitcoin Core"
    text: "Gavin Andresen quitte son rôle de développeur principal de Bitcoin Core pour se consacrer à son poste de Chief Scientist de la Bitcoin Foundation. Wladimir van der Laan, que la fondation paie déjà à plein temps pour travailler sur le logiciel, lui succède comme mainteneur."
    related: ["bitcoin-core", "mainteneur-principal-core"]
    sources:
      - "https://web.archive.org/web/20140409000000/https://bitcoinfoundation.org/blog/?p=677"
      - "https://web.archive.org/web/2014/http://www.coindesk.com/gavin-andresen-steps-bitcoins-lead-developer/"
  - date: "2014-04-08"
    title: "Bitcoin Core 0.9.1 corrige Heartbleed"
    text: "Gavin Andresen publie Bitcoin Core 0.9.1. Le code ne change pas : seule la bibliothèque OpenSSL passe en version 1.0.1g pour corriger la faille Heartbleed, qui peut exposer jusqu'à 64 Ko de mémoire à un client ou à un serveur connecté."
    related: ["bitcoin-core"]
    sources:
      - "https://bitcoin.org/en/release/v0.9.1"
      - "https://mailing-list.bitcoindevs.xyz/bitcoindev/CABsx9T3dQa9SpHqJd-AEWeiGUH4zGPWcO7rsgQq53dBV0JqZfw@mail.gmail.com/"
  - date: "2014-04-16"
    title: "Mt.Gox part en liquidation"
    text: "Le tribunal de district de Tokyo rejette la demande de redressement de Mt.Gox, qui part en liquidation. Un administrateur doit vendre ses actifs, et beaucoup de créanciers ne récupéreront probablement rien."
    related: ["mtgox"]
    sources:
      - "https://csmonitor.com/Business/Latest-News-Wires/2014/0416/Bitcoin-exchange-Mt.-Gox-headed-for-liquidation"
      - "https://www.pcworld.com/article/2144400/mt-gox-has-filed-for-liquidation-in-japan-says-report.html"
  - date: "2014-05-01"
    title: "Première version de Dark Wallet"
    text: "Le collectif unSystem, mené par Amir Taaki et Cody Wilson, publie la version alpha de Dark Wallet, une extension pour Chrome. Ce portefeuille mélange par défaut les paiements de ses utilisateurs avec CoinJoin pour rendre les transactions plus difficiles à tracer."
    related: ["darkwallet", "coinjoin"]
    sources:
      - "https://www.wired.com/2014/04/dark-wallet/"
      - "https://www.computerworld.com/article/1383145/dark-wallet-promises-anonymity-for-bitcoin-transactions.html"
  - date: "2014-05-06"
    title: "La Bolivie interdit le bitcoin"
    text: "Par sa résolution 044/2014, la Banque centrale de Bolivie interdit l'usage des monnaies qui ne sont ni émises ni régulées par un État ou une zone économique. Le texte cite nommément le bitcoin, le namecoin et le peercoin."
    sources:
      - "https://www.bcb.gob.bo/webdocs/01_resoluciones/044%202014.PDF"
      - "https://www.libertaddigital.com/libremercado/2014-06-24/bolivia-prohibe-totalmente-el-uso-de-bitcoin-1276522098/"
      - "https://eju.tv/?p=449195"
  - date: "2014-05-15"
    title: "Conférence Bitcoin 2014 à Amsterdam"
    text: "La Bitcoin Foundation ouvre à Amsterdam Bitcoin 2014, sa deuxième conférence annuelle. Plus de 1 000 participants y écoutent notamment Patrick Byrne, patron d'Overstock, et le discours annuel de Gavin Andresen sur l'état du protocole."
    related: ["fondation-bitcoin"]
    sources:
      - "https://www.coindesk.com/bitcoin-2014-conference-gets-underway-amsterdam-today"
      - "https://cointelegraph.com/news/bitcoin_2014_con_in_amsterdam_first_day_report"
  - date: "2014-06"
    title: "GHash.io dépasse 51 % de la puissance de calcul"
    text: "Le pool GHash.io fournit à plusieurs reprises plus de 51 % de la puissance de calcul du réseau, jusqu'à 12 heures d'affilée. Pour réduire sa part, BitFury retire 1,5 PH/s du pool le 13 juin."
    related: ["ghash-io", "attaque-des-51-pour-cent", "mining-pool"]
    sources:
      - "https://arstechnica.com/information-technology/2014/06/bitcoin-security-guarantee-shattered-by-anonymous-miner-with-51-network-power/"
      - "https://coindesk.com/markets/2014/06/13/bitfury-pulls-1phs-of-mining-power-from-ghashio-amid-community-uproar/"
      - "https://libertystreeteconomics.newyorkfed.org/tag/hash-rate/"
  - date: "2014-06-11"
    title: "Expedia accepte le bitcoin"
    text: "Expedia accepte le bitcoin pour les réservations d'hôtel sur son site américain et devient le plus grand service de voyage en ligne à le faire. Coinbase convertit les paiements en dollars."
    related: ["coinbase"]
    sources:
      - "https://www.bloomberg.com/news/articles/2014-06-11/expedia-to-accept-bitcoins-for-online-hotel-bookings"
      - "https://www.knkx.org/business/2014-06-13/expedia-begins-accepting-bitcoin-for-hotel-bookings"
  - date: "2014-07"
    title: "L'Équateur interdit les monnaies décentralisées"
    text: "L'Assemblée nationale de l'Équateur adopte par 91 voix une réforme monétaire qui crée une monnaie électronique d'État et interdit de fait le bitcoin et les autres monnaies décentralisées. Le texte part à la signature du président Rafael Correa."
    sources:
      - "https://www.coindesk.com/markets/2014/07/25/ecuador-bans-bitcoin-plans-own-digital-money"
      - "https://siliconangle.com/?p=195801"
  - date: "2014-07-02"
    title: "Tim Draper achète les bitcoins de Silk Road"
    text: "L'investisseur Tim Draper annonce avoir remporté la totalité des 29 656 BTC saisis sur Silk Road et vendus aux enchères par l'US Marshals Service, face à 45 enchérisseurs inscrits. Il compte s'en servir avec la plateforme Vaurum."
    related: ["silk-road"]
    sources:
      - "https://fortune.com/2014/07/02/venture-capitalist-draper-wins-bitcoin-auction"
      - "https://silicon.co.uk/workspace/silk-road-bitcoin-auction-148499"
  - date: "2014-07-04"
    title: "Avis de l'Autorité bancaire européenne"
    text: "L'Autorité bancaire européenne publie son avis sur les monnaies virtuelles. En attendant un cadre réglementaire, elle recommande aux superviseurs nationaux de dissuader banques et établissements de paiement d'acheter, de détenir ou de vendre des monnaies virtuelles."
    sources:
      - "https://eba.europa.eu/sites/default/documents/files/documents/10180/657547/81409b94-4222-45d7-ba3b-7deb5863ab57/EBA-Op-2014-08%20Opinion%20on%20Virtual%20Currencies.pdf"
      - "https://www.scl.org/3210-european-banking-authority-opinion-on-virtual-currencies/"
  - date: "2014-07-17"
    title: "New York présente la BitLicense"
    text: "Benjamin Lawsky, régulateur financier de l'État de New York, publie son projet de BitLicense. Toute entreprise qui reçoit, transmet, conserve ou convertit des monnaies virtuelles devra obtenir une licence, contrairement aux commerçants et aux particuliers qui s'en servent pour payer."
    sources:
      - "https://www.insurancejournal.com/news/east/2014/07/17/335058.htm"
      - "https://www.wamc.org/new-york-news/2014-07-17/ny-proposes-regulations-for-virtual-currency"
  - date: "2014-07-18"
    title: "Dell accepte le bitcoin"
    text: "Dell accepte le bitcoin sur son site marchand Dell.com. Coinbase traite les paiements, et les clients qui paient depuis un autre portefeuille règlent de petits frais de transaction."
    related: ["coinbase"]
    sources:
      - "https://www.cnbc.com/2014/07/18/dellcom-announces-support-for-bitcoin-payments.html"
      - "https://www.pcworld.com/article/440372/dude-youre-getting-a-dell-with-bitcoin.html"
  - date: "2014-07-29"
    title: "Lancement du Trezor"
    text: "SatoshiLabs, fondée par Marek « Slush » Palatinus et Pavol « Stick » Rusnák, lance officiellement le Trezor, plus tard appelé Trezor One. C'est le premier portefeuille matériel pour cryptomonnaies vendu dans le commerce."
    related: ["trezor", "hardware-wallet"]
    sources:
      - "https://trezor.io/fr/blog/news/a-decade-of-pioneering-10-years-since-trezors-first-hardware-wallet-revolution"
      - "https://cointelegraph.com/news/trezor-hardware-wallet-turns-10"
  - date: "2014-08-28"
    title: "Mort de Hal Finney"
    text: "Hal Finney, destinataire de la première transaction Bitcoin, meurt à Phoenix à 58 ans. Paralysé par la maladie de Charcot, diagnostiquée en 2009, il est confié selon ses volontés à la fondation Alcor, qui conserve son corps par cryogénie."
    related: ["finney-hal"]
    sources:
      - "https://www.coindesk.com/bitcoin-pioneer-hal-finney-passes-away"
      - "https://www.nytimes.com/2014/08/31/business/hal-finney-cryptographer-and-bitcoin-pioneer-dies-at-58.html"
  - date: "2014-09-08"
    title: "Braintree, filiale de PayPal, adopte le bitcoin"
    text: "Braintree, filiale de PayPal, annonce un partenariat avec Coinbase pour que ses marchands acceptent le bitcoin dans les mois qui viennent. Son patron, Bill Ready, y voit un premier pas de PayPal vers Bitcoin."
    related: ["coinbase"]
    sources:
      - "https://techcrunch.com/2014/09/08/paypal-braintree/"
      - "https://www.pcworld.com/article/435156/paypal-subsidiary-braintree-to-process-bitcoin-payments.html"
  - date: "2014-10-01"
    title: "Peter Todd propose OP_CHECKLOCKTIMEVERIFY"
    text: "Peter Todd soumet à la liste bitcoin-development un brouillon de BIP pour l'opcode `OP_CHECKLOCKTIMEVERIFY`, qui empêche de dépenser une sortie avant une date ou une hauteur de bloc donnée. Le texte devient BIP-0065."
    related: ["bip-0065", "op-checklocktimeverify-0xb1", "timelock"]
    sources:
      - "https://mailing-list.bitcoindevs.xyz/bitcoindev/20141001130826.GM28710@savin.petertodd.org/"
      - "https://github.com/bitcoin/bips/blob/master/bip-0065.mediawiki"
  - date: "2014-10-08"
    title: "Andreas Antonopoulos devant le Sénat du Canada"
    text: "Andreas Antonopoulos, auteur de *Mastering Bitcoin*, témoigne devant le comité sénatorial canadien des banques et du commerce, qui étudie les monnaies numériques. Il plaide contre une réglementation stricte qui freinerait l'innovation et répond aux questions sur le crime et le blanchiment."
    sources:
      - "https://sencanada.ca/en/Content/SEN/Committee/412/banc/15mn-51627-e"
      - "https://siliconangle.com/2014/10/15/bitcoin-weekly-2014-october-15-bitcoin-breaks-400-antonopoulos-speaks-to-canadian-senate-butterfly-labs-vs-ftc/"
  - date: "2014-10-22"
    title: "Publication du papier sur les sidechains"
    text: "Adam Back, Gregory Maxwell, Pieter Wuille et six coauteurs publient « Enabling Blockchain Innovations with Pegged Sidechains ». Le papier décrit des chaînes distinctes, les *sidechains*, vers lesquelles des bitcoins peuvent passer puis revenir grâce à un ancrage bidirectionnel."
    related: ["sidechain", "blockstream"]
    sources:
      - "https://blockstream.com/sidechains.pdf"
      - "https://mailing-list.bitcoindevs.xyz/bitcoindev/CALqxMTHeipZZrJ_NSXK9vxiO83gSDgM6TA7T7XNBS3LtmuK2KA@mail.gmail.com/"
  - date: "2014-11-06"
    title: "Fermeture de Silk Road 2.0"
    text: "La justice américaine ferme Silk Road 2.0 et annonce l'arrestation, la veille à San Francisco, de son opérateur présumé Blake Benthall. Selon l'acte d'accusation, le site réalisait au moins 8 millions USD de ventes par mois et comptait environ 150 000 utilisateurs actifs."
    related: ["silk-road"]
    sources:
      - "https://www.justice.gov/archive/usao/nys/pressreleases/November14/BlakeBenthallArrestPR.php"
      - "https://siliconangle.com/2014/11/07/busted-feds-close-down-silk-road-2-0-and-several-other-online-drug-dens/"
  - date: "2014-11-17"
    title: "Blockstream lève 21 millions USD"
    text: "Blockstream, la société qui a publié le papier sur les *sidechains* en octobre, annonce une levée de 21 millions USD auprès de près de 40 investisseurs. Reid Hoffman, Khosla Ventures et Real Ventures mènent le tour."
    related: ["blockstream", "sidechain"]
    sources:
      - "https://betakit.com/blockstream-raises-21-million-from-40-investors-including-reid-hoffman-real-ventures-khosla-ventures/"
      - "https://www.venturecapitaljournal.com/blockstream-raises-21-mln-from-hoffman-khosla-real-innovation-others/"
  - date: "2014-12"
    title: "Parution de Mastering Bitcoin"
    text: "O'Reilly publie *Mastering Bitcoin*, le livre technique d'Andreas Antonopoulos sur le fonctionnement de Bitcoin. Le texte est aussi disponible sur GitHub sous licence ouverte."
    sources:
      - "https://www.oreilly.com/library/view/mastering-bitcoin/9781491902639/copyright.html"
      - "https://github.com/bitcoinbook/bitcoinbook"
  - date: "2014-12-04"
    title: "Seconde vente aux enchères des bitcoins de Silk Road"
    text: "L'US Marshals Service met aux enchères 50 000 BTC saisis lors de l'affaire Silk Road. Un groupe d'acheteurs mené par SecondMarket, la société de Barry Silbert, en remporte 48 000, et Tim Draper 2 000."
    related: ["silk-road"]
    sources:
      - "https://fortune.com/2014/12/04/bitcoins-seized-from-silk-road-on-offer-in-a-second-auction"
      - "https://www.cnbc.com/2015/03/05/feds-auction-135m-worth-of-silk-road-bitcoins.html"
      - "https://bitcoinmagazine.com/markets/us-marshals-auction-participant-price-not-significantly-market-1425705458"
  - date: "2014-12-11"
    title: "Microsoft accepte le bitcoin"
    text: "Microsoft permet à ses clients américains de créditer leur compte en bitcoins, par l'intermédiaire de BitPay, pour acheter des applications et des jeux sur Windows, Windows Phone et Xbox."
    sources:
      - "https://www.pcworld.com/article/430796/microsoft-starts-accepting-bitcoin-payments.html"
      - "https://betanews.com/2014/12/11/microsoft-now-accepts-bitcoin-payments-in-windows-windows-phone-and-xbox-stores/"
  - date: "2014-12-19"
    title: "Charlie Shrem condamné à deux ans de prison"
    text: "Le tribunal fédéral de Manhattan condamne Charlie Shrem, ancien patron de BitInstant, à deux ans de prison. Il avait plaidé coupable d'avoir aidé à vendre près de 1 million USD de bitcoins destinés à des achats de drogue sur Silk Road."
    related: ["silk-road"]
    sources:
      - "https://www.justice.gov/archive/usao/nys/pressreleases/December14/ShremCharlieSentencingPR.php"
      - "https://silicon.co.uk/security/bitcoin-shrem-silk-road-jail-158022"
  - date: "2014-12-26"
    title: "Premier Bitcoin Bowl"
    text: "Le Bitcoin St. Petersburg Bowl, match de football universitaire américain parrainé par BitPay, oppose UCF à NC State au Tropicana Field de St. Petersburg. Plus de 3 millions de téléspectateurs le suivent."
    sources:
      - "https://www.nationalfootballpost.com/bitcoin-bowl-preview-ucf-vs-nc-state"
      - "https://siliconangle.com/?p=212761"
