    text: "Le dépôt bitcoin/bitcoin est créé sur GitHub à 15 h 16 UTC. Moins d'une heure plus tard, Gavin Andresen y annonce le suivi « officiel » des bugs et des demandes, tout en promettant de rester très prudent sur les changements acceptés."
