    text: "La police des Bahamas arrête Sam Bankman-Fried à la demande des États-Unis, où le procureur de Manhattan a obtenu contre lui un acte d'accusation sous scellés. Le lendemain, la SEC l'accuse d'avoir trompé les investisseurs de FTX."
