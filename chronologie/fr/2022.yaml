    text: "Core Scientific, l'un des plus grands mineurs de bitcoin cotés au Nasdaq, se place sous la protection du chapitre 11 au Texas après la dégradation de ses résultats et de sa trésorerie. Ses machines continuent de miner pendant la restructuration."
