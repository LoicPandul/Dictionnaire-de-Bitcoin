# Chronologie de Bitcoin : 2011.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2011-02"
    title: "Ouverture de Silk Road"
    text: "Silk Road, un marché noir accessible seulement par Tor où l'on paie en bitcoins, ouvre en février. Fin janvier, un utilisateur nommé « altoid », que le FBI identifiera comme Ross Ulbricht, en a fait la promotion sur le forum Shroomery puis sur bitcointalk."
    related: ["silk-road", "tor-the-onion-router", "bitcointalk"]
    sources:
      - "https://web.archive.org/web/2011/http://gawker.com/5805928/the-underground-website-where-you-can-buy-any-drug-imaginable"
      - "https://www.nbcnews.com/news/world/end-silk-road-slip-ups-building-internet-drug-market-led-flna8C11326181"
      - "https://news.bitcoin.com/bitcoin-history-part-15-silk-road-is-born/"

  - date: "2011-02-09"
    title: "Le bitcoin atteint la parité avec le dollar"
    text: "Pour la première fois, 1 BTC s'échange contre 1 USD. Vers 22 h UTC, le fil « Parity Party » de bitcointalk, ouvert un mois plus tôt pour attendre ce moment, s'anime, et Slashdot relaie la nouvelle le lendemain."
    related: ["bitcointalk"]
    sources:
      - "https://bitcointalk.org/index.php?topic=2734.0"
      - "https://web.archive.org/web/20210423083126/https://twitter.com/Dave_Parrish/status/35466982635601920"
      - "https://web.archive.org/web/2011/http://news.slashdot.org/story/11/02/10/189246/Online-Only-Currency-BitCoin-Reaches-Dollar-Parity"

  - date: "2011-04-23"
    title: "Dernier e-mail connu de Satoshi Nakamoto à Mike Hearn"
    text: "Satoshi Nakamoto répond à Mike Hearn : « I've moved on to other things. It's in good hands with Gavin and everyone. » C'est le dernier message connu qu'il lui adresse, quatre jours avant que Gavin Andresen n'annonce sa venue à la CIA."
    related: ["nakamoto-satoshi"]
    sources:
      - "https://thedefiant.io/news/people/bitcoin-creator-satoshi-nakamoto-sent-final-email-to-mike-hearn-on-april-23-2011-6735013c"
      - "https://cointelegraph.com/news/satoshi-nakamoto-final-email-revisited-after-13-years"
      - "https://thenextweb.com/hardfork/2019/07/19/satoshi-nakamoto-left-Bitcoin-because-of-the-cia-theory-cryptocurrency/"

  - date: "2011-06-19"
    title: "Piratage de Mt. Gox et chute du cours à 0,01 USD"
    text: "Vers 18 h UTC, un pirate s'empare d'un compte administrateur de Mt. Gox, s'attribue des bitcoins fictifs et les vend : le cours passe de 17,50 USD à 0,01 USD en 30 minutes. Il retire environ 2 000 BTC, et la base des utilisateurs circule en ligne."
    related: ["mtgox"]
    sources:
      - "https://web.archive.org/web/20110919162635/https://mtgox.com/press_release_20110630.html"
      - "https://www.wired.com/2011/06/gox/"
      - "https://www.theregister.com/2011/06/19/bitcoin_values_collapse_again/"
      - "https://www.pcworld.com/article/486888/faked_bitcoins_caused_price_crash_exchange_reveals.html"

  - date: "2011-09-19"
    title: "Amir Taaki rédige BIP-0001"
    text: "Amir Taaki crée sur le wiki Bitcoin la page BIP-0001, qui décrit le processus des propositions d'amélioration de Bitcoin (BIP). Il part du PEP 1 de Python. Le 18 octobre, Gavin Andresen propose sur la liste de diffusion d'en faire l'éditeur des BIP."
    related: ["bip", "bip-0001"]
    sources:
      - "https://github.com/bitcoin/bips/blob/master/bip-0001.mediawiki"
      - "https://en.bitcoin.it/w/index.php?title=BIP_0001&dir=prev&action=history"
      - "https://gnusha.org/pi/bitcoindev/CABsx9T0xjz2bO0PKX7VBka_j_MpGky9scHhkyM=b9MbtPAwx=A@mail.gmail.com/"

  - date: "2011-10-18"
    title: "Gavin Andresen rédige BIP-0011, BIP-0012 et BIP-0013"
    text: "Gavin Andresen rédige trois propositions pour les transactions multisignatures : BIP-0011 rend standard les transactions M-de-N, BIP-0012 crée l'opcode `OP_EVAL` et BIP-0013 définit un format d'adresse pour payer vers le *hash* d'un script."
    related: ["bip-0011", "bip-0012", "bip-0013", "op-eval", "multisig"]
    sources:
      - "https://github.com/bitcoin/bips/blob/master/bip-0011.mediawiki"
      - "https://github.com/bitcoin/bips/blob/master/bip-0012.mediawiki"
      - "https://github.com/bitcoin/bips/blob/master/bip-0013.mediawiki"
      - "https://en.bitcoin.it/w/index.php?title=BIP_0011&dir=prev&action=history"
      - "https://en.bitcoin.it/w/index.php?title=BIP_0012&dir=prev&action=history"

  - date: "2011-11-21"
    title: "Sortie de Bitcoin 0.5.0 avec Bitcoin-Qt"
    text: "Bitcoin 0.5.0 remplace l'ancienne interface par Bitcoin-Qt, une interface graphique entièrement nouvelle fondée sur la bibliothèque Qt et traduite notamment en allemand, en espagnol et en néerlandais. Le démon `bitcoind` reste livré à côté."
    related: ["bitcoin-qt", "bitcoin-core"]
    sources:
      - "https://bitcoin.org/en/release/v0.5.0"
      - "https://bitcointalk.org/index.php?topic=52480.0"
