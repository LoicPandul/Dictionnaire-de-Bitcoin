  - date: "2011-09-26"
    title: "Bitcoin-Qt entre dans le dépôt principal"
    text: "Gavin Andresen fusionne dans la branche principale de Bitcoin l'interface graphique Qt de Wladimir van der Laan (*pull request* n° 521). Elle deviendra l'interface de la version 0.5.0."
    related: ["bitcoin-qt", "bitcoin-core"]
    sources:
      - "https://github.com/bitcoin/bitcoin/pull/521"
      - "https://bitcointalk.org/index.php?topic=45742.msg545547#msg545547"

  - date: "2011-10-03"
    title: "The New Yorker cherche Satoshi Nakamoto"
    text: "Dans « The Crypto-Currency », Joshua Davis cherche Satoshi Nakamoto parmi les participants de la conférence Crypto 2011. Il retient Michael Clear, étudiant en cryptographie à Dublin, qui lui répond : « I'm not Satoshi, but even if I was I wouldn't tell you ». Clear dément ensuite."
    related: ["nakamoto-satoshi"]
    sources:
      - "https://www.newyorker.com/magazine/2011/10/10/the-crypto-currency"
      - "https://www.npr.org/sections/money/2011/10/03/141011155/did-a-reporter-just-solve-the-bitcoin-mystery"
      - "https://web.archive.org/web/2011/http://www.fastcompany.com/1785445/bitcoin-crypto-currency-mystery-reopened"

  - date: "2011-10-11"
    title: "Fast Company avance trois autres noms"
    text: "Dans Fast Company, Adam Penenberg conteste la piste de The New Yorker. Une expression du livre blanc le mène à une demande de brevet déposée le 15 août 2008, trois jours avant l'enregistrement de bitcoin.org, par Neal King, Vladimir Oksman et Charles Bry. King et Bry nient tout lien."
    related: ["nakamoto-satoshi"]
    sources:
      - "https://web.archive.org/web/2011/http://www.fastcompany.com/1785445/bitcoin-crypto-currency-mystery-reopened"
      - "https://web.archive.org/web/2019/https://breakermag.com/desperately-seeking-satoshi/"

  - date: "2011-10-13"
    title: "Lancement du réseau Litecoin"
    text: "Vers 3 h UTC, Charlie Lee publie le *hash* du bloc genèse de Litecoin et le minage commence. Présenté comme l'argent face à l'or de Bitcoin, Litecoin reprend la preuve de travail scrypt de Tenebrix et produit ses blocs 4 fois plus vite."
    related: ["litecoin", "altcoin"]
    sources:
      - "https://bitcointalk.org/index.php?topic=47417.0"
      - "https://litecoinspace.org/block/dec173dda2735ff11376b68bdfda804cede230c1fa6f1a11765cddfd8edf4398"

  - date: "2011-10-18"
    title: "Gavin Andresen rédige BIP-0011, BIP-0012 et BIP-0013"
    text: "Gavin Andresen rédige trois propositions pour les transactions multisignatures : BIP-0011 rend standard les transactions M-de-N, BIP-0012 crée l'opcode `OP_EVAL` et BIP-0013 définit un format d'adresse pour payer vers le *hash* d'un script."
    related: ["bip-0011", "bip-0012", "bip-0013", "op-eval", "multisig"]
    sources:
      - "https://github.com/bitcoin/bips/blob/master/bip-0011.mediawiki"
      - "https://github.com/bitcoin/bips/blob/master/bip-0012.mediawiki"
      - "https://github.com/bitcoin/bips/blob/master/bip-0013.mediawiki"
      - "https://en.bitcoin.it/w/index.php?title=BIP_0011&dir=prev&action=history"
      - "https://en.bitcoin.it/w/index.php?title=BIP_0012&dir=prev&action=history"

  - date: "2011-10-28"
    title: "Mt. Gox détruit 2 609 BTC"
    text: "Le bloc 150 951 contient 23 sorties de Mt. Gox dont le script `76a90088ac` ne pourra jamais être dépensé : à la place du *hash* de 20 octets de l'adresse, le logiciel de la plateforme a poussé une valeur vide. 2 609,36 BTC sont perdus."
    related: ["mtgox", "scriptpubkey"]
    sources:
      - "https://mempool.space/block/0000000000000449ee5b94ba7a051caffff5c23d6a03335f6e20e3985b5ffa61"
      - "https://blockstream.info/block/0000000000000449ee5b94ba7a051caffff5c23d6a03335f6e20e3985b5ffa61"
      - "https://www.righto.com/2014/03/the-programming-error-that-cost-mt-gox.html"
      - "https://news.bitcoin.com/bitcoin-history-part-17-that-time-mt-gox-destroyed-2609-btc/"

  - date: "2011-11-05"
    title: "Annonce d'Electrum"
    text: "Thomas Voegtlin (ThomasV) annonce sur bitcointalk Electrum, un client léger qui s'appuie sur des serveurs au lieu de télécharger la chaîne de blocs. Le premier *commit* du projet date de la veille."
    related: ["electrum", "portefeuille"]
    sources:
      - "https://bitcointalk.org/index.php?topic=50936.0"
      - "https://github.com/spesmilo/electrum/commit/6db1a31e58ee15c448448139e7d3a9e72b14268f"

  - date: "2011-11-10"
    title: "Amir Taaki rédige BIP-0014"
    text: "Amir Taaki rédige BIP-0014, qui sépare le numéro de version du protocole de celui du logiciel. La proposition ajoute une chaîne *user agent*, sur le modèle des navigateurs web, pour que chaque client s'identifie sur le réseau, par exemple `/Satoshi:5.64/bitcoin-qt:0.4/`."
    related: ["bip"]
    sources:
      - "https://github.com/bitcoin/bips/blob/master/bip-0014.mediawiki"
      - "https://en.bitcoin.it/w/index.php?title=BIP_0014&dir=prev&action=history"

  - date: "2011-11-11"
    title: "Faille dans le chiffrement du portefeuille"
    text: "Gavin Andresen révèle un bug grave dans le chiffrement du portefeuille des versions 0.4 et 0.5 : des clés privées peuvent rester en clair dans `wallet.dat`. Référencée CVE-2011-4447, la faille est corrigée dans la version 0.5.0, qui réécrit les portefeuilles déjà chiffrés."
    related: ["wallet-dat", "chiffrer-chiffrement", "bitcoin-core"]
    sources:
      - "https://bitcointalk.org/index.php?topic=51604.msg615237#msg615237"
      - "https://ic.unicamp.br/~stolfi/EXPORT/projects/bitcoin/bitcointalk/Gavin_Andresen/text/2011-11-11-215720.txt"
      - "https://bitcoin.org/en/release/v0.5.0"

  - date: "2011-11-21"
    title: "Sortie de Bitcoin 0.5.0 avec Bitcoin-Qt"
    text: "Bitcoin 0.5.0 remplace l'ancienne interface par Bitcoin-Qt, une interface graphique entièrement nouvelle fondée sur la bibliothèque Qt et traduite notamment en allemand, en espagnol et en néerlandais. Le démon `bitcoind` reste livré à côté."
    related: ["bitcoin-qt", "bitcoin-core"]
    sources:
      - "https://bitcoin.org/en/release/v0.5.0"
      - "https://bitcointalk.org/index.php?topic=52480.0"

  - date: "2011-11-23"
    title: "Wired publie « The Rise and Fall of Bitcoin »"
    text: "Benjamin Wallace raconte dans Wired la bulle de 2011 : la flambée qui suit l'article de Gawker sur la drogue achetée en bitcoins, puis le piratage de Mt. Gox, la perte de Bitomat et la disparition de MyBitcoin, jusqu'au désenchantement de la communauté."
    related: ["mtgox", "silk-road"]
    sources:
      - "https://www.wired.com/2011/11/mf-bitcoin/"
      - "https://web.archive.org/web/20111124022726/http://www.wired.com/magazine/2011/11/mf_bitcoin/all/1"
      - "https://pxlnv.com/linklog/the-rise-and-fall-of-bitcoin/"

  - date: "2011-11-25"
    title: "Première conférence Bitcoin européenne, à Prague"
    text: "Du 25 au 27 novembre, Prague accueille la première conférence Bitcoin d'Europe, organisée par Mitchell Bourne avec l'aide de la Bitcoin Consultancy. Parmi les orateurs figurent Amir Taaki, Stefan Thomas, Rick Falkvinge, fondateur du Parti pirate, Max Keiser et David Birch."
    sources:
      - "https://en.bitcoin.it/wiki/Conferences"
      - "https://bitcoinmagazine.com/industry-events/the-london-2012-bitcoin-conference-1343146418"
      - "https://bitcoinmagazine.com/industry-events/annual-bitcoin-conference-takes-place-in-london-1348247615"
      - "https://twitter.com/stacyherbert/status/140490389147754496"

  - date: "2011-12-20"
    title: "OP_EVAL entre dans la branche principale"
    text: "Gavin Andresen fusionne `OP_EVAL` (BIP-0012) et les adresses associées dans la branche principale de Bitcoin, en vue de la version 0.6. L'opcode doit rester sans effet jusqu'au 1er février 2012, et le soutien des mineurs doit être évalué le 15 janvier."
    related: ["op-eval", "bip-0012"]
    sources:
      - "https://github.com/bitcoin/bitcoin/commit/595925592d36fb5d5d34beea3c3e71fca2b6726e"
      - "https://bitcointalk.org/index.php?topic=50707.msg659791#msg659791"
      - "https://ic.unicamp.br/~stolfi/EXPORT/projects/bitcoin/bitcointalk/Gavin_Andresen/text/2011-12-23-035406.txt"

  - date: "2011-12-29"
    title: "Russell O'Connor propose une alternative à OP_EVAL"
    text: "À la demande de Gavin Andresen, Russell O'Connor propose sur la liste bitcoin-development un opcode `OP_CODEHASH` pour remplacer `OP_EVAL`. Le 4 janvier 2012, Gavin Andresen remplace `OP_EVAL` par Pay to Script Hash (BIP-0016) dans le code."
    related: ["op-eval", "p2sh", "bip-0016"]
    sources:
      - "https://gnusha.org/pi/bitcoindev/alpine.LRH.2.00.1112290111310.22327@theorem.ca/"
      - "https://mirror.b10c.me/lists/bitcoindev/alpine.LRH.2.00.1112290111310.22327@theorem.ca/raw"
