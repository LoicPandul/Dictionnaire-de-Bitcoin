# Chronologie de Bitcoin : 2021.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2021-01-05"
    title: "Proposition de Bech32m (BIP-0350)"
    text: "Pieter Wuille soumet à la liste bitcoin-dev le BIP-0350, qui définit `Bech32m`, une variante de `Bech32` à la somme de contrôle modifiée. Elle corrige une faiblesse : des `q` insérés ou supprimés avant un `p` final passent inaperçus. `Bech32m` servira aux adresses SegWit de version 1 et plus, dont Taproot."
    related: ["bip-0350", "bech32-et-bech32m", "taproot"]
    sources:
      - "https://web.archive.org/web/20210123053052/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2021-January/018338.html"
      - "https://github.com/bitcoin/bips/blob/master/bip-0350.mediawiki"
      - "https://bitcoinops.org/en/newsletters/2021/01/13/"

  - date: "2021-02-08"
    title: "Tesla achète 1,5 milliard de dollars de bitcoins"
    text: "Dans un document déposé auprès de la SEC, Tesla révèle avoir acheté pour 1,5 milliard de dollars de bitcoins en janvier et annonce qu'il acceptera le bitcoin en paiement de ses produits. Le cours dépasse 44 000 dollars le jour même."
    sources:
      - "https://www.cnbc.com/2021/02/08/tesla-buys-1point5-billion-in-bitcoin.html"
      - "https://bitcoinmagazine.com/markets/its-happening-tesla-buys-1-5-billion-of-bitcoin"

  - date: "2021-02-18"
    title: "Premier ETF bitcoin d'Amérique du Nord"
    text: "Le Purpose Bitcoin ETF commence à s'échanger à la Bourse de Toronto sous les symboles BTCC.B et BTCC.U. Premier ETF bitcoin d'Amérique du Nord, il détient directement des bitcoins. Il recueille 421 millions de dollars en deux jours, selon Bloomberg Intelligence."
    related: ["etf"]
    sources:
      - "https://s21.q4cdn.com/671813756/files/doc_news/2021/02/1/Toronto-Stock-Exchange-Lists-Worlds-First-Bitcoin-ETF-2021-2-18-2021.pdf"
      - "https://forklog.com/en/news/first-bitcoin-etf-in-north-america-attracts-421m-in-two-days"

  - date: "2021-05-01"
    title: "Début du signalement de Taproot (Speedy Trial)"
    text: "Le bloc 681 408 ouvre la première période de signalement de Taproot. Selon Speedy Trial, une variante de BIP-0009, Taproot est verrouillé si 90 % des blocs d'une période de 2 016 signalent avant le 11 août. Bitcoin Core 0.21.1, publié le même jour, contient cette logique."
    related: ["taproot", "speedy-trial", "bip-0009", "signaling", "bitcoin-core"]
    sources:
      - "https://mempool.space/block/681408"
      - "https://bitcoincore.org/en/2021/05/01/release-0.21.1/"
      - "https://www.coindesk.com/tech/2021/05/01/bitcoin-taproot-activation-has-begun-miners-now-have-3-months-to-get-on-board"
      - "https://bitcoinmagazine.com/technical/bitcoin-core-0-21-1-taproot-code-out"

  - date: "2021-05-21"
    title: "Pékin appelle à réprimer le minage"
    text: "Le comité de stabilité financière du Conseil d'État chinois, réuni par le vice-Premier ministre Liu He, appelle à « réprimer le minage et le négoce de bitcoins ». Le cours repasse sous 37 000 dollars."
    related: ["minage"]
    sources:
      - "https://www.coindesk.com/markets/2021/05/21/bitcoin-falls-as-china-calls-for-crackdown-on-crypto-mining-trading"
      - "https://www.cnbc.com/2021/05/21/bitcoin-falls-after-china-calls-for-crackdown-on-bitcoin-mining-and-trading-behavior.html"

  - date: "2021-06-09"
    title: "Le Salvador vote la loi Bitcoin"
    text: "Dans la nuit du 8 au 9 juin, l'Assemblée législative du Salvador adopte la loi Bitcoin par 62 voix sur 84, quelques jours après son annonce par Nayib Bukele. Le bitcoin aura cours légal aux côtés du dollar américain."
    related: ["cours-legal"]
    sources:
      - "https://www.aljazeera.com/news/2021/6/9/el-salvador-congress-approves-bitcoin-as-legal-tender"
      - "https://www.coindesk.com/markets/2021/06/09/its-official-el-salvadors-legislature-votes-to-adopt-bitcoin-as-legal-tender"

  - date: "2021-06-12"
    title: "Verrouillage de Taproot"
    text: "Le bloc 687 284 est le 1 815e de sa période de 2 016 blocs à signaler Taproot, soit le seuil de 90 % : Taproot est verrouillé (*locked in*). Ses règles s'appliqueront à partir du bloc 709 632, attendu en novembre."
    related: ["taproot", "speedy-trial", "signaling"]
    sources:
      - "https://mempool.space/block/687284"
      - "https://bitcoinmagazine.com/technical/taproot-locks-in"
      - "https://www.coindesk.com/tech/2021/06/12/locked-in-bitcoins-taproot-upgrade-gets-its-90-mandate"

  - date: "2021-07-03"
    title: "Plus forte baisse de difficulté de l'histoire"
    text: "L'ajustement du bloc 689 472 abaisse la difficulté de minage de 27,94 %, la plus forte baisse depuis 2009. Il suit l'effondrement du hashrate provoqué par la fermeture des fermes de minage en Chine."
    related: ["ajustement-de-la-difficulte", "difficulte", "hashrate"]
    sources:
      - "https://mempool.space/block/689472"
      - "https://www.cnbc.com/2021/07/03/bitcoin-mining-difficulty-drops-after-hashrate-collapse-in-china-.html"
      - "https://decrypt.co/75162/bitcoin-mining-records-largest-difficulty-drop-ever-heres-what-miners-say"

  - date: "2021-09-07"
    title: "Le bitcoin a cours légal au Salvador"
    text: "La loi Bitcoin entre en vigueur : le bitcoin a cours légal au Salvador aux côtés du dollar. Le portefeuille public Chivo, qui offre 30 dollars en bitcoins à chaque inscrit, est coupé quelques heures faute de capacité des serveurs. Le cours chute jusqu'à 16 % dans la matinée."
    related: ["cours-legal"]
    sources:
      - "https://www.coindesk.com/policy/2021/09/07/bitcoin-now-legal-tender-in-el-salvador-marking-world-first"
      - "https://www.cnbc.com/2021/09/07/bitcoin-retreats-from-the-highest-level-since-may-as-el-salvador-adopts-it-as-legal-tender.html"

  - date: "2021-09-24"
    title: "La Chine déclare illégales les transactions en cryptomonnaies"
    text: "La Banque populaire de Chine déclare illégales toutes les activités liées aux cryptomonnaies, y compris les services que des plateformes étrangères rendent aux résidents chinois. Le bitcoin perd environ 2 000 dollars dans la journée."
    sources:
      - "https://www.npr.org/2021/09/24/1040381774/china-cryptocurrency-transactions-illegal-bitcoin"
      - "https://www.coindesk.com/markets/2021/09/24/bitcoin-drops-2k-as-china-declares-cryptocurrency-related-business-illegal"

  - date: "2021-10-19"
    title: "Premier ETF bitcoin américain (BITO)"
    text: "Le ProShares Bitcoin Strategy ETF (BITO) commence à s'échanger au New York Stock Exchange. Premier ETF américain lié au bitcoin, il suit les contrats à terme du CME et non le bitcoin lui-même. Environ un milliard de dollars de parts changent de mains le premier jour."
    related: ["etf"]
    sources:
      - "https://www.cnbc.com/2021/10/19/first-bitcoin-futures-etf-rises-2percent-in-trading-debut.html"
      - "https://bitcoinmagazine.com/markets/bito-first-bitcoin-futures-etf-trades-1-billion-on-first-day"

  - date: "2021-11-10"
    title: "Record du cours à près de 69 000 dollars"
    text: "Après un chiffre d'inflation américaine plus élevé que prévu pour octobre, le bitcoin atteint un record d'environ 68 950 dollars selon CoinDesk, 69 000 dollars selon Forklog, puis rend une partie de ses gains."
    related: ["ath-all-time-high"]
    sources:
      - "https://www.coindesk.com/markets/2021/11/10/market-wrap-higher-inflation-expected-to-send-bitcoin-and-gold-higher-into-end-of-year"
      - "https://forklog.com/en/bitcoin-price-hits-all-time-high-at-69000/"

  - date: "2021-11-14"
    title: "Activation de Taproot"
    text: "Le bloc 709 632, miné par F2Pool à 5 h 15 UTC, active Taproot : les signatures de Schnorr (BIP-0340), Taproot (BIP-0341) et Tapscript (BIP-0342) entrent en vigueur. Plusieurs grands pools n'incluent d'abord aucune dépense Taproot dans leurs blocs."
    related: ["taproot", "soft-fork", "bip-0340", "bip-0341", "bip-0342", "p2tr", "tapscript"]
    sources:
      - "https://mempool.space/block/709632"
      - "https://forklog.com/en/taproot-upgrade-activated-on-the-bitcoin-network/"
      - "https://bitcoinops.org/en/newsletters/2021/11/17/"
