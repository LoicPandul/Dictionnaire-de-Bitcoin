    title: "Verdict du procès Kleiman contre Wright"
    text: "Un jury fédéral de Floride juge que Craig Wright et Dave Kleiman n'étaient pas associés : la succession de Kleiman, qui réclamait la moitié d'environ 1,1 million de bitcoins minés par Satoshi Nakamoto, n'obtient rien. Wright doit verser 100 millions de dollars à W&K Info Defense Research."
