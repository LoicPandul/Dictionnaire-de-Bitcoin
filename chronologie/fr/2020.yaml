# Chronologie de Bitcoin : 2020.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2020-03-12"
    title: "Jeudi noir, le cours du bitcoin s'effondre"
    text: "Dans la panique des marchés liée au Covid-19, le cours du bitcoin perd près de la moitié de sa valeur en une journée. Dans la nuit du 12 au 13 mars, il descend sous 4 000 dollars, jusqu'à 3 858 dollars sur Bitstamp."
    sources:
      - "https://siliconangle.com/2020/03/12/bitcoin-crashes-4000-massive-coronavirus-sell-off/"
      - "https://forklog.com/en/?p=38872"
      - "https://cointelegraph.com/magazine/black-thursday-anniversary-can-crypto-markets-see-another-huge-crash"

  - date: "2020-05-11"
    title: "Troisième halving"
    text: "Le bloc 630 000, miné par AntPool à 19 h 23 UTC, divise par deux la subvention de bloc, qui passe de 12,5 à 6,25 BTC."
    related: ["halving", "subvention-de-bloc"]
    sources:
      - "https://mempool.space/block/000000000000000000024bead8df69990852c202db0e0097c1a12ea637d7e96d"
      - "https://www.crowdfundinsider.com/?p=161351"
      - "https://www.techradar.com/news/bitcoin-halving-sees-mining-profits-slashed-for-third-time"

  - date: "2020-08-11"
    title: "MicroStrategy achète 21 454 bitcoins"
    text: "MicroStrategy, éditeur de logiciels coté au Nasdaq, annonce l'achat de 21 454 bitcoins pour 250 millions de dollars, frais compris, et fait du bitcoin le principal actif de sa trésorerie. Son PDG Michael Saylor le juge supérieur à la détention de liquidités."
    sources:
      - "https://www.nasdaq.com/press-release/microstrategy-adopts-bitcoin-as-primary-treasury-reserve-asset-2020-08-11"
      - "https://www.coindesk.com/markets/2020/08/11/microstrategy-buys-250m-in-bitcoin-calling-the-crypto-superior-to-cash"

  - date: "2020-10-14"
    title: "Publication de MuSig2"
    text: "Jonas Nick, Tim Ruffing et Yannick Seurin déposent sur l'archive de l'IACR l'article décrivant MuSig2, un schéma de multisignature Schnorr en deux tours de communication, sans preuve à divulgation nulle. Le premier tour, l'échange des nonces, peut être fait à l'avance."
    related: ["musig2", "musig", "schnorr-protocole"]
    sources:
      - "https://eprint.iacr.org/2020/1261"
      - "https://bitcoinops.org/en/newsletters/2020/10/21/"

  - date: "2020-10-15"
    title: "Taproot fusionné dans Bitcoin Core"
    text: "La *pull request* #19953, qui ajoute à Bitcoin Core la validation des BIP-0340 à BIP-0342 (Schnorr, Taproot et Tapscript), est fusionnée. Les nouvelles règles ne s'appliquent encore qu'au mode de test privé regtest, faute d'activation sur le réseau principal."
    related: ["taproot", "schnorr-protocole", "tapscript", "bip-0340", "bip-0341", "bip-0342", "bitcoin-core"]
    sources:
      - "https://github.com/bitcoin/bitcoin/pull/19953"
      - "https://bitcoinops.org/en/newsletters/2020/10/21/"
