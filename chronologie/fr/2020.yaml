# Chronologie de Bitcoin : 2020.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2020-01-24"
    title: "Les BIP de Taproot entrent dans le dépôt des BIP"
    text: "Luke Dashjr fusionne dans le dépôt des BIP la proposition de Pieter Wuille et de ses coauteurs, qui reçoit trois numéros : BIP-0340 pour les signatures de Schnorr sur secp256k1, BIP-0341 pour Taproot et BIP-0342 pour Tapscript."
    related: ["bip-0340", "bip-0341", "bip-0342", "taproot", "schnorr-protocole", "tapscript"]
    sources:
      - "https://github.com/bitcoin/bips/pull/876"
      - "https://bitcoinops.org/en/newsletters/2020/01/29/"

  - date: "2020-02-13"
    title: "Arrestation de l'opérateur du mixeur Helix"
    text: "Le département de la Justice américain annonce l'arrestation de Larry Harmon, un habitant d'Akron (Ohio) accusé d'avoir exploité Helix de 2014 à 2017. Ce mixeur du *darknet*, lié au moteur de recherche Grams, aurait fait transiter plus de 350 000 BTC, soit plus de 300 millions de dollars."
    related: ["mixage"]
    sources:
      - "https://web.archive.org/web/2020/https://www.justice.gov/opa/pr/ohio-resident-charged-operating-darknet-based-bitcoin-mixer-which-laundered-over-300-million"
      - "https://www.zdnet.com/article/ohio-man-arrested-for-running-bitcoin-mixing-service-that-laundered-300-million/"
      - "https://yro.slashdot.org/story/20/02/14/0426219/ohio-man-arrested-for-running-bitcoin-mixing-service-that-laundered-300-million"

  - date: "2020-03-04"
    title: "La Cour suprême indienne lève l'interdit bancaire de la RBI"
    text: "La Cour suprême de l'Inde annule la circulaire du 6 avril 2018 par laquelle la Reserve Bank of India interdisait aux banques de servir les acteurs des cryptomonnaies. Les juges la jugent disproportionnée."
    sources:
      - "https://www.business-standard.com/amp/article/pti-stories/sc-allows-banks-to-provide-services-on-cryptocurrencies-sets-aside-rbi-order-120030401528_1.html"
      - "https://asiatimes.com/2020/03/indian-supreme-court-strikes-down-crypto-ban/"

  - date: "2020-03-12"
    title: "Jeudi noir, le cours du bitcoin s'effondre"
    text: "Dans la panique des marchés liée au Covid-19, le cours du bitcoin perd près de la moitié de sa valeur en une journée. Dans la nuit du 12 au 13 mars, il descend sous 4 000 dollars, jusqu'à 3 858 dollars sur Bitstamp."
    sources:
      - "https://siliconangle.com/2020/03/12/bitcoin-crashes-4000-massive-coronavirus-sell-off/"
      - "https://forklog.com/en/?p=38872"
      - "https://cointelegraph.com/magazine/black-thursday-anniversary-can-crypto-markets-see-another-huge-crash"

  - date: "2020-03-17"
    title: "Coinhouse, premier PSAN enregistré par l'AMF"
    text: "Coinhouse, anciennement La Maison du Bitcoin, et sa filiale de conservation deviennent les premiers prestataires de services sur actifs numériques (PSAN) enregistrés par l'Autorité des marchés financiers, sous les numéros E2020-001 et E2020-002, dans le cadre de la loi Pacte."
    related: ["psan"]
    sources:
      - "https://cryptoast.fr/coinhouse-premiere-plateforme-crypto-a-etre-enregistree-par-lamf-en-france/"
      - "https://cryptoactu.com/liste-des-psan-enregistres-et-premieres-consequences/"

  - date: "2020-04-07"
    title: "Bisq suspend les échanges après une faille"
    text: "La plateforme d'échange pair à pair Bisq gèle tous les échanges : un attaquant exploite une faille du protocole d'échange, introduite par une mise à jour, pour détourner environ 3 BTC et 4 000 XMR à 7 utilisateurs du marché XMR/BTC. Le correctif arrive avec la version 1.3.0."
    related: ["bisq"]
    sources:
      - "https://decrypt.co/24961/hacker-steals-250000-from-crypto-exchange-bisq"
      - "https://securityaffairs.com/101377/cyber-crime/bitcoin-exchange-bisq-hack.html"

  - date: "2020-04-30"
    title: "Sortie de lnd 0.10 et des paiements multi-chemins"
    text: "Lightning Labs publie lnd 0.10.0-beta. Le nœud peut désormais envoyer des paiements multi-chemins (MPP), qu'il savait recevoir depuis la version 0.9, et financer un canal par une PSBT, donc directement depuis un portefeuille matériel."
    related: ["lnd", "mpp-multi-path-payments", "psbt", "lightning-labs"]
    sources:
      - "https://lightning.engineering/posts/2020-04-30-lnd-v0.10/"
      - "https://github.com/lightningnetwork/lnd/releases/tag/v0.10.0-beta"

  - date: "2020-05-07"
    title: "Paul Tudor Jones se tourne vers le bitcoin"
    text: "Dans sa lettre aux investisseurs « The Great Monetary Inflation », le gérant Paul Tudor Jones annonce que son fonds Tudor BVI pourra acheter des contrats à terme sur le bitcoin, à hauteur de quelques pour cent de ses actifs, comme protection contre la création monétaire des banques centrales."
    sources:
      - "https://web.archive.org/web/2020/https://www.theblock.co/post/64398/paul-tudor-jones-says-he-is-buying-bitcoin-as-a-hedge-against-central-bank-money-printing"
      - "https://decrypt.co/28169/paul-tudor-jones-makes-compelling-case-for-bitcoin"
      - "https://bitcoinist.com/three-biggest-takeways-from-bitcoin-convert-paul-tudor-jones-investment-letter/"

  - date: "2020-05-11"
    title: "Troisième halving"
    text: "Le bloc 630 000, miné par AntPool à 19 h 23 UTC, divise par deux la subvention de bloc, qui passe de 12,5 à 6,25 BTC."
    related: ["halving", "subvention-de-bloc"]
    sources:
      - "https://mempool.space/block/000000000000000000024bead8df69990852c202db0e0097c1a12ea637d7e96d"
      - "https://www.crowdfundinsider.com/?p=161351"
      - "https://www.techradar.com/news/bitcoin-halving-sees-mining-profits-slashed-for-third-time"

  - date: "2020-06-03"
    title: "Sortie de Bitcoin Core 0.20.0"
    text: "Bitcoin Core 0.20.0 génère par défaut des adresses `bech32` pour les utilisateurs de l'interface RPC, permet de restreindre les commandes RPC autorisées à chaque utilisateur et ajoute une première prise en charge des PSBT dans l'interface graphique."
    related: ["bitcoin-core", "bech32-et-bech32m", "psbt"]
    sources:
      - "https://bitcoincore.org/en/2020/06/03/release-0.20.0/"
      - "https://github.com/bitcoin/bitcoin/releases/tag/v0.20.0"
      - "https://bitcoinops.org/en/newsletters/2020/12/23/"

  - date: "2020-07-15"
    title: "Piratage de Twitter et arnaque au bitcoin"
    text: "Des pirates prennent le contrôle d'environ 130 comptes Twitter, dont ceux de Barack Obama, Joe Biden, Elon Musk et Apple, et promettent de doubler tout bitcoin envoyé à leur adresse. Selon la justice américaine, environ 415 versements y rapportent plus de 117 000 dollars."
    sources:
      - "https://mobilesyrup.com/2020/07/15/twitter-accounts-hacked-bitcoin-scam/"
      - "https://www.local10.com/news/local/2020/07/15/twitter-accounts-of-big-names-like-biden-obama-and-buffet-hacked-in-bitcoin-scheme/"
      - "https://www.irishnews.com/magazine/technology/2020/07/31/news/british-teenager-among-trio-charged-in-us-over-twitter-hack-2023230/"

  - date: "2020-07-22"
    title: "Les banques fédérales américaines autorisées à garder des cryptoactifs"
    text: "L'Office of the Comptroller of the Currency (OCC) publie la lettre interprétative 1170 : les banques nationales et les caisses d'épargne fédérales américaines peuvent proposer à leurs clients un service de garde de cryptomonnaies, y compris la conservation de leurs clés."
    sources:
      - "https://www.occ.gov/news-issuances/news-releases/2020/nr-occ-2020-98.html"
      - "https://www.corporatecomplianceinsights.com/occ-guidance-for-cryptocurrencies/"

  - date: "2020-07-29"
    title: "Ledger révèle une fuite de données clients"
    text: "Ledger annonce le vol de sa base de données commerciale : environ un million d'adresses e-mail, et pour 9 500 clients le nom, l'adresse postale et le téléphone. Un chercheur l'a alerté le 14 juillet. Aucune clé ni phrase de récupération n'est concernée."
    related: ["ledger"]
    sources:
      - "https://www.ledger.com/addressing-the-july-2020-e-commerce-and-marketing-data-breach"
      - "https://www.hackread.com/crypto-wallet-ledger-data-breach-hackers-steal-data/"

  - date: "2020-07-31"
    title: "Arrestation du cerveau présumé du piratage de Twitter"
    text: "La police de Floride arrête Graham Ivan Clark, 17 ans, présenté comme le cerveau du piratage de Twitter du 15 juillet. Le même jour, le département de la Justice inculpe deux complices, le Britannique Mason Sheppard et Nima Fazeli."
    sources:
      - "https://www.cyberscoop.com/accused-twitter-hacker-arrested-bitcoin-florida/"
      - "https://www.irishnews.com/magazine/technology/2020/07/31/news/british-teenager-among-trio-charged-in-us-over-twitter-hack-2023230/"

  - date: "2020-07-31"
    title: "Sortie de c-lightning 0.9.0"
    text: "Blockstream publie c-lightning 0.9.0, baptisée « Rat Poison Squared on Steroids ». Le nœud sait désormais envoyer des paiements en plusieurs parties et des paiements spontanés *keysend*, grâce à une commande `pay` réécrite."
    related: ["cln-c-lightning", "blockstream", "mpp-multi-path-payments"]
    sources:
      - "https://github.com/ElementsProject/lightning/releases/tag/v0.9.0"
      - "https://bitcoinops.org/en/newsletters/2020/08/05/"
      - "https://au.news.yahoo.com/rat-poison-squared-steroids-bitcoin-184724344.html"

  - date: "2020-07-31"
    title: "La Russie interdit de payer en cryptomonnaie"
    text: "Vladimir Poutine signe la loi « Sur les actifs financiers numériques », adoptée par la Douma le 22 juillet. Elle donne un statut légal aux cryptomonnaies mais interdit aux résidents russes de les accepter en paiement de biens ou de services, à partir du 1er janvier 2021."
    sources:
      - "https://forklog.com/en/putin-signs-law-on-digital-financial-assets-dfa/"
      - "https://debevoise.com/insights/publications/2020/08/russia-adopts-law-on-digital-financial-assets"
      - "https://cointelegraph.com/news/russian-lawmakers-finally-pass-countrys-major-crypto-bill"

  - date: "2020-08-11"
    title: "MicroStrategy achète 21 454 bitcoins"
    text: "MicroStrategy, éditeur de logiciels coté au Nasdaq, annonce l'achat de 21 454 bitcoins pour 250 millions de dollars, frais compris, et fait du bitcoin le principal actif de sa trésorerie. Son PDG Michael Saylor le juge supérieur à la détention de liquidités."
    sources:
      - "https://www.nasdaq.com/press-release/microstrategy-adopts-bitcoin-as-primary-treasury-reserve-asset-2020-08-11"
      - "https://www.coindesk.com/markets/2020/08/11/microstrategy-buys-250m-in-bitcoin-calling-the-crypto-superior-to-cash"

  - date: "2020-08-20"
    title: "Sortie de lnd 0.11 et des canaux « wumbo »"
    text: "Lightning Labs publie lnd 0.11.0-beta. Les opérateurs qui le souhaitent peuvent ouvrir des canaux au-delà de l'ancienne limite de 0,1677 BTC, les canaux dits « wumbo »."
    related: ["lnd", "lightning-labs", "lightning-network"]
    sources:
      - "https://lightning.engineering/posts/2020-08-20-lnd-v0.11/"
      - "https://github.com/lightningnetwork/lnd/releases/tag/v0.11.0-beta"
      - "https://bitcoinops.org/en/newsletters/2020/12/23/"

  - date: "2020-09-16"
    title: "Kraken obtient une licence bancaire au Wyoming"
    text: "La plateforme Kraken reçoit de l'État du Wyoming une licence de *special purpose depository institution*. Elle devient la première entreprise de cryptoactifs dotée d'une licence bancaire aux États-Unis."
    sources:
      - "https://www.americanbanker.com/news/crypto-exchange-kraken-receives-wyoming-bank-charter"
      - "https://www.proskauer.com/blog/kraken-becomes-first-digital-asset-company-to-receive-us-bank-charter"

  - date: "2020-09-21"
    title: "Signet fusionné dans Bitcoin Core"
    text: "La *pull request* #18267, qui ajoute à Bitcoin Core les règles de consensus de Signet (BIP-0325), est fusionnée. Ce réseau de test public exige que chaque bloc soit signé par une autorité, ce qui le protège du vandalisme que subit testnet."
    related: ["signet", "bip-0325", "bitcoin-core"]
    sources:
      - "https://github.com/bitcoin/bitcoin/pull/18267"
      - "https://bitcoinops.org/en/newsletters/2020/09/30/"
      - "https://bitcoinops.org/en/newsletters/2020/12/23/"

  - date: "2020-09-25"
    title: "Piratage de KuCoin"
    text: "Des pirates vident les portefeuilles chauds de la plateforme singapourienne KuCoin, qui détecte les premiers retraits suspects le 26 septembre à 3 h 05, heure de Singapour. Le butin, estimé à environ 275 millions de dollars, comprend 1 008 BTC."
    sources:
      - "https://coingeek.com/kucoin-hacked-for-275-million/"
      - "https://securityaffairs.com/108771/cyber-crime/kucoin-cryptocurrency-exchange-hack.html"

  - date: "2020-10-01"
    title: "Les fondateurs de BitMEX inculpés"
    text: "La CFTC poursuit BitMEX pour avoir offert sans autorisation des produits dérivés à des Américains. Le même jour, le parquet de New York inculpe Arthur Hayes, Ben Delo, Samuel Reed et Gregory Dwyer pour violation du Bank Secrecy Act, faute de contrôles contre le blanchiment. Samuel Reed est arrêté."
    sources:
      - "https://www.cftc.gov/PressRoom/PressReleases/8270-20"
      - "https://www.justice.gov/usao-sdny/pr/founders-and-executives-shore-cryptocurrency-derivatives-exchange-charged-violation"
      - "https://www.aljazeera.com/economy/2020/10/2/us-hits-bitmex-cryptocurrency-exchange-founders-with-charges"

  - date: "2020-10-08"
    title: "Square achète 4 709 bitcoins"
    text: "Square, l'entreprise de paiement de Jack Dorsey, annonce l'achat d'environ 4 709 bitcoins pour 50 millions de dollars, soit 1 % de ses actifs totaux."
    sources:
      - "https://squareup.com/us/en/press/2020-bitcoin-investment"
      - "https://fortune.com/2020/10/08/square-bitcoin-buying-spree-50-million/"

  - date: "2020-10-14"
    title: "Publication de MuSig2"
    text: "Jonas Nick, Tim Ruffing et Yannick Seurin déposent sur l'archive de l'IACR l'article décrivant MuSig2, un schéma de multisignature Schnorr en deux tours de communication, sans preuve à divulgation nulle. Le premier tour, l'échange des nonces, peut être fait à l'avance."
    related: ["musig2", "musig", "schnorr-protocole"]
    sources:
      - "https://eprint.iacr.org/2020/1261"
      - "https://bitcoinops.org/en/newsletters/2020/10/21/"

  - date: "2020-10-15"
    title: "Taproot fusionné dans Bitcoin Core"
    text: "La *pull request* #19953, qui ajoute à Bitcoin Core la validation des BIP-0340 à BIP-0342 (Schnorr, Taproot et Tapscript), est fusionnée. Les nouvelles règles ne s'appliquent encore qu'au mode de test privé regtest, faute d'activation sur le réseau principal."
    related: ["taproot", "schnorr-protocole", "tapscript", "bip-0340", "bip-0341", "bip-0342", "bitcoin-core"]
    sources:
      - "https://github.com/bitcoin/bitcoin/pull/19953"
      - "https://bitcoinops.org/en/newsletters/2020/10/21/"

  - date: "2020-10-16"
    title: "OKEx suspend les retraits"
    text: "La plateforme OKEx suspend tous les retraits : l'un des détenteurs de ses clés privées, son fondateur Xu Mingxing selon la presse, est retenu par la police chinoise et ne peut plus autoriser les sorties de fonds. Les retraits reprennent fin novembre."
    sources:
      - "https://www.crowdfundinsider.com/2020/11/169365-okex-says-withdrawals-to-recommence-following-concerns-of-security-breach/"
      - "https://decrypt.co/48830/crypto-exchange-okex-to-reopen-bitcoin-withdrawals-this-month"

  - date: "2020-10-20"
    title: "Divulgation de deux failles de lnd"
    text: "Conner Fromknecht, de Lightning Labs, publie sur la liste lightning-dev le détail de CVE-2020-26895 et CVE-2020-26896, deux failles de lnd signalées en avril par Antoine Riard. Elles permettaient de voler des fonds à un nœud Lightning. Optech recommande de passer à lnd 0.11."
    related: ["lnd", "lightning-labs"]
    sources:
      - "https://web.archive.org/web/2021/https://lists.linuxfoundation.org/pipermail/lightning-dev/2020-October/002858.html"
      - "https://bitcoinops.org/en/newsletters/2020/10/28/"
      - "https://bitcoinops.org/en/newsletters/2020/12/23/"

  - date: "2020-10-21"
    title: "PayPal ouvre l'achat de bitcoins"
    text: "PayPal permet à ses clients américains d'acheter, de détenir et de vendre du bitcoin, de l'ether, du bitcoin cash et du litecoin depuis leur compte, avec Paxos comme prestataire. Les cryptomonnaies restent sur PayPal : impossible de les retirer vers son propre portefeuille."
    related: ["self-custody"]
    sources:
      - "https://newsroom.paypal-corp.com/2020-10-21-PayPal-Launches-New-Service-Enabling-Users-to-Buy-Hold-and-Sell-Cryptocurrency"
      - "https://www.huntonak.com/blockchain-legal-resource/paypal-pushes-crypto-further-into-the-mainstream"

  - date: "2020-11-02"
    title: "Lancement de Lightning Pool"
    text: "Lightning Labs lance en version alpha Lightning Pool, une place de marché non custodiale où les opérateurs de nœuds achètent et vendent aux enchères de la liquidité entrante, c'est-à-dire des canaux Lightning ouverts vers eux."
    related: ["pool-lightning", "lightning-labs", "lightning-network"]
    sources:
      - "https://lightning.engineering/posts/2020-11-02-pool-deep-dive/"
      - "https://bitcoinmagazine.com/technical/lightning-labs-releases-channel-liquidity-marketplace"
      - "https://forklog.com/en/lightning-labs-launches-lightning-pool-liquidity-marketplace/"

  - date: "2020-11-03"
    title: "Plus forte baisse de difficulté depuis 2011"
    text: "Au bloc 655 200, la difficulté du minage baisse de 16,05 %, la plus forte correction depuis 2011. La puissance de calcul recule depuis la fin de la saison des pluies au Sichuan, qui pousse des mineurs chinois à déménager."
    related: ["difficulte", "ajustement-de-la-difficulte"]
    sources:
      - "https://mempool.space/block/0000000000000000000be6439455cefcb61e62eb9b0f47f2c99d2de2ce8dd144"
      - "https://forklog.com/en/bitcoin-network-records-largest-difficulty-drop-since-2011/"

  - date: "2020-11-05"
    title: "Saisie de 69 370 BTC liés à Silk Road"
    text: "Le département de la Justice annonce avoir saisi le 3 novembre 69 370 BTC, environ un milliard de dollars, qu'un pirate surnommé « Individual X » avait volés à Silk Road. Il engage la procédure de confiscation, la plus grosse saisie de cryptomonnaie de son histoire."
    related: ["silk-road"]
    sources:
      - "https://siliconangle.com/2020/11/05/feds-seize-1b-bitcoin-linked-defunct-dark-web-marketplace-silk-road/"
      - "https://www.securityweek.com/us-seizes-1-billion-worth-bitcoin-connected-silk-road"

  - date: "2020-11-30"
    title: "Le bitcoin bat son record de 2017"
    text: "Près de trois ans après son précédent sommet de décembre 2017, le cours du bitcoin atteint un nouveau record de 19 850,11 dollars selon l'indice de CoinDesk."
    related: ["ath-all-time-high"]
    sources:
      - "https://www.coindesk.com/markets/2020/11/30/bitcoin-price-sets-new-record-high-of-19850/"
      - "https://www.cnbc.com/2020/11/30/bitcoin-rallies-back-over-the-weekend-and-breaks-above-19000-again.html"
      - "https://www.punto-informatico.it/bitcoin-nuovo-record-19850-dollari/"

  - date: "2020-12-09"
    title: "La France durcit le régime des PSAN"
    text: "L'ordonnance n° 2020-1544 renforce la lutte contre le blanchiment appliquée aux actifs numériques. L'échange entre cryptoactifs et l'exploitation d'une plateforme de négociation rejoignent la conservation et l'achat-vente contre monnaie légale parmi les services soumis à l'enregistrement obligatoire auprès de l'AMF."
    related: ["psan", "kyc-know-your-customer"]
    sources:
      - "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000042636234"
      - "https://www.amf-france.org/sites/institutionnel/files/pdf/63299/fr/Actifs_numeriques__renforcement_par_ordonnance_du_cadre_de_la_lutte_contre_le_blanchiment_de_capitaux_et_le_financement_du_terrorisme_%28LCB-FT%29_appliques_aux_PSAN.pdf"

  - date: "2020-12-10"
    title: "L'assureur MassMutual achète 100 millions de dollars de bitcoins"
    text: "Massachusetts Mutual Life Insurance, assureur fondé en 1851, achète pour 100 millions de dollars de bitcoins, soit 0,04 % de son fonds général. Il prend aussi une participation de 5 millions de dollars dans NYDIG, qui conserve ses bitcoins."
    sources:
      - "https://decrypt.co/51101/massmutual-buys-bitcoin"
      - "https://www.thinkadvisor.com/2020/12/11/169-year-old-massmutual-invests-100-million-in-bitcoin/"
      - "https://coverager.com/nydig-announces-minority-stake-purchase-by-massmutual/"

  - date: "2020-12-16"
    title: "Le bitcoin dépasse 20 000 dollars"
    text: "Le cours du bitcoin franchit 20 000 dollars pour la première fois et monte jusqu'à 20 893 dollars à New York dans la journée. Il a presque triplé depuis le début de l'année."
    related: ["ath-all-time-high"]
    sources:
      - "https://www.aljazeera.com/economy/2020/12/16/bitcoin-smashes-above-20000-for-first-time"
      - "https://www.businesslive.co.za/bd/markets/2020-12-16-bitcoin-breaks-above-20000-for-the-first-time-in-price-milestone/"
      - "https://www.theblock.co/linked/88037/bitcoin-price-breaks-above-20000-1"

  - date: "2020-12-17"
    title: "Coinbase dépose son dossier d'introduction en Bourse"
    text: "Coinbase annonce avoir déposé à titre confidentiel auprès de la SEC un projet de formulaire S-1, première étape de son entrée en Bourse. La plateforme ne donne ni calendrier, ni nombre d'actions, ni prix."
    related: ["coinbase"]
    sources:
      - "https://decrypt.co/51846/crypto-exchange-coinbase-going-public-ipo"
      - "https://www.crowdfundinsider.com/2020/12/170400-coinbase-files-to-ipo/"

  - date: "2020-12-18"
    title: "FinCEN vise les portefeuilles non hébergés"
    text: "FinCEN, agence du Trésor américain, propose d'obliger banques et prestataires à vérifier l'identité des clients qui échangent avec un portefeuille non hébergé au-delà de 3 000 dollars, et à déclarer ces transactions au-delà de 10 000 dollars. Le public n'a que jusqu'au 4 janvier 2021 pour commenter."
    related: ["self-custody", "kyc-know-your-customer"]
    sources:
      - "https://home.treasury.gov/news/press-releases/sm1216"
      - "https://decrypt.co/52021/us-treasury-apply-bankcrecy-act-rules-crypto-wallets"

  - date: "2020-12-20"
    title: "Les données clients de Ledger publiées en ligne"
    text: "La base volée à Ledger en juin est diffusée sur RaidForums : plus d'un million d'adresses e-mail et, selon Ledger, jusqu'à 272 000 fiches avec nom, adresse postale et téléphone, bien plus que les 9 500 annoncées en juillet. Ledger rappelle qu'il ne demande jamais la phrase de récupération."
