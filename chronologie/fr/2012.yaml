# Chronologie de Bitcoin : 2012.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2012-01-15"
    title: "Bitcoin dans la série The Good Wife"
    text: "CBS diffuse « Bitcoin for Dummies », 13e épisode de la saison 3 de la série judiciaire The Good Wife. Le Trésor américain y traque le créateur anonyme de Bitcoin, dont l'avocat, joué par Jason Biggs, défend l'anonymat devant le tribunal."
    sources:
      - "https://siliconangle.com/2012/01/18/bitcoin-sneaks-into-popular-tv-drama-via-the-good-wife/"
      - "https://bitcoinblog.de/2012/01/21/the-good-wife-bitcoins-appearance-in-a-u-s-tv-series/"
      - "https://en.bitcoin.it/wiki/Bitcoin_references_in_TV_Shows"
  - date: "2012-01-18"
    title: "Luke Dashjr propose le BIP-0017"
    text: "Luke Dashjr publie le brouillon du BIP-0017, qui introduit l'opcode `OP_CHECKHASHVERIFY` comme alternative au P2SH de Gavin Andresen. Chaque camp demande aux mineurs de signaler son choix dans la coinbase ; le BIP-0016 l'emporte et le BIP-0017 est abandonné."
    related: ["bip-0017", "bip-0016", "p2sh", "coinbase"]
    sources:
      - "https://github.com/bitcoin/bips/blob/master/bip-0017.mediawiki"
      - "https://en.bitcoin.it/w/index.php?title=BIP_0017&dir=prev&action=history&limit=500"
      - "https://mailing-list.bitcoindevs.xyz/bitcoindev/CABsx9T2LBXsoQiQguJMoFhA9aM7bFE6AGX9czRQB2wti1Binqw@mail.gmail.com/"
  - date: "2012-02-13"
    title: "Fermeture de TradeHill"
    text: "La plateforme d'échange TradeHill, basée à San Francisco, suspend ses activités et rembourse ses clients. Son PDG Jered Kenna accuse ensuite Dwolla d'avoir annulé environ 100 000 USD de transactions déjà créditées, et poursuit le prestataire de paiement pour 2 millions USD."
    sources:
      - "https://en.bitcoin.it/wiki/TradeHill"
      - "https://news.slashdot.org/story/12/02/15/1658248/major-bitcoin-exchange-ceases-operation"
      - "https://www.americanbanker.com/payments/news/bitcoin-exchange-claims-dwolla-put-it-out-of-business"
  - date: "2012-03-01"
    title: "Vol de 46 703 BTC chez l'hébergeur Linode"
    text: "Des attaquants s'introduisent dans l'infrastructure de l'hébergeur Linode et vident les portefeuilles de plusieurs services Bitcoin. Le butin atteint 46 703 BTC, dont 43 554 BTC à la plateforme Bitcoinica et 3 094 BTC au pool de minage de Marek Palatinus (Slush)."
    related: ["portefeuille-chaud"]
    sources:
      - "https://siliconangle.com/2012/03/02/linode-breach-leads-to-massive-heist-of-46000-btc-from-bitcoinica-faucet/"
      - "https://bitcointalk.org/index.php?topic=66916.0"
      - "https://www.theregister.com/2012/03/02/linode_bitcoin_heist/"
  - date: "2012-03-15"
    title: "Activation du BIP-0030"
    text: "Les nœuds refusent désormais les blocs horodatés après le 15 mars 2012 à 00 h 00 UTC qui contiennent une transaction de même identifiant qu'une transaction antérieure pas entièrement dépensée. Pieter Wuille avait retenu cette date avec les principaux pools de minage."
    related: ["bip-0030", "soft-fork", "txid-transaction-identifier"]
    sources:
      - "https://github.com/bitcoin/bips/blob/master/bip-0030.mediawiki"
      - "https://mailing-list.bitcoindevs.xyz/bitcoindev/CAPg+sBhmGHnMResVxPDZdfpmWTb9uqD0RrQD7oSXBQq7oHpm8g@mail.gmail.com/"
  - date: "2012-03-30"
    title: "Sortie de Bitcoin 0.6.0"
    text: "Gavin Andresen publie Bitcoin-Qt et bitcoind 0.6.0. Les nouveaux portefeuilles utilisent des clés publiques compressées de 33 octets au lieu de 65, la synchronisation initiale s'accélère et le logiciel prend en charge P2SH avant son activation."
    related: ["bitcoin-qt", "bitcoin-core", "cle-publique-compressee", "p2sh"]
    sources:
      - "https://bitcointalk.org/index.php?topic=74737.0"
      - "https://github.com/bitcoin/bitcoin/releases/tag/v0.6.0"
  - date: "2012-04-01"
    title: "Activation de P2SH"
    text: "Les nœuds appliquent les règles du BIP-0016 aux blocs horodatés à partir du 1er avril 2012. Le 16 mars, Gavin Andresen avait confirmé cette date, environ 70 % de la puissance de calcul signalant son soutien. Le *Pay to Script Hash* simplifie l'envoi vers des scripts complexes comme le multisig."
    related: ["p2sh", "bip-0016", "soft-fork", "multisig"]
    sources:
      - "https://github.com/bitcoin/bips/blob/master/bip-0016.mediawiki"
      - "https://mailing-list.bitcoindevs.xyz/bitcoindev/CABsx9T3Hvx-A5+tdPi=-wMWXd_3mW6GbLoponZUjwBA_A=gMMA@mail.gmail.com/"
  - date: "2012-04-24"
    title: "Lancement de SatoshiDice"
    text: "Erik Voorhees présente sur bitcointalk SatoshiDice, un jeu de dés où l'on parie en envoyant des bitcoins à une adresse qui fixe la probabilité de gain. Quelques jours après son lancement, le site représente 40 % de l'activité quotidienne du réseau."
    related: ["satoshidice"]
    sources:
      - "https://bitcointalk.org/index.php?topic=77870.0"
      - "https://coinmetrics.substack.com/p/coin-metrics-state-of-the-network-25c"
  - date: "2012-05"
    title: "Premier numéro de Bitcoin Magazine"
    text: "Mihai Alisie et Vitalik Buterin lancent l'édition imprimée de Bitcoin Magazine, première publication consacrée uniquement à Bitcoin. Le premier numéro part à l'impression le 1er mai, avec un masque d'Anonymous en couverture."
    related: ["bitcoin-magazine"]
    sources:
      - "https://bitcoinmagazine.com/press-releases/get-ready-new-print-edition-bitcoin-magazine"
      - "https://en.bitcoin.it/wiki/Bitcoin_Magazine"
  - date: "2012-05-09"
    title: "Wired publie un rapport du FBI sur Bitcoin"
    text: "Wired révèle un rapport interne du FBI daté du 24 avril, « Bitcoin Virtual Currency: Unique Features Present Distinct Challenges for Deterring Illicit Activity ». Le bureau y craint que Bitcoin serve au blanchiment et aux marchés illicites."
    sources:
      - "https://www.wired.com/2012/05/fbi-fears-bitcoin/"
      - "https://siliconangle.com/2012/05/10/leaked-fbi-report-shows-concern-over-bitcoins-attractiveness-to-criminals/"
  - date: "2012-05-11"
    title: "Bitcoinica perd 18 547 BTC"
    text: "Des pirates entrent dans les serveurs de Bitcoinica et vident son portefeuille en ligne de 18 547 BTC, environ 90 000 USD. La plateforme suspend ses activités ; en juillet, un second vol par son compte Mt. Gox lui coûte encore environ 40 000 BTC."
    related: ["portefeuille-chaud", "mtgox"]
    sources:
      - "https://www.pcworld.com/article/464522/hackers_break_into_bitcoin_exchange_site_bitcoinica_steal_90000_in_bitcoins.html"
      - "https://siliconangle.com/2012/07/16/bitcoinica-cant-catch-a-break-recent-breach-hemorrhages-40000-btc/"
      - "https://www.btc-echo.de/schlagzeilen/fast-60-000-bitcoin-gestohlen-bitcoinica-hack-jaehrt-sich-140836/"
  - date: "2012-06"
    title: "Butterfly Labs annonce ses premiers ASIC"
    text: "Butterfly Labs dévoile la BitForce SC Single, une machine de minage à ASIC annoncée à 40 GH/s pour 1 299 USD, et ouvre les précommandes. Les livraisons, prévues pour octobre, prennent des mois de retard."
    related: ["asic", "minage"]
    sources:
      - "https://bitcoinmagazine.com/?p=30357"
      - "https://blog.zorinaq.com/company-announces-65nm-chip-for-mining-bitcoins-funded-with-vent/"
      - "https://bitcoinmagazine.com/business/bitcoin-developer-receives-first-butterfly-labs-asic-1364858475"
  - date: "2012-06"
    title: "Lancement de LocalBitcoins"
    text: "Jeremias Kangas lance à Helsinki LocalBitcoins, une place de marché qui met en relation des particuliers pour échanger des bitcoins contre leur monnaie locale. Le service fonctionne jusqu'en février 2023."
    related: ["p2p-pair-a-pair"]
    sources:
      - "https://cointelegraph.com/news/localbitcoins"
      - "https://bitcoinmagazine.com/?p=5195"
      - "https://decrypt.co/120933"
  - date: "2012-08-17"
    title: "Effondrement de Bitcoin Savings & Trust"
    text: "Trendon Shavers, alias pirateat40, ferme Bitcoin Savings & Trust, qui promettait jusqu'à 7 % d'intérêts par semaine. En 2013, la SEC le poursuit pour pyramide de Ponzi : il aurait levé au moins 700 000 BTC."
    related: ["bitcointalk"]
    sources:
      - "https://bitcointalk.org/index.php?topic=101339.0"
      - "https://farside.co.uk/?p=45670"
      - "https://www.sec.gov/news/press-release/2013-132"
  - date: "2012-09-04"
    title: "Bitfloor se fait voler 24 000 BTC"
    text: "Roman Shtylman, fondateur de la plateforme américaine Bitfloor, annonce sur bitcointalk qu'un attaquant a trouvé une sauvegarde non chiffrée des clés du portefeuille. Environ 24 000 BTC, près de 250 000 USD, disparaissent et la plateforme suspend ses activités."
    related: ["portefeuille-chaud"]
    sources:
      - "https://www.theregister.com/2012/09/05/bitfloor_heist/"
      - "https://bitcoinmagazine.com/business/bitfloor-hacked-250000-missing-1346821046"
      - "https://www.nbcnews.com/technolog/250-000-worth-bitcoins-stolen-net-heist-980871"
  - date: "2012-09-15"
    title: "Conférence Bitcoin de Londres"
    text: "La Bitcoin Consultancy d'Amir Taaki réunit des centaines de participants à Londres les 15 et 16 septembre, un an après la première conférence de Prague. Richard Stallman, fondateur du projet GNU, figure parmi les intervenants."
    sources:
      - "https://farside.co.uk/london-2012-the-2nd-bitcoin-conference/"
      - "https://bitcoinmagazine.com/industry-events/annual-bitcoin-conference-takes-place-in-london-1348247615"
      - "https://bitcoinmagazine.com/industry-events/the-london-2012-bitcoin-conference-1343146418"
  - date: "2012-09-17"
    title: "Sortie de Bitcoin 0.7.0"
    text: "Gavin Andresen publie Bitcoin-Qt et bitcoind 0.7.0. La version ajoute une console de débogage, l'API de transactions brutes, IPv6, les services cachés Tor et l'appel `getblocktemplate` du BIP-0022. Les blocs minés passent en version 2, comme le prévoit le BIP-0034."
    related: ["bitcoin-qt", "bitcoin-core", "raw-transaction", "tor-the-onion-router", "getblocktemplate", "bip-0022", "bip-0034"]
    sources:
      - "https://bitcointalk.org/index.php?topic=110243.0"
      - "https://github.com/bitcoin/bitcoin/blob/master/doc/release-notes/release-notes-0.7.0.md"
  - date: "2012-09-27"
    title: "Lancement de la Bitcoin Foundation"
    text: "Gavin Andresen annonce sur bitcointalk la création de la Bitcoin Foundation, chargée de « standardiser, protéger et promouvoir » l'usage de Bitcoin. Il la présente comme une association de membres calquée sur la Linux Foundation."
    related: ["fondation-bitcoin"]
    sources:
      - "https://bitcointalk.org/index.php?topic=113400.msg1224721#msg1224721"
      - "https://www.theregister.com/2012/09/29/bitcoin_foundation_launched/"
  - date: "2012-10-26"
    title: "Coinbase ouvre l'achat de bitcoins par compte bancaire"
    text: "Coinbase, fondée par Brian Armstrong et passée par l'incubateur Y Combinator à l'été 2012, permet de relier un compte bancaire américain pour acheter et vendre des bitcoins. En janvier 2013, le service traite déjà 1 million USD d'achats et de ventes par mois."
    sources:
      - "https://web.archive.org/web/2013/http://blog.coinbase.com/post/34357253898/you-can-now-buy-and-sell-bitcoin-by-connecting-any-u-s"
      - "https://bitcoinmagazine.com/articles/introducing-the-exchanges-coinbase-part-1-1378059449"
      - "https://www.ycombinator.com/blog/coinbase-from-yc-to-ipo/"
  - date: "2012-10-29"
    title: "Premier rapport de la BCE sur les monnaies virtuelles"
    text: "La Banque centrale européenne publie « Virtual Currency Schemes », dont la première étude de cas porte sur Bitcoin. Elle conclut que ces monnaies ne menacent ni la stabilité des prix ni celle du système financier, mais qu'elles exposent les banques centrales à un risque de réputation."
    sources:
      - "https://www.ecb.europa.eu/pub/pdf/other/virtualcurrencyschemes201210en.pdf"
      - "https://itweb.co.za/article/the-rise-of-the-virtual-currency/DVgZeyvJjOdvdjX9"
      - "https://yro.slashdot.org/story/12/11/03/1516231/european-central-bank-casts-wary-eye-toward-bitcoin"
      - "https://monoskop.org/log/?p=6232"
  - date: "2012-11-15"
    title: "WordPress.com accepte le bitcoin"
    text: "WordPress.com permet de payer ses services en bitcoin, par l'intermédiaire de BitPay. Andy Skelton justifie ce choix par les restrictions des moyens de paiement classiques : PayPal bloque à lui seul plus de 60 pays."
    sources:
      - "https://thenextweb.com/insider/2012/11/15/wordpress-com-criticizes-paypal-credit-card-firms-for-restrictions-now-lets-you-pay-with-bitcoin/"
      - "https://siliconangle.com/2012/11/16/wordpress-com-announces-acceptance-of-bitcoins-as-payment-for-upgradesservices/"
  - date: "2012-11-28"
    title: "Premier halving"
    text: "Le bloc 210 000, miné à 15 h 24 UTC, ouvre la deuxième époque de l'émission : la récompense de bloc passe de 50 à 25 BTC."
    related: ["halving"]
    sources:
      - "https://mempool.space/block/000000000000048b95347e83192f69cf0366076336c639f9b7228e9ba171342e"
      - "https://blockstream.info/block/000000000000048b95347e83192f69cf0366076336c639f9b7228e9ba171342e"
  - date: "2012-12-06"
    title: "Bitcoin-Central s'adosse à une banque française"
    text: "La plateforme française Bitcoin-Central, exploitée par Paymium, s'associe au prestataire de paiement Aqoba et au Crédit Mutuel Arkéa. Chaque compte client reçoit un numéro de compte bancaire international (IBAN), sous régulation française."
    sources:
      - "https://bitcointalk.org/index.php?topic=129461.0"
      - "https://spectrum.ieee.org/bitcoincentral-is-now-the-worlds-first-bitcoin-bankkind-of"
      - "https://www.pymnts.com/news/2012/bitcoin-becomes-a-lot-more-real/"
