# Chronologie de Bitcoin : 2009.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2009-01-03"
    title: "Minage du bloc genèse"
    text: "Le bloc 0 de Bitcoin est horodaté à 18 h 15 min 05 s UTC. Sa transaction coinbase contient le titre du Times du jour : « Chancellor on brink of second bailout for banks »."
    related: ["genese", "coinbase", "nakamoto-satoshi"]
    sources:
      - "https://mempool.space/block/000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f"
      - "https://blockstream.info/block/000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f"
      - "https://github.com/bitcoin/bitcoin/blob/master/src/kernel/chainparams.cpp"

  - date: "2009-01-08"
    title: "Sortie de Bitcoin v0.1"
    text: "À 19 h 27 UTC, Satoshi Nakamoto annonce sur la liste Cryptography la première version de Bitcoin, pour Windows uniquement, code source C++ inclus. Le logiciel se télécharge sur SourceForge."
    related: ["bitcoin-core", "nakamoto-satoshi", "sourceforge"]
    sources:
      - "https://www.metzdowd.com/pipermail/cryptography/2009-January/014994.html"
      - "https://satoshi.nakamotoinstitute.org/emails/cryptography/16/"

  - date: "2009-01-09"
    title: "Minage du bloc 1"
    text: "Le bloc 1 est horodaté à 2 h 54 UTC, près de 6 jours après le bloc genèse. La chaîne de blocs commence à s'allonger avec la sortie du logiciel."
    related: ["genese"]
    sources:
      - "https://mempool.space/block/00000000839a8e6886ab5951d76f411475428afc90947ee320161bbf18eb6048"
      - "https://blockstream.info/block/00000000839a8e6886ab5951d76f411475428afc90947ee320161bbf18eb6048"

  - date: "2009-01-11"
    title: "Hal Finney tweete « Running bitcoin »"
    text: "À 3 h 33 UTC, Hal Finney publie sur Twitter « Running bitcoin ». Il racontera en 2013 avoir téléchargé le logiciel dès l'annonce de Satoshi Nakamoto et pense avoir été le premier, après lui, à le faire tourner."
    related: ["finney-hal"]
    sources:
      - "https://twitter.com/halfin/status/1110302988"
      - "https://bitcointalk.org/index.php?topic=155054.0"

  - date: "2009-01-12"
    title: "Première transaction entre deux personnes"
    text: "Le bloc 170, horodaté à 3 h 30 UTC, contient la première transaction de Satoshi Nakamoto vers une autre personne : il envoie 10 BTC à Hal Finney, à titre de test, et se rend 40 BTC de monnaie."
    related: ["finney-hal", "nakamoto-satoshi"]
    sources:
      - "https://mempool.space/tx/f4184fc596403b9d638783cf57adfe4c75c605f6356fbc91338530e9831e9e16"
      - "https://blockstream.info/tx/f4184fc596403b9d638783cf57adfe4c75c605f6356fbc91338530e9831e9e16"
      - "https://bitcointalk.org/index.php?topic=155054.0"

  - date: "2009-10-05"
    title: "Premier taux de change publié entre bitcoin et dollar"
    text: "Le site New Liberty Standard publie son premier taux : 1 USD vaut 1 309,03 BTC. Le prix ne vient pas d'échanges réels mais d'un calcul fondé sur le coût de l'électricité nécessaire pour miner ces bitcoins."
    sources:
      - "https://web.archive.org/web/20091229132610/http://newlibertystandard.wetpaint.com/page/Exchange+Rate"
      - "https://www.bullionstar.com/blogs/ronan-manly/dawn-of-bitcoin-price-discovery-2009-2011-the-very-early-bitcoin-exchanges"

  - date: "2009-10-12"
    title: "Première vente connue de bitcoins contre des dollars"
    text: "Martti Malmi vend 5 050 BTC contre 5,02 USD. Il retrouvera la trace de cet échange en 2014 dans ses e-mails : c'est la plus ancienne vente connue de bitcoins contre des dollars."
    sources:
      - "https://twitter.com/marttimalmi/status/423455561703624704"
      - "https://bitcoinmagazine.com/markets/bitcoins-first-trade-now-worth-130-million"
