# Chronologie de Bitcoin : 2013.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2013-01-30"
    title: "Premier mineur ASIC livré au public"
    text: "Avalon livre ses premiers mineurs ASIC, des machines conçues uniquement pour le hachage `SHA256` de Bitcoin. Jeff Garzik reçoit l'une des premières unités vendues au public et confirme qu'elle calcule à 68 GH/s."
    related: ["asic", "mineur"]
    sources:
      - "https://bitcointalk.org/index.php?topic=140099.0"
      - "https://bitcoinmagazine.com/business/working-avalon-asic-confirmed-1359613230"
  - date: "2013-02-19"
    title: "Sortie de Bitcoin 0.8.0"
    text: "Gavin Andresen publie Bitcoin-Qt et bitcoind 0.8.0. Les index des blocs et des transactions passent de Berkeley DB à LevelDB, plus rapide, et le protocole réseau gagne les filtres de Bloom du BIP-0037, qui servent les portefeuilles légers."
    related: ["bitcoin-qt", "bitcoin-core", "leveldb", "berkeleydb", "bloom-filter", "bip-0037", "noeud-spv-noeud-leger"]
    sources:
      - "https://mailing-list.bitcoindevs.xyz/bitcoindev/CABsx9T0okOLprP1-S3mOY6mBLF-x-d-3Nc7Ci7ZKDG-2mAeNFA@mail.gmail.com/"
      - "https://bitcointalk.org/index.php?topic=145184.0"
  - date: "2013-03-11"
    title: "Scission de la chaîne entre les versions 0.7 et 0.8"
    text: "Un mineur en version 0.8.0 produit le bloc 225 430, que les versions antérieures rejettent faute de verrous Berkeley DB suffisants. La chaîne se scinde ; les pools BTC Guild et Slush repassent en 0.7 pour remettre la majorité de la puissance sur une seule chaîne."
    related: ["chainsplit", "berkeleydb", "leveldb", "bip-0050", "mining-pool"]
    sources:
      - "https://bitcoin.org/en/alert/2013-03-11-chain-fork"
      - "https://github.com/bitcoin/bips/blob/master/bip-0050.mediawiki"
  - date: "2013-03-18"
    title: "Le FinCEN encadre les monnaies virtuelles"
    text: "Le régulateur financier américain publie la note FIN-2013-G001. Un simple utilisateur de monnaie virtuelle n'est pas concerné, mais un administrateur ou une plateforme d'échange devient un transmetteur d'argent, soumis aux obligations anti-blanchiment."
    related: ["aml-anti-money-laundering"]
    sources:
      - "https://fincen.gov/resources/statutes-regulations/guidance/application-fincens-regulations-persons-administering"
      - "https://infobytes.orrick.com/2013-03-22/fincen-issues-guidance-virtual-currencies/"
  - date: "2013-03-25"
    title: "Le BIP-0034 devient obligatoire"
    text: "À partir du bloc 227 931, les nœuds rejettent les blocs de version 1 et exigent que la transaction coinbase commence par la hauteur du bloc."
    related: ["bip-0034", "soft-fork", "coinbase", "hauteur-de-bloc", "bip-0090"]
    sources:
      - "https://github.com/bitcoin/bips/blob/master/bip-0090.mediawiki"
      - "https://mempool.space/block/000000000000024b89b42a942fe0d9fea3bb44ab7bd1b19115dd6a759c0808b8"
      - "https://blockstream.info/block/000000000000024b89b42a942fe0d9fea3bb44ab7bd1b19115dd6a759c0808b8"
  - date: "2013-08-22"
    title: "Gregory Maxwell propose CoinJoin"
    text: "Gregory Maxwell décrit CoinJoin sur bitcointalk : plusieurs utilisateurs qui veulent payer construisent ensemble une seule transaction, ce qui brouille le lien entre entrées et sorties. L'idée ne demande aucun changement du protocole."
    related: ["coinjoin"]
    sources:
      - "https://bitcointalk.org/index.php?topic=279249.0"
      - "https://bitcoinmagazine.com/culture/coinjoins-first-steps-how-dark-wallet-paved-the-way-for-a-more-private-bitcoin"
      - "https://bitcoinops.org/en/topics/coinjoin/"
  - date: "2013-09-10"
    title: "Proposition du BIP-0039"
    text: "Marek Palatinus (Slush) présente sur bitcoin-dev le BIP-0039, qui transforme la graine d'un portefeuille en une liste de mots facile à noter. Il veut standardiser un algorithme entre les logiciels et corriger les défauts de celui d'Electrum."
    related: ["bip-0039", "phrase-de-recuperation", "graine", "electrum"]
    sources:
      - "https://github.com/bitcoin/bips/blob/master/bip-0039.mediawiki"
      - "https://mailing-list.bitcoindevs.xyz/bitcoindev/CAJna-HgXPNa2UCO_edBzK=oY5-F=6LQVHap1Vk9XtGr09chy9Q@mail.gmail.com/"
  - date: "2013-10-01"
    title: "Fermeture de Silk Road et arrestation de Ross Ulbricht"
    text: "Le FBI ferme Silk Road et arrête à San Francisco Ross Ulbricht, accusé d'être « Dread Pirate Roberts ». Les autorités saisissent environ 29 655 BTC sur le site, puis annoncent le 25 octobre la saisie de 144 336 BTC sur ses ordinateurs."
    related: ["silk-road", "tor-the-onion-router"]
    sources:
      - "https://www.justice.gov/usao-sdny/pr/manhattan-us-attorney-announces-seizure-additional-28-million-worth-bitcoins-belonging"
      - "https://www.aljazeera.com/amp/news/2013/10/2/fbi-shuts-down-online-black-market"
  - date: "2013-11-27"
    title: "Le bitcoin dépasse 1 000 USD sur Mt. Gox"
    text: "Le cours franchit 1 000 USD sur Mt. Gox, avec un pic à 1 030 USD, après une hausse de plus de 62 % en une semaine."
    related: ["mtgox", "ath-all-time-high"]
    sources:
      - "https://thenextweb.com/insider/2013/11/27/bitcoin-passes-1000-mark-first-time/"
      - "https://techcrunch.com/2013/11/27/bitcoin-crosses-the-1000-mark-on-the-mt-gox-exchange"
  - date: "2013-12-05"
    title: "La Chine interdit le bitcoin à ses banques"
    text: "La Banque populaire de Chine et 4 autres autorités interdisent aux institutions financières et aux services de paiement de proposer des services en bitcoin. Les particuliers restent libres d'en échanger, à leurs risques. Le cours repasse sous 1 000 USD."
    sources:
      - "https://technode.com/2013/12/05/china-central-bank-warns-financial-institutions-of-bitcoin-risks"
      - "https://www.pcworld.com/article/448961/china-bans-banks-from-trading-in-bitcoin.html"
