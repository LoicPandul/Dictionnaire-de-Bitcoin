# Chronologie de Bitcoin : 2024.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2024-01-10"
    title: "La SEC autorise les ETF bitcoin au comptant"
    text: "La SEC approuve la cotation de 11 ETF bitcoin au comptant, dont ceux de BlackRock, Fidelity et Grayscale, sur NYSE Arca, le Nasdaq et Cboe BZX. La veille, un pirate qui avait pris le compte X de la SEC par *SIM swap* avait annoncé cette approbation trop tôt."
    related: ["etf"]
    sources:
      - "https://www.sec.gov/files/rules/sro/nysearca/2024/34-99306.pdf"
      - "https://www.kitco.com/news/article/2024-01-10/sec-approves-11-spot-bitcoin-etfs"
      - "https://www.sec.gov/secgov-x-account"
      - "https://www.nbcnews.com/tech/crypto/sec-says-not-yet-approve-bitcoin-etf-x-account-was-compromised-rcna133158"

  - date: "2024-01-11"
    title: "Premier jour de cotation des ETF bitcoin américains"
    text: "Les 11 ETF bitcoin au comptant ouvrent à la cotation aux États-Unis. Plus de 4,6 milliards de dollars de parts s'échangent dans la journée, une bonne partie sur le fonds de Grayscale, issu de la conversion de son ancien trust."
    related: ["etf"]
    sources:
      - "https://news.bloomberglaw.com/crypto/bitcoin-etf-trades-top-3-billion-in-ground-breaking-first-day"
      - "https://gulfnews.com/business/markets/us-bitcoin-etfs-see-46b-in-volume-in-first-day-of-trading-1.1705157570382"
      - "https://cointelegraph.com/markets/spot-bitcoin-etfs-record-notable-volume-on-day-1-btc-price-nearly-hits-49k"

  - date: "2024-04-20"
    title: "Quatrième halving au bloc 840 000 et lancement des Runes"
    text: "ViaBTC mine le bloc 840 000 à 00 h 09 UTC et la récompense passe de 6,25 à 3,125 BTC. Le protocole de jetons Runes de Casey Rodarmor démarre au même bloc : la course aux premières gravures y porte les frais au record de 37,6 BTC."
    related: ["halving", "runes", "recompense-de-bloc"]
    sources:
      - "https://mempool.space/block/0000000000000000000320283a032748cef8227873ff4872689bf23f1cda83a5"
      - "https://www.tradingview.com/news/cointelegraph:4a59c11af094b:0-bitcoin-users-spend-record-2-4m-in-fees-on-halving-block/"

  - date: "2024-04-24"
    title: "Arrestation des fondateurs de Samourai Wallet"
    text: "La justice américaine inculpe Keonne Rodriguez et William Lonergan Hill, fondateurs de Samourai Wallet, pour blanchiment et transmission d'argent sans licence. Rodriguez est arrêté en Pennsylvanie, Hill au Portugal, et le service est saisi. L'accusation lui reproche plus de 2 milliards de dollars de transactions illégales."
    related: ["samourai-wallet", "whirlpool", "coinjoin"]
    sources:
      - "https://web.archive.org/web/20240424201942/https://www.justice.gov/usao-sdny/pr/founders-and-ceo-cryptocurrency-mixing-service-arrested-and-charged-money-laundering"
      - "https://thehackernews.com/2024/04/doj-arrests-founders-of-crypto-mixer.html"

  - date: "2024-05-08"
    title: "Les *silent payments* deviennent BIP-0352"
    text: "Le dépôt des BIP fusionne BIP-0352, les *silent payments* : le destinataire publie une adresse statique, et chaque payeur en dérive une adresse on-chain unique, sans interaction avec lui."
    related: ["silent-payments", "bip-0352"]
    sources:
      - "https://github.com/bitcoin/bips/pull/1458"
      - "https://bitcoinops.org/en/newsletters/2024/05/17/"

  - date: "2024-07-05"
    title: "Mt. Gox commence à rembourser en bitcoins"
    text: "Dix ans après la faillite, le syndic Nobuaki Kobayashi effectue les premiers remboursements en bitcoins et en bitcoin cash par l'intermédiaire de plateformes désignées. Selon Arkham Intelligence, les portefeuilles de la plateforme détiennent encore 138 985 BTC."
    related: ["mtgox"]
    sources:
      - "https://www.mtgox.com/img/pdf/20240705_01_announcement_en.pdf"
      - "https://www.nbcnews.com/business/markets/mt-gox-begins-repaying-bitcoin-creditors-decade-after-collapse-rcna160489"

  - date: "2024-07-27"
    title: "Donald Trump promet une réserve stratégique de bitcoins"
    text: "À la conférence Bitcoin 2024 de Nashville, Donald Trump, candidat républicain, promet s'il est élu de garder 100 % des bitcoins de l'État fédéral comme cœur d'une réserve stratégique, et de renvoyer Gary Gensler, président de la SEC."
    related: ["reserve-strategique-de-bitcoin"]
    sources:
      - "https://www.wired.com/story/donald-trump-strategic-bitcoin-stockpile-bitcoin-2024/"
      - "https://cointelegraph.com/news/trump-implement-bitcoin-strategic-reserve-elected-president"

  - date: "2024-09-24"
    title: "BOLT-12 entre dans la spécification Lightning"
    text: "Les mainteneurs de la spécification Lightning fusionnent BOLT-12, les *offers* proposées en 2019. Deux nœuds y négocient la facture par messages en oignon, et le destinataire peut cacher son nœud derrière des *blinded paths*."
    related: ["bolt-12", "offer", "blinded-paths", "lightning-network"]
    sources:
      - "https://github.com/lightning/bolts/pull/798"
      - "https://bitcoinops.org/en/newsletters/2024/10/04/"

  - date: "2024-11-06"
    title: "Donald Trump élu, le bitcoin à un nouveau record"
    text: "Au lendemain du scrutin, Donald Trump est déclaré vainqueur de l'élection présidentielle américaine. Le bitcoin monte jusqu'au record de 75 345 dollars."
    related: ["ath-all-time-high"]
    sources:
      - "https://cointelegraph.com/news/trump-declares-victory-crypto-community"
      - "https://www.business-standard.com/amp/markets/cryptocurrency/bitcoin-hits-record-as-traders-bet-trump-s-victory-will-boost-crypto-124110601337_1.html"

  - date: "2024-12-05"
    title: "Le bitcoin dépasse 100 000 dollars"
    text: "Pour la première fois, le bitcoin franchit 100 000 dollars, quelques heures après que Donald Trump a choisi Paul Atkins, favorable aux cryptomonnaies, pour remplacer Gary Gensler à la tête de la SEC."
    related: ["ath-all-time-high"]
    sources:
      - "https://www.nbcnews.com/business/markets/bitcoin-100000-rcna181008"
      - "https://cointelegraph.com/news/bitcoin-hits-100k-btc-price-hit-a-new-all-time-high"

  - date: "2024-12-18"
    title: "Le Salvador recule sur le bitcoin pour un prêt du FMI"
    text: "Le FMI conclut avec le Salvador un accord technique pour un prêt d'environ 1,4 milliard de dollars sur 40 mois. En échange, l'acceptation du bitcoin par le secteur privé devient facultative, les impôts se paient en dollars et l'État se retire peu à peu du portefeuille Chivo."
    sources:
      - "https://www.imf.org/en/news/articles/2024/12/18/pr-24485-el-salvador-imf-reaches-staff-level-agreement-on-an-eff-arrangement"
      - "https://cointelegraph.com/news/el-salvador-bitcoin-payment-voluntary-imf-loan-deal"
