# Chronologie de Bitcoin : 2018.
# Chaque date est recoupée par au moins deux sources indépendantes (champ sources).
# Point de départ : https://bitcointalk.org/index.php?topic=5187275.0

events:
  - date: "2018-01"
    title: "Publication de MuSig"
    text: "Gregory Maxwell, Andrew Poelstra, Yannick Seurin et Pieter Wuille publient MuSig, un schéma de multisignature fondé sur les signatures de Schnorr. Plusieurs signataires y produisent une seule signature, vérifiable contre une clé publique agrégée : un multisig coopératif ressemble alors à une dépense à clé unique."
    related: ["musig", "schnorr-protocole"]
    sources:
      - "https://eprint.iacr.org/2018/068"
      - "https://blog.blockstream.com/en-musig-key-aggregation-schnorr-signatures/"
      - "https://bitcoinops.org/en/newsletters/2018/12/28/"

  - date: "2018-01-23"
    title: "Gregory Maxwell propose Taproot"
    text: "Gregory Maxwell décrit Taproot sur la liste bitcoin-dev. Une sortie engage une clé publique qui peut dépenser seule, ou révéler un script caché si les participants ne coopèrent pas. Une dépense coopérative ressemble alors à un simple paiement à une clé."
    related: ["taproot", "mast"]
    sources:
      - "https://web.archive.org/web/20200501222330/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2018-January/015614.html"
      - "https://bitcoinops.org/en/topics/taproot/"
      - "https://bitcoinops.org/en/newsletters/2018/12/28/"

  - date: "2018-03-15"
    title: "lnd 0.4-beta, première version pour le réseau principal"
    text: "Lightning Labs publie lnd 0.4-beta, première version de son implémentation de Lightning qui peut tourner sur le réseau principal de Bitcoin. L'équipe annonce en même temps une levée de 2,5 millions de dollars, avec Jack Dorsey et Charlie Lee parmi les investisseurs."
    related: ["lnd", "lightning-labs", "lightning-network"]
    sources:
      - "https://lightning.engineering/posts/2018-03-15-lnd-beta/"
      - "https://bitcoinmagazine.com/technical/lightnings-first-implementation-now-beta-developers-raise-25m"

  - date: "2018-04-30"
    title: "Publication d'eltoo et de SIGHASH_NOINPUT"
    text: "Christian Decker, Rusty Russell et Olaoluwa Osuntokun publient eltoo, un mécanisme de mise à jour des canaux Lightning où un état récent remplace un état ancien publié, sans pénalité. Le même jour, Decker propose le drapeau `SIGHASH_NOINPUT` dont eltoo a besoin, futur BIP-0118."
    related: ["eltoo", "bip-0118", "sighash-anyprevout", "lightning-network"]
    sources:
      - "https://blog.blockstream.com/en-eltoo-next-lightning/"
      - "https://web.archive.org/web/20210820211212/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2018-April/015908.html"
      - "https://bitcoinops.org/en/topics/eltoo/"

  - date: "2018-07-06"
    title: "Pieter Wuille propose un BIP pour les signatures de Schnorr"
    text: "Pieter Wuille soumet à la liste bitcoin-dev un projet de BIP pour des signatures de Schnorr de 64 octets sur la courbe secp256k1. Le texte fixe le format des signatures sans proposer encore de soft fork. Il aboutira au BIP-0340."
    related: ["schnorr-protocole", "bip-0340"]
    sources:
      - "https://web.archive.org/web/20191105135032/https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2018-July/016203.html"
      - "https://bitcoinops.org/en/newsletters/2018/07/10/"

  - date: "2018-09-18"
    title: "Bitcoin Core 0.16.3 corrige CVE-2018-17144"
    text: "Bitcoin Core 0.16.3 corrige une faille des versions 0.14.0 à 0.16.2 : un bloc dépensant deux fois la même entrée fait planter le nœud. Le 20 septembre, les développeurs révèlent que la faille permettait aussi, sur certaines versions, de créer des bitcoins en trop."
    related: ["bitcoin-core", "inflation", "double-depense"]
    sources:
      - "https://bitcoincore.org/en/2018/09/20/notice/"
      - "https://github.com/bitcoin/bitcoin/releases/tag/v0.16.3"
      - "https://bitcoinops.org/en/newsletters/2018/09/18/"

  - date: "2018-10-10"
    title: "Lancement de la sidechain Liquid"
    text: "Blockstream annonce le lancement de Liquid, une sidechain fédérée de Bitcoin destinée au règlement entre plateformes d'échange. Sa chaîne tourne depuis le 27 septembre, gérée par 23 membres dont Bitfinex, BitMEX et Xapo."
    related: ["liquid-network", "sidechain", "federation", "blockstream"]
    sources:
      - "https://blockstream.com/press-releases/2018-10-10-blockstream-launches-the-liquid-network/"
      - "https://forklog.com/en/blockstreams-liquid-network-sidechain-for-the-bitcoin-network-goes-live/"

  - date: "2018-11-15"
    title: "Scission de Bitcoin Cash entre ABC et SV"
    text: "À 18 h 02 UTC, un hard fork divise Bitcoin Cash en deux chaînes : Bitcoin ABC et Bitcoin SV, développé par nChain, la société de Craig Wright. Une guerre de puissance de calcul s'engage entre les mineurs des deux camps."
    related: ["bch-bitcoin-cash", "bsv-bitcoin-satoshi-vision", "hard-fork"]
    sources:
      - "https://forklog.com/en/bitcoin-cash-forked-splitting-into-two-blockchains/"
      - "https://thenextweb.com/news/bitcoin-cash-hard-fork-hash"

  - date: "2018-11-28"
    title: "L'OFAC sanctionne pour la première fois des adresses bitcoin"
    text: "Le Trésor américain sanctionne deux Iraniens qui changeaient en rials les rançons en bitcoins du rançongiciel SamSam. Pour la première fois, l'OFAC inscrit des adresses bitcoin dans sa liste de personnes sanctionnées : deux adresses, par lesquelles sont passées plus de 7 000 transactions."
    sources:
      - "https://home.treasury.gov/news/press-releases/sm556"
      - "https://www.wilmerhale.com/en/insights/client-alerts/20181130-ofac-identifies-digital-currency-addresses-in-sanctions-designations-and-provides-faqs-on-digital-currency-compliance"
