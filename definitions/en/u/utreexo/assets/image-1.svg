<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="672" viewBox="0 0 1280 672"><style>/* charte.css : rôles des schémas du Dictionnaire de Bitcoin 2027, en couleur et en noir et blanc.
   Source : design/charte-2027.md, section 6 « Les schémas » (branche feat/couverture-2027,
   commit f5a3a13b). Un schéma n'écrit aucune couleur en dur : il pose des classes de rôle, et la
   classe `nb` sur &lt;html&gt; (ajoutée par rendre.mjs) bascule tout le schéma dans sa version imprimée. */







svg {
  --encre: #1E1A1D;          /* Encre : traits et textes */
  --note: #6B6368;           /* Écorce : annotations */
  --sujet-fond: #AA226A;     /* Figue : LE sujet de la définition, un seul par schéma */
  --sujet-texte: #FFFFFF;
  --valeur-fond: #F4E5C6;    /* Safran clair */
  --valeur-trait: #956D28;   /* Safran */
  --secret-fond: #D3EAEA;    /* Paon clair */
  --secret-trait: #0B6B6E;   /* Paon */
  --fond: #FFFFFF;
}
svg.nb {                    /* livre imprimé : N100, N12, N35 */
  --encre: #000000;
  --note: #000000;
  --sujet-fond: #000000;
  --sujet-texte: #FFFFFF;
  --valeur-fond: #E0E0E0;
  --valeur-trait: #000000;
  --secret-fond: #A6A6A6;
  --secret-trait: #000000;
}

html, body { margin: 0; background: var(--fond); }
svg { display: block; background: var(--fond); }
svg text { font-family: "Archivo Schema", sans-serif; fill: var(--encre); }

/* Textes : rien sous 30 px */
.nom-sujet   { font-size: 36px; font-weight: 600; fill: var(--sujet-texte) !important; }
.etiquette   { font-size: 32px; font-weight: 600; }
.secondaire  { font-size: 30px; font-weight: 400; }
.annotation  { font-size: 30px; font-weight: 400; font-style: italic; fill: var(--note) !important; }
.mono        { font-family: "Atkinson Hyperlegible Mono", monospace !important; font-size: 30px; }
.sur-sujet   { fill: var(--sujet-texte) !important; }   /* tout autre texte posé sur le sujet */

/* Formes par rôle */
.structure   { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* rectangle, angles vifs */
.sujet       { fill: var(--sujet-fond); stroke: var(--sujet-fond); stroke-width: 3; }     /* garde la forme de son type */
.valeur      { fill: var(--valeur-fond); stroke: var(--valeur-trait); stroke-width: 3; }  /* pilule : rx = hauteur / 2 */
.secret      { fill: var(--secret-fond); stroke: var(--secret-trait); stroke-width: 3; }  /* rx = 8 */
.acteur      { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* disque */
.adversaire  { fill: url(#hachures); stroke: var(--encre); stroke-width: 3; }             /* hachures à 45° */
.reserve     { fill: #FFFFFF; stroke: none; }        /* réserve blanche de 8 px sous un texte posé sur des hachures */

/* Modificateur cumulable : hors chaîne (contour tireté, 3 px, motif 10 / 6) */
.tirete      { stroke-dasharray: 10 6; }

/* Traits */
.flux        { fill: none; stroke: var(--encre); stroke-width: 5; marker-end: url(#tete-flux); }
.lien        { fill: none; stroke: var(--encre); stroke-width: 3; marker-end: url(#tete-lien); }
.hors-chaine { fill: none; stroke: var(--encre); stroke-width: 3; stroke-dasharray: 10 6; }
.fleche-note { fill: none; stroke: var(--note); stroke-width: 2; marker-end: url(#tete-note); }
.tete        { fill: var(--encre); }
.tete-note   { fill: none; stroke: var(--note); stroke-width: 2; }
.hachure     { stroke: var(--encre); stroke-width: 2; }

/* styles propres au schéma */

  .cadre   { fill: none; stroke: var(--note); stroke-width: 2; }   /* regroupe les nœuds inconnus, trait d'annotation */
  .attache { fill: none; stroke: var(--encre); stroke-width: 3; }
  .egal    { font-size: 64px; font-weight: 600; }
</style>
  <defs>
    <marker id="tete-flux" viewBox="0 0 18 14" refX="17" refY="7" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L18 7 L0 14 Z"/></marker>
    <marker id="tete-lien" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L12 5 L0 10 Z"/></marker>
    <marker id="tete-note" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="tete-note" d="M1 1 L10 6 L1 11"/></marker>
    <pattern id="hachures" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line class="hachure" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <g id="schema">
   <g transform="translate(16 0)">
    <!-- Cadres légers : nœuds inconnus du nœud Utreexo -->
    <rect class="cadre" x="16" y="320" width="416" height="256"/>
    <rect class="cadre" x="656" y="472" width="208" height="104"/>

    <!-- Rangée 3 : UTXO -->
    <rect class="valeur" x="32" y="488" width="176" height="72" rx="36"/>
    <text class="etiquette" x="120" y="536" text-anchor="middle">UTXO 1</text>
    <rect class="valeur" x="240" y="488" width="176" height="72" rx="36"/>
    <text class="etiquette" x="328" y="536" text-anchor="middle">UTXO 2</text>
    <rect class="hors-chaine" x="456" y="480" width="192" height="88" rx="44"/>
    <rect class="sujet" x="464" y="488" width="176" height="72" rx="36"/>
    <text class="nom-sujet" x="552" y="537" text-anchor="middle">UTXO 3</text>
    <rect class="valeur" x="672" y="488" width="176" height="72" rx="36"/>
    <text class="etiquette" x="760" y="536" text-anchor="middle">UTXO 4</text>

    <!-- Dépendances que le nœud ne calcule pas -->
    <path class="lien" d="M120 488 V412"/>
    <path class="lien" d="M328 488 V412"/>
    <path class="lien" d="M760 488 V412"/>
    <path class="lien" d="M160 336 V260"/>
    <path class="lien" d="M288 336 V260"/>

    <!-- Rangée 2 -->
    <rect class="structure" x="32" y="336" width="176" height="72"/>
    <text class="etiquette" x="120" y="384" text-anchor="middle">Hash 1</text>
    <rect class="structure" x="240" y="336" width="176" height="72"/>
    <text class="etiquette" x="328" y="384" text-anchor="middle">Hash 2</text>
    <rect class="structure" x="464" y="336" width="176" height="72"/>
    <text class="etiquette" x="552" y="384" text-anchor="middle">Hash 3</text>
    <rect class="structure tirete" x="672" y="336" width="176" height="72"/>
    <text class="etiquette" x="760" y="384" text-anchor="middle">Hash 4</text>

    <!-- Rangée 1 -->
    <rect class="structure tirete" x="120" y="184" width="208" height="72"/>
    <text class="etiquette" x="224" y="232" text-anchor="middle">Hash 1-2</text>
    <rect class="structure" x="552" y="184" width="208" height="72"/>
    <text class="etiquette" x="656" y="232" text-anchor="middle">Hash 3-4</text>

    <!-- Racine calculée -->
    <rect class="structure" x="288" y="32" width="304" height="72"/>
    <text class="etiquette" x="440" y="80" text-anchor="middle">Computed root</text>

    <!-- Chemin recalculé par le nœud -->
    <path class="flux" d="M552 480 V412"/>
    <path class="flux" d="M600 336 V260"/>
    <path class="flux" d="M712 336 V260"/>
    <path class="flux" d="M576 184 V108"/>
    <path class="flux" d="M312 184 V108"/>

    <text class="egal" x="744" y="91" text-anchor="middle">=</text>
    <text class="annotation" x="616" y="156">if equal, UTXO 3 exists</text>

    <!-- Annotations -->
    <text class="annotation" x="16" y="140">proof</text>
    <path class="fleche-note" d="M68 150 C 80 170, 96 188, 116 204"/>

    <text class="annotation" x="440" y="640" text-anchor="middle">unseen by the node</text>
    <path class="fleche-note" d="M312 630 C 290 626, 280 610, 276 582"/>
    <path class="fleche-note" d="M568 630 C 680 640, 730 620, 744 582"/>
   </g>

    <!-- Racine en RAM et nœud -->
    <rect class="structure" x="912" y="32" width="336" height="72"/>
    <text class="etiquette" x="1080" y="80" text-anchor="middle">Root in RAM</text>
    <path class="attache" d="M1080 104 V192"/>
    <circle class="acteur" cx="1080" cy="280" r="88"/>
    <text class="etiquette" x="1080" y="272" text-anchor="middle">Utreexo</text>
    <text class="etiquette" x="1080" y="308" text-anchor="middle">node</text>

    <text class="annotation" x="912" y="480">proof received</text>
    <text class="annotation" x="912" y="516">with the transaction</text>
    <path class="fleche-note" d="M906 464 C 900 430, 892 400, 870 384"/>
  </g>
</svg>