    <text class="secondaire" style="font-size:48px" x="322" y="117">y<tspan font-size="30" dy="-20">2</tspan><tspan dy="20"> = x</tspan><tspan font-size="30" dy="-20">3</tspan><tspan dy="20"> + 7</tspan></text>
    <!-- Abscisse commune : de P1 jusqu'au champ x de la clé -->
