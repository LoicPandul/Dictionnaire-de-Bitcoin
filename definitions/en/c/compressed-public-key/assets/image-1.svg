    <text class="annotation" x="64" y="744">selects P1 or P2</text>
    <text class="annotation" x="64" y="784">by the parity of y,</text>
    <text class="annotation" x="64" y="824">not by its sign</text>
    <path class="fleche-note" d="M144 842 Q154 912 332 916"/>
  </g>
</svg>