    <path d="M944.00 516 V596" style="stroke:var(--fond);stroke-width:3"/>
    <text class="etiquette sur-sujet" x="994.67" y="568" text-anchor="middle">10</text>
    <path d="M1045.33 516 V596" style="stroke:var(--fond);stroke-width:3"/>
    <text class="etiquette sur-sujet" x="1096.00" y="568" text-anchor="middle">11</text>
    <path d="M1146.67 516 V596" style="stroke:var(--fond);stroke-width:3"/>
