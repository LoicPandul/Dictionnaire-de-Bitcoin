    <path class="flux" d="M96 356 V428"/>
    <text class="annotation" x="128" y="402">a word from the list of 2,048 words</text>
    <rect class="sujet" x="32" y="436" width="1216" height="176"/>
    <text class="nom-sujet" x="640" y="488" text-anchor="middle">Mnemonic phrase</text>
    <text class="etiquette sur-sujet" x="82.67" y="568" text-anchor="middle">1</text>
    <path d="M133.33 516 V596" style="stroke:var(--fond);stroke-width:3"/>
