    <path d="M234.67 516 V596" style="stroke:var(--fond);stroke-width:3"/>
    <text class="etiquette sur-sujet" x="285.33" y="568" text-anchor="middle">3</text>
    <path d="M336.00 516 V596" style="stroke:var(--fond);stroke-width:3"/>
    <text class="etiquette sur-sujet" x="386.67" y="568" text-anchor="middle">4</text>
