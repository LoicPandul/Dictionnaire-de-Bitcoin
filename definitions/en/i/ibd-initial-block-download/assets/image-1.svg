<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="768" viewBox="0 0 1280 768"><style>/* charte.css : rôles des schémas du Dictionnaire de Bitcoin 2027, en couleur et en noir et blanc.
   Source : design/charte-2027.md, section 6 « Les schémas » (branche feat/couverture-2027,
   commit f5a3a13b). Un schéma n'écrit aucune couleur en dur : il pose des classes de rôle, et la
   classe `nb` sur &lt;html&gt; (ajoutée par rendre.mjs) bascule tout le schéma dans sa version imprimée. */







svg {
  --encre: #1E1A1D;          /* Encre : traits et textes */
  --note: #6B6368;           /* Écorce : annotations */
  --sujet-fond: #AA226A;     /* Figue : LE sujet de la définition, un seul par schéma */
  --sujet-texte: #FFFFFF;
  --valeur-fond: #F4E5C6;    /* Safran clair */
  --valeur-trait: #956D28;   /* Safran */
  --secret-fond: #D3EAEA;    /* Paon clair */
  --secret-trait: #0B6B6E;   /* Paon */
  --fond: #FFFFFF;
}
svg.nb {                    /* livre imprimé : N100, N12, N35 */
  --encre: #000000;
  --note: #000000;
  --sujet-fond: #000000;
  --sujet-texte: #FFFFFF;
  --valeur-fond: #E0E0E0;
  --valeur-trait: #000000;
  --secret-fond: #A6A6A6;
  --secret-trait: #000000;
}

html, body { margin: 0; background: var(--fond); }
svg { display: block; background: var(--fond); }
svg text { font-family: "Archivo Schema", sans-serif; fill: var(--encre); }

/* Textes : rien sous 30 px */
.nom-sujet   { font-size: 36px; font-weight: 600; fill: var(--sujet-texte) !important; }
.etiquette   { font-size: 32px; font-weight: 600; }
.secondaire  { font-size: 30px; font-weight: 400; }
.annotation  { font-size: 30px; font-weight: 400; font-style: italic; fill: var(--note) !important; }
.mono        { font-family: "Atkinson Hyperlegible Mono", monospace !important; font-size: 30px; }
.sur-sujet   { fill: var(--sujet-texte) !important; }   /* tout autre texte posé sur le sujet */

/* Formes par rôle */
.structure   { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* rectangle, angles vifs */
.sujet       { fill: var(--sujet-fond); stroke: var(--sujet-fond); stroke-width: 3; }     /* garde la forme de son type */
.valeur      { fill: var(--valeur-fond); stroke: var(--valeur-trait); stroke-width: 3; }  /* pilule : rx = hauteur / 2 */
.secret      { fill: var(--secret-fond); stroke: var(--secret-trait); stroke-width: 3; }  /* rx = 8 */
.acteur      { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* disque */
.adversaire  { fill: url(#hachures); stroke: var(--encre); stroke-width: 3; }             /* hachures à 45° */
.reserve     { fill: #FFFFFF; stroke: none; }        /* réserve blanche de 8 px sous un texte posé sur des hachures */

/* Modificateur cumulable : hors chaîne (contour tireté, 3 px, motif 10 / 6) */
.tirete      { stroke-dasharray: 10 6; }

/* Traits */
.flux        { fill: none; stroke: var(--encre); stroke-width: 5; marker-end: url(#tete-flux); }
.lien        { fill: none; stroke: var(--encre); stroke-width: 3; marker-end: url(#tete-lien); }
.hors-chaine { fill: none; stroke: var(--encre); stroke-width: 3; stroke-dasharray: 10 6; }
.fleche-note { fill: none; stroke: var(--note); stroke-width: 2; marker-end: url(#tete-note); }
.tete        { fill: var(--encre); }
.tete-note   { fill: none; stroke: var(--note); stroke-width: 2; }
.hachure     { stroke: var(--encre); stroke-width: 2; }
</style>
  <defs>
    <marker id="tete-flux" viewBox="0 0 18 14" refX="17" refY="7" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L18 7 L0 14 Z"/></marker>
    <marker id="tete-lien" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L12 5 L0 10 Z"/></marker>
    <marker id="tete-note" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="tete-note" d="M1 1 L10 6 L1 11"/></marker>
    <pattern id="hachures" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line class="hachure" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <g id="schema">
    <!-- Pairs -->
    <circle class="acteur" cx="360" cy="96" r="64"/>
    <text class="etiquette" x="360" y="107" text-anchor="middle">Peer</text>
    <circle class="acteur" cx="600" cy="96" r="64"/>
    <text class="etiquette" x="600" y="107" text-anchor="middle">Peer</text>
    <circle class="acteur" cx="840" cy="96" r="64"/>
    <text class="etiquette" x="840" y="107" text-anchor="middle">Peer</text>

    <!-- En-têtes d'abord : un pair -->
    <path class="lien" d="M320 146 V332"/>
    <text class="annotation" x="296" y="224" text-anchor="end">headers</text>
    <text class="annotation" x="296" y="260" text-anchor="end">first</text>

    <!-- Puis blocs en parallèle -->
    <path class="flux" d="M400 146 V332"/>
    <path class="flux" d="M600 160 V332"/>
    <path class="flux" d="M840 160 V332"/>
    <rect class="structure" x="368" y="208" width="64" height="64"/>
    <text class="mono" x="400" y="251" text-anchor="middle">2</text>
    <rect class="structure" x="568" y="208" width="64" height="64"/>
    <text class="mono" x="600" y="251" text-anchor="middle">1</text>
    <rect class="structure" x="808" y="208" width="64" height="64"/>
    <text class="mono" x="840" y="251" text-anchor="middle">3</text>
    <text class="annotation" x="936" y="224">then blocks,</text>
    <text class="annotation" x="936" y="260">in parallel</text>

    <!-- Sujet -->
    <rect class="sujet" x="192" y="336" width="720" height="128"/>
    <text class="nom-sujet" x="552" y="394" text-anchor="middle">Initial block download</text>
    <text class="secondaire sur-sujet" x="552" y="438" text-anchor="middle">validates each block, in order</text>

    <!-- UTXO set -->
    <path class="flux" d="M912 400 H988"/>
    <rect class="structure" x="992" y="320" width="256" height="160"/>
    <text class="etiquette" x="1120" y="376" text-anchor="middle">UTXO set</text>
    <text class="secondaire" x="1120" y="420" text-anchor="middle">updated</text>
    <text class="secondaire" x="1120" y="456" text-anchor="middle">with each block</text>

    <!-- Chaîne locale : bloc = en-tête + corps ; à venir = en-tête seul -->
    <path class="flux" d="M592 464 V556"/>
    <rect class="structure" x="32" y="560" width="176" height="96"/>
    <path class="structure" d="M32 584 H208"/>
    <text class="etiquette" x="120" y="632" text-anchor="middle">Genesis</text>
    <path class="lien" d="M208 572 H254"/>
    <rect class="structure" x="256" y="560" width="96" height="96"/>
    <path class="structure" d="M256 584 H352"/>
    <text class="mono" x="304" y="631" text-anchor="middle">1</text>
    <path class="lien" d="M352 572 H398"/>
    <rect class="structure" x="400" y="560" width="96" height="96"/>
    <path class="structure" d="M400 584 H496"/>
    <text class="mono" x="448" y="631" text-anchor="middle">2</text>
    <path class="lien" d="M496 572 H542"/>
    <rect class="structure" x="544" y="560" width="96" height="96"/>
    <path class="structure" d="M544 584 H640"/>
    <text class="mono" x="592" y="631" text-anchor="middle">3</text>
    <path class="lien" d="M640 572 H686"/>
    <rect class="structure" x="688" y="560" width="96" height="24"/>
    <text class="mono" x="736" y="624" text-anchor="middle">4</text>
    <path class="lien" d="M784 572 H830"/>
    <rect class="structure" x="832" y="560" width="96" height="24"/>
    <text class="mono" x="880" y="624" text-anchor="middle">5</text>
    <path class="lien" d="M928 572 H962"/>
    <text class="etiquette" x="1000" y="583" text-anchor="middle">…</text>
    <path class="lien" d="M1036 572 H1054"/>
    <rect class="structure" x="1056" y="560" width="192" height="24"/>
    <text class="etiquette" x="1152" y="626" text-anchor="middle">Tip</text>
    <text class="annotation" x="672" y="510">headers only</text>
    <path class="fleche-note" d="M752 520 C752 536 744 548 740 556"/>

    <!-- assumevalid -->
    <path class="fleche-note" d="M32 680 V688 H1036 V680" style="marker-end:none"/>
    <text class="annotation" x="534" y="732" text-anchor="middle">scripts not verified before the assumevalid block</text>
  </g>
</svg>