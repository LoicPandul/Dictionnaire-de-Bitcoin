    <text class="etiquette" x="833.4132741310386" y="479.52977748617513">Observer</text>
    <text class="annotation" x="833.4132741310386" y="524.5297774861751">sees this node</text>
    <text class="annotation" x="833.4132741310386" y="562.5297774861751">propagate it first</text>
    <path class="fleche-note" d="M825.4132741310386 552.5297774861751 C 751.4132741310386 558.5297774861751, 696 439, 654 342"/>
  </g>
</svg>