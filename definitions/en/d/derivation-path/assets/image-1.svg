<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040"><style>/* charte.css : rôles des schémas du Dictionnaire de Bitcoin 2027, en couleur et en noir et blanc.
   Source : design/charte-2027.md, section 6 « Les schémas » (branche feat/couverture-2027,
   commit f5a3a13b). Un schéma n'écrit aucune couleur en dur : il pose des classes de rôle, et la
   classe `nb` sur &lt;html&gt; (ajoutée par rendre.mjs) bascule tout le schéma dans sa version imprimée. */







svg {
  --encre: #1E1A1D;          /* Encre : traits et textes */
  --note: #6B6368;           /* Écorce : annotations */
  --sujet-fond: #AA226A;     /* Figue : LE sujet de la définition, un seul par schéma */
  --sujet-texte: #FFFFFF;
  --valeur-fond: #F4E5C6;    /* Safran clair */
  --valeur-trait: #956D28;   /* Safran */
  --secret-fond: #D3EAEA;    /* Paon clair */
  --secret-trait: #0B6B6E;   /* Paon */
  --fond: #FFFFFF;
}
svg.nb {                    /* livre imprimé : N100, N12, N35 */
  --encre: #000000;
  --note: #000000;
  --sujet-fond: #000000;
  --sujet-texte: #FFFFFF;
  --valeur-fond: #E0E0E0;
  --valeur-trait: #000000;
  --secret-fond: #A6A6A6;
  --secret-trait: #000000;
}

html, body { margin: 0; background: var(--fond); }
svg { display: block; background: var(--fond); }
svg text { font-family: "Archivo Schema", sans-serif; fill: var(--encre); }

/* Textes : rien sous 30 px */
.nom-sujet   { font-size: 36px; font-weight: 600; fill: var(--sujet-texte) !important; }
.etiquette   { font-size: 32px; font-weight: 600; }
.secondaire  { font-size: 30px; font-weight: 400; }
.annotation  { font-size: 30px; font-weight: 400; font-style: italic; fill: var(--note) !important; }
.mono        { font-family: "Atkinson Hyperlegible Mono", monospace !important; font-size: 30px; }
.sur-sujet   { fill: var(--sujet-texte) !important; }   /* tout autre texte posé sur le sujet */

/* Formes par rôle */
.structure   { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* rectangle, angles vifs */
.sujet       { fill: var(--sujet-fond); stroke: var(--sujet-fond); stroke-width: 3; }     /* garde la forme de son type */
.valeur      { fill: var(--valeur-fond); stroke: var(--valeur-trait); stroke-width: 3; }  /* pilule : rx = hauteur / 2 */
.secret      { fill: var(--secret-fond); stroke: var(--secret-trait); stroke-width: 3; }  /* rx = 8 */
.acteur      { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* disque */
.adversaire  { fill: url(#hachures); stroke: var(--encre); stroke-width: 3; }             /* hachures à 45° */
.reserve     { fill: #FFFFFF; stroke: none; }        /* réserve blanche de 8 px sous un texte posé sur des hachures */

/* Modificateur cumulable : hors chaîne (contour tireté, 3 px, motif 10 / 6) */
.tirete      { stroke-dasharray: 10 6; }

/* Traits */
.flux        { fill: none; stroke: var(--encre); stroke-width: 5; marker-end: url(#tete-flux); }
.lien        { fill: none; stroke: var(--encre); stroke-width: 3; marker-end: url(#tete-lien); }
.hors-chaine { fill: none; stroke: var(--encre); stroke-width: 3; stroke-dasharray: 10 6; }
.fleche-note { fill: none; stroke: var(--note); stroke-width: 2; marker-end: url(#tete-note); }
.tete        { fill: var(--encre); }
.tete-note   { fill: none; stroke: var(--note); stroke-width: 2; }
.hachure     { stroke: var(--encre); stroke-width: 2; }
</style>
  <defs>
    <marker id="tete-flux" viewBox="0 0 18 14" refX="17" refY="7" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L18 7 L0 14 Z"/></marker>
    <marker id="tete-lien" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L12 5 L0 10 Z"/></marker>
    <marker id="tete-note" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="tete-note" d="M1 1 L10 6 L1 11"/></marker>
    <pattern id="hachures" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line class="hachure" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <g id="schema">
    <rect class="sujet" x="32" y="32" width="1216" height="96"/>
    <text class="mono sur-sujet" style="font-size:48px;font-weight:700" x="133.3" y="97" text-anchor="middle">m</text>
    <text class="mono sur-sujet" style="font-size:48px" x="234.7" y="97" text-anchor="middle">/</text>
    <text class="mono sur-sujet" style="font-size:48px;font-weight:700" x="336.0" y="97" text-anchor="middle">86'</text>
    <text class="mono sur-sujet" style="font-size:48px" x="437.3" y="97" text-anchor="middle">/</text>
    <text class="mono sur-sujet" style="font-size:48px;font-weight:700" x="538.7" y="97" text-anchor="middle">0'</text>
    <text class="mono sur-sujet" style="font-size:48px" x="640.0" y="97" text-anchor="middle">/</text>
    <text class="mono sur-sujet" style="font-size:48px;font-weight:700" x="741.3" y="97" text-anchor="middle">0'</text>
    <text class="mono sur-sujet" style="font-size:48px" x="842.7" y="97" text-anchor="middle">/</text>
    <text class="mono sur-sujet" style="font-size:48px;font-weight:700" x="944.0" y="97" text-anchor="middle">0</text>
    <text class="mono sur-sujet" style="font-size:48px" x="1045.3" y="97" text-anchor="middle">/</text>
    <text class="mono sur-sujet" style="font-size:48px;font-weight:700" x="1146.7" y="97" text-anchor="middle">5</text>
    <path class="fleche-note" style="marker-end:none" d="M842.7 160 V1008"/>
    <rect class="secret" rx="8" x="33.3" y="176" width="200" height="112"/>
    <text class="mono" style="font-size:40px;font-weight:700" x="133.3" y="226" text-anchor="middle">m</text>
    <text class="secondaire" x="133.3" y="270" text-anchor="middle">master key</text>
    <text class="annotation" x="133.3" y="336" text-anchor="middle">depth 0</text>
    <path class="flux" d="M233.3 232 H336.0 V310"/>
    <rect class="secret" rx="8" x="256.0" y="320" width="176" height="112"/>
    <rect class="secret" rx="8" x="248.0" y="312" width="176" height="112"/>
    <text class="mono" style="font-size:40px;font-weight:700" x="336.0" y="362" text-anchor="middle">86'</text>
    <text class="secondaire" x="336.0" y="406" text-anchor="middle">BIP-0086</text>
    <text class="annotation" x="336.0" y="472" text-anchor="middle">depth 1</text>
    <path class="flux" d="M424.0 368 H538.7 V446"/>
    <rect class="secret" rx="8" x="458.7" y="456" width="176" height="112"/>
    <rect class="secret" rx="8" x="450.7" y="448" width="176" height="112"/>
    <text class="mono" style="font-size:40px;font-weight:700" x="538.7" y="498" text-anchor="middle">0'</text>
    <text class="secondaire" x="538.7" y="542" text-anchor="middle">bitcoin</text>
    <text class="annotation" x="538.7" y="608" text-anchor="middle">depth 2</text>
    <path class="flux" d="M626.7 504 H741.3 V582"/>
    <rect class="secret" rx="8" x="661.3" y="592" width="176" height="112"/>
    <rect class="secret" rx="8" x="653.3" y="584" width="176" height="112"/>
    <text class="mono" style="font-size:40px;font-weight:700" x="741.3" y="634" text-anchor="middle">0'</text>
    <text class="secondaire" x="741.3" y="678" text-anchor="middle">1st account</text>
    <text class="annotation" x="741.3" y="744" text-anchor="middle">depth 3</text>
    <path class="flux" d="M829.3 640 H944.0 V718"/>
    <rect class="secret" rx="8" x="864.0" y="728" width="176" height="112"/>
    <rect class="secret" rx="8" x="856.0" y="720" width="176" height="112"/>
    <text class="mono" style="font-size:40px;font-weight:700" x="944.0" y="770" text-anchor="middle">0</text>
    <text class="secondaire" x="944.0" y="814" text-anchor="middle">external</text>
    <text class="annotation" x="944.0" y="880" text-anchor="middle">depth 4</text>
    <path class="flux" d="M1032.0 776 H1146.7 V854"/>
    <rect class="secret" rx="8" x="1066.7" y="864" width="176" height="112"/>
    <rect class="secret" rx="8" x="1058.7" y="856" width="176" height="112"/>
    <text class="mono" style="font-size:40px;font-weight:700" x="1146.7" y="906" text-anchor="middle">5</text>
    <text class="secondaire" x="1146.7" y="950" text-anchor="middle">6th address</text>
    <text class="annotation" x="1146.7" y="1016" text-anchor="middle">depth 5</text>
    <text class="annotation" x="410.7" y="652" text-anchor="end">other keys</text>
    <text class="annotation" x="410.7" y="692" text-anchor="end">at the same depth</text>
    <path class="fleche-note" d="M410.7 620 C 416.7 578, 426.7 569, 449.7 568"/>
    <text class="etiquette" x="874.7" y="224">normal derivation</text>
    <text class="secondaire" x="874.7" y="272">public keys</text>
    <text class="secondaire" x="874.7" y="312">computable from</text>
    <text class="secondaire" x="874.7" y="352">the account xpub</text>
    <text class="etiquette" x="810.7" y="960" text-anchor="end">hardened derivation (<tspan class="mono" style="font-size:32px;font-weight:700">'</tspan>)</text>
    <text class="secondaire" x="810.7" y="1004" text-anchor="end">parent private key required</text>
  </g>
</svg>