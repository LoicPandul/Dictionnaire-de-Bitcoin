    <path class="lien" style="marker-end:none" d="M640 372 H672"/>
    <rect class="valeur adversaire" x="106" y="464" width="500" height="64" rx="32"/><rect id="res" class="reserve" x="138" y="472" width="436" height="48"/><text id="txt" class="etiquette" x="356" y="507" text-anchor="middle">Same bitcoin to the attacker</text>
    <path class="lien" d="M356 464 V418"/>
    <text class="etiquette" x="808" y="239">Public chain</text>
    <text class="etiquette" x="808" y="368">Attacker's chain</text>
    <text class="annotation" x="808" y="408">secret, faster:</text>
    <text class="annotation" x="808" y="444">over 50% of the hashrate</text>
    <path class="flux" d="M716 436 V770"/>
    <text class="annotation" x="740" y="612">published</text>
    <text class="etiquette" x="32" y="640">After</text>
    <rect class="structure" x="312" y="648" width="88" height="88"/>
    <rect class="structure" x="432" y="648" width="88" height="88"/>
    <rect class="structure" x="552" y="648" width="88" height="88"/>
    <path class="lien" style="marker-end:none" d="M400 692 H432"/>
    <path class="lien" style="marker-end:none" d="M520 692 H552"/>
    <rect class="structure" x="32" y="776" width="88" height="88"/>
    <rect class="structure" x="152" y="776" width="88" height="88"/>
    <path class="lien" style="marker-end:none" d="M120 820 H152"/>
    <path class="lien" style="marker-end:none" d="M240 820 H312"/>
    <path class="lien" style="marker-end:none" d="M240 820 L312 692"/>
    <rect class="structure" x="312" y="776" width="88" height="88"/>
    <rect class="structure" x="432" y="776" width="88" height="88"/>
    <rect class="structure" x="552" y="776" width="88" height="88"/>
    <rect class="structure" x="672" y="776" width="88" height="88"/>
    <path class="lien" style="marker-end:none" d="M400 820 H432"/>
    <path class="lien" style="marker-end:none" d="M520 820 H552"/>
    <path class="lien" style="marker-end:none" d="M640 820 H672"/>
    <text class="etiquette" x="808" y="684">Public chain abandoned</text>
    <text class="annotation" x="808" y="724">payment canceled</text>
    <text class="etiquette" x="808" y="812">Attacker's chain</text>
    <text class="annotation" x="808" y="852">more work: adopted</text>
    <path class="sujet" d="M312 328 h88 v88 h-88 Z M432 328 h88 v88 h-88 Z M552 328 h88 v88 h-88 Z M672 328 h88 v88 h-88 Z"/>
  </g>
</svg>