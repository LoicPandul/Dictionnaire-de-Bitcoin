    <rect class="structure" x="552" y="184" width="88" height="88"/>
    <path class="lien" style="marker-end:none" d="M400 228 H432"/>
    <path class="lien" style="marker-end:none" d="M520 228 H552"/>
    <rect class="hors-chaine" x="292" y="312" width="488" height="120"/>
