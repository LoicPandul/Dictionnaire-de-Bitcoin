    <text class="annotation" x="544" y="620">flipped</text>
    <path class="flux" d="M912 534 V720 H372"/>
    <text class="annotation" x="756" y="584">the others</text>
    <text class="annotation" x="756" y="620">drop</text>
    <text class="secondaire" x="582" y="776" text-anchor="middle">repeat ≈ (π/4)√N rounds</text>
    <text class="annotation" x="1150" y="300" text-anchor="end">probability</text>
