    <path class="fleche-note" d="M222 312 Q193.0 330 193.0 404"/>
    <text class="secondaire" x="148" y="580" text-anchor="middle">1/√N each</text>
    <text class="annotation" x="148" y="624" text-anchor="middle">here N = 8</text>
    <path class="fleche-note" style="marker-end:none" d="M352 440 H598"/>
    <path class="fleche-note" style="marker-end:none" d="M680 440 H926"/>
