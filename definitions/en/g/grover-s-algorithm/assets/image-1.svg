    <text class="etiquette" x="148" y="104" text-anchor="middle">Superposition</text>
    <text class="etiquette" x="476" y="104" text-anchor="middle">Oracle</text>
    <text class="etiquette" x="804" y="104" text-anchor="middle">Inversion</text>
    <text class="secondaire" x="804" y="144" text-anchor="middle">about the mean</text>
    <text class="etiquette" x="1132" y="104" text-anchor="middle">Measurement</text>
    <path class="flux" d="M284 320 H340"/>
    <path class="flux" d="M612 320 H668"/>
    <path class="flux" d="M940 320 H996"/>
