<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="664" viewBox="0 0 1280 664"><style>/* charte.css : rôles des schémas du Dictionnaire de Bitcoin 2027, en couleur et en noir et blanc.
   Source : design/charte-2027.md, section 6 « Les schémas » (branche feat/couverture-2027,
   commit f5a3a13b). Un schéma n'écrit aucune couleur en dur : il pose des classes de rôle, et la
   classe `nb` sur &lt;html&gt; (ajoutée par rendre.mjs) bascule tout le schéma dans sa version imprimée. */







svg {
  --encre: #1E1A1D;          /* Encre : traits et textes */
  --note: #6B6368;           /* Écorce : annotations */
  --sujet-fond: #AA226A;     /* Figue : LE sujet de la définition, un seul par schéma */
  --sujet-texte: #FFFFFF;
  --valeur-fond: #F4E5C6;    /* Safran clair */
  --valeur-trait: #956D28;   /* Safran */
  --secret-fond: #D3EAEA;    /* Paon clair */
  --secret-trait: #0B6B6E;   /* Paon */
  --fond: #FFFFFF;
}
svg.nb {                    /* livre imprimé : N100, N12, N35 */
  --encre: #000000;
  --note: #000000;
  --sujet-fond: #000000;
  --sujet-texte: #FFFFFF;
  --valeur-fond: #E0E0E0;
  --valeur-trait: #000000;
  --secret-fond: #A6A6A6;
  --secret-trait: #000000;
}

html, body { margin: 0; background: var(--fond); }
svg { display: block; background: var(--fond); }
svg text { font-family: "Archivo Schema", sans-serif; fill: var(--encre); }

/* Textes : rien sous 30 px */
.nom-sujet   { font-size: 36px; font-weight: 600; fill: var(--sujet-texte) !important; }
.etiquette   { font-size: 32px; font-weight: 600; }
.secondaire  { font-size: 30px; font-weight: 400; }
.annotation  { font-size: 30px; font-weight: 400; font-style: italic; fill: var(--note) !important; }
.mono        { font-family: "Atkinson Hyperlegible Mono", monospace !important; font-size: 30px; }
.sur-sujet   { fill: var(--sujet-texte) !important; }   /* tout autre texte posé sur le sujet */

/* Formes par rôle */
.structure   { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* rectangle, angles vifs */
.sujet       { fill: var(--sujet-fond); stroke: var(--sujet-fond); stroke-width: 3; }     /* garde la forme de son type */
.valeur      { fill: var(--valeur-fond); stroke: var(--valeur-trait); stroke-width: 3; }  /* pilule : rx = hauteur / 2 */
.secret      { fill: var(--secret-fond); stroke: var(--secret-trait); stroke-width: 3; }  /* rx = 8 */
.acteur      { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* disque */
.adversaire  { fill: url(#hachures); stroke: var(--encre); stroke-width: 3; }             /* hachures à 45° */
.reserve     { fill: #FFFFFF; stroke: none; }        /* réserve blanche de 8 px sous un texte posé sur des hachures */

/* Modificateur cumulable : hors chaîne (contour tireté, 3 px, motif 10 / 6) */
.tirete      { stroke-dasharray: 10 6; }

/* Traits */
.flux        { fill: none; stroke: var(--encre); stroke-width: 5; marker-end: url(#tete-flux); }
.lien        { fill: none; stroke: var(--encre); stroke-width: 3; marker-end: url(#tete-lien); }
.hors-chaine { fill: none; stroke: var(--encre); stroke-width: 3; stroke-dasharray: 10 6; }
.fleche-note { fill: none; stroke: var(--note); stroke-width: 2; marker-end: url(#tete-note); }
.tete        { fill: var(--encre); }
.tete-note   { fill: none; stroke: var(--note); stroke-width: 2; }
.hachure     { stroke: var(--encre); stroke-width: 2; }
</style>
  <defs>
    <marker id="tete-flux" viewBox="0 0 18 14" refX="17" refY="7" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L18 7 L0 14 Z"/></marker>
    <marker id="tete-lien" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L12 5 L0 10 Z"/></marker>
    <marker id="tete-note" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="tete-note" d="M1 1 L10 6 L1 11"/></marker>
    <pattern id="hachures" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line class="hachure" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <g id="schema">
    <!-- Ligne 1 : covenant non récursif -->
    <text class="etiquette" x="32" y="56">Non-recursive covenant</text>
    <rect class="valeur" x="32" y="96" width="144" height="64" rx="32"/>
    <text class="etiquette" x="104" y="139" text-anchor="middle">UTXO</text>
    <path class="flux" d="M176 128 H218"/>
    <rect class="structure" x="220" y="80" width="112" height="96"/>
    <text class="etiquette" x="276" y="139" text-anchor="middle">Tx 1</text>
    <path class="flux" d="M332 128 H374"/>
    <rect class="valeur" x="376" y="96" width="144" height="64" rx="32"/>
    <text class="etiquette" x="448" y="139" text-anchor="middle">UTXO</text>
    <path class="flux" d="M520 128 H562"/>
    <rect class="structure" x="564" y="80" width="112" height="96"/>
    <text class="etiquette" x="620" y="139" text-anchor="middle">Tx 2</text>
    <path class="flux" d="M676 128 H718"/>
    <rect class="valeur" x="720" y="96" width="144" height="64" rx="32"/>
    <text class="etiquette" x="792" y="139" text-anchor="middle">UTXO</text>
    <path class="flux" d="M864 128 H906"/>
    <rect class="structure" x="908" y="80" width="112" height="96"/>
    <text class="etiquette" x="964" y="139" text-anchor="middle">Tx 3</text>
    <path class="flux" d="M1020 128 H1062"/>
    <rect class="valeur" x="1064" y="96" width="144" height="64" rx="32"/>
    <text class="etiquette" x="1136" y="139" text-anchor="middle">UTXO</text>
    <text class="etiquette" x="1218" y="139">…</text>

    <rect class="structure" x="32" y="232" width="488" height="64"/>
    <text class="etiquette" x="276" y="275" text-anchor="middle">Constraint</text>
    <path class="lien" d="M104 160 V230"/>
    <text class="mono" x="120" y="208">scriptPubKey</text>
    <path class="lien" d="M448 232 V162"/>
    <text class="annotation" x="720" y="274">following outputs unconstrained</text>

    <!-- Ligne 2 : covenant récursif -->
    <text class="etiquette" x="32" y="392">Recursive covenant</text>
    <rect class="valeur" x="32" y="432" width="144" height="64" rx="32"/>
    <text class="etiquette" x="104" y="475" text-anchor="middle">UTXO</text>
    <path class="flux" d="M176 464 H218"/>
    <rect class="structure" x="220" y="416" width="112" height="96"/>
    <text class="etiquette" x="276" y="475" text-anchor="middle">Tx 1</text>
    <path class="flux" d="M332 464 H374"/>
    <rect class="valeur" x="376" y="432" width="144" height="64" rx="32"/>
    <text class="etiquette" x="448" y="475" text-anchor="middle">UTXO</text>
    <path class="flux" d="M520 464 H562"/>
    <rect class="structure" x="564" y="416" width="112" height="96"/>
    <text class="etiquette" x="620" y="475" text-anchor="middle">Tx 2</text>
    <path class="flux" d="M676 464 H718"/>
    <rect class="valeur" x="720" y="432" width="144" height="64" rx="32"/>
    <text class="etiquette" x="792" y="475" text-anchor="middle">UTXO</text>
    <path class="flux" d="M864 464 H906"/>
    <rect class="structure" x="908" y="416" width="112" height="96"/>
    <text class="etiquette" x="964" y="475" text-anchor="middle">Tx 3</text>
    <path class="flux" d="M1020 464 H1062"/>
    <rect class="valeur" x="1064" y="432" width="144" height="64" rx="32"/>
    <text class="etiquette" x="1136" y="475" text-anchor="middle">UTXO</text>
    <text class="etiquette" x="1218" y="475">…</text>

    <rect class="sujet" x="32" y="568" width="1216" height="64"/>
    <text class="nom-sujet" x="620" y="613" text-anchor="middle">Recursive constraint</text>
    <path class="lien" d="M104 496 V566"/>
    <text class="mono" x="120" y="544">scriptPubKey</text>
    <path class="lien" d="M448 568 V498"/>
    <path class="lien" d="M792 568 V498"/>
    <path class="lien" d="M1136 568 V498"/>
  </g>
</svg>