<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="704" viewBox="0 0 1280 704"><style>/* charte.css : rôles des schémas du Dictionnaire de Bitcoin 2027, en couleur et en noir et blanc.
   Source : design/charte-2027.md, section 6 « Les schémas » (branche feat/couverture-2027,
   commit f5a3a13b). Un schéma n'écrit aucune couleur en dur : il pose des classes de rôle, et la
   classe `nb` sur &lt;html&gt; (ajoutée par rendre.mjs) bascule tout le schéma dans sa version imprimée. */







svg {
  --encre: #1E1A1D;          /* Encre : traits et textes */
  --note: #6B6368;           /* Écorce : annotations */
  --sujet-fond: #AA226A;     /* Figue : LE sujet de la définition, un seul par schéma */
  --sujet-texte: #FFFFFF;
  --valeur-fond: #F4E5C6;    /* Safran clair */
  --valeur-trait: #956D28;   /* Safran */
  --secret-fond: #D3EAEA;    /* Paon clair */
  --secret-trait: #0B6B6E;   /* Paon */
  --fond: #FFFFFF;
}
svg.nb {                    /* livre imprimé : N100, N12, N35 */
  --encre: #000000;
  --note: #000000;
  --sujet-fond: #000000;
  --sujet-texte: #FFFFFF;
  --valeur-fond: #E0E0E0;
  --valeur-trait: #000000;
  --secret-fond: #A6A6A6;
  --secret-trait: #000000;
}

html, body { margin: 0; background: var(--fond); }
svg { display: block; background: var(--fond); }
svg text { font-family: "Archivo Schema", sans-serif; fill: var(--encre); }

/* Textes : rien sous 30 px */
.nom-sujet   { font-size: 36px; font-weight: 600; fill: var(--sujet-texte) !important; }
.etiquette   { font-size: 32px; font-weight: 600; }
.secondaire  { font-size: 30px; font-weight: 400; }
.annotation  { font-size: 30px; font-weight: 400; font-style: italic; fill: var(--note) !important; }
.mono        { font-family: "Atkinson Hyperlegible Mono", monospace !important; font-size: 30px; }
.sur-sujet   { fill: var(--sujet-texte) !important; }   /* tout autre texte posé sur le sujet */

/* Formes par rôle */
.structure   { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* rectangle, angles vifs */
.sujet       { fill: var(--sujet-fond); stroke: var(--sujet-fond); stroke-width: 3; }     /* garde la forme de son type */
.valeur      { fill: var(--valeur-fond); stroke: var(--valeur-trait); stroke-width: 3; }  /* pilule : rx = hauteur / 2 */
.secret      { fill: var(--secret-fond); stroke: var(--secret-trait); stroke-width: 3; }  /* rx = 8 */
.acteur      { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* disque */
.adversaire  { fill: url(#hachures); stroke: var(--encre); stroke-width: 3; }             /* hachures à 45° */
.reserve     { fill: #FFFFFF; stroke: none; }        /* réserve blanche de 8 px sous un texte posé sur des hachures */

/* Modificateur cumulable : hors chaîne (contour tireté, 3 px, motif 10 / 6) */
.tirete      { stroke-dasharray: 10 6; }

/* Traits */
.flux        { fill: none; stroke: var(--encre); stroke-width: 5; marker-end: url(#tete-flux); }
.lien        { fill: none; stroke: var(--encre); stroke-width: 3; marker-end: url(#tete-lien); }
.hors-chaine { fill: none; stroke: var(--encre); stroke-width: 3; stroke-dasharray: 10 6; }
.fleche-note { fill: none; stroke: var(--note); stroke-width: 2; marker-end: url(#tete-note); }
.tete        { fill: var(--encre); }
.tete-note   { fill: none; stroke: var(--note); stroke-width: 2; }
.hachure     { stroke: var(--encre); stroke-width: 2; }

/* styles propres au schéma */

  .lien-sur-sujet { fill: none; stroke: var(--sujet-texte); stroke-width: 3; marker-end: url(#tete-lien-blanche); }
  .tete-blanche { fill: var(--sujet-texte); }
  .trait-sur-sujet { fill: none; stroke: var(--sujet-texte); stroke-width: 3; }
</style>
  <defs>
    <marker id="tete-flux" viewBox="0 0 18 14" refX="17" refY="7" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L18 7 L0 14 Z"/></marker>
    <marker id="tete-lien" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L12 5 L0 10 Z"/></marker>
    <marker id="tete-lien-blanche" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="tete-blanche" d="M0 0 L12 5 L0 10 Z"/></marker>
    <marker id="tete-note" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="tete-note" d="M1 1 L10 6 L1 11"/></marker>
    <pattern id="hachures" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line class="hachure" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <g id="schema">
    <!-- ===== Arbre des TXID (structure), racine vers l'en-tête ===== -->
    <rect class="structure" x="137" y="32" width="400" height="112"/>
    <text class="etiquette" x="337" y="80" text-anchor="middle">Block header</text>
    <text class="secondaire" x="337" y="122" text-anchor="middle">Merkle root</text>

    <path class="lien" d="M337 208 V148"/>
    <rect class="structure" x="305" y="208" width="64" height="40"/>
    <text class="etiquette" x="40" y="228">TXID tree</text>
    <text class="secondaire" x="40" y="268">without witness</text>

    <path class="lien" d="M198 312 L327 251"/>
    <path class="lien" d="M476 312 L347 251"/>
    <rect class="structure" x="166" y="312" width="64" height="40"/>
    <rect class="structure" x="444" y="312" width="64" height="40"/>
    <path class="lien" d="M124 416 L190 355"/>
    <path class="lien" d="M272 416 L206 355"/>
    <path class="lien" d="M408 416 L468 355"/>
    <path class="lien" d="M544 416 L484 355"/>
    <rect class="structure" x="48" y="416" width="152" height="64"/>
    <rect class="structure" x="208" y="416" width="128" height="64"/>
    <rect class="structure" x="344" y="416" width="128" height="64"/>
    <rect class="structure" x="480" y="416" width="128" height="64"/>
    <text class="secondaire" x="124" y="458" text-anchor="middle">coinbase</text>
    <text class="secondaire" x="272" y="458" text-anchor="middle">tx 1</text>
    <text class="secondaire" x="408" y="458" text-anchor="middle">tx 2</text>
    <text class="secondaire" x="544" y="458" text-anchor="middle">tx 3</text>

    <!-- La coinbase est elle-même une feuille de l'arbre des TXID -->
    <path class="lien" d="M124 560 V484"/>
    <rect class="structure" x="48" y="560" width="400" height="112"/>
    <text class="etiquette" x="248" y="608" text-anchor="middle">Coinbase transaction</text>
    <text class="mono" x="248" y="650" text-anchor="middle">OP_RETURN aa21a9ed…</text>

    <!-- ===== Arbre des WTXID (sujet), racine vers la coinbase ===== -->
    <rect class="sujet" x="648" y="32" width="600" height="640"/>
    <text class="nom-sujet" x="948" y="96" text-anchor="middle">WTXID tree</text>
    <text class="secondaire sur-sujet" x="948" y="136" text-anchor="middle">with witness</text>

    <rect class="structure" x="664" y="200" width="152" height="64"/>
    <rect class="structure" x="824" y="200" width="128" height="64"/>
    <rect class="structure" x="960" y="200" width="128" height="64"/>
    <rect class="structure" x="1096" y="200" width="128" height="64"/>
    <text class="mono" x="740" y="242" text-anchor="middle">0…0</text>
    <text class="secondaire" x="888" y="242" text-anchor="middle">tx 1</text>
    <text class="secondaire" x="1024" y="242" text-anchor="middle">tx 2</text>
    <text class="secondaire" x="1160" y="242" text-anchor="middle">tx 3</text>

    <path class="lien-sur-sujet" d="M740 264 L806 397"/>
    <path class="lien-sur-sujet" d="M888 264 L822 397"/>
    <path class="lien-sur-sujet" d="M1024 264 L1084 397"/>
    <path class="lien-sur-sujet" d="M1160 264 L1100 397"/>
    <rect class="structure" x="782" y="400" width="64" height="40"/>
    <rect class="structure" x="1060" y="400" width="64" height="40"/>
    <path class="lien-sur-sujet" d="M814 440 L943 593"/>
    <path class="lien-sur-sujet" d="M1092 440 L963 593"/>
    <rect class="structure" x="921" y="596" width="64" height="40"/>

    <path class="trait-sur-sujet" d="M921 616 H648"/>
    <path class="lien" d="M648 616 H452"/>
  </g>
</svg>