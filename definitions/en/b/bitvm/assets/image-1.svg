<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960"><style>/* charte.css : rôles des schémas du Dictionnaire de Bitcoin 2027, en couleur et en noir et blanc.
   Source : design/charte-2027.md, section 6 « Les schémas » (branche feat/couverture-2027,
   commit f5a3a13b). Un schéma n'écrit aucune couleur en dur : il pose des classes de rôle, et la
   classe `nb` sur &lt;html&gt; (ajoutée par rendre.mjs) bascule tout le schéma dans sa version imprimée. */







svg {
  --encre: #1E1A1D;          /* Encre : traits et textes */
  --note: #6B6368;           /* Écorce : annotations */
  --sujet-fond: #AA226A;     /* Figue : LE sujet de la définition, un seul par schéma */
  --sujet-texte: #FFFFFF;
  --valeur-fond: #F4E5C6;    /* Safran clair */
  --valeur-trait: #956D28;   /* Safran */
  --secret-fond: #D3EAEA;    /* Paon clair */
  --secret-trait: #0B6B6E;   /* Paon */
  --fond: #FFFFFF;
}
svg.nb {                    /* livre imprimé : N100, N12, N35 */
  --encre: #000000;
  --note: #000000;
  --sujet-fond: #000000;
  --sujet-texte: #FFFFFF;
  --valeur-fond: #E0E0E0;
  --valeur-trait: #000000;
  --secret-fond: #A6A6A6;
  --secret-trait: #000000;
}

html, body { margin: 0; background: var(--fond); }
svg { display: block; background: var(--fond); }
svg text { font-family: "Archivo Schema", sans-serif; fill: var(--encre); }

/* Textes : rien sous 30 px */
.nom-sujet   { font-size: 36px; font-weight: 600; fill: var(--sujet-texte) !important; }
.etiquette   { font-size: 32px; font-weight: 600; }
.secondaire  { font-size: 30px; font-weight: 400; }
.annotation  { font-size: 30px; font-weight: 400; font-style: italic; fill: var(--note) !important; }
.mono        { font-family: "Atkinson Hyperlegible Mono", monospace !important; font-size: 30px; }
.sur-sujet   { fill: var(--sujet-texte) !important; }   /* tout autre texte posé sur le sujet */

/* Formes par rôle */
.structure   { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* rectangle, angles vifs */
.sujet       { fill: var(--sujet-fond); stroke: var(--sujet-fond); stroke-width: 3; }     /* garde la forme de son type */
.valeur      { fill: var(--valeur-fond); stroke: var(--valeur-trait); stroke-width: 3; }  /* pilule : rx = hauteur / 2 */
.secret      { fill: var(--secret-fond); stroke: var(--secret-trait); stroke-width: 3; }  /* rx = 8 */
.acteur      { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* disque */
.adversaire  { fill: url(#hachures); stroke: var(--encre); stroke-width: 3; }             /* hachures à 45° */
.reserve     { fill: #FFFFFF; stroke: none; }        /* réserve blanche de 8 px sous un texte posé sur des hachures */

/* Modificateur cumulable : hors chaîne (contour tireté, 3 px, motif 10 / 6) */
.tirete      { stroke-dasharray: 10 6; }

/* Traits */
.flux        { fill: none; stroke: var(--encre); stroke-width: 5; marker-end: url(#tete-flux); }
.lien        { fill: none; stroke: var(--encre); stroke-width: 3; marker-end: url(#tete-lien); }
.hors-chaine { fill: none; stroke: var(--encre); stroke-width: 3; stroke-dasharray: 10 6; }
.fleche-note { fill: none; stroke: var(--note); stroke-width: 2; marker-end: url(#tete-note); }
.tete        { fill: var(--encre); }
.tete-note   { fill: none; stroke: var(--note); stroke-width: 2; }
.hachure     { stroke: var(--encre); stroke-width: 2; }

/* styles propres au schéma */
.branche { fill: none; stroke: var(--encre); stroke-width: 3; } .cadre { fill: none; }</style>
  <defs>
    <marker id="tete-flux" viewBox="0 0 18 14" refX="17" refY="7" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L18 7 L0 14 Z"/></marker>
    <marker id="tete-lien" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L12 5 L0 10 Z"/></marker>
    <marker id="tete-note" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="tete-note" d="M1 1 L10 6 L1 11"/></marker>
    <pattern id="hachures" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line class="hachure" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <g id="schema">
    <!-- Zone hors chaîne -->
    <rect class="structure tirete cadre" x="32" y="32" width="1216" height="336"/>
    <text class="annotation" x="64" y="80">Off-chain computation</text>

    <circle class="acteur" cx="200" cy="232" r="96"/>
    <text class="etiquette" x="200" y="243" text-anchor="middle">Prover</text>
    <circle class="acteur" cx="1136" cy="232" r="96"/>
    <text class="etiquette" x="1136" y="243" text-anchor="middle">Verifier</text>

    <path class="hors-chaine" d="M296 232 H368"/>
    <path class="branche" d="M368 172 V292 M368 172 H392 M368 196 H392 M368 268 H392 M368 292 H392"/>
    <path class="structure" d="M392 160 H416 A24 24 0 0 1 416 208 H392 Z"/>
    <circle class="structure" cx="447" cy="184" r="7"/>
    <path class="structure" d="M392 256 H416 A24 24 0 0 1 416 304 H392 Z"/>
    <circle class="structure" cx="447" cy="280" r="7"/>
    <path class="structure" d="M492 184 H516 A24 24 0 0 1 516 232 H492 Z"/>
    <circle class="structure" cx="547" cy="208" r="7"/>
    <path class="structure" d="M592 208 H616 A24 24 0 0 1 616 256 H592 Z"/>
    <circle class="structure" cx="647" cy="232" r="7"/>
    <path class="branche" d="M454 184 H470 V196 H492 M454 280 H580 V244 H592 M478 280 V220 H492 M554 208 H572 V220 H592"/>
    <circle class="tete" cx="478" cy="280" r="6"/>
    <path class="lien" d="M654 232 H690"/>
    <text class="secondaire" x="520" y="352" text-anchor="middle">NAND circuit</text>
    <rect class="adversaire" x="694" y="184" width="260" height="96"/>
    <rect class="reserve" x="716" y="208" width="216" height="48"/>
    <text class="etiquette" x="824" y="243" text-anchor="middle">false result</text>
    <path class="hors-chaine" d="M954 232 H1036" marker-end="url(#tete-lien)"/>

    <!-- Sur la chaîne -->
    <text class="annotation" x="64" y="496">On-chain</text>
    <rect class="structure" x="400" y="440" width="340" height="88"/>
    <text class="etiquette" x="570" y="495" text-anchor="middle">Taproot address</text>

    <path class="branche" d="M570 528 L280 600 M570 528 L860 600"/>
    <rect class="structure" x="264" y="600" width="32" height="32"/>
    <rect class="structure" x="844" y="600" width="32" height="32"/>
    <path class="branche" d="M280 632 L160 720 M280 632 L400 720 M860 632 L640 720 M860 632 L1000 720"/>

    <rect class="structure tirete" x="80" y="720" width="160" height="88"/>
    <text class="mono" x="160" y="775" text-anchor="middle">NAND</text>
    <rect class="structure tirete" x="320" y="720" width="160" height="88"/>
    <text class="mono" x="400" y="775" text-anchor="middle">NAND</text>
    <rect class="structure tirete" x="560" y="720" width="160" height="88"/>
    <text class="mono" x="640" y="775" text-anchor="middle">NAND</text>
    <text class="annotation" x="400" y="864" text-anchor="middle">unrevealed gates</text>

    <rect class="sujet" x="912" y="720" width="320" height="136"/>
    <text class="nom-sujet" x="1072" y="776" text-anchor="middle">Disputed gate</text>
    <text class="mono sur-sujet" x="1072" y="825" text-anchor="middle">A NAND B = C</text>
    <text class="annotation" x="1072" y="912" text-anchor="middle">revealed and executed</text>

    <!-- Contestation -->
    <path class="flux" d="M1136 328 V716"/>
    
    <text class="etiquette" x="1120" y="487" text-anchor="end">challenges</text>
  </g>
</svg>