<text class="annotation" x="448" y="72">en vrai : 256 bits,</text>
<text class="annotation" x="448" y="112">environ 255 doublements</text>
<text class="mono" x="88" y="194" text-anchor="middle">1</text>
<path class="structure" style="fill:none" d="M48 216 V204 H128 V216"/>
<path class="structure" style="fill:none" d="M152 216 V204 H336 V216"/>
