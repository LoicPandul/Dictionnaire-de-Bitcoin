<text class="etiquette" x="472.0" y="307" text-anchor="middle">4G</text>
<path class="flux" d="M528 296 H606"/>
<text class="mono" x="568.0" y="336" text-anchor="middle">+G</text>
<rect class="structure" x="608" y="248" width="112" height="96"/>
<text class="etiquette" x="664.0" y="307" text-anchor="middle">5G</text>
<path class="flux" d="M720 296 H798"/>
<text class="mono" x="760.0" y="336" text-anchor="middle">×2</text>
<rect class="structure" x="800" y="248" width="112" height="96"/>
<text class="etiquette" x="856.0" y="307" text-anchor="middle">10G</text>
<path class="flux" d="M912 296 H990"/>
<text class="mono" x="952.0" y="336" text-anchor="middle">+G</text>
<rect class="sujet" x="992" y="232" width="256" height="128"/>
<text class="nom-sujet" x="1120" y="286" text-anchor="middle">Clé publique</text>
<text class="mono sur-sujet" x="1120" y="332" text-anchor="middle">K = 11·G</text>
<text class="annotation" x="1032" y="72">un bit de k</text>
<text class="annotation" x="1032" y="112">par étape</text>
<path class="fleche-note" d="M1100 128 Q1060 146 1000 164"/>
<text class="annotation" x="32" y="408">×2 : doublement, +G : addition</text>
<path class="adversaire" d="M1136 360 H1216 V528 H520 L536 510 L504 492 L536 474 L504 456 L520 440 H1136 Z"/>
<rect class="reserve" x="600" y="460" width="480" height="48"/>
<text class="etiquette" x="840" y="495" text-anchor="middle">De K vers k : aucun chemin</text>
</g>
</svg>