<path class="structure" style="fill:none" d="M728 216 V204 H1240 V216"/>
<text class="mono" x="984.0" y="194" text-anchor="middle">1</text>
<rect class="structure" x="32" y="248" width="112" height="96"/>
<text class="etiquette" x="88.0" y="307" text-anchor="middle">G</text>
<path class="flux" d="M144 296 H222"/>
<text class="mono" x="184.0" y="336" text-anchor="middle">×2</text>
<rect class="structure" x="224" y="248" width="112" height="96"/>
<text class="etiquette" x="280.0" y="307" text-anchor="middle">2G</text>
<path class="flux" d="M336 296 H414"/>
<text class="mono" x="376.0" y="336" text-anchor="middle">×2</text>
