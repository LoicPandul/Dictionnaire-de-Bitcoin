    <rect class="structure" x="1210" y="320" width="20" height="56"/>
    <path class="flux" d="M680 270 V178"/>
    <text class="annotation" x="704" y="236">difficulté Bitcoin atteinte</text>
    <path class="lien" style="marker-end:none" d="M32 488 H690 V472"/>
    <text class="annotation" x="32" y="528">les mineurs de ces shares se partagent la récompense</text>
    <text class="secondaire sur-sujet" x="1224" y="428" text-anchor="end">une share toutes les 30 s</text>
  </g>
</svg>