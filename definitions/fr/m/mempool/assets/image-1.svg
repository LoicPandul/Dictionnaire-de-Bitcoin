<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="768" viewBox="0 0 1280 768"><style>/* charte.css : rôles des schémas du Dictionnaire de Bitcoin 2027, en couleur et en noir et blanc.
   Source : design/charte-2027.md, section 6 « Les schémas » (branche feat/couverture-2027,
   commit f5a3a13b). Un schéma n'écrit aucune couleur en dur : il pose des classes de rôle, et la
   classe `nb` sur &lt;html&gt; (ajoutée par rendre.mjs) bascule tout le schéma dans sa version imprimée. */







svg {
  --encre: #1E1A1D;          /* Encre : traits et textes */
  --note: #6B6368;           /* Écorce : annotations */
  --sujet-fond: #AA226A;     /* Figue : LE sujet de la définition, un seul par schéma */
  --sujet-texte: #FFFFFF;
  --valeur-fond: #F4E5C6;    /* Safran clair */
  --valeur-trait: #956D28;   /* Safran */
  --secret-fond: #D3EAEA;    /* Paon clair */
  --secret-trait: #0B6B6E;   /* Paon */
  --fond: #FFFFFF;
}
svg.nb {                    /* livre imprimé : N100, N12, N35 */
  --encre: #000000;
  --note: #000000;
  --sujet-fond: #000000;
  --sujet-texte: #FFFFFF;
  --valeur-fond: #E0E0E0;
  --valeur-trait: #000000;
  --secret-fond: #A6A6A6;
  --secret-trait: #000000;
}

html, body { margin: 0; background: var(--fond); }
svg { display: block; background: var(--fond); }
svg text { font-family: "Archivo Schema", sans-serif; fill: var(--encre); }

/* Textes : rien sous 30 px */
.nom-sujet   { font-size: 36px; font-weight: 600; fill: var(--sujet-texte) !important; }
.etiquette   { font-size: 32px; font-weight: 600; }
.secondaire  { font-size: 30px; font-weight: 400; }
.annotation  { font-size: 30px; font-weight: 400; font-style: italic; fill: var(--note) !important; }
.mono        { font-family: "Atkinson Hyperlegible Mono", monospace !important; font-size: 30px; }
.sur-sujet   { fill: var(--sujet-texte) !important; }   /* tout autre texte posé sur le sujet */

/* Formes par rôle */
.structure   { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* rectangle, angles vifs */
.sujet       { fill: var(--sujet-fond); stroke: var(--sujet-fond); stroke-width: 3; }     /* garde la forme de son type */
.valeur      { fill: var(--valeur-fond); stroke: var(--valeur-trait); stroke-width: 3; }  /* pilule : rx = hauteur / 2 */
.secret      { fill: var(--secret-fond); stroke: var(--secret-trait); stroke-width: 3; }  /* rx = 8 */
.acteur      { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* disque */
.adversaire  { fill: url(#hachures); stroke: var(--encre); stroke-width: 3; }             /* hachures à 45° */
.reserve     { fill: #FFFFFF; stroke: none; }        /* réserve blanche de 8 px sous un texte posé sur des hachures */

/* Modificateur cumulable : hors chaîne (contour tireté, 3 px, motif 10 / 6) */
.tirete      { stroke-dasharray: 10 6; }

/* Traits */
.flux        { fill: none; stroke: var(--encre); stroke-width: 5; marker-end: url(#tete-flux); }
.lien        { fill: none; stroke: var(--encre); stroke-width: 3; marker-end: url(#tete-lien); }
.hors-chaine { fill: none; stroke: var(--encre); stroke-width: 3; stroke-dasharray: 10 6; }
.fleche-note { fill: none; stroke: var(--note); stroke-width: 2; marker-end: url(#tete-note); }
.tete        { fill: var(--encre); }
.tete-note   { fill: none; stroke: var(--note); stroke-width: 2; }
.hachure     { stroke: var(--encre); stroke-width: 2; }
</style>
  <defs>
    <marker id="tete-flux" viewBox="0 0 18 14" refX="17" refY="7" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L18 7 L0 14 Z"/></marker>
    <marker id="tete-lien" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L12 5 L0 10 Z"/></marker>
    <marker id="tete-note" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="tete-note" d="M1 1 L10 6 L1 11"/></marker>
    <pattern id="hachures" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line class="hachure" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <g id="schema">
    <!-- Nœud : grand disque acteur, qui contient la vérification et la mempool -->
    <circle class="acteur" cx="600" cy="384" r="304"/>
    <text class="etiquette" x="600" y="168" text-anchor="middle">Nœud</text>

    <!-- Transaction diffusée -->
    <text class="annotation" x="130" y="320" text-anchor="middle">diffusée</text>
    <rect class="structure" x="32" y="344" width="196" height="80"/>
    <text class="etiquette" x="130" y="395" text-anchor="middle">Transaction</text>
    <path class="hors-chaine" d="M228 384 H322" marker-end="url(#tete-lien)"/>

    <!-- Vérification, dans le nœud -->
    <rect class="structure" x="328" y="344" width="200" height="80"/>
    <text class="etiquette" x="428" y="395" text-anchor="middle">Vérification</text>
    <path class="lien" d="M400 424 V496"/>
    <text class="secondaire" x="400" y="536" text-anchor="middle">rejetée</text>
    <path class="flux" d="M528 384 H564"/>

    <!-- Mempool (sujet) -->
    <rect class="sujet" x="568" y="224" width="256" height="320"/>
    <text class="nom-sujet" x="696" y="272" text-anchor="middle">Mempool</text>
    <rect class="structure" x="592" y="296" width="208" height="52"/>
    <text class="mono" x="696" y="333" text-anchor="middle">25 sat/vB</text>
    <rect class="structure" x="592" y="356" width="208" height="52"/>
    <text class="mono" x="696" y="393" text-anchor="middle">12 sat/vB</text>
    <rect class="structure" x="592" y="416" width="208" height="52"/>
    <text class="mono" x="696" y="453" text-anchor="middle">4 sat/vB</text>
    <rect class="structure" x="592" y="476" width="208" height="52"/>
    <text class="mono" x="696" y="513" text-anchor="middle">2 sat/vB</text>

    <!-- Sortie de la mempool -->
    <text class="annotation" x="32" y="96">en sort quand</text>
    <text class="annotation" x="32" y="132">un bloc l'inclut</text>
    <path class="fleche-note" d="M240 120 Q440 120 562 228"/>

    <!-- Relais vers les pairs -->
    <path class="hors-chaine" d="M868 240 L938 202" marker-end="url(#tete-lien)"/>
    <path class="hors-chaine" d="M904 384 H936" marker-end="url(#tete-lien)"/>
    <path class="hors-chaine" d="M868 528 L940 568" marker-end="url(#tete-lien)"/>
    <circle class="acteur" cx="1000" cy="176" r="60"/>
    <text class="etiquette" x="1000" y="187" text-anchor="middle">Nœud</text>
    <circle class="acteur" cx="1000" cy="384" r="60"/>
    <text class="etiquette" x="1000" y="395" text-anchor="middle">Nœud</text>
    <text class="annotation" x="1080" y="272">chacun</text>
    <text class="annotation" x="1080" y="308">sa mempool</text>

    <!-- Mineur et bloc -->
    <circle class="acteur" cx="1000" cy="600" r="64"/>
    <text class="etiquette" x="1000" y="611" text-anchor="middle">Mineur</text>
    <path class="flux" d="M1064 600 H1116"/>
    <rect class="structure" x="1120" y="560" width="128" height="80"/>
    <text class="etiquette" x="1184" y="611" text-anchor="middle">Bloc</text>
    <text class="annotation" x="1248" y="704" text-anchor="end">puise dans sa mempool,</text>
    <text class="annotation" x="1248" y="740" text-anchor="end">meilleurs frais d'abord</text>
  </g>
</svg>