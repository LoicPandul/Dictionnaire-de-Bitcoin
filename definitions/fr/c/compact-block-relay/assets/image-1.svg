    <rect class="structure" x="544" y="448" width="8" height="80"/>
    <rect class="structure" x="560" y="448" width="8" height="80"/>
    <text class="secondaire" x="488" y="608" text-anchor="middle">3 000 identifiants de 6 octets</text>
    <text class="etiquette" x="830" y="436" text-anchor="middle">≈ 18 ko</text>
    <path class="flux" d="M592 456 H1066"/>
    <path class="hors-chaine" style="marker-end:url(#tete-lien)" d="M1079 520 H596"/>
    <text class="secondaire" x="836" y="564" text-anchor="middle">demande les manquantes</text>
    <circle class="acteur" cx="1136" cy="476" r="72"/>
    <text class="etiquette" x="1136" y="487" text-anchor="middle">Pair</text>
    <rect class="structure" x="1016" y="616" width="240" height="80"/>
    <text class="etiquette" x="1136" y="667" text-anchor="middle">Mempool</text>
    <path class="lien" d="M1136 616 V550"/>
    <text class="annotation" x="992" y="666" text-anchor="end">transactions déjà connues</text>
  </g>
</svg>