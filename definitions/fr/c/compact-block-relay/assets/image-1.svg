    <text class="etiquette" x="1136" y="179" text-anchor="middle">Pair</text>

    <text class="annotation" x="32" y="352">Avec BIP 152</text>
    <rect class="sujet" x="32" y="376" width="560" height="184"/>
    <text class="nom-sujet" x="56" y="424">Bloc compact</text>
    <rect class="structure" x="56" y="448" width="144" height="80"/>
