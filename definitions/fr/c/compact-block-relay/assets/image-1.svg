    <rect class="structure" x="448" y="448" width="8" height="80"/>
    <rect class="structure" x="464" y="448" width="8" height="80"/>
    <rect class="structure" x="480" y="448" width="8" height="80"/>
    <rect class="structure" x="496" y="448" width="8" height="80"/>
    <rect class="structure" x="512" y="448" width="8" height="80"/>
