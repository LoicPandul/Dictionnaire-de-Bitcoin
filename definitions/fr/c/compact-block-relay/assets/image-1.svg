    <text class="secondaire" x="546" y="292" text-anchor="middle">3 000 transactions entières</text>
    <text class="etiquette" x="982" y="148" text-anchor="middle">≈ 1,5 Mo</text>
    <path class="flux" d="M900 168 H1062"/>
