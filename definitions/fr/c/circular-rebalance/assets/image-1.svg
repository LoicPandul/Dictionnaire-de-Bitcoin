<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="608" viewBox="0 0 1280 608"><style>/* charte.css : rôles des schémas du Dictionnaire de Bitcoin 2027, en couleur et en noir et blanc.
   Source : design/charte-2027.md, section 6 « Les schémas » (branche feat/couverture-2027,
   commit f5a3a13b). Un schéma n'écrit aucune couleur en dur : il pose des classes de rôle, et la
   classe `nb` sur &lt;html&gt; (ajoutée par rendre.mjs) bascule tout le schéma dans sa version imprimée. */







svg {
  --encre: #1E1A1D;          /* Encre : traits et textes */
  --note: #6B6368;           /* Écorce : annotations */
  --sujet-fond: #AA226A;     /* Figue : LE sujet de la définition, un seul par schéma */
  --sujet-texte: #FFFFFF;
  --valeur-fond: #F4E5C6;    /* Safran clair */
  --valeur-trait: #956D28;   /* Safran */
  --secret-fond: #D3EAEA;    /* Paon clair */
  --secret-trait: #0B6B6E;   /* Paon */
  --fond: #FFFFFF;
}
svg.nb {                    /* livre imprimé : N100, N12, N35 */
  --encre: #000000;
  --note: #000000;
  --sujet-fond: #000000;
  --sujet-texte: #FFFFFF;
  --valeur-fond: #E0E0E0;
  --valeur-trait: #000000;
  --secret-fond: #A6A6A6;
  --secret-trait: #000000;
}

html, body { margin: 0; background: var(--fond); }
svg { display: block; background: var(--fond); }
svg text { font-family: "Archivo Schema", sans-serif; fill: var(--encre); }

/* Textes : rien sous 30 px */
.nom-sujet   { font-size: 36px; font-weight: 600; fill: var(--sujet-texte) !important; }
.etiquette   { font-size: 32px; font-weight: 600; }
.secondaire  { font-size: 30px; font-weight: 400; }
.annotation  { font-size: 30px; font-weight: 400; font-style: italic; fill: var(--note) !important; }
.mono        { font-family: "Atkinson Hyperlegible Mono", monospace !important; font-size: 30px; }
.sur-sujet   { fill: var(--sujet-texte) !important; }   /* tout autre texte posé sur le sujet */

/* Formes par rôle */
.structure   { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* rectangle, angles vifs */
.sujet       { fill: var(--sujet-fond); stroke: var(--sujet-fond); stroke-width: 3; }     /* garde la forme de son type */
.valeur      { fill: var(--valeur-fond); stroke: var(--valeur-trait); stroke-width: 3; }  /* pilule : rx = hauteur / 2 */
.secret      { fill: var(--secret-fond); stroke: var(--secret-trait); stroke-width: 3; }  /* rx = 8 */
.acteur      { fill: var(--fond); stroke: var(--encre); stroke-width: 3; }                /* disque */
.adversaire  { fill: url(#hachures); stroke: var(--encre); stroke-width: 3; }             /* hachures à 45° */
.reserve     { fill: #FFFFFF; stroke: none; }        /* réserve blanche de 8 px sous un texte posé sur des hachures */

/* Modificateur cumulable : hors chaîne (contour tireté, 3 px, motif 10 / 6) */
.tirete      { stroke-dasharray: 10 6; }

/* Traits */
.flux        { fill: none; stroke: var(--encre); stroke-width: 5; marker-end: url(#tete-flux); }
.lien        { fill: none; stroke: var(--encre); stroke-width: 3; marker-end: url(#tete-lien); }
.hors-chaine { fill: none; stroke: var(--encre); stroke-width: 3; stroke-dasharray: 10 6; }
.fleche-note { fill: none; stroke: var(--note); stroke-width: 2; marker-end: url(#tete-note); }
.tete        { fill: var(--encre); }
.tete-note   { fill: none; stroke: var(--note); stroke-width: 2; }
.hachure     { stroke: var(--encre); stroke-width: 2; }
</style>
  <defs>
    <marker id="tete-flux" viewBox="0 0 18 14" refX="17" refY="7" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L18 7 L0 14 Z"/></marker>
    <marker id="tete-lien" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="tete" d="M0 0 L12 5 L0 10 Z"/></marker>
    <marker id="tete-note" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="tete-note" d="M1 1 L10 6 L1 11"/></marker>
    <marker id="tete-sujet" viewBox="0 0 28 22" refX="14" refY="11" markerWidth="28" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path style="fill:var(--sujet-fond)" d="M0 0 L28 11 L0 22 Z"/></marker>
    <marker id="fin-sujet" viewBox="0 0 28 22" refX="24" refY="11" markerWidth="28" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path style="fill:var(--sujet-fond)" d="M0 0 L28 11 L0 22 Z"/></marker>
    <pattern id="hachures" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line class="hachure" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <g id="schema">
    <!-- Réseau : canaux hors chaîne sur un cercle -->
    <circle class="hors-chaine" cx="310" cy="300" r="210"/>
    <text class="etiquette" x="168" y="80" text-anchor="middle">Canal A</text>
    <text class="etiquette" x="168" y="548" text-anchor="middle">Canal B</text>

    <!-- Le paiement circulaire (sujet) -->
    <path class="sujet" style="fill:none;stroke-width:8" d="M160.6 265 L350.9 155 M415 188 L415 408 M354.4 447 L164.1 337"/>
    <path style="fill:none;stroke:none;marker-end:url(#fin-sujet)" d="M340 161 L350.9 155"/>
    <path style="fill:none;stroke:none;marker-end:url(#fin-sujet)" d="M415 396 L415 408"/>
    <path style="fill:none;stroke:none;marker-end:url(#fin-sujet)" d="M175 331 L164.1 337"/>
    <text class="etiquette" x="296" y="268" text-anchor="middle">Paiement</text>
    <text class="etiquette" x="296" y="308" text-anchor="middle">circulaire</text>
    <text class="secondaire" x="296" y="352" text-anchor="middle">400 000 sats</text>

    <circle class="acteur" cx="100" cy="300" r="64"/>
    <text class="etiquette" x="100" y="294" text-anchor="middle">Mon</text>
    <text class="etiquette" x="100" y="328" text-anchor="middle">nœud</text>
    <circle class="acteur" cx="415" cy="118" r="64"/>
    <text class="etiquette" x="415" y="129" text-anchor="middle">Pair A</text>
    <circle class="acteur" cx="415" cy="482" r="64"/>
    <text class="etiquette" x="415" y="493" text-anchor="middle">Pair B</text>

    <path class="fleche-note" d="M584 548 Q 580 400 432 362"/>
    <text class="annotation" x="536" y="584">frais de routage : 200 sats</text>

    <!-- Bilan : liquidité sortante de mon nœud -->
    <text class="secondaire" x="656" y="72">Ma liquidité sortante (sats)</text>

    <text class="etiquette" x="656" y="136">Canal A</text>
    <text class="secondaire" x="656" y="194">avant</text>
    <rect class="structure tirete" x="776" y="160" width="320" height="48" rx="24"/>
    <path class="valeur" d="M800 160 H1064 V208 H800 A24 24 0 0 1 800 160 Z"/>
    <text class="etiquette" x="1112" y="196">900 000</text>
    <text class="secondaire" x="656" y="258">après</text>
    <rect class="structure tirete" x="776" y="224" width="320" height="48" rx="24"/>
    <path class="valeur" d="M800 224 H936 V272 H800 A24 24 0 0 1 800 224 Z"/>
    <text class="etiquette" x="1112" y="260">499 800</text>

    <text class="etiquette" x="656" y="344">Canal B</text>
    <text class="secondaire" x="656" y="402">avant</text>
    <rect class="structure tirete" x="776" y="368" width="320" height="48" rx="24"/>
    <path class="valeur" d="M800 368 H808 V416 H800 A24 24 0 0 1 800 368 Z"/>
    <text class="etiquette" x="1112" y="404">100 000</text>
    <text class="secondaire" x="656" y="466">après</text>
    <rect class="structure tirete" x="776" y="432" width="320" height="48" rx="24"/>
    <path class="valeur" d="M800 432 H936 V480 H800 A24 24 0 0 1 800 432 Z"/>
    <text class="etiquette" x="1112" y="468">500 000</text>
  </g>
</svg>