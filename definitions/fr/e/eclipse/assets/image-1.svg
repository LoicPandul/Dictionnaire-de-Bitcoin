    <line class="structure" x1="253" y1="556" x2="196" y2="499"/>
    <line class="structure" x1="162" y1="417" x2="162" y2="335"/>
    <line class="structure" x1="196" y1="253" x2="253" y2="196"/>
    <line class="structure" x1="335" y1="162" x2="417" y2="162"/>
    <line class="structure" x1="499" y1="196" x2="556" y2="253"/>
    <line class="structure" x1="590" y1="335" x2="590" y2="417"/>
    <circle class="adversaire" cx="590" cy="465" r="48"/>
    <circle class="adversaire" cx="465" cy="590" r="48"/>
    <circle class="adversaire" cx="287" cy="590" r="48"/>
    <circle class="adversaire" cx="162" cy="465" r="48"/>
    <circle class="adversaire" cx="162" cy="287" r="48"/>
    <circle class="adversaire" cx="287" cy="162" r="48"/>
    <circle class="adversaire" cx="465" cy="162" r="48"/>
    <circle class="adversaire" cx="590" cy="287" r="48"/>
    <line class="structure" x1="1043" y1="191" x2="1141" y2="169"/>
    <line class="structure" x1="1187" y1="204" x2="1197" y2="332"/>
    <line class="structure" x1="1162" y1="398" x2="1102" y2="434"/>
