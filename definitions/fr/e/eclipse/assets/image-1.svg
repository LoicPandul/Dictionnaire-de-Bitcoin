    <circle class="acteur" cx="928" cy="360" r="44"/>
    <circle class="sujet" cx="376" cy="376" r="104"/>
    <text class="nom-sujet" x="376" y="370" text-anchor="middle">Nœud</text>
    <text class="nom-sujet" x="376" y="414" text-anchor="middle">victime</text>
    <text class="etiquette" x="376" y="704" text-anchor="middle">Nœuds de l'attaquant</text>
    <text class="etiquette" x="1064" y="576" text-anchor="middle">Réseau honnête</text>
    <text class="annotation" x="672" y="80" text-anchor="start">toutes ses connexions</text>
    <text class="annotation" x="672" y="120" text-anchor="start">mènent à l'attaquant</text>
    <path class="fleche-note" d="M664 112 Q 548 152 516 296"/>
    <text class="annotation" x="768" y="368" text-anchor="middle">aucune</text>
    <text class="annotation" x="768" y="408" text-anchor="middle">connexion</text>
  </g>
</svg>